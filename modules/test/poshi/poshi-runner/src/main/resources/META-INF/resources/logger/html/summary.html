<html>
	<head>
		<meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
		<meta content="utf-8" http-equiv="encoding" />
		<meta content="Tue, 01 Jan 1980 1:00:00 GMT" http-equiv="expires" />

		<link href="https://cdn.jsdelivr.net/npm/alloy-ui@3.1.0/build/aui-css/css/bootstrap.min.css" rel="stylesheet" />

		<script src="https://cdn.jsdelivr.net/npm/alloy-ui@3.1.0/build//aui/aui-min.js"></script>

		<script>
			YUI().use(
				'aui-image-viewer','aui-tabview','aui-toggler',
				function(Y) {
					new Y.ImageViewer(
						{
							caption: 'Screenshots',
							intervalTime: 10,
							links: '.screenshots a',
							zIndex: 1
						}
					).render();

					new Y.TabView(
						{
							srcNode: '#summaries'
						}
					).render();

					new Y.TogglerDelegate(
						{
							animated: true,
							container: '#summaries',
							content: '.content',
							expanded: false,
							header: '.header'
						}
					);
				}
			);
		</script>

		<style>
			.btn {
				left: 12;
				padding: 0px 6px;
				position: absolute;
			}

			.major-steps > li {
				list-style-type: none;
				padding: 3px;
			}

			.minor-steps > li {
				left: -20px;
				position: relative;
			}

			.screenshots-thumbnail {
				margin: 20px 0;
				width: 150px;
			}
		</style>
	</head>

	<body>
		<h3 id="summaryTestName"></h3>

		<p id="summaryTestDescription"></p>

		<div id="summaries">
			<ul id="summaryTitleContainer"></ul>

			<div id="summaryContentContainer"></div>
		</div>

		<script defer src="../js/update_images.js" type="text/javascript"></script>
	</body>
</html>
