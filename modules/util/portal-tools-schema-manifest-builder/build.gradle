dependencies {
	api group: "org.apache.logging.log4j", name: "log4j-core", version: "2.26.1"
	compileInclude group: "org.json", name: "json", version: "20231013"
	compileOnly group: "com.liferay", name: "com.liferay.petra.concurrent", version: "5.1.7"
	compileOnly group: "com.liferay", name: "com.liferay.petra.function", version: "5.5.0"
	compileOnly group: "com.liferay", name: "com.liferay.petra.io", version: "5.0.5"
	compileOnly group: "com.liferay", name: "com.liferay.petra.lang", version: "5.2.0"
	compileOnly group: "com.liferay", name: "com.liferay.petra.string", version: "5.3.0"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.impl", version: "134.0.0"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "195.0.0"
}

deployDependencies {
	from (configurations.compileClasspath) {
		include "log4j-api-*.jar"
		include "log4j-core-*.jar"
	}

	rename(/log4j-api-(.+)\.jar/, "log4j-api" + renameSuffix)
	rename(/log4j-core-(.+)\.jar/, "log4j-core" + renameSuffix)
}

liferay {
	deployDir = "../../../tools/sdk/dependencies/com.liferay.portal.tools.schema.manifest.builder/lib"
}

liferayOSGi {
	expandCompileInclude = true
}

updateFileVersions {
	match(/\t\t<dependency name="com.liferay.portal.tools.schema.manifest.builder" org="com.liferay" rev="(\d.+)" \/>/, "../../../tools/sdk/dependencies/com.liferay.portal.tools.schema.manifest.builder/ivy.xml")
	match(/private static final String _VERSION = "(\d.+)";/, "../../sdk/gradle-plugins-defaults/src/main/java/com/liferay/gradle/plugins/defaults/internal/SchemaManifestBuilderPlugin.java")
}