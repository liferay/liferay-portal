import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

if (JavaVersion.current() != JavaVersion.VERSION_17) {
	throw new GradleException("Project ${project.name} requires JDK 17.")
}

task patch(type: PatchTask)

dependencies {
	compileOnly group: "javax.cache", name: "cache-api", version: "1.1.1"
	compileOnly group: "javax.servlet", name: "javax.servlet-api", version: "3.0.1"
	compileOnly group: "org.apache.cxf", name: "cxf-rt-rs-security-oauth2", version: "3.6.11"
}

jarSources {
	mustRunAfter patch
}

patch {
	ext {
		autoClean = false
	}

	fileNames "org/apache/cxf/rs/security/oauth2/filters/JwtAccessTokenValidator.java"
	fileNames "org/apache/cxf/rs/security/oauth2/filters/OAuthRequestFilter.java"
	fileNames "org/apache/cxf/rs/security/oauth2/grants/code/JCacheCodeDataProvider.java"
	fileNames "org/apache/cxf/rs/security/oauth2/provider/AbstractOAuthDataProvider.java"
	fileNames "org/apache/cxf/rs/security/oauth2/provider/JCacheOAuthDataProvider.java"
	fileNames "org/apache/cxf/rs/security/oauth2/provider/OAuthDataProvider.java"
	fileNames "org/apache/cxf/rs/security/oauth2/services/AbstractTokenService.java"
	fileNames "org/apache/cxf/rs/security/oauth2/services/TokenIntrospectionService.java"
	fileNames "org/apache/cxf/rs/security/oauth2/services/TokenRevocationService.java"
	fileNames "org/apache/cxf/rs/security/oauth2/utils/AuthorizationUtils.java"
	originalLibModuleName = "cxf-rt-rs-security-oauth2"
}