import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

task deployJar(type: Copy)
task patch(type: PatchTask)

sourceCompatibility = "1.8"
targetCompatibility = "1.8"

dependencies {
	compileOnly group: "commons-configuration", name: "commons-configuration", version: "1.10"
}

deploy {
	finalizedBy deployJar
}

deployJar {
	ext {
		autoClean = false
	}

	from jar
	into "../../../lib/portal"

	rename {
		"commons-configuration.jar"
	}
}

jarSources {
	mustRunAfter patch
}

patch {
	ext {
		autoClean = false
	}

	fileNames "org/apache/commons/configuration/AbstractConfiguration.java"
	fileNames "org/apache/commons/configuration/PropertiesConfiguration.java"
	fileNames "org/apache/commons/configuration/PropertyConverter.java"
	originalLibModuleName = "commons-configuration"
}