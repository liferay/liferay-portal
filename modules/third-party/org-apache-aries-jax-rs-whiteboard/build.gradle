apply from: "../../build-jakarta-transformer.gradle"

dependencies {
	compileOnly group: "com.liferay", name: "org.apache.aries.jax.rs.whiteboard", transitive: false, version: "2.0.0.LIFERAY-PATCHED-1"
}

task updateSPIFile(type: Zip)

jarTransformed {
	finalizedBy updateSPIFile
}

updateSPIFile {
	from {
		zipTree(jar.archivePath)
	}
	rename("javax.ws.rs.sse.SseEventSource.Builder", "jakarta.ws.rs.sse.SseEventSource.Builder")

	doLast {
		archivePath.renameTo(jar.archivePath)
	}
}