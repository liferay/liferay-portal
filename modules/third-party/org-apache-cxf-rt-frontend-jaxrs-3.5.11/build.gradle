import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

task patch(type: PatchTask)

sourceCompatibility = "1.8"
targetCompatibility = "1.8"

dependencies {
	compileOnly group: "javax.servlet", name: "javax.servlet-api", version: "3.0.1"
	compileOnly group: "org.apache.cxf", name: "cxf-core", version: "3.5.11"
	compileOnly group: "org.apache.cxf", name: "cxf-rt-frontend-jaxrs", version: "3.5.11"
	compileOnly group: "org.apache.cxf", name: "cxf-rt-transports-http", version: "3.5.11"
	compileOnly group: "org.apache.geronimo.specs", name: "geronimo-jaxrs_2.1_spec", version: "1.1"
}

jarSources {
	mustRunAfter patch
}

patch {
	ext {
		autoClean = false
	}

	fileNames "org/apache/cxf/jaxrs/ext/MessageContextImpl.java"
	fileNames "org/apache/cxf/jaxrs/utils/FormUtils.java"
	originalLibModuleName = "cxf-rt-frontend-jaxrs"
}