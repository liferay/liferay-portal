import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

task patch(type: PatchTask)

sourceCompatibility = "1.8"
targetCompatibility = "1.8"

dependencies {
	compileOnly group: "javax.annotation", name: "javax.annotation-api", version: "1.3.2"
	compileOnly group: "org.apache.cxf", name: "cxf-core", version: "3.5.11"
	compileOnly group: "org.apache.cxf", name: "cxf-rt-wsdl", version: "3.5.11"
	compileOnly group: "wsdl4j", name: "wsdl4j", version: "1.6.3"
}

jarSources {
	mustRunAfter patch
}

patch {
	ext {
		autoClean = false
	}

	fileNames "org/apache/cxf/wsdl11/AbstractWrapperWSDLLocator.java"
	fileNames "org/apache/cxf/wsdl11/WSDLManagerImpl.java"
	originalLibModuleName = "cxf-rt-wsdl"
}