import groovy.json.JsonSlurper

import org.yaml.snakeyaml.Yaml

task runGradleTest

runGradleTest {
	dependsOn ":client-extensions:able:publishClientExtension", ":client-extensions:baker:publishClientExtension"

	doLast {
		Map<String, Object> catalog = new JsonSlurper().parse(new URL("http://localhost:5000/v2/_catalog"))

		assert catalog.repositories.contains("able")
		assert catalog.repositories.contains("charts/able")
		assert catalog.repositories.contains("charts/baker")
		assert !catalog.repositories.contains("baker")

		HttpURLConnection httpURLConnection = new URL("http://localhost:5000/v2/able/manifests/1.0.0").openConnection()

		httpURLConnection.requestMethod = "HEAD"

		httpURLConnection.setRequestProperty("Accept", "application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json")

		assert httpURLConnection.responseCode == 200

		String digest = httpURLConnection.getHeaderField("Docker-Content-Digest")

		Map<String, Object> ableChart = _pullChart("able")

		assert ableChart.chart.appVersion == "1.0.0"
		assert ableChart.chart.name == "able"
		assert ableChart.chart.version == "1.0.0"

		Map<String, Object> ableValues = ableChart.values

		assert ableValues.clientExtension.configs.size() > 0
		assert ableValues.clientExtension.serviceId == "able"
		assert ableValues.fullnameOverride == "able"
		assert ableValues.image.pullPolicy == "IfNotPresent"
		assert ableValues.image.repository == "localhost:5000/able"
		assert ableValues.image.tag == "1.0.0@" + digest
		assert ableValues.service.enabled == true
		assert ableValues.workload.containerPort == 58081
		assert ableValues.workload.enabled == true
		assert ableValues.workload.kind == "Deployment"
		assert ableValues.workload.securityContext.runAsNonRoot == true

		Map<String, Object> bakerChart = _pullChart("baker")

		assert bakerChart.chart.name == "baker"
		assert bakerChart.chart.version == "1.0.0"

		Map<String, Object> bakerValues = bakerChart.values

		assert bakerValues.clientExtension.configs.size() > 0
		assert bakerValues.image.repository == null
		assert bakerValues.service.enabled == false
		assert bakerValues.workload.enabled == false
	}
}

Map<String, Object> _pullChart(String name) {
	File destinationDir = new File(buildDir, "pulled-charts/${name}")

	delete destinationDir

	destinationDir.mkdirs()

	exec {
		commandLine "helm", "pull", "oci://localhost:5000/charts/${name}", "--plain-http", "--untar", "--untardir", destinationDir, "--version", "1.0.0"
	}

	File chartDir = new File(destinationDir, name)

	Yaml yaml = new Yaml()

	return [chart: yaml.load(new File(chartDir, "Chart.yaml").text), values: yaml.load(new File(chartDir, "values.yaml").text)]
}