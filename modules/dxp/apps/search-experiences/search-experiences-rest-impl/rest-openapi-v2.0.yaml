                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SXPElement"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/SXPElement"
            tags: ["SXPElement"]
        put:
