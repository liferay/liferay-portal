            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SXPBlueprint"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/SXPBlueprint"
            tags: ["SXPBlueprint"]
        put:
            description:
