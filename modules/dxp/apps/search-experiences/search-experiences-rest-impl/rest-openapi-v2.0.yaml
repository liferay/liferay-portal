            tags: ["SXPBlueprint"]
    /sxp-blueprints/{sxpBlueprintId}:
        delete:
            description:
                Deletes a Blueprint
            operationId: deleteSXPBlueprint
            parameters:
                - in: path
                  name: sxpBlueprintId
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["SXPBlueprint"]
        get:
            description:
                Gets a Blueprint
            operationId: getSXPBlueprint
            parameters:
                - in: path
                  name: sxpBlueprintId
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SXPBlueprint"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/SXPBlueprint"
            tags: ["SXPBlueprint"]
        patch:
            description:
                Updates a Blueprint
            operationId: patchSXPBlueprint
            parameters:
                - in: path
                  name: sxpBlueprintId
                  required: true
                  schema:
                      format: int64
                      type: integer
            requestBody:
                content:
