                        application/xml:
                            schema:
                                $ref: "#/components/schemas/SXPBlueprint"
            tags: ["SXPBlueprint"]
        put:
            description:
                Creates or updates a Blueprint
            operationId: putSXPBlueprintByExternalReferenceCode
            parameters:
                - in: path
                  name: externalReferenceCode
                  required: true
                  schema:
                      type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SXPBlueprint"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/SXPBlueprint"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SXPBlueprint"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/SXPBlueprint"
            tags: ["SXPBlueprint"]
    /sxp-blueprints/validate:
        post:
