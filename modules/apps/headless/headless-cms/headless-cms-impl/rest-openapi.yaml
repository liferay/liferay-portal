openapi: 3.0.1
paths:
    "/asset-permission":
        post:
            description:
                Perform an action on the asset's permissions
            operationId: postAssetPermission
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AssetPermissionAction"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/AssetPermissionAction"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssetPermissionAction"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/AssetPermissionAction"
            tags: ["AssetPermissionAction"]
    "/asset-statistics":
        get:
            operationId: getAssetStatistics
            parameters:
                -   in: query
                    name: assetLibraryId
                    schema:
                        format: int64
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssetStatistics"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/AssetStatistics"
            tags: ["AssetStatistics"]
    "/asset-usages/{assetId}":
        get:
            operationId: getAssetUsagesAssetPage
            parameters:
                -   in: path
                    name: assetId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: search
                    schema:
                        type: string
                -   in: query
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AssetUsage"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AssetUsage"
                                type: array
            tags: ["AssetUsage"]
    "/broken-link-assets":
        get:
            operationId: getBrokenLinkAssetsPage
            parameters:
                -   in: query
                    name: assetLibraryId
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: search
                    schema:
                        type: string
                -   in: query
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/BrokenLinkAsset"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/BrokenLinkAsset"
                                type: array
            tags: ["BrokenLinkAsset"]
            x-feature-flag: LPD-82226
    "/missing-required-fields-assets":
        get:
            operationId: getMissingRequiredFieldsAssetsPage
            parameters:
                -   in: query
                    name: assetLibraryId
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: search
                    schema:
                        type: string
                -   in: query
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/MissingRequiredFieldsAsset"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/MissingRequiredFieldsAsset"
                                type: array
            tags: ["MissingRequiredFieldsAsset"]
            x-feature-flag: LPD-82226