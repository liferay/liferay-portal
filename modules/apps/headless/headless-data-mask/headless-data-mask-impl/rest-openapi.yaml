components:
    schemas:
        Redaction:
            description:
                Outcome of applying a candidate data mask to text.
            properties:
                error:
                    description:
                        Set when the candidate regex failed to compile (or threw at apply time). A diagnostic message is shown inline in the admin UI. When present, output is the unredacted text.
                    type: string
                output:
                    description:
                        The text after redaction. Equal to the input text when no matches were found OR when an error occurred.
                    type: string
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.headless.data.mask.client', and version '1.0.2'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Headless Data Mask
    version: v1.0
openapi: 3.0.1
paths:
    "/redaction":
        get:
            description:
                Compile a candidate data mask and apply it to text, returning a preview of the redacted output and any compile or apply error. Called by the data mask creation UI before the mask is saved, so the regex is evaluated by the same java.util.regex.Pattern engine that runs in production &mdash; eliminating JavaScript vs Java regex divergence as a source of false positive validation.
            operationId: getRedaction
            parameters:
                -   in: query
                    name: detectionRegex
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: replacementRegex
                    schema:
                        type: string
                -   in: query
                    name: replacementValue
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: text
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Redaction"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Redaction"
                    description:
                        Redaction outcome.
            tags: ["Redaction"]