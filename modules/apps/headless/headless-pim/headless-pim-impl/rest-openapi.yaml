components:
    schemas:
        Link:
            properties:
                sourceLinkReference:
                    allOf:
                        -   $ref: "#/components/schemas/LinkReference"
                targetLinkReferences:
                    items:
                        $ref: "#/components/schemas/LinkReference"
                    type: array
                type:
                    type: string
            required:
                -   sourceLinkReference
                -   type
            type: object
        LinkReference:
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    readOnly: true
                    type: object
                className:
                    type: string
                code:
                    readOnly: true
                    type: string
                externalReferenceCode:
                    type: string
                id:
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    readOnly: true
                    type: string
                status:
                    $ref: "#/components/schemas/Status"
                    readOnly: true
                type:
                    readOnly: true
                    type: string
            required:
                -   className
                -   externalReferenceCode
            type: object
        Status:
            properties:
                code:
                    format: int32
                    type: integer
                label:
                    type: string
                label_i18n:
                    type: string
            type: object
info:
    description:
        "Manages typed relationships between PIM entities.. A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.headless.pim.client', and version '1.0.2'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Liferay Headless PIM
    version: v1.0
openapi: 3.0.1
paths:
    "/scopes/{scopeKey}/links":
        delete:
            operationId: deleteScopeScopeKeyLink
            parameters:
                -   in: path
                    name: scopeKey
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: className
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: externalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: type
                    required: true
                    schema:
                        type: string
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["Link"]
        get:
            operationId: getScopeScopeKeyLinksPage
            parameters:
                -   in: path
                    name: scopeKey
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: className
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: externalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: search
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LinkReference"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/LinkReference"
                                type: array
            tags: ["LinkReference"]
        post:
            operationId: postScopeScopeKeyLink
            parameters:
                -   in: path
                    name: scopeKey
                    required: true
                    schema:
                        type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/Link"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/Link"
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            tags: ["Link"]