components:
    schemas:
        StyleBook:
            description:
                Represents a style book entry.
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            description:
                                The action's properties.
                            type: string
                        description:
                            The action's name.
                        type: object
                    description:
                        The actions and their permissions for this style book.
                    readOnly: true
                    type: object
                creator:
                    $ref: ../../headless-admin-user/headless-admin-user-impl/rest-openapi.yaml#Creator
                    description:
                        The style book's creator.
                    readOnly: true
                dateCreated:
                    description:
                        The style book's creation date.
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        The last time the style book changed.
                    format: date-time
                    readOnly: true
                    type: string
                defaultStyleBook:
                    description:
                        A flag to indicate whether this is the default style book for the specified theme.
                    type: boolean
                designLibraryExternalReferenceCode:
                    description:
                        The external reference code of the Design Library this style book belongs to. Null for site-scoped style books.
                    readOnly: true
                    type: string
                designLibraryName:
                    description:
                        The name of the Design Library this style book belongs to. Null for site-scoped style books.
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        The style book's external reference code.
                    type: string
                frontendTokensValues:
                    description:
                        The style book's tokens values.
                    type: string
                id:
                    description:
                        The style book's ID.
                    format: int64
                    readOnly: true
                    type: integer
                key:
                    description:
                        The style book's key.
                    type: string
                name:
                    description:
                        The style book's name.
                    type: string
                previewFileEntryExternalReferenceCode:
                    description:
                        The style book's preview file entry external reference code.
                    type: string
                themeId:
                    description:
                        The theme id or the themeCSS client extension external reference code this style book is based on.
                    type: string
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.headless.admin.style.book.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Liferay Headless Admin Style Book API
    version: v1.0
openapi: 3.0.1
