components:
    schemas:
        Admin:
            # @review
            description:
                Administrator information.
            properties:
                emailAddress:
                    # @review
                    description:
                        Administrator's email address.
                    format: email
                    type: string
                familyName:
                    # @review
                    description:
                        The admin's surname (last name).
                    type: string
                givenName:
                    # @review
                    description:
                        The admin's first name.
                    type: string
            type: object
        PortalInstance:
            # @review
            properties:
                active:
                    readOnly: true
                    type: boolean
                admin:
                    $ref: "#/components/schemas/Admin"
                    # @review
                    description:
                        The portal instance's administrator. This field is optional and is only used in the portal instance creation.
                    writeOnly: true
                companyId:
                    description:
                        internal unique key.
                    format: int64
                    type: integer
                domain:
                    description:
                        domain used for email authentication.
                    type: string
                portalInstanceId:
                    description:
                        public unique key (corresponds to company's webId field)
                    type: string
                siteInitializerKey:
                    type: string
                    writeOnly: true
                virtualHost:
                    type: string
            type: object
        PortalInstanceExport:
            description:
                The result of exporting a portal instance.
            properties:
                exportedPartitionName:
                    description:
                        The name of the schema created by the export (e.g., lexported_12345).
                    type: string
                sourcePartitionName:
                    description:
                        The name of the source partition that was exported (e.g., lpartition_12345).
                    type: string
            type: object
        PortalInstanceImport:
            description:
                Import configuration for a DB partition portal instance.
            properties:
                name:
                    description:
                        Optional display name for the imported portal instance.
                    type: string
                schemaName:
                    description:
                        The DB partition schema name to import (format lexported_[companyId]).
                    type: string
                virtualHost:
                    description:
                        Optional virtual host for the imported portal instance.
                    type: string
                webId:
                    description:
                        Optional web ID for the imported portal instance.
                    type: string
            required:
                -   schemaName
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.headless.portal.instances.client', and version '1.0.33'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Liferay Portal Instances Headless API
    version: v1.0
openapi: 3.0.1
paths:
    /portal-instances:
        get:
            description:
                Retrieves the portal instances
            operationId: getPortalInstancesPage
            parameters:
                -   in: query
                    explode: true
                    name: skipDefault
                    required: false
                    schema:
                        type: boolean
                    style: form
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/PortalInstance"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/PortalInstance"
                                type: array
                    description:
                        default response
            # @review
            tags: ["PortalInstance"]
        post:
            description:
                Adds a new portal instance
            operationId: postPortalInstance
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/PortalInstance"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/PortalInstance"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PortalInstance"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/PortalInstance"
                    description:
                        default response
            # @review
            tags: ["PortalInstance"]
    /portal-instances/import:
        post:
            description:
                Imports a DB partition portal instance
            operationId: postPortalInstanceImport
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/PortalInstanceImport"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/PortalInstanceImport"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PortalInstance"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/PortalInstance"
                    description:
                        default response
            tags: ["PortalInstance"]
    /portal-instances/{portalInstanceId}:
        delete:
            description:
                Removes the portal instance
            operationId: deletePortalInstance
            parameters:
                -   in: path
                    name: portalInstanceId
                    required: true
                    schema:
                        type: string
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
            # @review
            tags: ["PortalInstance"]
        get:
            description:
                Retrieves the portal instance
            operationId: getPortalInstance
            parameters:
                -   in: path
                    name: portalInstanceId
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PortalInstance"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/PortalInstance"
                    description:
                        default response
            # @review
            tags: ["PortalInstance"]
        patch:
            # @review
            description:
                Updates the portal instance with information sent in the request body. Only the provided fields are updated.
            operationId: patchPortalInstance
            parameters:
                -   in: path
                    name: portalInstanceId
                    required: true
                    schema:
                        type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/PortalInstance"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/PortalInstance"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PortalInstance"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/PortalInstance"
                    # @review
                    description:
                        "Portal instance successfully updated"
            # @review
            tags: ["PortalInstance"]
    /portal-instances/{portalInstanceId}/activate:
        # @review
        put:
            description:
                Activates the portal instance
            operationId: putPortalInstanceActivate
            parameters:
                -   in: path
                    name: portalInstanceId
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json: {}
                        application/xml: {}
                    description:
                        default response
            tags: ["PortalInstance"]
    /portal-instances/{portalInstanceId}/deactivate:
        # @review
        put:
            description:
                Deactivates the portal instance. When a portal instance is deactivated, its virtual host will not longer respond requests.
            operationId: putPortalInstanceDeactivate
            parameters:
                -   in: path
                    name: portalInstanceId
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json: {}
                        application/xml: {}
                    description:
                        default response
            tags: ["PortalInstance"]
    /portal-instances/{portalInstanceId}/export:
        post:
            description:
                Exports the portal instance
            operationId: postPortalInstanceExport
            parameters:
                -   in: path
                    name: portalInstanceId
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PortalInstanceExport"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/PortalInstanceExport"
                    description:
                        The result of exporting the portal instance.
            tags: ["PortalInstance"]