<!DOCTYPE html>

<html>
<head>

	<style>
		body {
			background: #fff;
			font-family: system-ui, -apple-system, sans-serif;
			margin: 0;
			padding: 24px;
		}

		.alert {
			align-items: center;
			background: #feefef;
			border: 1px solid #f48989;
			border-radius: 4px;
			color: #da1414;
			display: flex;
			gap: 12px;
			padding: 1rem;
		}

		.alert-icon {
			flex-shrink: 0;
			height: 20px;
			width: 20px;
		}

		.alert-message {
			font-size: .875rem;
			line-height: 1.5;
			margin: 0;
		}
	</style>
</head>

	<div class="alert">

		</svg>

	</div>

</html>
