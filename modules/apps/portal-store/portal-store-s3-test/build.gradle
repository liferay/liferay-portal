task buildIBMS3StoreTest(type: Copy)

buildIBMS3StoreTest {
	doFirst {
		delete "src/testIntegration/java/com/liferay/portal/store/s3/test/IBMS3StoreTest.java"
	}

	ext {
		autoClean = false
	}

	filter {
		String line ->

		line.replace "@RunWith(Arquillian.class)", "@Generated(\"\")\n@RunWith(Arquillian.class)"
	}

	filter {
		String line ->

		line.replace "S3StoreTest", "IBMS3StoreTest"
	}

	filter {
		String line ->

		line.replace "import java.util.Dictionary;", "import jakarta.annotation.Generated;\n\nimport java.util.Dictionary;"
	}

	filter {
		String line ->

		line.replace "s3.S3Store", "s3.IBMS3Store"
	}

	from new File("src/testIntegration/java/com/liferay/portal/store/s3/test/S3StoreTest.java")
	into "src/testIntegration/java/com/liferay/portal/store/s3/test"
	rename {
		"IBMS3StoreTest.java"
	}
}

clean {
	delete "src/testIntegration/java/com/liferay/portal/store/s3/test/IBMS3StoreTest.java"
}

compileJava {
	dependsOn buildIBMS3StoreTest
}

dependencies {
	testIntegrationImplementation group: "jakarta.annotation", name: "jakarta.annotation-api", version: "2.1.1"
	testIntegrationImplementation group: "org.osgi", name: "org.osgi.service.cm", version: "1.6.0"
	testIntegrationImplementation project(":apps:portal-store:portal-store-s3")
	testIntegrationImplementation project(":apps:portal-store:portal-store-test-util")
	testIntegrationImplementation project(":test:arquillian-extension-junit-bridge")
}