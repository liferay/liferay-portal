        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Liferay Commerce Delivery Order API
    version: v1.0
openapi: 3.0.1
paths:
    /channels/by-externalReferenceCode/{channelExternalReferenceCode}/accounts/by-externalReferenceCode/{accountExternalReferenceCode}/placed-orders:
        get:
            description:
                Resolves the channel and the account by external reference code, then delegates to
                getChannelAccountPlacedOrdersPage to return the same channel-scoped, account-scoped page of placed
                orders. Filter, sort, and search semantics match the by-id variant.
            parameters:
            -   $ref: "#/components/parameters/accountExternalReferenceCodePathParam"
            -   $ref: "#/components/parameters/channelExternalReferenceCodePathParam"
            -   $ref: "#/components/parameters/filterQueryParam"
            -   $ref: "#/components/parameters/pageQueryParam"
            -   $ref: "#/components/parameters/pageSizeQueryParam"
            -   $ref: "#/components/parameters/searchQueryParam"
            -   $ref: "#/components/parameters/sortQueryParam"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/PlacedOrder"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/PlacedOrder"
                                type: array
                    description:
                        Successful operation
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                404:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The specified resource was not found
                500:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Unexpected error
            tags:
            -   PlacedOrder
    /channels/by-externalReferenceCode/{externalReferenceCode}/placed-orders:
        get:
            description:
                Resolves the channel by external reference code and delegates to getChannelPlacedOrdersPage to return
                non-open placed orders visible to the caller in that channel.
            operationId: getChannelByExternalReferenceCodePlacedOrdersPage
            parameters:
            -   $ref: "#/components/parameters/externalReferenceCodePathParam"
            -   $ref: "#/components/parameters/filterQueryParam"
            -   $ref: "#/components/parameters/pageQueryParam"
            -   $ref: "#/components/parameters/pageSizeQueryParam"
            -   $ref: "#/components/parameters/searchQueryParam"
            -   $ref: "#/components/parameters/sortQueryParam"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/PlacedOrder"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/PlacedOrder"
                                type: array
                    description:
                        Successful operation
                401:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Authentication information is missing or invalid
                404:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The specified resource was not found
                500:
                    content:
