                Executes a transition. A positive workflowTaskId runs CommerceOrderService.executeWorkflowTransition;
                name=process-quote runs CommerceOrderEngine.transitionCommerceOrder to ORDER_STATUS_QUOTE_PROCESSED;
                name=reorder runs CommerceOrderService.reorderCommerceOrder and returns the new order id on the
                response's orderId field. Refuses on open orders.
            operationId: postPlacedOrderOrderTransition
            parameters:
            -   $ref: "#/components/parameters/placedOrderIdPathParam"
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/OrderTransition"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/OrderTransition"
                required: true
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OrderTransition"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/OrderTransition"
                403:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The authenticated user lacks permission for the requested action on this placed order.
                409:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        The order is still open or the requested workflow transition is not allowed for the order's
                        current status.
                422:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Error"
                    description:
                        Domain validation rejected the request -- the resolved entity could not be found, a referenced
                        lookup key was missing, or a required field was out of range.
            tags:
            -   OrderTransition
