                shippingAddressId:
                    description:
                        Reference to the per-item shipping address (FK identifier). Read-only.
                    example: 31130
                    format: int64
                    readOnly: true
                    type: integer
                sku:
                    description:
                        SKU string of the line item. Read-only.
                    example: HSW-10IN
                    readOnly: true
                    type: string
                skuId:
                    description:
                        Reference to the SKU (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                subscription:
                    description:
                        When true the line item is part of a subscription.
                    example: true
                    readOnly: true
                    type: boolean
                thumbnail:
                    description:
                        URL of the line item thumbnail. Read-only.
                    example: https://example.com/thumb.png
                    readOnly: true
                    type: string
                unitOfMeasure:
                    description:
                        Locale-resolved name of the chosen unit of measure. Read-only.
                    example: Meter
                    readOnly: true
                    type: string
                unitOfMeasureKey:
                    description:
                        Key of the chosen unit of measure. Read-only.
                    example: m
                    readOnly: true
                    type: string
                valid:
                    description:
                        Declared validity flag. Declared on the schema; not populated by the default response converter.
                    example: true
                    readOnly: true
                    type: boolean
                virtualItemURLs:
                    description:
                        Download URLs of the line item's virtual file entries. Read-only.
                    items:
                        type: string
                    readOnly: true
                    type: array
                virtualItems:
                    description:
                        Full list of virtual-item file entries on the line item. Read-only.
                    items:
                        $ref: "#/components/schemas/VirtualItem"
                    readOnly: true
                    type: array
            type: object
        PlacedOrderItemShipment:
            description:
                Shipment-item row that ships a portion of a placed order item. When the order has no direct shipments,
                this row may be sourced from a supplier order linked to the same item.
            properties:
                accountId:
                    description:
                        Reference to the account of the parent shipment (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                author:
                    description:
                        User name of the user who created the parent shipment. Read-only.
                    example: John Doe
                    readOnly: true
                    type: string
                carrier:
                    description:
                        Carrier name of the parent shipment. Read-only.
                    example: FedEx
                    readOnly: true
                    type: string
                createDate:
                    description:
                        Creation date of the parent shipment, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                estimatedDeliveryDate:
                    description:
                        Expected delivery date of the parent shipment, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                estimatedShippingDate:
                    description:
                        Expected ship date of the parent shipment, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        External reference code of the parent shipment. Read-only.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                id:
                    description:
                        Identifier of the parent shipment (not the shipment item itself). Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                modifiedDate:
                    description:
                        Last modification date of the parent shipment, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                orderId:
                    description:
                        Declared parent order id. Declared on the schema; not populated by the default response
                        converter.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                quantity:
                    description:
                        Locale-formatted shipped quantity for this row. Read-only.
                    example: 10.1
                    format: bigdecimal
                    readOnly: true
                    type: number
                shippingAddressId:
                    description:
                        Reference to the destination address (FK identifier). Read-only.
                    example: 31130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                shippingMethodId:
                    description:
                        Reference to the shipping method (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                shippingOptionName:
                    description:
                        Shipping option name on the parent shipment. Read-only.
                    example: Standard Delivery
                    readOnly: true
                    type: string
                status:
                    $ref: "#/components/schemas/Status"
                    readOnly: true
                supplierShipment:
                    description:
                        When true this row was sourced from a supplier order's shipment items rather than the order's
                        own shipments. Read-only.
                    example: false
                    readOnly: true
                    type: boolean
                trackingNumber:
                    description:
                        Tracking number on the parent shipment. Read-only.
                    example: 123AD-asd
                    readOnly: true
                    type: string
                trackingURL:
                    description:
                        Tracking URL on the parent shipment. Read-only.
                    example: https://example.com/tracking/123AD-asd
                    readOnly: true
                    type: string
                unitOfMeasureKey:
                    description:
                        Key of the unit of measure for this shipment item. Read-only.
                    example: m
                    readOnly: true
                    type: string
            type: object
        Price:
            description:
                Per-unit pricing block for a placed order item -- base price, promotional price, discount, and final
                price, each in numeric form plus a locale-formatted string.
            properties:
                currency:
                    description:
                        Locale-resolved currency name from the order's currency. Read-only.
                    example: US Dollar
                    readOnly: true
                    type: string
                discount:
                    description:
                        Per-unit discount amount in the order's currency. Read-only.
                    example: 1.5
                    format: double
                    readOnly: true
                    type: number
                discountFormatted:
                    description:
                        Per-unit discount amount formatted in the order's currency and the request locale. Read-only.
                    example: $1.50
                    readOnly: true
                    type: string
                discountPercentage:
                    description:
                        Locale-formatted discount percentage. Read-only.
                    example: 10%
                    readOnly: true
                    type: string
                discountPercentageLevel1:
                    description:
                        First-level cumulative discount percentage from the line item's price calculation. Read-only.
                    example: 10.0
                    format: double
                    readOnly: true
                    type: number
                discountPercentageLevel2:
                    description:
                        Second-level cumulative discount percentage from the line item's price calculation. Read-only.
                    example: 0.0
                    format: double
                    readOnly: true
                    type: number
                discountPercentageLevel3:
                    description:
                        Third-level cumulative discount percentage from the line item's price calculation. Read-only.
                    example: 0.0
                    format: double
                    readOnly: true
                    type: number
                discountPercentageLevel4:
                    description:
                        Fourth-level cumulative discount percentage from the line item's price calculation. Read-only.
                    example: 0.0
                    format: double
                    readOnly: true
                    type: number
                finalPrice:
                    description:
                        Final per-unit price after discounts and promos, in the order's currency. Read-only.
                    example: 13.5
                    format: double
                    readOnly: true
                    type: number
                finalPriceFormatted:
                    description:
                        Final per-unit price formatted in the order's currency and the request locale. Read-only.
                    example: $13.50
                    readOnly: true
                    type: string
                price:
                    description:
                        Base per-unit price before discounts, in the order's currency. Read-only.
                    example: 15.0
                    format: double
                    readOnly: true
                    type: number
                priceFormatted:
                    description:
                        Base per-unit price formatted in the order's currency and the request locale. Read-only.
                    example: $15.00
                    readOnly: true
                    type: string
                promoPrice:
                    description:
                        Promotional per-unit price when a promo is active, in the order's currency. Read-only.
                    example: 13.5
                    format: double
                    readOnly: true
                    type: number
                promoPriceFormatted:
                    description:
                        Promotional per-unit price formatted in the order's currency and the request locale. Read-only.
                    example: $13.50
                    readOnly: true
                    type: string
            type: object
        Settings:
            description:
                Inventory configuration applied to a placed order item -- minimum, maximum, multiple, and the explicit
                allowed quantities when the SKU has them configured.
            properties:
                allowedQuantities:
                    description:
                        Explicit list of allowed order quantities for the line item's SKU. Omitted when no inventory
                        configuration is present. Read-only.
                    items:
                        example: 10.1
                        format: bigdecimal
                        type: number
                    readOnly: true
                    type: array
                maxQuantity:
                    description:
                        Maximum order quantity for the SKU. Defaults to the system maximum when unset. Read-only.
                    example: 100
                    format: bigdecimal
                    readOnly: true
                    type: number
                minQuantity:
                    description:
                        Minimum order quantity for the SKU. Defaults to one when unset. Read-only.
                    example: 1
                    format: bigdecimal
                    readOnly: true
                    type: number
                multipleQuantity:
                    description:
                        Required quantity multiple for the SKU. Defaults to one when unset. Read-only.
                    example: 1
                    format: bigdecimal
                    readOnly: true
                    type: number
            type: object
        Shipment:
            description:
                Shipment record produced for a placed order. itemsCount and oneLineAddress are read from the search
                index when the shipment is loaded as part of a listing and may be absent on direct lookups.
            properties:
                accountId:
                    description:
                        Reference to the account of the shipment (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                carrier:
                    description:
                        Carrier name of the shipment. Read-only.
                    example: FedEx
                    readOnly: true
                    type: string
                createDate:
                    description:
                        Creation date of the shipment, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                expectedDate:
                    description:
                        Expected delivery date of the shipment, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        Idempotency key for the shipment; must be unique per shipment within the company. Read-only on
                        this response.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                id:
                    description:
                        Primary identifier of the shipment. Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                itemsCount:
                    description:
                        Number of items in the shipment, read from the search document on listing responses. Read-only.
                    example: 3
                    format: int32
                    readOnly: true
                    type: integer
                modifiedDate:
                    description:
                        Last modification date of the shipment, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                oneLineAddress:
                    description:
                        Single-line shipping address for list display, read from the search document on listing
                        responses. Read-only.
                    example: 1400 Montefino Ave, Diamond Bar, CA 91765, US
                    readOnly: true
                    type: string
                orderExternalReferenceCode:
                    description:
                        Declared order external reference code. Declared on the schema; not populated by the default
                        response converter.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                orderId:
                    description:
                        Declared parent order id. Declared on the schema; not populated by the default response
                        converter.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                shippingAddress:
                    $ref: "#/components/schemas/ShippingAddress"
                    readOnly: true
                shippingAddressId:
                    description:
                        Reference to the destination address (FK identifier). Read-only.
                    example: 31130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                shippingDate:
                    description:
                        Date the shipment was shipped, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                shippingMethodId:
                    description:
                        Reference to the shipping method (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                shippingOptionName:
                    description:
                        Name of the chosen shipping option. Read-only.
                    example: Standard Delivery
                    readOnly: true
                    type: string
                status:
                    $ref: "#/components/schemas/Status"
                    readOnly: true
                trackingNumber:
                    description:
                        Tracking number stored on the shipment. Read-only.
                    example: 123AD-asd
                    readOnly: true
                    type: string
                trackingURL:
                    description:
                        Tracking URL stored on the shipment. Read-only.
                    example: https://example.com/tracking/123AD-asd
                    readOnly: true
                    type: string
                userName:
                    description:
                        User name of the user who created the shipment. Read-only.
                    example: John Doe
                    readOnly: true
                    type: string
            type: object
        ShippingAddress:
            description:
                Snapshot of the destination address on a shipment. Declared on the shipment schema for completeness; not
                populated by the default response converter.
            properties:
                city:
                    description:
                        City line of the destination address. Read-only.
                    example: Diamond Bar
                    readOnly: true
                    type: string
                countryISOCode:
                    description:
                        ISO 3166 alpha-2 country code of the destination. Read-only.
                    example: US
                    readOnly: true
                    type: string
                description:
                    description:
                        Free-form description of the destination address. Read-only.
                    example: right stairs, first room on the left
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        External reference code of the underlying address. Read-only.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                id:
                    description:
                        Identifier of the destination address. Read-only.
                    example: 31130
                    format: int64
                    minimum: 0
                    readOnly: true
                    type: integer
                latitude:
                    description:
                        Latitude geocode of the destination as a decimal degree. Read-only.
                    example: 33.9976884
                    format: double
                    readOnly: true
                    type: number
                longitude:
                    description:
                        Longitude geocode of the destination as a decimal degree. Read-only.
                    example: -117.8144595
                    format: double
                    readOnly: true
                    type: number
                name:
                    description:
                        Recipient name on the destination. Read-only.
                    example: Alessio Antonio Rendina
                    readOnly: true
                    type: string
                phoneNumber:
                    description:
                        Phone number on the destination. Read-only.
                    example: (123) 456 7890
                    readOnly: true
                    type: string
                regionISOCode:
                    description:
                        Region code of the destination. Read-only.
                    example: CA
                    readOnly: true
                    type: string
                street1:
                    description:
                        First street line of the destination. Read-only.
                    example: 1400 Montefino Ave
                    readOnly: true
                    type: string
                street2:
                    description:
                        Second street line of the destination. Read-only.
                    example: 1st floor
                    readOnly: true
                    type: string
                street3:
                    description:
                        Third street line of the destination. Read-only.
                    example: suite 200
                    readOnly: true
                    type: string
                zip:
                    description:
                        Postal code of the destination. Read-only.
                    example: "91765"
                    readOnly: true
                    type: string
            type: object
        ShippingMethod:
            description:
                Reference to a shipping method. Declared on the response schemas for completeness; not populated by the
                default response converter in this API.
            properties:
                description:
                    description:
                        Locale-resolved description of the shipping method. Read-only.
                    example: Standard ground delivery.
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        External reference code of the shipping method. Read-only.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                id:
                    description:
                        Primary identifier of the shipping method. Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        Locale-resolved name of the shipping method. Read-only.
                    example: Standard
                    readOnly: true
                    type: string
                shippingOption:
                    $ref: "#/components/schemas/ShippingOption"
                    readOnly: true
            type: object
        ShippingOption:
            description:
                Reference to a shipping option offered by a shipping method. Declared on the response schemas for
                completeness; not populated by the default response converter in this API.
            properties:
                amount:
                    description:
                        Numeric shipping cost in the order's currency. Read-only.
                    example: 9.99
                    format: double
                    readOnly: true
                    type: number
                amountFormatted:
                    description:
                        Shipping cost formatted in the order's currency and the request locale. Read-only.
                    example: $9.99
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        External reference code of the shipping option. Read-only.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                label:
                    description:
                        Locale-resolved label of the option. Read-only.
                    example: Standard Delivery
                    readOnly: true
                    type: string
                name:
                    description:
                        Programmatic name (key) of the option. Read-only.
                    example: standard-delivery
                    readOnly: true
                    type: string
            type: object
        Status:
            description:
                Status descriptor -- an integer code plus its raw label key and its locale-resolved label. The code's
                meaning depends on the field that embeds this status (order, payment, workflow, or shipment status); the
                code property lists the per-slot integer-to-label mapping.
            properties:
                code:
                    description:
                        Integer status code whose meaning depends on the embedding field. Order status (orderStatusInfo)
                        -- 0=Completed, 1=Pending, 2=Open, 6=In Progress, 8=Cancelled, 9=Subscription, 10=Processing,
                        13=Awaiting Pickup, 14=Partially Shipped, 15=Shipped, 16=Declined, 17=Refunded, 18=Disputed,
                        19=Partially Refunded, 20=On Hold, 21=Quote Requested, 22=Quote Processed. Payment status
                        (paymentStatusInfo) -- 0=Completed, 1=Pending, 2=Authorized, 4=Failed, 8=Cancelled, 17=Refunded,
                        23=Not Required. Workflow status (workflowStatusInfo) -- 0=Approved, 1=Pending, 2=Draft,
                        3=Expired, 4=Denied, 5=Inactive, 6=Incomplete, 7=Scheduled, 8=In Trash, 9=Empty. Shipment status
                        -- 0=Processing, 1=Ready To Ship, 2=Shipped, 3=Delivered. Read-only.
                    example: 0
                    format: int32
                    readOnly: true
                    type: integer
                label:
                    description:
                        Raw status label key, lowercase-with-dashes form. Read-only.
                    example: completed
                    readOnly: true
                    type: string
                label_i18n:
                    description:
                        Locale-resolved status label. Read-only.
                    example: Completed
                    readOnly: true
                    type: string
            type: object
        Step:
            description:
                Step in the order tracker derived from the order's configuration. The state typically resolves to one of
                complete, current, or upcoming.
            properties:
                id:
                    description:
                        Step identifier from the tracker definition. Read-only.
                    example: order-placed
                    readOnly: true
                    type: string
                label:
                    description:
                        Locale-resolved label of the step. Read-only.
                    example: Order Placed
                    readOnly: true
                    type: string
                state:
                    description:
                        Step state -- typically one of `complete`, `current`, or `upcoming`. Read-only.
                    example: complete
                    readOnly: true
                    type: string
        Summary:
            description:
                Pricing summary for a placed order -- items subtotal, shipping, tax, total, plus the cumulative discount
                levels and tax-inclusive variants when the channel publishes prices with tax.
            properties:
                currency:
                    description:
                        Locale-resolved currency name of the order. Read-only.
                    example: US Dollar
                    readOnly: true
                    type: string
                itemsCount:
                    description:
                        Number of top-level line items on the order. Read-only.
                    example: 3
                    format: int32
                    readOnly: true
                    type: integer
                itemsQuantity:
                    description:
                        Sum of line-item quantities on the order, with trailing zeros stripped. Read-only.
                    example: 10.1
                    format: bigdecimal
                    readOnly: true
                    type: number
                shippingDiscountPercentages:
                    description:
                        Cumulative shipping discount percentage levels 1 to 4, formatted in the request locale.
                        Read-only.
                    items:
                        type: string
                    readOnly: true
                    type: array
                shippingDiscountValue:
                    description:
                        Shipping discount amount in the order's currency; uses the tax-inclusive amount when the channel
                        displays prices with tax. Read-only.
                    example: 0.0
                    format: double
                    readOnly: true
                    type: number
                shippingDiscountValueFormatted:
                    description:
                        Shipping discount amount formatted in the order's currency and the request locale. Read-only.
                    example: $0.00
                    readOnly: true
                    type: string
                shippingValue:
                    description:
                        Shipping subtotal (without tax) in the order's currency. Read-only.
                    example: 9.99
                    format: double
                    readOnly: true
                    type: number
                shippingValueFormatted:
                    description:
                        Shipping subtotal formatted in the order's currency and the request locale. Read-only.
                    example: $9.99
                    readOnly: true
                    type: string
                shippingValueWithTaxAmount:
                    description:
                        Shipping subtotal including tax in the order's currency, when the channel publishes it.
                        Read-only.
                    example: 10.79
                    format: double
                    readOnly: true
                    type: number
                shippingValueWithTaxAmountFormatted:
                    description:
                        Shipping subtotal including tax, formatted in the order's currency and the request locale.
                        Read-only.
                    example: $10.79
                    readOnly: true
                    type: string
                subtotal:
                    description:
                        Items subtotal in the order's currency; switches to the tax-inclusive subtotal when the channel
                        displays prices with tax. Read-only.
                    example: 150.0
                    format: double
                    readOnly: true
                    type: number
                subtotalDiscountPercentages:
                    description:
                        Cumulative subtotal discount percentage levels 1 to 4, formatted in the request locale.
                        Read-only.
                    items:
                        type: string
                    readOnly: true
                    type: array
                subtotalDiscountValue:
                    description:
                        Subtotal discount amount in the order's currency; uses the tax-inclusive amount when the channel
                        displays prices with tax. Read-only.
                    example: 15.0
                    format: double
                    readOnly: true
                    type: number
                subtotalDiscountValueFormatted:
                    description:
                        Subtotal discount amount formatted in the order's currency and the request locale. Read-only.
                    example: $15.00
                    readOnly: true
                    type: string
                subtotalFormatted:
                    description:
                        Items subtotal formatted in the order's currency and the request locale. Read-only.
                    example: $150.00
                    readOnly: true
                    type: string
                taxValue:
                    description:
                        Tax amount on the order, in the order's currency. Read-only.
                    example: 12.15
                    format: double
                    readOnly: true
                    type: number
                taxValueFormatted:
                    description:
                        Tax amount formatted in the order's currency and the request locale. Read-only.
                    example: $12.15
                    readOnly: true
                    type: string
                total:
                    description:
                        Order total in the order's currency; switches to the tax-inclusive total when the channel
                        displays prices with tax. Read-only.
                    example: 156.99
                    format: double
                    readOnly: true
                    type: number
                totalDiscountPercentages:
                    description:
                        Cumulative total discount percentage levels 1 to 4, formatted in the request locale. Read-only.
                    items:
                        type: string
                    readOnly: true
                    type: array
                totalDiscountValue:
                    description:
                        Total discount amount in the order's currency; uses the tax-inclusive amount when the channel
                        displays prices with tax. Read-only.
                    example: 15.0
                    format: double
                    readOnly: true
                    type: number
                totalDiscountValueFormatted:
                    description:
                        Total discount amount formatted in the order's currency and the request locale. Read-only.
                    example: $15.00
                    readOnly: true
                    type: string
                totalFormatted:
                    description:
                        Order total formatted in the order's currency and the request locale. Read-only.
                    example: $156.99
                    readOnly: true
                    type: string
            type: object
        Term:
            description:
                Reference to a commerce term entry linked to a placed order. Exposed in both the delivery-term and
                payment-term sub-resource slots.
            properties:
                description:
                    description:
                        Locale-resolved description of the term in the request locale. Read-only.
                    example: Net 30 payment terms.
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        External reference code of the term. Read-only.
                    example: AB-34098-789-N
                    type: string
                id:
                    description:
                        Primary identifier of the term. Read-only.
                    example: 30130
                    format: int64
                    minimum: 0
                    type: integer
                name:
                    description:
                        Programmatic name (key) of the term. Read-only.
                    example: net-30
                    readOnly: true
                    type: string
            type: object
        VirtualItem:
            description:
                Virtual-item file entry attached to a placed order item -- carries the download URL, the remaining usage
                count, and the file version.
            properties:
                url:
                    description:
                        Direct download URL of the virtual-item file. Read-only.
                    example: https://example.com/virtual-download.zip
                    readOnly: true
                    type: string
                usages:
                    description:
                        Remaining download count on the virtual-item file. Read-only.
                    example: 3
                    format: int32
                    readOnly: true
                    type: integer
                version:
                    description:
                        Version string of the virtual-item file; null when unset. Read-only.
                    example: v1.0.0
                    readOnly: true
                    type: string
            type: object
    securitySchemes:
        BasicAuth:
            scheme: basic
            type: http
        BearerAuth:
            scheme: bearer
            type: http
