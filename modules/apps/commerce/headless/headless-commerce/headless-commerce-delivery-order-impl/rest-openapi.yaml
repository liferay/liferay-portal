components:
    parameters:
        accountExternalReferenceCodePathParam:
            in: path
            description:
                External reference code of the CommerceAccount that owns the placed orders being listed.
            name: accountExternalReferenceCode
            required: true
            schema:
                type: string
        accountIdPathParam:
            in: path
            description:
                Identifier of the CommerceAccount that owns the placed orders being listed.
            name: accountId
            required: true
            schema:
                format: int64
                type: integer
        attachmentExternalReferenceCodePathParam:
            in: path
            description:
                External reference code of the CommerceOrderAttachment being deleted.
            name: attachmentExternalReferenceCode
            required: true
            schema:
                type: string
        attachmentIdPathParam:
            in: path
            description:
                Identifier of the attachment being deleted.
            name: attachmentId
            required: true
            schema:
                format: int64
                type: integer
        callbackURLQueryParam:
            in: query
            description:
                Optional URL the storefront should navigate to after the payment step. When omitted, the
                order-confirmation checkout step URL is used as the next step.
            name: callbackURL
            required: false
            schema:
                type: string
        channelExternalReferenceCodePathParam:
            in: path
            description:
                External reference code of the CommerceChannel scoping the placed orders being listed.
            name: channelExternalReferenceCode
            required: true
            schema:
                type: string
        channelIdPathParam:
            in: path
            description:
                Identifier of the CommerceChannel scoping the placed orders being listed.
            name: channelId
            required: true
            schema:
                format: int64
                type: integer
        externalReferenceCodePathParam:
            in: path
            description:
                External reference code -- the caller-supplied idempotency key of the resource being addressed. The
                meaning is contextual to the path; on /placed-orders/by-externalReferenceCode/... it is the placed
                order, on /placed-order-items/by-externalReferenceCode/... it is the placed order item, on
                /placed-order-comments/by-externalReferenceCode/... it is the comment, and on
                /channels/by-externalReferenceCode/... it is the channel.
            name: externalReferenceCode
            required: true
            schema:
                type: string
        filterQueryParam:
            in: query
            description:
                OData v4 filter expression evaluated against the indexed entity. Supported fields depend on the endpoint
                -- placed orders use accountId, orderStatus, customFields, orderStatusInfo, createDate, modifiedDate,
                orderDate, requestedDeliveryDate, authorId, id, account, author, externalReferenceCode, name, orderType,
                orderTypeExternalReferenceCode, and purchaseOrderNumber; attachments use restricted, dateCreated,
                dateModified, priority, commerceOrderId, externalReferenceCode, title, and type (only when feature flag
                LPD-6252 is enabled); shipments use status, createDate, expectedDate, shippingDate, id, carrier, and
                tracking.
            name: filter
            required: false
            schema:
                type: string
        pageQueryParam:
            in: query
            description:
                One-based page index. Combined with pageSize to slice the result set; page=1 returns the first page.
            name: page
            required: false
            schema:
                type: integer
        pageSizeQueryParam:
            in: query
            description:
                Number of items per page. When omitted the Vulcan default page size applies.
            name: pageSize
            required: false
            schema:
                type: integer
        placedOrderCommentIdPathParam:
            in: path
            description:
                Identifier of the CommerceOrderNote being retrieved.
            name: placedOrderCommentId
            required: true
            schema:
                format: int64
                type: integer
        placedOrderIdPathParam:
            in: path
            description:
                Identifier of the placed CommerceOrder.
            name: placedOrderId
            required: true
            schema:
                format: int64
                type: integer
        placedOrderItemIdPathParam:
            in: path
            description:
                Identifier of the placed CommerceOrderItem.
            name: placedOrderItemId
            required: true
            schema:
                format: int64
                type: integer
        searchQueryParam:
            in: query
            description:
                Free-text keyword search evaluated against the indexed entity (uses Lucene-style matching on the same
                field set the entity model exposes for filter and sort).
            name: search
            required: false
            schema:
                type: string
        skuIdQueryParam:
            in: query
            description:
                Identifier of the CPInstance to narrow the placed order items to. Currently declared but not yet applied
                as an extra filter by the resource implementation.
            name: skuId
            required: false
            schema:
                format: int64
                type: integer
        sortQueryParam:
            in: query
            description:
                Comma-separated list of sort expressions evaluated by Vulcan. Supported fields match the entity model --
                see the filter parameter for the field set.
            name: sort
            required: false
            schema:
                type: string
    schemas:
        Attachment:
            description:
                Document or image attached to a placed order. Returned by the attachments listing endpoint and created
                via the by-base64 upload.
            properties:
                actions:
                    additionalProperties:
                        additionalProperties:
                            type: string
                        type: object
                    description:
                        Map of HATEOAS actions available to the current user, keyed by action name. Each value carries
                        the href template and HTTP method, computed dynamically from user permissions. Read-only.
                    readOnly: true
                    type: object
                dateModified:
                    description:
                        Last modification timestamp of the attachment, in ISO 8601. Read-only.
                    example: 2017-07-21 19:30:00+00:00
                    format: date-time
                    readOnly: true
                    type: string
                extension:
                    description:
                        File extension of the underlying document-library file. Read-only.
                    example: pdf
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        Idempotency key for create and update; must be unique per attachment within the company.
                        Read-only on this response.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                id:
                    description:
                        Primary identifier of the attachment. Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                priority:
                    description:
                        Display priority of the attachment, lower numbers appearing first.
                    example: 1.0
                    format: double
                    readOnly: true
                    type: number
                restricted:
                    description:
                        When true the attachment is restricted to admin and commerce roles; storefront audiences do not
                        see it.
                    example: false
                    readOnly: true
                    type: boolean
                title:
                    description:
                        Title of the attachment as supplied at upload time.
                    example: Purchase Order Confirmation
                    readOnly: true
                    type: string
                type:
                    description:
                        Type key of the attachment, drawn from the order-attachment type list configured for the
                        company.
                    example: purchase-order
                    readOnly: true
                    type: string
                typeLabel:
                    description:
                        Locale-resolved label of the attachment type, derived from the type key. Falls back to the raw
                        key when no list entry matches.
                    example: Purchase Order
                    readOnly: true
                    type: string
                url:
                    description:
                        Document-library download URL for the latest file version. Read-only.
                    example: https://example.com/attachment.pdf
                    readOnly: true
                    type: string
        AttachmentBase64:
            description:
                Request payload for uploading an order attachment as a base64-encoded file.
            properties:
                attachment:
                    description:
                        Base64-encoded binary content of the file.
                    example: JVBERi0xLjQKJeLjz9MK
                    type: string
                externalReferenceCode:
                    description:
                        Optional idempotency key applied to the attachment on the legacy file-entry path; ignored on the
                        indexed path.
                    example: AB-34098-789-N
                    type: string
                priority:
                    description:
                        Display priority applied to the new attachment, lower numbers appearing first.
                    example: 1.0
                    format: double
                    type: number
                restricted:
                    description:
                        When true the new attachment is restricted to admin and commerce roles.
                    example: false
                    type: boolean
                title:
                    description:
                        Title applied to the new attachment; also reused as the file name on the indexed path.
                    example: Purchase Order Confirmation
                    type: string
                type:
                    description:
                        Type key applied to the new attachment, drawn from the order-attachment type list configured for
                        the company.
                    example: purchase-order
                    type: string
            type: object
        Error:
            description:
                Standard error envelope returned for any non-2xx response.
            properties:
                errorCode:
                    description:
                        Internal error code that identifies the failure class.
                    example: 996
                    readOnly: true
                    type: integer
                errorDescription:
                    description:
                        Human-readable description of the failure.
                    example: Unable to find currency. Currency code should be expressed with 3-letter ISO 4217 format.
                    readOnly: true
                    type: string
                message:
                    description:
                        Underlying exception message captured by the error handler.
                    example: No CommerceCurrency exists with the key {groupId=41811, code=US Dollar}
                    readOnly: true
                    type: string
                status:
                    description:
                        HTTP status code returned alongside the body.
                    example: 404
                    readOnly: true
                    type: integer
            type: object
        OrderTransition:
            description:
                Workflow transition that can be executed on a placed order. Returned by the listing endpoint with the
                transitions available to the current user, and accepted by the POST endpoint to execute one.
            properties:
                comment:
                    description:
                        Optional reviewer comment attached to the transition; read on input and echoed on the response.
                    example: Approved by supervisor.
                    type: string
                label:
                    description:
                        Locale-resolved label of the transition name. Read-only.
                    example: Approve
                    readOnly: true
                    type: string
                name:
                    description:
                        Transition name -- either a workflow transition name, the synthetic value `process-quote`, or
                        the synthetic value `reorder`.
                    example: approve
                    type: string
                orderId:
                    description:
                        On the reorder response, the identifier of the newly created order. Unset for other transitions.
                        Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                placedOrderId:
                    description:
                        Reference to the order the transition originated from (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                workflowTaskId:
                    description:
                        Identifier of the workflow task being acted on; zero indicates the synthetic process-quote or
                        reorder transition.
                    example: 30130
                    format: int64
                    type: integer
        PlacedOrder:
            description:
                Finalized order (one whose status has moved past the open cart-draft state) as exposed to storefront and
                order-history consumers. Retrieved by id or external reference code; a small set of buyer-facing fields
                can be updated via PATCH.
            properties:
                account:
                    description:
                        Display name of the buyer account on the order. Read-only.
                    example: Acme Industries
                    readOnly: true
                    type: string
                accountId:
                    description:
                        Reference to the buyer account (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                attachments:
                    description:
                        Legacy file-entry attachments of the order. For the indexed attachment surface use the
                        /attachments sub-resource.
                    items:
                        $ref: "#/components/schemas/Attachment"
                    type: array
                author:
                    description:
                        User name of the user who created the order. Read-only.
                    example: John Doe
                    readOnly: true
                    type: string
                authorId:
                    description:
                        Reference to the user who created the order (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                channelId:
                    description:
                        Reference to the channel the order belongs to (FK identifier). Read-only; resolved from the
                        order's site.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                couponCode:
                    description:
                        Coupon code applied to the order. Read-only.
                    example: SUMMER10
                    readOnly: true
                    type: string
                createDate:
                    description:
                        Creation date of the order, in ISO 8601 (date only). Read-only; set when the order is first
                        persisted.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                currencyCode:
                    description:
                        ISO 4217 currency code of the order. Declared on the schema; not populated by the default
                        response converter.
                    example: USD
                    readOnly: true
                    type: string
                customFields:
                    additionalProperties: true
                    description:
                        Custom expando attributes captured from the order; writable through PATCH.
                    type: object
                errorMessages:
                    description:
                        Validation messages produced by the order engine. Declared on the schema; not currently
                        populated by this response.
                    items:
                        type: string
                    readOnly: true
                    type: array
                externalReferenceCode:
                    description:
                        Idempotency key for create and update; must be unique per order within the company. Read-only on
                        this response.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                friendlyURLSeparator:
                    description:
                        Friendly URL separator configured for orders in this company; returned only when the matching
                        feature flag is enabled.
                    example: /-/
                    readOnly: true
                    type: string
                id:
                    description:
                        Primary identifier of the order. Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                lastPriceUpdateDate:
                    description:
                        Date of the last successful price recalculation, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                modifiedDate:
                    description:
                        Last modification date of the order, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                name:
                    description:
                        Human-friendly order name; writable through PATCH.
                    example: Order Name
                    type: string
                orderStatusInfo:
                    $ref: "#/components/schemas/Status"
                    readOnly: true
                orderType:
                    description:
                        Locale-resolved name of the order type. Read-only.
                    example: Standard
                    readOnly: true
                    type: string
                orderTypeExternalReferenceCode:
                    description:
                        External reference code of the order type. Read-only.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                orderTypeId:
                    description:
                        Reference to the order type (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                orderUUID:
                    description:
                        UUID of the order, used for guest payment links. Read-only.
                    example: 11111111-1111-1111-1111-111111111111
                    readOnly: true
                    type: string
                paymentMethod:
                    description:
                        Engine key of the payment method recorded on the order. Read-only.
                    example: money-order
                    readOnly: true
                    type: string
                paymentMethodLabel:
                    description:
                        Locale-resolved display name of the payment method. Read-only.
                    example: Money Order
                    readOnly: true
                    type: string
                paymentStatus:
                    description:
                        "Integer payment status of the order. Integer payment status: 0=Completed, 1=Pending, 2=Authorized, 4=Failed, 8=Cancelled, 17=Refunded, 23=Not Required. Read-only."
                    example: 0
                    format: int32
                    readOnly: true
                    type: integer
                paymentStatusInfo:
                    $ref: "#/components/schemas/Status"
                    readOnly: true
                paymentStatusLabel:
                    description:
                        Raw label key for the payment status; the locale-resolved form is on
                        `paymentStatusInfo.label_i18n`. Read-only.
                    example: completed
                    readOnly: true
                    type: string
                placedOrderBillingAddress:
                    $ref: "#/components/schemas/PlacedOrderAddress"
                    readOnly: true
                placedOrderBillingAddressId:
                    description:
                        Reference to the billing address (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                placedOrderComments:
                    description:
                        Comments attached to the order. Read-only on this response.
                    items:
                        $ref: "#/components/schemas/PlacedOrderComment"
                    readOnly: true
                    type: array
                placedOrderItems:
                    description:
                        Top-level line items on the order. Read-only on this response.
                    items:
                        $ref: "#/components/schemas/PlacedOrderItem"
                    readOnly: true
                    type: array
                placedOrderShippingAddress:
                    $ref: "#/components/schemas/PlacedOrderAddress"
                    readOnly: true
                placedOrderShippingAddressId:
                    description:
                        Reference to the shipping address (FK identifier). Read-only.
                    example: 31130
                    format: int64
                    readOnly: true
                    type: integer
                printedNote:
                    description:
                        Printed note shown on the order receipt; writable through PATCH.
                    example: Please leave at the front desk.
                    type: string
                purchaseOrderNumber:
                    description:
                        Customer-supplied purchase-order number; writable through PATCH.
                    example: PO-12345
                    type: string
                requestedDeliveryDate:
                    description:
                        Requested delivery date stored on the order, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                shipments:
                    $ref: "#/components/schemas/Shipment"
                    readOnly: true
                shippingMethod:
                    description:
                        Engine key of the shipping method recorded on the order. Read-only.
                    example: fixed
                    readOnly: true
                    type: string
                shippingOption:
                    description:
                        Name of the chosen shipping option on the order. Read-only.
                    example: Standard Delivery
                    readOnly: true
                    type: string
                status:
                    description:
                        Raw workflow status label of the order. Read-only.
                    example: approved
                    readOnly: true
                    type: string
                steps:
                    description:
                        Tracker steps for the order, derived from the order's configuration. Read-only.
                    items:
                        $ref: "#/components/schemas/Step"
                    type: array
                summary:
                    $ref: "#/components/schemas/Summary"
                    readOnly: true
                useAsBilling:
                    description:
                        Declared shipping-as-billing flag. Declared on the schema; not populated by the default response
                        converter.
                    example: true
                    readOnly: true
                    type: boolean
                valid:
                    description:
                        Declared validity flag. Declared on the schema; not populated by the default response converter.
                    example: true
                    readOnly: true
                    type: boolean
                workflowStatusInfo:
                    $ref: "#/components/schemas/Status"
                    readOnly: true
            type: object
        PlacedOrderAddress:
            description:
                Snapshot of the address recorded on a placed order, used for both the billing and the shipping slots.
                Read-only -- addresses cannot be edited through this API once the order has been placed.
            properties:
                city:
                    description:
                        City line of the address. Read-only.
                    example: Diamond Bar
                    readOnly: true
                    type: string
                country:
                    description:
                        Locale-resolved country name. Read-only.
                    example: United States
                    readOnly: true
                    type: string
                countryISOCode:
                    description:
                        ISO 3166 alpha-2 country code. Read-only.
                    example: US
                    readOnly: true
                    type: string
                description:
                    description:
                        Free-form description on the address. Read-only.
                    example: right stairs, first room on the left
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        Idempotency key for the address; must be unique per address within the company. Read-only on
                        this response.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                id:
                    description:
                        Primary identifier of the address. Read-only.
                    example: 31130
                    format: int64
                    readOnly: true
                    type: integer
                latitude:
                    description:
                        Latitude geocode of the address as a decimal degree. Read-only.
                    example: 33.9976884
                    format: double
                    readOnly: true
                    type: number
                longitude:
                    description:
                        Longitude geocode of the address as a decimal degree. Read-only.
                    example: -117.8144595
                    format: double
                    readOnly: true
                    type: number
                name:
                    description:
                        Recipient name on the address. Read-only.
                    example: Alessio Antonio Rendina
                    readOnly: true
                    type: string
                phoneNumber:
                    description:
                        Phone number on the address. Read-only.
                    example: (123) 456 7890
                    readOnly: true
                    type: string
                region:
                    description:
                        Locale-resolved region name. Read-only.
                    example: California
                    readOnly: true
                    type: string
                regionISOCode:
                    description:
                        Region code; empty string when the country has no registered regions. Read-only.
                    example: CA
                    readOnly: true
                    type: string
                street1:
                    description:
                        First street line of the address. Read-only.
                    example: 1400 Montefino Ave
                    readOnly: true
                    type: string
                street2:
                    description:
                        Second street line of the address. Read-only.
                    example: 1st floor
                    readOnly: true
                    type: string
                street3:
                    description:
                        Third street line of the address. Read-only.
                    example: suite 200
                    readOnly: true
                    type: string
                subtype:
                    description:
                        Optional subtype label on the address. Read-only.
                    example: Office
                    readOnly: true
                    type: string
                type:
                    description:
                        Declared address-type string. Declared on the schema; not populated by the default response
                        converter.
                    example: shipping
                    readOnly: true
                    type: string
                typeId:
                    description:
                        "Integer address type: 1=Billing, 2=Billing And Shipping, 3=Shipping. Read-only."
                    example: 3
                    format: int32
                    readOnly: true
                    type: integer
                vatNumber:
                    description:
                        Declared VAT number. Declared on the schema; not populated by the default response converter.
                    example: Abcd1234
                    readOnly: true
                    type: string
                zip:
                    description:
                        Postal code on the address. Read-only.
                    example: "91765"
                    readOnly: true
                    type: string
            type: object
        PlacedOrderComment:
            description:
                Note attached to a placed order. The restricted flag separates buyer-visible notes from back-office-only
                notes.
            properties:
                author:
                    description:
                        User name of the user who wrote the comment. Read-only.
                    example: John Doe
                    readOnly: true
                    type: string
                content:
                    description:
                        Body of the comment. Read-only.
                    example: Please verify the delivery date with the buyer.
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        Idempotency key for the comment; must be unique per comment within the company. Read-only on
                        this response.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                id:
                    description:
                        Primary identifier of the comment. Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                orderId:
                    description:
                        Reference to the parent order (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                restricted:
                    description:
                        When true the comment is hidden from buyer-side audiences and only visible in back-office
                        contexts.
                    example: false
                    readOnly: true
                    type: boolean
            type: object
        PlacedOrderItem:
            description:
                Top-level line item on a placed order. Child items are exposed inline via the placedOrderItems
                collection, shipment splits via placedOrderItemShipments, and virtual downloads via virtualItems and
                virtualItemURLs.
            properties:
                adaptiveMediaImageHTMLTag:
                    description:
                        Pre-rendered Adaptive Media image tag for the item. Read-only.
                    readOnly: true
                    type: string
                customFields:
                    additionalProperties: true
                    description:
                        Custom expando attributes captured from the line item. Read-only on this response.
                    readOnly: true
                    type: object
                deliveryGroup:
                    deprecated: true
                    description:
                        Deprecated -- use `deliveryGroupName` instead. Carries the same value.
                    example: default
                    readOnly: true
                    type: string
                deliveryGroupName:
                    description:
                        Delivery group name on the line item. Read-only.
                    example: default
                    readOnly: true
                    type: string
                errorMessages:
                    description:
                        When the underlying SKU no longer exists, the single message
                        `the-product-is-no-longer-available`; otherwise null. Read-only.
                    items:
                        type: string
                    readOnly: true
                    type: array
                externalReferenceCode:
                    description:
                        Idempotency key for the line item; must be unique per line item within the company. Read-only on
                        this response.
                    example: AB-34098-789-N
                    readOnly: true
                    type: string
                id:
                    description:
                        Primary identifier of the line item. Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        Locale-resolved item name in the request locale. Read-only.
                    example: Hand Saw
                    readOnly: true
                    type: string
                options:
                    description:
                        JSON blob of the line item's selected product options. Read-only.
                    example: "[]"
                    readOnly: true
                    type: string
                parentOrderItemId:
                    description:
                        Reference to the parent line item (FK identifier). Zero when the line item is top-level.
                        Read-only.
                    example: 0
                    format: int64
                    readOnly: true
                    type: integer
                placedOrderItemShipments:
                    description:
                        Shipments for this line item. Read-only on this response.
                    items:
                        $ref: "#/components/schemas/PlacedOrderItemShipment"
                    readOnly: true
                    type: array
                placedOrderItems:
                    description:
                        Child line items beneath this line item. Read-only on this response.
                    items:
                        $ref: "#/components/schemas/PlacedOrderItem"
                    readOnly: true
                    type: array
                price:
                    $ref: "#/components/schemas/Price"
                    readOnly: true
                productId:
                    description:
                        Reference to the parent product (FK identifier). Read-only.
                    example: 30130
                    format: int64
                    readOnly: true
                    type: integer
                productURLs:
                    additionalProperties:
                        type: string
                    description:
                        Localized text. Map keys are locale codes; values are the URL title for the product in that
                        locale. Read-only.
                    example:
                        en_US: hand-saw
                        hr_HR: hand-saw-hr
                        hu_HU: hand-saw-hu
                    readOnly: true
                    type: object
                quantity:
                    description:
                        Locale-formatted quantity, computed from the SKU and the chosen unit of measure. Read-only.
                    example: 10.1
                    format: bigdecimal
                    readOnly: true
                    type: number
                replacedSku:
                    description:
                        SKU of the original item this row replaced, when the line item was swapped at fulfillment.
                        Read-only.
                    example: OLD-SKU-001
                    readOnly: true
                    type: string
                requestedDeliveryDate:
                    description:
                        Requested delivery date on the line item, in ISO 8601 (date only). Read-only.
                    example: 2017-07-21
                    format: date
                    readOnly: true
                    type: string
                settings:
                    $ref: "#/components/schemas/Settings"
                    readOnly: true
                shippingAddressExternalReferenceCode:
