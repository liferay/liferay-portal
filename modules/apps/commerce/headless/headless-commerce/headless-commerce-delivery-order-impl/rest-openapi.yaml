tags:
-   description:
        CRUD over the placed order's attachments, switching between the legacy file-entry repository and the indexed
        CommerceOrderAttachment model based on feature flag LPD-6252.
    name: Attachment
-   description:
        Listing of workflow transitions a user can execute on a placed order (workflow tasks plus the synthetic
        process-quote and reorder transitions) and the endpoint that executes one.
    name: OrderTransition
-   description:
        Operations on finalized orders (orders whose status is no longer open), including retrieval by id or external
        reference code, channel-scoped and account-scoped listings, in-place edits, and resume-payment URL construction.
    name: PlacedOrder
-   description:
        Read-only access to the billing and shipping CommerceAddress snapshots referenced by a placed order.
    name: PlacedOrderAddress
-   description:
        Read-only access to the CommerceOrderNote entries attached to a placed order, listed by id or external reference
        code.
    name: PlacedOrderComment
-   description:
        Read-only access to top-level CommerceOrderItem rows of a placed order, with options, pricing, virtual items,
        and inventory settings.
    name: PlacedOrderItem
-   description:
        Read-only access to the CommerceShipmentItem rows produced for a given placed order item, with a fallback to
