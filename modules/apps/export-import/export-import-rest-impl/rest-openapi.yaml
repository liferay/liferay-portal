components:
    schemas:
        ExportPreview:
            properties:
                additionCount:
                    format: int64
                    readOnly: true
                    type: integer
                deletionCount:
                    format: int64
                    readOnly: true
                    type: integer
                previewPortletDataHandlerSections:
                    items:
                        $ref: "#/components/schemas/PreviewPortletDataHandlerSection"
                    readOnly: true
                    type: array
            type: object
        ExportProcess:
            properties:
                creator:
                    $ref: ../../headless/headless-delivery/headless-delivery-impl/rest-openapi.yaml#Creator
                    readOnly: true
                dateCompleted:
                    format: date-time
                    readOnly: true
                    type: string
                dateCreated:
                    description:
                        The export process's creation date.
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        The export process's last modification date.
                    format: date-time
                    readOnly: true
                    type: string
                errorMessage:
                    description:
                        The export process's error message when it did not end successfully.
                    readOnly: true
                    type: string
                id:
                    description:
                        The export process's ID.
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        The export process's name.
                    readOnly: true
                    type: string
                status:
                    $ref: "#/components/schemas/Status"
                    description:
                        The export process's end status.
                    readOnly: true
            type: object
        ExportProcessRequest:
            properties:
                comments:
                    default: false
                    type: boolean
                dateRangeType:
                    description:
                        The recipe used to resolve the export window at every run. ALL exports everything, DATE_RANGE exports the window between the start and end dates, resolving a missing end date as the run time, and LAST exports a window of whole hours ending at the run time, derived from the start date. When absent, the type is inferred from the given dates.
                    enum: [ALL, DATE_RANGE, LAST]
                    type: string
                deletions:
                    default: false
                    type: boolean
                endDate:
                    format: date-time
                    type: string
                logo:
                    default: false
                    type: boolean
                name:
                    type: string
                permissions:
                    default: false
                    type: boolean
                ratings:
                    default: false
                    type: boolean
                requestPortletDataHandlers:
                    items:
                        $ref: "#/components/schemas/RequestPortletDataHandler"
                    type: array
                sitePagesSettings:
                    default: false
                    type: boolean
                siteTemplateSettings:
                    default: false
                    type: boolean
                startDate:
                    format: date-time
                    type: string
                themeSettings:
                    default: false
                    type: boolean
            required:
                -   name
            type: object
        ImportPreview:
            properties:
                additionCount:
                    format: int64
                    readOnly: true
                    type: integer
                author:
                    readOnly: true
                    type: string
                deletionCount:
                    format: int64
                    readOnly: true
                    type: integer
                exportDate:
                    format: date-time
                    readOnly: true
                    type: string
                fileName:
                    readOnly: true
                    type: string
                fileSize:
                    format: int64
                    readOnly: true
                    type: integer
                previewPortletDataHandlerSections:
                    items:
                        $ref: "#/components/schemas/PreviewPortletDataHandlerSection"
                    readOnly: true
                    type: array
            type: object
        ImportProcess:
            properties:
                creator:
                    $ref: ../../headless/headless-delivery/headless-delivery-impl/rest-openapi.yaml#Creator
                    readOnly: true
                dateCompleted:
                    format: date-time
                    readOnly: true
                    type: string
                dateCreated:
                    description:
                        The import process's creation date.
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        The import process's last modification date.
                    format: date-time
                    readOnly: true
                    type: string
                errorMessage:
                    description:
                        The import process's error message when it did not end successfully.
                    readOnly: true
                    type: string
                id:
                    description:
                        The import process's ID.
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        The import process's name.
                    readOnly: true
                    type: string
                status:
                    $ref: "#/components/schemas/Status"
                    description:
                        The import process's end status.
                    readOnly: true
            type: object
        ImportProcessRequest:
            properties:
                comments:
                    default: false
                    type: boolean
                dataStrategy:
                    default: MIRROR
                    enum: [MIRROR, MIRROR_OVERWRITE, COPY_AS_NEW]
                    type: string
                deletions:
                    default: false
                    type: boolean
                logo:
                    default: false
                    type: boolean
                name:
                    type: string
                permissions:
                    default: false
                    type: boolean
                ratings:
                    default: false
                    type: boolean
                requestPortletDataHandlers:
                    items:
                        $ref: "#/components/schemas/RequestPortletDataHandler"
                    type: array
                sitePagesSettings:
                    default: false
                    type: boolean
                siteTemplateSettings:
                    default: false
                    type: boolean
                themeSettings:
                    default: false
                    type: boolean
                userIdStrategy:
                    default: CURRENT_USER_ID
                    enum: [CURRENT_USER_ID, ALWAYS_CURRENT_USER_ID]
                    type: string
            type: object
        Origin:
            properties:
                code:
                    format: int32
                    type: integer
                label:
                    type: string
            type: object
        PreviewPortletDataHandler:
            properties:
                additionCount:
                    format: int64
                    readOnly: true
                    type: integer
                deletionCount:
                    format: int64
                    readOnly: true
                    type: integer
                description:
                    readOnly: true
                    type: string
                label:
                    readOnly: true
                    type: string
                name:
                    description:
                        The handler's portlet ID.
                    readOnly: true
                    type: string
                previewPortletDataHandlerControls:
                    items:
                        $ref: "#/components/schemas/PreviewPortletDataHandlerControl"
                    readOnly: true
                    type: array
                tag:
                    readOnly: true
                    type: string
            type: object
        PreviewPortletDataHandlerBoolean:
            allOf:
                -   $ref: "#/components/schemas/PreviewPortletDataHandlerControl"
                -   properties:
                        additionCount:
                            format: int64
                            readOnly: true
                            type: integer
                        defaultState:
                            readOnly: true
                            type: boolean
                        deletionCount:
                            format: int64
                            readOnly: true
                            type: integer
                        previewPortletDataHandlerControls:
                            items:
                                $ref: "#/components/schemas/PreviewPortletDataHandlerControl"
                            readOnly: true
                            type: array
            type: object
        PreviewPortletDataHandlerChoice:
            allOf:
                -   $ref: "#/components/schemas/PreviewPortletDataHandlerControl"
                -   properties:
                        choices:
                            items:
                                properties:
                                    additionCount:
                                        format: int64
                                        readOnly: true
                                        type: integer
                                    deletionCount:
                                        format: int64
                                        readOnly: true
                                        type: integer
                                    label:
                                        readOnly: true
                                        type: string
                                    name:
                                        readOnly: true
                                        type: string
                                type: object
                            readOnly: true
                            type: array
                        defaultChoice:
                            readOnly: true
                            type: string
            type: object
        PreviewPortletDataHandlerControl:
            discriminator:
                mapping:
                    Boolean: "#/components/schemas/PreviewPortletDataHandlerBoolean"
                    Choice: "#/components/schemas/PreviewPortletDataHandlerChoice"
                    Setting: "#/components/schemas/PreviewPortletDataHandlerSetting"
                propertyName: type
            properties:
                disabled:
                    readOnly: true
                    type: boolean
                label:
                    readOnly: true
                    type: string
                name:
                    readOnly: true
                    type: string
                type:
                    enum: [Boolean, Choice, Setting]
                    readOnly: true
                    type: string
            required:
                -   type
            type: object
        PreviewPortletDataHandlerSection:
            properties:
                additionCount:
                    format: int64
                    readOnly: true
                    type: integer
                deletionCount:
                    format: int64
                    readOnly: true
                    type: integer
                label:
                    readOnly: true
                    type: string
                name:
                    readOnly: true
                    type: string
                previewPortletDataHandlers:
                    items:
                        $ref: "#/components/schemas/PreviewPortletDataHandler"
                    readOnly: true
                    type: array
            type: object
        PreviewPortletDataHandlerSetting:
            allOf:
                -   $ref: "#/components/schemas/PreviewPortletDataHandlerControl"
                -   properties:
                        defaultState:
                            readOnly: true
                            type: boolean
                        previewPortletDataHandlerControls:
                            items:
                                $ref: "#/components/schemas/PreviewPortletDataHandlerControl"
                            readOnly: true
                            type: array
            type: object
        ProcessProgress:
            properties:
                percentage:
                    description:
                        The completion percentage of the process.
                    format: int32
                    readOnly: true
                    type: integer
            type: object
        PublishPreview:
            properties:
                additionCount:
                    format: int64
                    readOnly: true
                    type: integer
                deletionCount:
                    format: int64
                    readOnly: true
                    type: integer
                previewPortletDataHandlerSections:
                    items:
                        $ref: "#/components/schemas/PreviewPortletDataHandlerSection"
                    readOnly: true
                    type: array
            type: object
        PublishProcess:
            properties:
                creator:
                    $ref: ../../headless/headless-delivery/headless-delivery-impl/rest-openapi.yaml#Creator
                    readOnly: true
                dateCompleted:
                    format: date-time
                    readOnly: true
                    type: string
                dateCreated:
                    description:
                        The publish process's creation date.
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        The publish process's last modification date.
                    format: date-time
                    readOnly: true
                    type: string
                errorMessage:
                    description:
                        The publish process's error message when it did not end successfully.
                    readOnly: true
                    type: string
                id:
                    description:
                        The publish process's ID.
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        The publish process's name.
                    readOnly: true
                    type: string
                status:
                    $ref: "#/components/schemas/Status"
                    description:
                        The publish process's end status.
                    readOnly: true
                type:
                    description:
                        How the publish process was started, either manually or by a schedule.
                    enum: [MANUAL, SCHEDULED]
                    readOnly: true
                    type: string
            type: object
        PublishProcessRequest:
            properties:
                comments:
                    default: false
                    type: boolean
                cronExpression:
                    description:
                        A cron expression. When set, the publish is scheduled to recur instead of running immediately.
                    type: string
                dateRangeType:
                    description:
                        The recipe used to resolve the publish window at every run, relaunch, and scheduled occurrence. ALL publishes everything, DATE_RANGE publishes the window between the start and end dates, resolving a missing end date as the run time, LAST publishes a window of whole hours ending at the run time, derived from the start date, and FROM_LAST_PUBLISH_DATE publishes the changes recorded since each entity's own last publish. When absent, the type is inferred from the given dates.
                    enum: [ALL, DATE_RANGE, FROM_LAST_PUBLISH_DATE, LAST]
                    type: string
                deletions:
                    default: false
                    type: boolean
                endDate:
                    format: date-time
                    type: string
                logo:
                    default: false
                    type: boolean
                name:
                    type: string
                permissions:
                    default: false
                    type: boolean
                ratings:
                    default: false
                    type: boolean
                requestPortletDataHandlers:
                    items:
                        $ref: "#/components/schemas/RequestPortletDataHandler"
                    type: array
                scheduleEndDate:
                    description:
                        When the scheduled publish stops recurring. Applies only when a cron expression is given.
                    format: date-time
                    type: string
                scheduleStartDate:
                    description:
                        When the scheduled publish starts. Applies only when a cron expression is given. Defaults to now.
                    format: date-time
                    type: string
                sitePagesSettings:
                    default: false
                    type: boolean
                siteTemplateSettings:
                    default: false
                    type: boolean
                startDate:
                    format: date-time
                    type: string
                themeSettings:
                    default: false
                    type: boolean
                timeZoneId:
                    description:
                        The time zone the cron expression is evaluated in. Defaults to the server time zone.
                    type: string
            required:
                -   name
            type: object
        ReportEntry:
            properties:
                classExternalReferenceCode:
                    description:
                        The reported item's external reference code.
                    readOnly: true
                    type:
                        string
                classNameId:
                    description:
                        The reported item's class name ID.
                    format: int64
                    readOnly: true
                    type: integer
                classPK:
                    description:
                        The reported item's class primary key.
                    format: int64
                    readOnly: true
                    type: integer
                configurationId:
                    description:
                        The report entry's configuration ID.
                    format: int64
                    readOnly: true
                    type: integer
                creator:
                    $ref: ../../headless/headless-delivery/headless-delivery-impl/rest-openapi.yaml#Creator
                    readOnly: true
                dateCreated:
                    description:
                        The report entry's creation date.
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        The report entry's latest modification date.
                    format: date-time
                    readOnly: true
                    type: string
                errorMessage:
                    description:
                        The error message.
                    readOnly: true
                    type: string
                errorStacktrace:
                    description:
                        The full stack trace of the error. It is an optional field that can be embedded with nested fields.
                    readOnly: true
                    type: string
                id:
                    description:
                        The report entry's ID.
                    format: int64
                    readOnly: true
                    type: integer
                modelName:
                    description:
                        The reported item's model name.
                    readOnly: true
                    type: string
                origin:
                    $ref: "#/components/schemas/Origin"
                    description:
                        The report entry's origin.
                    readOnly: true
                scope:
                    description:
                        The reported item's scope.
                    readOnly: true
                    type: scope
                status:
                    $ref: "#/components/schemas/Status"
                    description:
                        The report entry's status.
                    readOnly: true
                type:
                    $ref: "#/components/schemas/Type"
                    description:
                        The report entry's type.
                    readOnly: true
            type: object
        RequestPortletDataHandler:
            properties:
                name:
                    description:
                        The handler's portlet ID.
                    type: string
                requestPortletDataHandlerControls:
                    items:
                        $ref: "#/components/schemas/RequestPortletDataHandlerControl"
                    type: array
            type: object
        RequestPortletDataHandlerControl:
            properties:
                name:
                    type: string
                requestPortletDataHandlerControls:
                    items:
                        $ref: "#/components/schemas/RequestPortletDataHandlerControl"
                    type: array
                values:
                    items:
                        type: string
                    type: array
            type: object
        ScheduledPublishProcess:
            properties:
                creator:
                    $ref: ../../headless/headless-delivery/headless-delivery-impl/rest-openapi.yaml#Creator
                    readOnly: true
                cronExpression:
                    description:
                        The cron expression that fires the scheduled publication.
                    readOnly: true
                    type: string
                dateCreated:
                    description:
                        The scheduled publish process's creation date.
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    description:
                        The scheduled publish process's ID.
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        The scheduled publish process's name.
                    readOnly: true
                    type: string
                nextFireDate:
                    description:
                        The next date the scheduled publication fires.
                    format: date-time
                    readOnly: true
                    type: string
                publishParameters:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    description:
                        The raw export import parameters the scheduled publication was created with.
                    readOnly: true
                    type: object
                scheduleEndDate:
                    description:
                        The date the scheduled publication stops firing.
                    format: date-time
                    readOnly: true
                    type: string
                scheduleStartDate:
                    description:
                        The date the scheduled publication starts firing.
                    format: date-time
                    readOnly: true
                    type: string
            type: object
        Status:
            properties:
                code:
                    format: int32
                    type: integer
                label:
                    type: string
        Type:
            properties:
                code:
                    format: int32
                    type: integer
                label:
                    type: string
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.exportimport.rest.client', and version '1.0.11'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Export Import
    version: v1.0
openapi: 3.0.1
paths:
    "/asset-libraries/{assetLibraryExternalReferenceCode}/export-preview":
        get:
            operationId: getAssetLibraryExportPreview
            parameters:
                -   in: path
                    name: assetLibraryExternalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: dateRangeType
                    schema:
                        enum: [ALL, DATE_RANGE, LAST]
                        type: string
                -   in: query
                    name: endDate
                    schema:
                        format: date-time
                        type: string
                -   in: query
                    name: plid
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: portletId
                    schema:
                        type: string
                -   in: query
                    name: startDate
                    schema:
                        format: date-time
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ExportPreview"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ExportPreview"
            tags: ["ExportPreview"]
    "/asset-libraries/{assetLibraryExternalReferenceCode}/export-processes":
        get:
            description:
                Retrieves the layout export process entries of the specified asset library, or the export process entries of one of its portlets when a portlet ID is given.
            operationId: getAssetLibraryExportProcessesPage
            parameters:
                -   in: path
                    name: assetLibraryExternalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: creatorId
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: fields
                    schema:
                        type: string
                -   in: query
                    name: nestedFields
                    schema:
                        type: string
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: portletId
                    schema:
                        type: string
                -   in: query
                    name: restrictFields
                    schema:
                        type: string
                -   in: query
                    name: search
                    schema:
                        type: string
                -   in: query
                    name: sort
                    schema:
                        type: string
                -   in: query
                    name: status
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ExportProcess"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ExportProcess"
                                type: array
            tags: ["ExportProcess"]
        post:
            operationId: postAssetLibraryExportProcess
            parameters:
                -   in: path
                    name: assetLibraryExternalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: plid
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: portletId
                    schema:
                        type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ExportProcessRequest"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/ExportProcessRequest"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ExportProcess"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ExportProcess"
            tags: ["ExportProcess"]
    "/asset-libraries/{assetLibraryExternalReferenceCode}/import-preview":
        post:
            operationId: postAssetLibraryImportPreview
            parameters:
                -   in: path
                    name: assetLibraryExternalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: plid
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: portletId
                    schema:
                        type: string
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                            type: object
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ImportPreview"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ImportPreview"
            tags: ["ImportPreview"]
    "/asset-libraries/{assetLibraryExternalReferenceCode}/import-processes":
        get:
            description:
                Retrieves the layout import process entries of the specified asset library, or the import process entries of one of its portlets when a portlet ID is given.
            operationId: getAssetLibraryImportProcessesPage
            parameters:
                -   in: path
                    name: assetLibraryExternalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: creatorId
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: fields
                    schema:
                        type: string
                -   in: query
                    name: nestedFields
                    schema:
                        type: string
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: portletId
                    schema:
                        type: string
                -   in: query
                    name: restrictFields
                    schema:
                        type: string
                -   in: query
                    name: search
                    schema:
                        type: string
                -   in: query
                    name: sort
                    schema:
                        type: string
                -   in: query
                    name: status
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ImportProcess"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ImportProcess"
                                type: array
            tags: ["ImportProcess"]
        post:
            operationId: postAssetLibraryImportProcess
            parameters:
                -   in: path
                    name: assetLibraryExternalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: plid
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: portletId
                    schema:
                        type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ImportProcessRequest"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/ImportProcessRequest"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ImportProcess"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ImportProcess"
            tags: ["ImportProcess"]
    "/export-preview":
        get:
            operationId: getExportPreview
            parameters:
                -   in: query
                    name: dateRangeType
                    schema:
                        enum: [ALL, DATE_RANGE, LAST]
                        type: string
                -   in: query
                    name: endDate
                    schema:
                        format: date-time
                        type: string
                -   in: query
                    name: plid
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: portletId
                    schema:
                        type: string
                -   in: query
                    name: startDate
                    schema:
                        format: date-time
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ExportPreview"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ExportPreview"
            tags: ["ExportPreview"]
    "/export-processes":
        get:
            description:
                Retrieves the layout export process entries of the instance, or the export process entries of one of its portlets when a portlet ID is given.
            operationId: getExportProcessesPage
            parameters:
                -   in: query
                    name: creatorId
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: fields
                    schema:
                        type: string
                -   in: query
                    name: nestedFields
                    schema:
                        type: string
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: portletId
                    schema:
                        type: string
                -   in: query
                    name: restrictFields
                    schema:
                        type: string
                -   in: query
                    name: search
                    schema:
                        type: string
                -   in: query
                    name: sort
                    schema:
                        type: string
                -   in: query
                    name: status
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ExportProcess"
                                type: array
                        application/xml:
                            schema:
                                items:
