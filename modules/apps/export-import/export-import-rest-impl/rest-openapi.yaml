            operationId: getSitePublishPreview
            parameters:
                -   in: path
                    name: siteExternalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: dateRangeType
                    schema:
                        enum: [ALL, DATE_RANGE, FROM_LAST_PUBLISH_DATE, LAST]
                        type: string
                -   in: query
                    name: endDate
                    schema:
                        format: date-time
                        type: string
                -   in: query
                    name: startDate
                    schema:
                        format: date-time
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PublishPreview"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/PublishPreview"
            tags: ["PublishPreview"]
    "/sites/{siteExternalReferenceCode}/publish-processes":
        get:
            description:
                Retrieves the Publish to Live processes of the specified site.
            operationId: getSitePublishProcessesPage
            parameters:
                -   in: path
                    name: siteExternalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: creatorId
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: fields
                    schema:
                        type: string
                -   in: query
                    name: nestedFields
                    schema:
                        type: string
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: restrictFields
                    schema:
                        type: string
                -   in: query
                    name: search
                    schema:
                        type: string
                -   in: query
                    name: sort
                    schema:
                        type: string
                -   in: query
                    name: status
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/PublishProcess"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/PublishProcess"
                                type: array
            tags: ["PublishProcess"]
        post:
            description:
                Starts a Publish to Live process on the specified site with the portlet data handlers returned by the publish preview. The date range type and dates select the content and are resolved every time the process runs, including relaunches. When no type is given, it is inferred from the dates - no dates cover all content, both dates cover that fixed date range, and a start date alone covers the window from the start date until each run.
            operationId: postSitePublishProcess
            parameters:
                -   in: path
                    name: siteExternalReferenceCode
                    required: true
                    schema:
                        type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/PublishProcessRequest"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/PublishProcessRequest"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PublishProcess"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/PublishProcess"
            tags: ["PublishProcess"]
