			|				<regexp name="svgPaint"/>
			|			</regexp-list>
			|		</attribute>
			|
			|		<attribute name="stroke-width" onInvalid="removeAttribute">
			|			<regexp-list>
			|				<regexp name="svgLength"/>
			|			</regexp-list>
			|		</attribute>
			|
			|		<attribute name="stroke-opacity" onInvalid="removeAttribute">
			|			<regexp-list>
