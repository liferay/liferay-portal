			|			<attribute name="vector-effect"/>
			|			<attribute name="shape-rendering"/>
			|			<attribute name="image-rendering"/>
			|			<attribute name="color-interpolation"/>
			|			<attribute name="pointer-events"/>
			|			<attribute name="paint-order"/>
			|			<attribute name="cursor"/>
			|			<attribute name="mask-type"/>
			|			<attribute name="font-family"/>
			|			<attribute name="font-size"/>
			|			<attribute name="font-weight"/>
			|			<attribute name="font-style"/>
			|			<attribute name="font-variant"/>
			|			<attribute name="font-stretch"/>
			|			<attribute name="text-anchor"/>
			|			<attribute name="dominant-baseline"/>
			|			<attribute name="alignment-baseline"/>
			|			<attribute name="baseline-shift"/>
			|			<attribute name="direction"/>
			|			<attribute name="letter-spacing"/>
			|			<attribute name="word-spacing"/>
			|			<attribute name="text-decoration"/>
			|			<attribute name="text-rendering"/>
			|			<attribute name="writing-mode"/>
			|			<attribute name="unicode-bidi"/>
			|			<attribute name="white-space"/>
			|			<attribute name="text-overflow"/>
			|			<attribute name="glyph-orientation-horizontal"/>
			|			<attribute name="glyph-orientation-vertical"/>
			|		</tag>
			|
			|		<tag name="title" action="validate">
			|		</tag>
			|
			|		<tag name="desc" action="validate">
			|		</tag>
			|
			|${line}""".stripMargin()
	}

	return line
}

private String _filterKnowledgeBaseSanitizer(String line) {
	if (line.contains('<directive name="embedStyleSheets" value="false"/>')) {
		line = """\
			|	${line}
			|	<directive name="allowDynamicAttributes" value="true"/>""".stripMargin()
	}

	if (line.contains('</global-tag-attributes>')) {
		line = """\
			|	${line}
			|	<dynamic-tag-attributes>
			|		<attribute name="data-"/>
			|	</dynamic-tag-attributes>""".stripMargin()
	}

	if (line.contains('<common-attributes>')) {
		line = """\
			|	${line}
			|		<attribute name="data-" description="Allows the HTML5 'data-' attribute to be added to elements">
			|			<regexp-list>
			|				<regexp name="anything"/>
			|			</regexp-list>
			|		</attribute>""".stripMargin()
	}

	if (line.contains('<literal value="hr"/>')) {
		line = """\
			|${line}
			|				<literal value="iframe"/>""".stripMargin()
	}
	else if (line.contains('<tag name="iframe" action="remove"/>')) {
		line = """\
		|	<tag name="iframe" action="validate">
		|		<attribute name="allow">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="allowfullscreen">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="allowTransparency">
		|			<regexp-list>
		|				<regexp name="boolean"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="frameborder">
		|			<regexp-list>
		|				<regexp name="integer"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="height"/>
		|		<attribute name="mozallowfullscreen">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="sandbox">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="scrolling">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="src">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="style">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="webkitallowfullscreen">
		|			<regexp-list>
		|				<regexp name="boolean"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="width"/>
		|	</tag>""".stripMargin()
	}

	if (line.contains('<regexp name="systemColor" value="(activeborder|activecaption')) {
		line = """\
			|${line}\n
			|		<!-- Used for onclick attribute on a tag -->
			|		<regexp name="onclick-window" value="(^window\\.open\\(this\\.href, \\'.*\\', \\'resizable=(yes|no),status=(yes|no),location=(yes|no),toolbar=(yes|no),menubar=(yes|no),fullscreen=(yes|no),scrollbars=(yes|no),dependent=(yes|no)(,width=(\\d)+(px|cm|mm|in|pt|pc|\\%){0,1}){0,1}(,left=(\\d)+(px|cm|mm|in|pt|pc|\\%){0,1}){0,1}(,height=(\\d)+(px|cm|mm|in|pt|pc|\\%){0,1}){0,1}(,top=(\\d)+(px|cm|mm|in|pt|pc|\\%){0,1}){0,1}\\'\\); return false;)"/>""".stripMargin()
	}

	if (line.contains('<tag name="a" action="validate">')) {
		line = """\
			|${line}
			|			<attribute name="onClick"/>\n""".stripMargin()
	}

	if (line.contains('<attribute name="onClick" description="The \'onClick\' event is executed when the control associated with the tag is clicked">')) {
		line = """\
			|${line}
			|			<regexp-list>
			|				<regexp name="onclick-window"/>
			|			</regexp-list>""".stripMargin()
	}

	return line
}