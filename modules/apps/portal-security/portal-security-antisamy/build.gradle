import com.liferay.gradle.util.FileUtil

task processBlogsSanitizerConfiguration(type: Copy)
task processDefaultSanitizerConfiguration(type: Copy)
task processFragmentSanitizerConfiguration(type: Copy)
task processKnowledgeBaseSanitizerConfiguration(type: Copy)

File sanitizerConfigurationFile = new File("src/main/resources/META-INF/resources/sanitizer-configuration.xml")
String sanitizerConfigurationUrl = "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/owaspantisamy/antisamy-ebay-1.4.4.xml"

copyCSS {
	mustRunAfter processBlogsSanitizerConfiguration
	mustRunAfter processDefaultSanitizerConfiguration
	mustRunAfter processFragmentSanitizerConfiguration
	mustRunAfter processKnowledgeBaseSanitizerConfiguration
}

dependencies {
	compileInclude group: "org.apache.httpcomponents.client5", name: "httpclient5", version: "5.4.4"
	compileInclude group: "org.apache.httpcomponents.core5", name: "httpcore5", version: "5.3.2"
	compileInclude group: "org.apache.httpcomponents.core5", name: "httpcore5-h2", version: "5.3.4"
	compileInclude group: "org.apache.xmlgraphics", name: "batik-constants", version: "1.16"
	compileInclude group: "org.apache.xmlgraphics", name: "batik-css", version: "1.16"
	compileInclude group: "org.apache.xmlgraphics", name: "batik-i18n", version: "1.16"
	compileInclude group: "org.apache.xmlgraphics", name: "batik-util", version: "1.16"
	compileInclude group: "org.apache.xmlgraphics", name: "xmlgraphics-commons", version: "2.6"
	compileInclude group: "org.htmlunit", name: "neko-htmlunit", version: "3.11.1"
	compileInclude group: "org.owasp.antisamy", name: "antisamy", version: "1.7.5"
	compileInclude group: "xml-apis", name: "xml-apis-ext", version: "1.3.04"
	compileOnly group: "com.liferay", name: "biz.aQute.bnd.annotation", version: "4.2.0.LIFERAY-PATCHED-2"
	compileOnly group: "com.liferay.portal", name: "com.liferay.portal.kernel", version: "default"
	compileOnly group: "commons-codec", name: "commons-codec", version: "1.15"
	compileOnly group: "org.osgi", name: "org.osgi.service.cm", version: "1.6.0"
	compileOnly group: "org.osgi", name: "org.osgi.service.component.annotations", version: "1.4.0"
	compileOnly group: "org.osgi", name: "osgi.core", version: "6.0.0"
	compileOnly group: "xerces", name: "xercesImpl", version: "2.12.2"
	compileOnly group: "xml-apis", name: "xml-apis", version: "1.4.01"
	compileOnly project(":apps:static:portal-configuration:portal-configuration-metatype-api")
	compileOnly project(":apps:static:portal-configuration:portal-configuration-persistence-api")
	compileOnly project(":core:petra:petra-concurrent")
	compileOnly project(":core:petra:petra-lang")
	compileOnly project(":core:petra:petra-string")
}

jarSources {
	mustRunAfter processBlogsSanitizerConfiguration
	mustRunAfter processDefaultSanitizerConfiguration
	mustRunAfter processFragmentSanitizerConfiguration
	mustRunAfter processKnowledgeBaseSanitizerConfiguration
}

processDefaultSanitizerConfiguration {
	doLast {
		String replace = """\
			|<attribute name="rel">
			|				<regexp-list>
			|					<regexp value="(\\\\\\\\s*(nofollow|noopener|noreferrer)(\\\\\\\\s(nofollow|noopener|noreferrer))*\\\\\\\\s*)?"/>
			|				</regexp-list>
			|			</attribute>""".stripMargin()

		ant.replaceregexp(
			file: sanitizerConfigurationFile,
			flags: "g",
			match: "<attribute name=\"rel\">\\s*<literal-list>\\s*<literal value=\"nofollow\"/>\\s*</literal-list>\\s*</attribute>",
			replace: replace)
	}

	ext {
		autoClean = false
	}

	filter {
		return _filterDefaultSanitizer(it)
	}

	from {
		FileUtil.get(project, sanitizerConfigurationUrl)
	}

	into sanitizerConfigurationFile.parentFile

	onlyIf {
		!sanitizerConfigurationFile.exists()
	}

	rename {
		sanitizerConfigurationFile.name
	}
}

processBlogsSanitizerConfiguration {
	dependsOn processDefaultSanitizerConfiguration

	File blogsSanitizerConfigurationFile = new File("src/main/resources/META-INF/resources/blogs-sanitizer-configuration.xml")

	ext {
		autoClean = false
	}

	filter {
		return _filterBlogsSanitizer(it)
	}

	from {
		sanitizerConfigurationFile
	}

	into blogsSanitizerConfigurationFile.parentFile

	onlyIf {
		!blogsSanitizerConfigurationFile.exists()
	}

	rename {
		blogsSanitizerConfigurationFile.name
	}
}

processFragmentSanitizerConfiguration {
	dependsOn processDefaultSanitizerConfiguration
	mustRunAfter processBlogsSanitizerConfiguration

	File fragmentSanitizerConfigurationFile = new File("src/main/resources/META-INF/resources/fragment-sanitizer-configuration.xml")

	ext {
		autoClean = false
	}

	filter {
		return _filterFragmentSanitizer(it)
	}

	from {
		sanitizerConfigurationFile
	}

	into fragmentSanitizerConfigurationFile.parentFile

	onlyIf {
		!fragmentSanitizerConfigurationFile.exists()
	}

	rename {
		fragmentSanitizerConfigurationFile.name
	}
}

processKnowledgeBaseSanitizerConfiguration {
	dependsOn processDefaultSanitizerConfiguration
	mustRunAfter processBlogsSanitizerConfiguration
	mustRunAfter processFragmentSanitizerConfiguration

	File knowledgeBaseSanitizerConfigurationFile = new File("src/main/resources/META-INF/resources/knowledge-base-sanitizer-configuration.xml")

	ext {
		autoClean = false
	}

	filter {
		return _filterKnowledgeBaseSanitizer(it)
	}

	from {
		sanitizerConfigurationFile
	}

	into knowledgeBaseSanitizerConfigurationFile.parentFile

	onlyIf {
		!knowledgeBaseSanitizerConfigurationFile.exists()
	}

	rename {
		knowledgeBaseSanitizerConfigurationFile.name
	}
}

processResources {
	dependsOn processBlogsSanitizerConfiguration
	dependsOn processDefaultSanitizerConfiguration
	dependsOn processFragmentSanitizerConfiguration
	dependsOn processKnowledgeBaseSanitizerConfiguration
}

private String _filterBlogsSanitizer(String line) {
	if (line.contains('<directive name="embedStyleSheets" value="false"/>')) {
		line = """\
			|	${line}
			|	<directive name="allowDynamicAttributes" value="true"/>""".stripMargin()
	}

	if (line.contains('</global-tag-attributes>')) {
		line = """\
			|	${line}
			|	<dynamic-tag-attributes>
			|		<attribute name="data-"/>
			|	</dynamic-tag-attributes>""".stripMargin()
	}

	if (line.contains('<common-attributes>')) {
		line = """\
			|	${line}
			|		<attribute name="data-" description="Allows the HTML5 'data-' attribute to be added to elements">
			|			<regexp-list>
			|				<regexp name="anything"/>
			|			</regexp-list>
			|		</attribute>""".stripMargin()
	}

	if (line.contains('<literal value="hr"/>')) {
		line = """\
			|${line}
			|				<literal value="iframe"/>""".stripMargin()
	}
	else if (line.contains('<tag name="iframe" action="remove"/>')) {
		line = """\
		|	<tag name="iframe" action="validate">
		|		<attribute name="allow">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="allowfullscreen">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="allowTransparency">
		|			<regexp-list>
		|				<regexp name="boolean"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="frameborder">
		|			<regexp-list>
		|				<regexp name="integer"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="height"/>
		|		<attribute name="mozallowfullscreen">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="sandbox">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="scrolling">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="src">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="style">
		|			<regexp-list>
		|				<regexp name="anything"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="webkitallowfullscreen">
		|			<regexp-list>
		|				<regexp name="boolean"/>
		|			</regexp-list>
		|		</attribute>
		|		<attribute name="width"/>
		|	</tag>""".stripMargin()
	}
	return line
}

private String _filterDefaultSanitizer(String line) {
	if (line.contains('<directives>')) {
		line = """\
			|${line}
			|		<directive name="noopenerAndNoreferrerAnchors" value="true" />
			|		<directive name="preserveSpace" value="true" />""".stripMargin()
	}

	if (line.contains('<directive name="maxInputSize" value="20000"/>')) {
		line = line.replace "20000", "200000"
	}

	if (line.contains('<regexp name="onsiteURL" value=')) {
		line = '		<regexp name="onsiteURL" value="^(?![\\p{L}\\p{N}\\\\\\.\\#@\\$%\\*\\+&amp;;\\-_~,\\?=/!]*(&amp;colon))[\\p{L}\\p{N}\\\\\\.\\#@\\$%\\*\\+&amp;;\\-_~,\\?=/!]*"/>'
	}
	else if (line.contains('<regexp name="offsiteURL" value=')) {
		line = '		<regexp name="offsiteURL" value="(\\s)*((ht|f)tp(s?)://|mailto:)[\\p{L}\\p{N}]+[\\p{L}\\p{N}\\p{Zs}\\.\\#@\\$%\\*\\+&amp;;:\\-_~,\\?=/!\\(\\)]*(\\s)*"/>'
	}
	else if (line.contains('<tag-rules>')) {
		line = """\
			|${line}
			|		<tag name="article" action="validate" />
			|		<tag name="aside" action="validate" />
			|		<tag name="bdi" action="validate" />
			|		<tag name="details" action="validate" />
			|		<tag name="dialog" action="validate" />
			|		<tag name="figcaption" action="validate" />
			|		<tag name="figure" action="validate" />
			|		<tag name="footer" action="validate" />
			|		<tag name="header" action="validate" />
			|		<tag name="main" action="validate" />
			|		<tag name="mark" action="validate" />
			|		<tag name="meter" action="validate" />
			|		<tag name="nav" action="validate" />
			|		<tag name="picture" action="validate">
			|			<attribute name="data-fileentryid" onInvalid="removeAttribute">
			|				<regexp-list>
			|					<regexp name="positiveInteger" />
			|				</regexp-list>
			|			</attribute>
			|		</tag>
			|		<tag name="progress" action="validate" />
			|		<tag name="rp" action="validate" />
			|		<tag name="rt" action="validate" />
			|		<tag name="ruby" action="validate" />
			|		<tag name="s" action="validate" />
			|		<tag name="section" action="validate" />
			|		<tag name="source" action="validate">
			|			<attribute name="src" onInvalid="removeTag">
			|				<regexp-list>
			|					<regexp name="onsiteURL"/>
			|					<regexp name="offsiteURL"/>
			|				</regexp-list>
			|			</attribute>
			|			<attribute name="srcset">
			|				<regexp-list>
			|					<regexp name="anything"/>
			|				</regexp-list>
			|			</attribute>
			|			<attribute name="media">
			|				<regexp-list>
			|					<regexp name="anything" />
			|				</regexp-list>
			|			</attribute>
			|			<attribute name="type">
			|				<regexp-list>
			|					<regexp value="[a-zA-Z0-9\\-]+/[a-zA-Z0-9\\-]+" />
			|				</regexp-list>
			|			</attribute>
			|		</tag>
			|		<tag name="summary" action="validate" />
			|		<tag name="time" action="validate" />
			|		<tag name="video" action="validate">
			|			<attribute name="autoplay">
			|				<regexp-list>
			|					<regexp name="anything"/>
			|				</regexp-list>
			|			</attribute>
			|			<attribute name="controls">
			|				<regexp-list>
			|					<regexp name="anything"/>
			|				</regexp-list>
			|			</attribute>
			|			<attribute name="crossorigin">
			|				<literal-list>
			|					<literal value="anonymous"/>
			|					<literal value="use-credentials"/>
			|				</literal-list>
			|			</attribute>
			|			<attribute name="height">
			|				<regexp-list>
			|					<regexp name="number"/>
			|				</regexp-list>
			|			</attribute>
			|			<attribute name="loop">
			|				<regexp-list>
			|					<regexp name="anything"/>
			|				</regexp-list>
			|			</attribute>
			|			<attribute name="muted">
			|				<regexp-list>
			|					<regexp name="anything"/>
			|				</regexp-list>
			|			</attribute>
			|			<attribute name="poster">
			|				<regexp-list>
			|					<regexp name="onsiteURL"/>
			|					<regexp name="offsiteURL"/>
			|				</regexp-list>
			|			</attribute>
			|			<attribute name="preload">
			|				<literal-list>
			|					<literal value="auto"/>
			|					<literal value="metadata"/>
			|					<literal value="none"/>
			|				</literal-list>
			|			</attribute>
			|			<attribute name="src">
			|				<regexp-list>
			|					<regexp name="onsiteURL"/>
			|					<regexp name="offsiteURL"/>
			|				</regexp-list>
			|			</attribute>
			|			<attribute name="width">
			|				<regexp-list>
			|					<regexp name="number" />
			|				</regexp-list>
			|			</attribute>
			|		</tag>
			|		<tag name="wbr" action="validate" />""".stripMargin()
	}
	else if (line.contains('<tag name="a" action="validate">')) {
		line = """\
			|		<tag name="a" action="validate">
			|			<attribute name="target">
			|				<regexp-list>
			|					<regexp name="htmlId"/>
			|				</regexp-list>
			|			</attribute>""".stripMargin()
	}
	else if (line.contains('<tag name="img"')) {
		line = """\
			|${line}
			|			<attribute name="data-fileentryid" onInvalid="removeAttribute">
			|				<regexp-list>
			|					<regexp name="positiveInteger"/>
			|				</regexp-list>
			|			</attribute>""".stripMargin()
	}
	else if (line.contains('<tag name="ol" action="validate"/>')) {
		line = """\
			|		<tag name="ol" action="validate">
			|			<attribute name="type">
			|				<literal-list>
			|					<literal value="1"/>
			|					<literal value="a"/>
			|					<literal value="A"/>
			|					<literal value="i"/>
			|					<literal value="I"/>
			|				</literal-list>
			|			</attribute>
			|		</tag>""".stripMargin()
	}
	else if (line.contains('</css-rules>')) {
		line = """\
			|${line}
			|		<allowed-empty-tags>
			|			<literal-list>
			|				<literal value="br"/>
			|				<literal value="hr"/>
			|				<literal value="a"/>
			|				<literal value="img"/>
			|				<literal value="param"/>
			|				<literal value="input"/>
			|				<literal value="textarea"/>
			|				<literal value="basefont"/>
			|				<literal value="col"/>
			|				<literal value="div"/>
			|				<literal value="source"/>
			|			</literal-list>
			|	</allowed-empty-tags>""".stripMargin()
	}

	return line
}

private String _filterFragmentSanitizer(String line) {
	if (line.trim().equals("<tag>g</tag>")) {
		return null
	}

	if (line.contains("</common-regexps>")) {
		line = """\
			|
			|		<regexp name="svgLength" value="(-|\\+)?([0-9]+(\\.[0-9]+)?|\\.[0-9]+)(px|pt|pc|mm|cm|in|em|ex|%)?"/>
			|		<regexp name="svgNumberList" value="(\\s|,)*(-|\\+)?([0-9]+(\\.[0-9]+)?|\\.[0-9]+)([eE](-|\\+)?[0-9]+)?((\\s|,)+(-|\\+)?([0-9]+(\\.[0-9]+)?|\\.[0-9]+)([eE](-|\\+)?[0-9]+)?)*(\\s|,)*"/>
			|		<regexp name="svgViewBox" value="(-|\\+)?([0-9]+(\\.[0-9]+)?)((\\s|,)+(-|\\+)?([0-9]+(\\.[0-9]+)?)){3}"/>
			|		<regexp name="svgPathData" value="[MmLlHhVvCcSsQqTtAaZz0-9eE,.\\s\\-+]+"/>
			|		<regexp name="svgTransformList" value="((matrix|translate|scale|rotate|skewX|skewY)\\s*\\([-+0-9eE,.\\s]*\\)\\s*)+"/>
			|		<regexp name="svgPaint" value="(none|currentColor|transparent|inherit|context-fill|context-stroke|#[0-9a-fA-F]{3,8}|rgba?\\([0-9,.\\s%]*\\)|hsla?\\([0-9,.\\s%]*\\)|url\\(\\s*#[a-zA-Z0-9\\-_:.]+\\s*\\)(\\s+(none|currentColor|#[0-9a-fA-F]{3,8}))?|[a-zA-Z]+)"/>
			|		<regexp name="svgLocalRef" value="(none|url\\(\\s*#[a-zA-Z0-9\\-_:.]+\\s*\\))"/>
			|		<regexp name="svgHrefLocal" value="#[a-zA-Z0-9\\-_:.]+"/>
			|		<regexp name="svgKeyword" value="[a-zA-Z][a-zA-Z\\-]*"/>
			|		<regexp name="svgPreserveAspectRatio" value="(none|x(Min|Mid|Max)Y(Min|Mid|Max))(\\s+(meet|slice))?"/>
			|${line}""".stripMargin()
	}
	else if (line.contains("</common-attributes>")) {
		line = """\
			|
			|		<attribute name="viewBox" onInvalid="removeAttribute">
			|			<regexp-list>
			|				<regexp name="svgViewBox"/>
			|			</regexp-list>
			|		</attribute>
			|
			|		<attribute name="viewbox" onInvalid="removeAttribute">
			|			<regexp-list>
			|				<regexp name="svgViewBox"/>
			|			</regexp-list>
			|		</attribute>
			|
			|		<attribute name="x" onInvalid="removeAttribute">
			|			<regexp-list>
			|				<regexp name="svgLength"/>
			|			</regexp-list>
			|		</attribute>
			|
			|		<attribute name="y" onInvalid="removeAttribute">
			|			<regexp-list>
			|				<regexp name="svgLength"/>
			|			</regexp-list>
			|		</attribute>
			|
			|		<attribute name="preserveAspectRatio" onInvalid="removeAttribute">
			|			<regexp-list>
			|				<regexp name="svgPreserveAspectRatio"/>
			|			</regexp-list>
			|		</attribute>
			|
			|		<attribute name="preserveaspectratio" onInvalid="removeAttribute">
			|			<regexp-list>
			|				<regexp name="svgPreserveAspectRatio"/>
			|			</regexp-list>
			|		</attribute>
			|
			|		<attribute name="fill" onInvalid="removeAttribute">
			|			<regexp-list>
			|				<regexp name="svgPaint"/>
			|			</regexp-list>
			|		</attribute>
			|
			|		<attribute name="fill-opacity" onInvalid="removeAttribute">
			|			<regexp-list>
