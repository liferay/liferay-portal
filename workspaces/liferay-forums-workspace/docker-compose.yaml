name: liferay-stack
services:
    database:
        container_name: database
        environment:
            POSTGRES_DB: lportal
            POSTGRES_HOST_AUTH_METHOD: trust
        healthcheck:
            interval: 5s
            retries: 10
            start_period: 5m
            test: >
                pg_isready
                --username
                postgres
            timeout: 20s
        image: postgres:16
        ports:
            -   5432:5432
    liferay:
        container_name: liferay
        depends_on:
            database:
                condition: service_healthy
        environment:
            LIFERAY_DISABLE_TRIAL_LICENSE: "true"
            LIFERAY_JPDA_ENABLED: "true"
            LIFERAY_JVM_OPTS: -XX:MaxMetaspaceSize=1g -XX:MaxNewSize=2g -XX:MetaspaceSize=768m -XX:NewSize=2g -XX:SurvivorRatio=7 -Xms8g -Xmx8g
            LIFERAY_WORKSPACE_ENVIRONMENT: local
        healthcheck:
            interval: 10s
            retries: 60
            start_period: 40s
            test: >
                curl
                --fail
                --silent
                http://localhost:8080/c/portal/status
            timeout: 10s
        image: liferay:local
        mem_limit: 10g
        mem_reservation: 8g
        ports:
            -   80:8080
            -   8000:8000
            -   8080:8080
            -   11311:11311
            -   58081:58081
        volumes:
            -   liferay_data:/opt/liferay/data
            -   liferay_routes:/opt/liferay/routes
volumes:
    liferay_data:
    liferay_routes: