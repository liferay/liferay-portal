assemble:
    -   fromTask: bootJar
liferay-seostudio-etc-pagespeed-oahs:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: Liferay SEO Studio Etc PageSpeed OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Portal.Instances.read
        -   seostudiodomain.everything
        -   seostudioinstance.everything
        -   seostudiopagespeedresult.everything
        -   seostudioscan.everything
        -   seostudioscanrun.everything
    type: oAuthApplicationHeadlessServer
liferay-seostudio-etc-pagespeed-oaua:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: Liferay SEO Studio Etc PageSpeed OAuth Application User Agent
    type: oAuthApplicationUserAgent
liferay-seostudio-etc-pagespeed-object-action-pagespeed:
    name: Liferay SEO Studio Etc PageSpeed Object Action PageSpeed
    oAuth2ApplicationExternalReferenceCode: liferay-seostudio-etc-pagespeed-oaua
    resourcePath: /object/action/pagespeed
    type: objectAction