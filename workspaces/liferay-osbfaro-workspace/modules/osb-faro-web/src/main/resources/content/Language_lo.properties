you-have-successfully-authenticated.-you-can-now-configure-your-data=ທ່ານໄດ້ຢືນຢັນ client id ແລະ secret ກັບແຫຼ່ງຂໍ້ມູນຂອງທ່ານສຳເລັດແລ້ວ. ຕອນນີ້ທ່ານສາມາດຕັ້ງຄ່າຂໍ້ມູນຂອງທ່ານໄດ້.
you-have-successfully-connected-to-your-data-source-complete-your-data-source-configuration-to-start-syncing-data=ທ່ານໄດ້ເຊື່ອມຕໍ່ກັບແຫຼ່ງຂໍ້ມູນຂອງທ່ານສຳເລັດແລ້ວ. ຕັ້ງຄ່າແຫຼ່ງຂໍ້ມູນໃຫ້ສຳເລັດເພື່ອເລີ່ມຕົ້ນການຊິງຄ໌ຂໍ້ມູນ.
