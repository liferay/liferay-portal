buildService {
	apiDir = "../osb-faro-api/src/main/java"
	databaseNameMaxLength = 64
}

dependencies {
	compileOnly group: "com.liferay.portal", name: "release.dxp.api", version: "2026.q1.5"
	compileOnly group: "junit", name: "junit", version: "4.13.1"
	compileOnly project(":modules:osb-faro-api")
	compileOnly project(":modules:osb-faro-provisioning-client")
	testImplementation group: "com.liferay", name: "jodd.util", version: "6.0.1.LIFERAY-PATCHED-2"
	testImplementation group: "com.liferay", name: "org.apache.commons.configuration", version: "1.10.LIFERAY-PATCHED-2"
	testImplementation group: "com.liferay.portal", name: "com.liferay.portal.impl", version: "default"
	testImplementation group: "com.liferay.portal", name: "release.dxp.api", version: "2026.q1.5"

	testImplementation(group: "easyconf", name: "easyconf", version: "0.9.5") {
		exclude group: "struts"
		exclude group: "xdoclet"
		exclude group: "xpp3"
	}

	testImplementation group: "junit", name: "junit", version: "4.13.1"
	testImplementation group: "org.apache.logging.log4j", name: "log4j-api", version: "2.20.0"
	testImplementation group: "org.apache.logging.log4j", name: "log4j-core", version: "2.20.0"
	testImplementation group: "org.jabsorb", name: "jabsorb", version: "1.3.1"
	testImplementation group: "org.jodd", name: "jodd-json", version: "6.0.3"
	testImplementation group: "org.slf4j", name: "slf4j-api", version: "1.7.26"
	testImplementation project(":modules:osb-faro-api")
}