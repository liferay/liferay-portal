components:
    schemas:
        Account:
            description:
                "An account synced to LDP. Accounts aggregate individuals (or contacts) employed by or associated with a single organization."
            properties:
                accountName:
                    description:
                        "Name of the account."
                    readOnly: true
                    type: string
                accountType:
                    description:
                        "Account classification supplied by the data source (e.g. 'Customer', 'Partner')."
                    readOnly: true
                    type: string
                activitiesCount:
                    description:
                        "Total number of tracked activities attributed to individuals associated with this account, over the account's whole history. Not a windowed count."
                    format: int64
                    readOnly: true
                    type: integer
                annualRevenue:
                    description:
                        "Annual revenue of the account."
                    format: double
                    readOnly: true
                    type: number
                country:
                    description:
                        "Country name where the account is headquartered."
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        "Last time the account record was modified within LDP."
                    format: date-time
                    readOnly: true
                    type: string
                firstActivityDate:
                    description:
                        "Date of the earliest tracked activity from any individual associated with this account."
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    description:
                        "Account ID. Use this with `getWorkspaceGroupAccount` to fetch the account directly."
                    readOnly: true
                    type: string
                industry:
                    description:
                        "Industry classification of the account (e.g. 'Software', 'Manufacturing')."
                    readOnly: true
                    type: string
                lastActivityDate:
                    description:
                        "Date of most recent activity from any individual associated with this account."
                    format: date-time
                    readOnly: true
                    type: string
                lifecycleStage:
                    description:
                        "Sales/marketing lifecycle stage of the account (e.g. 'Prospect', 'Customer')."
                    readOnly: true
                    type: string
                numberOfEmployees:
                    description:
                        "Number of employees reported for the account."
                    readOnly: true
                    type: integer
                website:
                    description:
                        "Website of the account."
                    readOnly: true
                    type: string
            type: object
        AccountLifecycle:
            description:
                "An account lifecycle of a channel: the ordered stages accounts move through (e.g. 'Aware', 'Engaged', 'Pipeline'). Use `getWorkspaceGroupChannelAccountLifecyclesPage` to list them."
            properties:
                accountLifecycleStages:
                    description:
                        "Stages of the lifecycle, in display order."
                    items:
                        $ref: "#/components/schemas/AccountLifecycleStage"
                    readOnly: true
                    type: array
                dateModified:
                    description:
                        "Last time the lifecycle was modified."
                    format: date-time
                    readOnly: true
                    type: string
                defaultAccountLifecycle:
                    description:
                        "True if the lifecycle is the default of the channel. A channel can have several lifecycles but only one default, which `getWorkspaceGroupChannelAccountsPage` uses when `accountLifecycleId` is omitted."
                    readOnly: true
                    type: boolean
                description:
                    description:
                        "Description of the lifecycle."
                    readOnly: true
                    type: string
                id:
                    description:
                        "Account lifecycle ID. Use it as `accountLifecycleId` to list the stage metrics and stage transitions of the lifecycle, to fetch the stage history of an account, or to filter accounts by lifecycle stage."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Name of the lifecycle."
                    readOnly: true
                    type: string
            type: object
        AccountLifecycleHistory:
            description:
                "An account's path through an account lifecycle: every stage of the lifecycle, with when the account entered and left it. Use `getWorkspaceGroupChannelAccountAccountLifecycleHistory` to retrieve it."
            properties:
                accountLifecycleStageHistories:
                    description:
                        "Every stage of the lifecycle, in display order, including the stages the account never entered."
                    items:
                        $ref: "#/components/schemas/AccountLifecycleStageHistory"
                    readOnly: true
                    type: array
                id:
                    description:
                        "Account lifecycle ID."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Name of the lifecycle."
                    readOnly: true
                    type: string
            type: object
        AccountLifecycleStage:
            description:
                "A stage of an account lifecycle. A lifecycle has between 1 and 20 stages, each with a name unique within the lifecycle, ordered by position."
            properties:
                description:
                    description:
                        "Description of the stage."
                    readOnly: true
                    type: string
                id:
                    description:
                        "Stage ID."
                    readOnly: true
                    type: string
                maxDuration:
                    description:
                        "Maximum number of days an account is expected to stay in the stage before it is considered stalled. Null when no limit is set."
                    readOnly: true
                    type: integer
                name:
                    description:
                        "Name of the stage, unique within the lifecycle ignoring case (e.g. 'Pipeline' or 'At Risk'). Use it as `fromLifecycleStage` or `toLifecycleStage` to filter stage transitions."
                    readOnly: true
                    type: string
                position:
                    description:
                        "Position of the stage in the lifecycle, starting at 1. An account that matches several stages is placed in the one with the highest position."
                    readOnly: true
                    type: integer
            type: object
        AccountLifecycleStageHistory:
            description:
                "A stage of an account lifecycle with the account's most recent stay in it. Both dates are null when the account never entered the stage, and only `endDate` is null for the stage the account is in now."
            properties:
                description:
                    description:
                        "Description of the stage."
                    readOnly: true
                    type: string
                endDate:
                    description:
                        "When the account left the stage. Null while the account is still in it or never entered it."
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    description:
                        "Stage ID."
                    readOnly: true
                    type: string
                maxDuration:
                    description:
                        "Maximum number of days an account is expected to stay in the stage before it is considered stalled. Null when no limit is set."
                    readOnly: true
                    type: integer
                name:
                    description:
                        "Name of the stage, unique within the lifecycle ignoring case (e.g. 'At Risk' or 'Pipeline')."
                    readOnly: true
                    type: string
                position:
                    description:
                        "Position of the stage in the lifecycle, starting at 1."
                    readOnly: true
                    type: integer
                startDate:
                    description:
                        "When the account entered the stage. Null when it never entered it."
                    format: date-time
                    readOnly: true
                    type: string
            type: object
        AccountLifecycleStageMetric:
            description:
                "A stage of an account lifecycle, with how many accounts are in it and how they move through it. Use `getWorkspaceGroupChannelAccountLifecycleStageMetricsPage` to list them."
            properties:
                accountsCount:
                    description:
                        "Number of accounts currently in the stage."
                    format: int64
                    readOnly: true
                    type: integer
                averageStageDuration:
                    description:
                        "Average number of days accounts stayed in the stage, over the stays that started in the last 90 days and have ended. 0 when there are none."
                    format: double
                    readOnly: true
                    type: number
                conversionRateToNextStage:
                    description:
                        "Moves from the stage to the next stage in the last 90 days, as a percentage of the accounts that entered the stage in that time. Null for the last stage and when no account entered the stage in that time."
                    format: double
                    readOnly: true
                    type: number
                description:
                    description:
                        "Description of the stage."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Name of the stage, unique within the lifecycle ignoring case (e.g. 'At Risk' or 'Pipeline')."
                    readOnly: true
                    type: string
                percentage:
                    description:
                        "Percentage of the lifecycle's current accounts that are in this stage."
                    format: double
                    readOnly: true
                    type: number
                position:
                    description:
                        "Position of the stage in the lifecycle, starting at 1."
                    readOnly: true
                    type: integer
            type: object
        AccountLifecycleStageTransition:
            description:
                "An account moving from one account lifecycle stage to another. An account that moved several times in the requested date range appears once per move."
            properties:
                accountId:
                    description:
                        "Account ID. Use this with `getWorkspaceGroupAccount` to fetch the account."
                    readOnly: true
                    type: string
                accountName:
                    description:
                        "Name of the account."
                    readOnly: true
                    type: string
                fromAccountLifecycleStage:
                    $ref: "#/components/schemas/AccountLifecycleStage"
                    description:
                        "Stage the account left."
                    readOnly: true
                toAccountLifecycleStage:
                    $ref: "#/components/schemas/AccountLifecycleStage"
                    description:
                        "Stage the account entered."
                    readOnly: true
                transitionDate:
                    description:
                        "When the account entered the new stage."
                    format: date-time
                    readOnly: true
                    type: string
            type: object
        Acquisition:
            description:
                "A source of the sessions of a channel: an acquisition channel, a referrer, or a `source / medium` pair, with the number of sessions that came from it. Use `getWorkspaceGroupChannelAcquisitionsPage` to list them."
            properties:
                count:
                    description:
                        "Number of sessions in the date range that came from this value. With `type` REFERRER, a session with several referrers counts once for each."
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        "Name of the acquisition channel, referrer URL, or `source / medium` pair, depending on the `type` the list was requested with. Channel and source / medium values are lowercase."
                    readOnly: true
                    type: string
            type: object
        AssetSummaryMetric:
            description:
                "An aggregated set of analytics metrics for a single tracked asset (page, blog, document, form, journal, object entry, etc.) over the selected date range. Trend percentages compare metrics on the selected date range to the previous date range. Use `getWorkspaceGroupChannelAssetSummariesPage` to list these sets of metrics."
            properties:
                assetId:
                    description:
                        "ID of the tracked asset."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Display title of the asset (e.g. the page title or blog post title)."
                    readOnly: true
                    type: string
                assetType:
                    description:
                        "Asset category as reported by the analytics engine (e.g. Blog, Document, Form, Journal, Page)."
                    readOnly: true
                    type: string
                downloads:
                    description:
                        "Download count over the selected date range. Null when the asset type doesn't track downloads."
                    format: double
                    readOnly: true
                    type: number
                downloadsTrendPercentage:
                    description:
                        "Percentage change in downloads compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
                impressions:
                    description:
                        "Impression count (asset rendered into a viewport but not necessarily interacted with)."
                    format: double
                    readOnly: true
                    type: number
                impressionsTrendPercentage:
                    description:
                        "Percentage change in impressions compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
                reads:
                    description:
                        "Read count (full-content engagement, distinct from impressions)."
                    format: double
                    readOnly: true
                    type: number
                readsTrendPercentage:
                    description:
                        "Percentage change in reads compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
                views:
                    description:
                        "View count (asset opened/loaded by an individual)."
                    format: double
                    readOnly: true
                    type: number
                viewsTrendPercentage:
                    description:
                        "Percentage change in views compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
            type: object
        Campaign:
            description:
                "A marketing campaign: a CRM campaign synced from Salesforce, or a campaign that LDP tracks from the UTM campaign tag of site visits."
            properties:
                accountsTouched:
                    description:
                        "Number of distinct accounts the campaign touched. In `getWorkspaceGroupChannelCampaignsPage` it counts the touches in the requested date range; in `getWorkspaceGroupChannelCampaign` it counts every touch, with no date range."
                    format: int64
                    readOnly: true
                    type: integer
                campaignType:
                    description:
                        "Campaign type as set in the CRM, such as Email or Webinar. Null for campaigns tracked from site visits."
                    readOnly: true
                    type: string
                endDate:
                    description:
                        "Planned end date of the campaign as set in the CRM. Null when none is set."
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    description:
                        "Campaign ID. Use it as `campaignId` in the other campaign tools."
                    readOnly: true
                    type: string
                individualsTouched:
                    description:
                        "Number of distinct individuals the campaign touched, known or anonymous. Counted over the same window as `accountsTouched`."
                    format: int64
                    readOnly: true
                    type: integer
                lastTouchDate:
                    description:
                        "When the campaign last touched an account in the requested date range. Only `getWorkspaceGroupChannelCampaignsPage` returns it; it is null in `getWorkspaceGroupChannelCampaign`."
                    format: date-time
                    readOnly: true
                    type: string
                name:
                    description:
                        "Name of the campaign."
                    readOnly: true
                    type: string
                origin:
                    description:
                        "Where the campaign comes from: SALESFORCE for a CRM campaign, or ANALYTICS for a campaign tracked from the UTM campaign tag of site visits."
                    readOnly: true
                    type: string
                startDate:
                    description:
                        "Planned start date of the campaign as set in the CRM. Null when none is set."
                    format: date-time
                    readOnly: true
                    type: string
                status:
                    description:
                        "Campaign status as set in the CRM, such as Planned, In Progress or Completed. Null for campaigns tracked from site visits."
                    readOnly: true
                    type: string
            type: object
        CampaignMetric:
            description:
                "An aggregated campaign metric of a channel over the selected date range, compared to the previous range of the same length."
            properties:
                metricType:
                    description:
                        "Metric: accountsTouched (distinct accounts touched by any campaign), campaignCount (distinct campaigns that touched an account), closedWonAmount or openPipelineAmount (sums of the touched accounts' Salesforce opportunity amounts over a fixed 90 day window)."
                    readOnly: true
                    type: string
                previousValue:
                    description:
                        "Value over the previous date range of the same length."
                    format: double
                    readOnly: true
                    type: number
                trendClassification:
                    description:
                        "Direction of the change from the previous range: POSITIVE, NEGATIVE or NEUTRAL. Null when the previous value is 0."
                    readOnly: true
                    type: string
                trendPercentage:
                    description:
                        "Percentage change from the previous date range. Null when the previous value is 0."
                    format: double
                    readOnly: true
                    type: number
                value:
                    description:
                        "Value over the selected date range."
                    format: double
                    readOnly: true
                    type: number
            type: object
        Channel:
            description:
                "A logical grouping of data coming from configured data sources (e.g. a website, a CRM connection) under which asset metrics, events, individuals, and segments are scoped. Also known as property."
            properties:
                id:
                    description:
                        "Channel ID. Use this with `getWorkspaceGroupChannel` to fetch the channel directly."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Display name of the channel."
                    readOnly: true
                    type: string
            type: object
        Event:
            description:
                "A single tracked analytics event captured — page views, custom events, form submissions, etc. Each event carries free-form `attributes` (a name value map of contextual properties) plus any matching page metadata. Use `getWorkspaceGroupChannelEventsPage` to retrieve a list of analytics events."
            properties:
                applicationId:
                    description:
                        "ID of the application that emitted the event."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Title of the asset associated with the event."
                    readOnly: true
                    type: string
                attributes:
                    additionalProperties:
                        type: string
                    description:
                        "Free-form event properties as a key-value map. Available keys depend on the event `name` (e.g. a `pageViewed` event carries different attributes than `formSubmitted`)."
                    readOnly: true
                    type: object
                canonicalUrl:
                    description:
                        "Canonical URL of the page where the event was emitted."
                    readOnly: true
                    type: string
                createDate:
                    description:
                        "Timestamp of when the event was recorded."
                    format: date-time
                    readOnly: true
                    type: string
                individualId:
                    description:
                        "ID of the individual that emitted the event. Null for anonymous individuals. Use with `getWorkspaceGroupIndividual` to fetch the individual."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Name of the event type (e.g. 'pageViewed', 'formSubmitted', etc.). The set of available names varies per channel and per integration."
                    readOnly: true
                    type: string
                pageDescription:
                    description:
                        "Meta description of the page that emitted the event."
                    readOnly: true
                    type: string
                pageKeywords:
                    description:
                        "Meta keywords of the page that emitted the event. Comma-separated when there are multiple."
                    readOnly: true
                    type: string
                pageTitle:
                    description:
                        "Title of the page that event occurred on."
                    readOnly: true
                    type: string
                referrer:
                    description:
                        "Referring URL the visitor arrived from."
                    readOnly: true
                    type: string
                url:
                    description:
                        "Full URL of the page where the event was emitted."
                    readOnly: true
                    type: string
            type: object
        EventAttributeDefinition:
            description:
                "An attribute recorded on events of an LDP workspace, with its data type and a sample value. Use `getWorkspaceGroupEventAttributeDefinitionsPage` to list them."
            properties:
                dataType:
                    description:
                        "Logical data type of the attribute's values."
                    enum: [BOOLEAN, DATE, DURATION, NUMBER, STRING]
                    readOnly: true
                    type: string
                description:
                    description:
                        "Description of the attribute."
                    readOnly: true
                    type: string
                displayName:
                    description:
                        "Display name of the attribute."
                    readOnly: true
                    type: string
                id:
                    description:
                        "Event attribute definition ID."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Name of the attribute."
                    readOnly: true
                    type: string
                sampleValue:
                    description:
                        "Sample value of the attribute. It may come from an event other than the one passed as `eventDefinitionId`."
                    readOnly: true
                    type: string
                type:
                    description:
                        "Attribute scope. GLOBAL attributes are shared by all events; LOCAL attributes belong to specific events."
                    enum: [GLOBAL, LOCAL]
                    readOnly: true
                    type: string
            type: object
        EventDefinition:
            description:
                "An event of an LDP workspace: one of the DEFAULT events that LDP predefines, or a CUSTOM event the workspace has seen across all channels, with its display name. Use `getWorkspaceGroupEventDefinitionsPage` to list them."
            properties:
                description:
                    description:
                        "Description of the event."
                    readOnly: true
                    type: string
                displayName:
                    description:
                        "Display name of the event."
                    readOnly: true
                    type: string
                hidden:
                    description:
                        "True if the definition is hidden from the LDP pickers."
                    readOnly: true
                    type: boolean
                id:
                    description:
                        "Event definition ID. Use it as `eventDefinitionId` to list the attributes of the event."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Name of the event (e.g. 'pageViewed', 'formSubmitted'). It is the `Event.name` of the matching events."
                    readOnly: true
                    type: string
                type:
                    description:
                        "Event classification. DEFAULT events are tracked by LDP out of the box; CUSTOM events are sent by a site itself."
                    enum: [CUSTOM, DEFAULT]
                    readOnly: true
                    type: string
            type: object
        EventMetric:
            description:
                "Event and session totals for a single account or individual over the selected date range, each with the previous period's total, a trend, and a time series bucketed by the requested interval. Use `getWorkspaceGroupChannelAccountEventMetric` or `getWorkspaceGroupChannelIndividualEventMetric` to retrieve it."
            properties:
                totalEvents:
                    $ref: "#/components/schemas/Metric"
                totalSessions:
                    $ref: "#/components/schemas/Metric"
            type: object
        HistogramBucket:
            description:
                "One bucket of a metric's time series."
            properties:
                key:
                    description:
                        "Start of the bucket, as an ISO-8601 date-time."
                    readOnly: true
                    type: string
                value:
                    description:
                        "Metric value inside the bucket."
                    format: double
                    readOnly: true
                    type: number
            type: object
        Individual:
            description:
                "A single individual synced to LDP. Individuals are aggregated from data sources configured to sync to LDP, and may be either 'known' (identified by email) or 'anonymous' (browser tracked only)."
            properties:
                accountName:
                    description:
                        "Display name of the account this Individual is primarily associated with."
                    readOnly: true
                    type: string
                activitiesCount:
                    description:
                        "Total number of tracked activities attributed to this individual."
                    format: int64
                    readOnly: true
                    type: integer
                activityStatus:
                    description:
                        "Engagement classification computed by LDP from the individual's recent activity: ACTIVE or INACTIVE."
                    readOnly: true
                    type: string
                averageSessionDuration:
                    description:
                        "Average duration of the individual's sessions, in milliseconds."
                    format: int64
                    readOnly: true
                    type: integer
                dateCreated:
                    description:
                        "First time this Individual was observed by LDP."
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        "Last time this individual's profile was modified."
                    format: date-time
                    readOnly: true
                    type: string
                demographics:
                    additionalProperties:
                        items:
                            $ref: "#/components/schemas/IndividualDemographicField"
                        type: array
                    description:
                        "Demographic attributes attached to this Individual, keyed by field name (e.g. 'givenName', 'jobTitle', 'birthDate'). Each value lists the records for that field, one per data source that supplies it. Use `IndividualDemographicField.fieldType` to interpret each `value`."
                    readOnly: true
                    type: object
                emailAddress:
                    description:
                        "Email address of a known individual, taken from the 'email' demographic attribute. Null for anonymous individuals or when no data source supplies one."
                    readOnly: true
                    type: string
                firstActivityDate:
                    description:
                        "Date of the earliest tracked activity for this individual."
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    description:
                        "Individual ID. Use this with `getWorkspaceGroupIndividual` to fetch a single individual."
                    readOnly: true
                    type: string
                knownSinceDate:
                    description:
                        "Date the individual stopped being anonymous and became known."
                    format: date-time
                    readOnly: true
                    type: string
                lastActivityDate:
                    description:
                        "Date of the most recent tracked activity for this individual."
                    format: date-time
                    readOnly: true
                    type: string
                lastSessionCountry:
                    description:
                        "Country detected for the individual's most recent session."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Display name of a known individual, built from the 'givenName' and 'familyName' demographic attributes. Null when neither is available."
                    readOnly: true
                    type: string
                profileType:
                    description:
                        "Profile classification. KNOWN individuals are identified by email/account; ANONYMOUS individuals are browser tracked only."
                    enum: [ANONYMOUS, KNOWN]
                    readOnly: true
                    type: string
                sessionsCount:
                    description:
                        "Total number of sessions attributed to this individual over their whole history. Not a windowed count."
                    format: int64
                    readOnly: true
                    type: integer
            type: object
        IndividualDemographicField:
            description:
                "A single demographic attribute attached to an individual (e.g. job title, age, country). Sourced from connected data sources. Records of the same field from different data sources share one key in `Individual.demographics`."
            properties:
                fieldType:
                    description:
                        "Logical data type of the value. Use this to interpret the `value` field."
                    enum: [BOOLEAN, DATE, NUMBER, STRING]
                    readOnly: true
                    type: string
                label:
                    description:
                        "Human-readable label for the attribute."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Canonical attribute name. Can be used in filter expressions and OData queries."
                    readOnly: true
                    type: string
                value:
                    description:
                        "Attribute value, always serialized as a string. Use `fieldType` to interpret/parse it as the underlying logical type."
                    readOnly: true
                    type: string
            type: object
        IndividualSegment:
            description:
                "A saved audience definition that selects individuals matching a filter expression."
            properties:
                activeIndividualCount:
                    description:
                        "Number of individuals currently in the segment who have been active."
                    format: int64
                    readOnly: true
                    type: integer
                anonymousIndividualCount:
                    description:
                        "Number of anonymous individuals in this segment."
                    format: int64
                    readOnly: true
                    type: integer
                channelId:
                    description:
                        "ID of the channel this segment is scoped to."
                    readOnly: true
                    type: string
                dateCreated:
                    description:
                        "When the segment was created."
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        "Last time the segment definition was modified."
                    format: date-time
                    readOnly: true
                    type: string
                filter:
                    description:
                        "OData-style filter expression that defines segment membership."
                    readOnly: true
                    type: string
                id:
                    description:
                        "Segment ID. Use this with `getWorkspaceGroupIndividualSegment` to fetch a single segment."
                    readOnly: true
                    type: string
                includeAnonymousUsers:
                    description:
                        "True if anonymous individuals are eligible for membership in this segment."
                    readOnly: true
                    type: boolean
                individualCount:
                    description:
                        "Total individuals in the segment."
                    format: int64
                    readOnly: true
                    type: integer
                knownIndividualCount:
                    description:
                        "Number of known individuals in this segment."
                    format: int64
                    readOnly: true
                    type: integer
                lastActivityDate:
                    description:
                        "Most recent activity by any individual currently in the segment."
                    format: date-time
                    readOnly: true
                    type: string
                name:
                    description:
                        "Display name of the segment."
                    readOnly: true
                    type: string
                segmentType:
                    description:
                        "Segment evaluation cadence."
                    enum: [BATCH, REAL_TIME]
                    readOnly: true
                    type: string
                state:
                    description:
                        "Lifecycle state of the segment."
                    enum: [DISABLED, IN_PROGRESS, READY]
                    readOnly: true
                    type: string
                status:
                    description:
                        "Operational status of the segment."
                    enum: [ACTIVE, INACTIVE]
                    readOnly: true
                    type: string
            type: object
        IndividualSegmentMembership:
            description:
                "A single individual's membership in an individual segment. Captures when the Individual entered the segment and (if applicable) when they exited."
            properties:
                dateCreated:
                    description:
                        "When the individual entered the segment."
                    format: date-time
                    readOnly: true
                    type: string
                dateRemoved:
                    description:
                        "When the individual exited the segment. Null if membership is still active."
                    format: date-time
                    readOnly: true
                    type: string
                individualId:
                    description:
                        "ID of the individual whose membership this record describes. Use with `getWorkspaceGroupIndividual` to fetch the individual."
                    readOnly: true
                    type: string
                individualSegmentId:
                    description:
                        "ID of the segment this membership belongs to."
                    readOnly: true
                    type: string
                status:
                    description:
                        "Membership status. ACTIVE means currently a member; INACTIVE means formerly a member."
                    enum: [ACTIVE, INACTIVE]
                    readOnly: true
                    type: string
            type: object
        IndividualSegmentMembershipChange:
            description:
                "Deprecated: a single change to an individual segment's membership. Returned only by the deprecated `getWorkspaceGroupIndividualSegmentMembershipChangesPage`, which is always empty."
            properties:
                dateChanged:
                    description:
                        "When the change happened."
                    format: date-time
                    readOnly: true
                    type: string
                dateFirst:
                    description:
                        "When the individual first entered the segment."
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    description:
                        "ID of the change record."
                    readOnly: true
                    type: string
                individualEmail:
                    description:
                        "Email address of the individual whose membership changed."
                    readOnly: true
                    type: string
                individualId:
                    description:
                        "ID of the individual whose membership changed. Use with `getWorkspaceGroupIndividual` to fetch the individual."
                    readOnly: true
                    type: string
                individualName:
                    description:
                        "Display name of the individual whose membership changed."
                    readOnly: true
                    type: string
                individualSegmentId:
                    description:
                        "ID of the segment this change belongs to."
                    readOnly: true
                    type: string
            type: object
        IndividualSegmentMembershipChangeMetric:
            description:
                "How an individual segment's membership changed over the selected date range, bucketed by day. `individuals` and `knownIndividuals` are the segment's size: `value` is the size at the end of the range and `previousValue` the size at the end of the preceding range of the same length. For the current member list use `getWorkspaceGroupIndividualSegmentMembershipsPage`."
            properties:
                individuals:
                    $ref: "#/components/schemas/Metric"
                knownIndividuals:
                    $ref: "#/components/schemas/Metric"
            type: object
        Metric:
            description:
                "A single aggregated metric over the selected date range, compared to the previous range of the same length, with a time series bucketed by the requested interval."
            properties:
                histogramBuckets:
                    description:
                        "Time series of the metric across the selected date range, one bucket per interval."
                    items:
                        $ref: "#/components/schemas/HistogramBucket"
                    readOnly: true
                    type: array
                previousValue:
                    description:
                        "Total over the previous date range of the same length."
                    format: double
                    readOnly: true
                    type: number
                trendClassification:
                    description:
                        "Direction of the change from the previous range: POSITIVE, NEGATIVE or NEUTRAL."
                    readOnly: true
                    type: string
                trendPercentage:
                    description:
                        "Percentage change from the previous date range."
                    format: double
                    readOnly: true
                    type: number
                value:
                    description:
                        "Total over the selected date range."
                    format: double
                    readOnly: true
                    type: number
            type: object
        PageMetric:
            description:
                "Analytics metrics for a single tracked page over the selected date range. Use `getWorkspaceGroupChannelPagesPage` to list these metrics for a site."
            properties:
                assetId:
                    description:
                        "ID of the tracked page (the page's canonical URL)."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Display title of the page."
                    readOnly: true
                    type: string
                avgTimeOnPage:
                    description:
                        "Average time on page in seconds across all sessions in the date range."
                    format: double
                    readOnly: true
                    type: number
                bounceRate:
                    description:
                        "Fraction of sessions that landed on this page and exited without further interaction. Expressed as a value between 0 to 1."
                    format: double
                    readOnly: true
                    type: number
                dataSourceId:
                    description:
                        "ID of the data source providing this page's analytics events."
                    readOnly: true
                    type: string
                directAccess:
                    description:
                        "Total count of sessions where this page was the entry point with no referrer over the selected time range."
                    format: double
                    readOnly: true
                    type: number
                entrances:
                    description:
                        "Total count of sessions that started on this page over the selected time range."
                    format: double
                    readOnly: true
                    type: number
                exitRate:
                    description:
                        "Fraction of sessions on which this page was the last page viewed before exit. Expressed as a value between 0 to 1."
                    format: double
                    readOnly: true
                    type: number
                indirectAccess:
                    description:
                        "Visit count where this page was reached via a referrer (search engine, link, etc.)."
                    format: double
                    readOnly: true
                    type: number
                urls:
                    description:
                        "List of distinct URLs that resolve to this page."
                    items:
                        type: string
                    readOnly: true
                    type: array
                views:
                    description:
                        "Total page view count over the selected date range."
                    format: double
                    readOnly: true
                    type: number
                viewsTrendPercentage:
                    description:
                        "Percentage change in views compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
                visitors:
                    description:
                        "Distinct visitor count over the selected date range."
                    format: double
                    readOnly: true
                    type: number
                visitorsTrendPercentage:
                    description:
                        "Percentage change in distinct visitors compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
            type: object
        SearchTerm:
            description:
                "Search term metrics. Use `getWorkspaceGroupChannelSearchTermsPage` to list these metrics for a workspace."
            properties:
                count:
                    description:
                        "Number of times the term has been searched."
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        "Value of the term that was searched."
                    readOnly: true
                    type: string
            type: object
        UserSession:
            description:
                "A single browsing session by one individual, with the events recorded during it. Use `getWorkspaceGroupChannelAccountUserSessionsPage` or `getWorkspaceGroupChannelIndividualUserSessionsPage` to list the sessions of an account's individuals or of one individual."
            properties:
                becameKnown:
                    description:
                        "True if the individual became known during this session."
                    readOnly: true
                    type: boolean
                browserName:
                    description:
                        "Browser used during the session."
                    readOnly: true
                    type: string
                completeDate:
                    description:
                        "When the session ended."
                    format: date-time
                    readOnly: true
                    type: string
                createDate:
                    description:
                        "When the session started."
                    format: date-time
                    readOnly: true
                    type: string
                deviceType:
                    description:
                        "Device type used during the session (e.g. 'Desktop', 'Smartphone')."
                    readOnly: true
                    type: string
                events:
                    description:
                        "Events recorded during the session, oldest first."
                    items:
                        $ref: "#/components/schemas/Event"
                    readOnly: true
                    type: array
            type: object
        VisitFrequencyMetric:
            description:
                "A split of the unique visitors of a channel over a date range by how often they came back. Buckets compare the number of sessions of each visitor to the number of days in the range: a visitor is daily with at least as many sessions as days, weekly with at least one session per 7 days, biweekly with at least one per 14 days, monthly with at least one per 30 days, and occasional otherwise. Each threshold is at least one session, so ranges shorter than 14, 28 or 60 days leave the biweekly, monthly or occasional bucket empty. Each visitor is counted in the most frequent bucket they qualify for. Use `getWorkspaceGroupChannelVisitFrequencyMetric` to retrieve it."
            properties:
                biWeeklyVisitors:
                    description:
                        "Visitors with at least one session per 14 days of the range, who are not daily or weekly."
                    format: int64
                    readOnly: true
                    type: integer
                dailyVisitors:
                    description:
                        "Visitors with at least as many sessions as days in the range."
                    format: int64
                    readOnly: true
                    type: integer
                monthlyVisitors:
                    description:
                        "Visitors with at least one session per 30 days of the range, who are not in a more frequent bucket."
                    format: int64
                    readOnly: true
                    type: integer
                occasionalVisitors:
                    description:
                        "Visitors who are not in any of the other buckets."
                    format: int64
                    readOnly: true
                    type: integer
                visitors:
                    description:
                        "Unique visitors in the range; the sum of the five buckets."
                    format: int64
                    readOnly: true
                    type: integer
                weeklyVisitors:
                    description:
                        "Visitors with at least one session per 7 days of the range, who are not daily."
                    format: int64
                    readOnly: true
                    type: integer
            type: object
        VisitorMetric:
            description:
                "A set of visitor totals of a channel over a date range. Use `getWorkspaceGroupChannelVisitorMetric` to retrieve it."
            properties:
                averageSessionDuration:
                    description:
                        "Average duration of the sessions in the range, in milliseconds."
                    format: int64
                    readOnly: true
                    type: integer
                knownVisitors:
                    description:
                        "Visitors identified by email. Anonymous visitors are `visitors` minus `knownVisitors`."
                    format: int64
                    readOnly: true
                    type: integer
                totalSessionDuration:
                    description:
                        "Sum of the durations of all sessions in the range, in milliseconds."
                    format: int64
                    readOnly: true
                    type: integer
                visitors:
                    description:
                        "Unique visitors, known and anonymous, with at least one session in the range."
                    format: int64
                    readOnly: true
                    type: integer
            type: object
        Workspace:
            description:
                "An LDP workspace synced from a Liferay site. Each workspace owns its own channels, individuals, accounts, segments, and asset analytics. Workspaces are scoped to the Liferay group identified by `groupId`."
            properties:
                groupId:
                    description:
                        "ID of the Liferay site that owns the LDP workspace. Use this with other endpoints to scope requests to this workspace."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Display name of the workspace."
                    readOnly: true
                    type: string
            type: object
info:
    description:
        "Read only headless REST API for LDP (Liferay Data Platform). Exposes account lifecycles, accounts, acquisitions, asset summary metrics, event attribute definitions, event definitions, events, individuals, individual segments, page metrics, properties, search terms, visit frequency metrics, and visitor metrics for use as MCP tools and external integrations. All endpoints are scoped to a provisioned LDP workspace. Every tool accepts a `fields` input: request only the fields you need, especially on lists, and leave out the heavy fields `demographics`, `events` and `attributes` unless the question needs them. A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.osb.faro.rest.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: LDP Headless REST API
    version: v1.0
    x-class-name: FaroRest
openapi: 3.0.1
paths:
    "/workspace/{groupId}/account-lifecycles/{accountLifecycleId}/stage-transitions":
        get:
            description:
                "List the accounts that moved from one account lifecycle stage to another within a date range, one entry per move and most recent first. Each entry names the account, the stage it left, the stage it entered, and when the move happened. Filter by origin stage (`fromLifecycleStage`), destination stage (`toLifecycleStage`), account country or industry, or segment membership. Lifecycle stage values are stage names (e.g. 'Pipeline' or 'at risk'), matched ignoring case and surrounding spaces. For date range filtering pass `rangeKey` as one of LAST_24_HOURS, YESTERDAY, LAST_7_DAYS, LAST_28_DAYS, LAST_30_DAYS, LAST_90_DAYS, LAST_180_DAYS, or pass both `rangeStart` and `rangeEnd` as `yyyy-MM-dd` dates for a custom window of at most 180 days; a custom window takes precedence over `rangeKey`. Without either, the last 90 days are used. Wide date ranges can take a while. If the response says the query is still running, wait the stated number of seconds and repeat the identical call."
            operationId: getWorkspaceGroupAccountLifecycleStageTransitionsPage
            parameters:
                -   in: path
                    description:
                        "ID of the Liferay site that owns the LDP workspace."
                    name: groupId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    description:
                        "ID of the account lifecycle whose stage transitions should be listed. Use `getWorkspaceGroupChannelAccountLifecyclesPage` to find it."
                    name: accountLifecycleId
                    required: true
                    schema:
                        type: string
                -   in: query
                    description:
                        "Only include accounts headquartered in this country."
                    name: country
                    schema:
                        type: string
                -   in: query
                    description:
                        "Only include moves out of this stage. Give the stage name (e.g. Pipeline); matching ignores case and surrounding spaces."
                    example: Pipeline
                    name: fromLifecycleStage
                    schema:
                        type: string
                -   in: query
                    description:
                        "Only include accounts in this industry."
                    name: industry
                    schema:
                        type: string
                -   in: query
                    description:
                        "Page number (starts at 1)."
                    name: page
                    schema:
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Page size, from 1 to 100. Larger values are rejected."
                    name: pageSize
                    schema:
                        maximum: 100
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Custom range end as a `yyyy-MM-dd` date (e.g. 2026-01-31). Set together with `rangeStart`; together they take precedence over `rangeKey`."
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    description:
                        "Date range preset. Use one of the listed enum values. Defaults to LAST_90_DAYS. When both `rangeStart` and `rangeEnd` are set, they take precedence over `rangeKey`."
                    example: LAST_90_DAYS
                    name: rangeKey
                    schema:
                        enum: [LAST_180_DAYS, LAST_24_HOURS, LAST_28_DAYS, LAST_30_DAYS, LAST_7_DAYS, LAST_90_DAYS, YESTERDAY]
                        type: string
                -   in: query
                    description:
                        "Custom range start as a `yyyy-MM-dd` date (e.g. 2026-01-01). Set together with `rangeEnd`; together they take precedence over `rangeKey`."
                    name: rangeStart
                    schema:
                        type: string
                -   in: query
                    description:
                        "Only include accounts that are members of this segment."
                    name: segmentId
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    description:
                        "Sort expression `column:asc|desc`. Defaults to `transitionDate:desc`. Sortable columns: accountId, accountName, fromAccountLifecycleStageId, toAccountLifecycleStageId, transitionDate. Only one column is accepted."
                    example: transitionDate:desc
                    name: sort
                    schema:
                        type: string
                -   in: query
                    description:
                        "Only include moves into this stage. Give the stage name (e.g. Onboarding); matching ignores case and surrounding spaces."
                    example: Onboarding
                    name: toLifecycleStage
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AccountLifecycleStageTransition"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AccountLifecycleStageTransition"
                                type: array
            tags: ["AccountLifecycleStageTransition"]
    "/workspace/{groupId}/accounts/{accountId}":
        get:
            description:
                "Fetch a single account by ID from an LDP workspace. Use this when you already have an account ID. To search accounts by name or filter, use `getWorkspaceGroupChannelAccountsPage`."
            operationId: getWorkspaceGroupAccount
            parameters:
                -   in: path
                    description:
                        "ID of the Liferay site that owns the LDP workspace."
                    name: groupId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    description:
                        "ID of the account to fetch."
                    name: accountId
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Account"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Account"
            tags: ["Account"]
    "/workspace/{groupId}/channels":
        get:
            description:
                "List channels configured within an LDP workspace. To fetch a single channel by ID, use `getWorkspaceGroupChannel`."
            operationId: getWorkspaceGroupChannelsPage
            parameters:
                -   in: path
                    description:
                        "ID of the Liferay site that owns the LDP workspace."
                    name: groupId
                    required: true
                    schema:
                        format: int64
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Channel"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Channel"
                                type: array
            tags: ["Channel"]
    "/workspace/{groupId}/channels/{channelId}":
        get:
            description:
                "Fetch a single channel (also known as property) from an LDP workspace. To list available channels in the workspace use `getWorkspaceGroupChannelsPage`."
            operationId: getWorkspaceGroupChannel
            parameters:
                -   in: path
                    description:
                        "ID of the Liferay site that owns the LDP workspace."
                    name: groupId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    description:
                        "ID of the channel to fetch."
                    name: channelId
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Channel"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Channel"
            tags: ["Channel"]
    "/workspace/{groupId}/channels/{channelId}/account-lifecycles":
        get:
            description:
                "List the account lifecycles of a channel (also known as property) in an LDP workspace, with their stages in display order. A channel can have several lifecycles, and exactly one of them is its default. Use this to find the `accountLifecycleId` and the stage names that the stage metric, stage history, and stage transition tools and `getWorkspaceGroupChannelAccountsPage` take."
            operationId: getWorkspaceGroupChannelAccountLifecyclesPage
            parameters:
                -   in: path
                    description:
                        "ID of the Liferay site that owns the LDP workspace."
                    name: groupId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    description:
                        "ID of the channel whose account lifecycles should be listed."
                    name: channelId
                    required: true
                    schema:
                        type: string
                -   in: query
                    description:
                        "Page number (starts at 1)."
                    name: page
                    schema:
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Page size, from 1 to 100. Larger values are rejected."
                    name: pageSize
                    schema:
                        maximum: 100
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Free text search across lifecycle name and author name, ignoring case. Empty or null returns all lifecycles."
                    name: search
                    schema:
                        type: string
                -   in: query
                    description:
                        "Sort expression `column:asc|desc`. Defaults to `name:asc` when omitted. Sortable columns: dateModified, id, name. Only one column is accepted."
                    example: name:asc
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AccountLifecycle"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AccountLifecycle"
                                type: array
            tags: ["AccountLifecycle"]
    "/workspace/{groupId}/channels/{channelId}/account-lifecycles/{accountLifecycleId}/stage-metrics":
        get:
            description:
                "List the stage metrics of an account lifecycle, one entry per stage in display order: how many accounts are in each stage now, their share of the lifecycle, the average days spent in the stage and the conversion rate to the next stage. Durations and conversion rates cover the last 90 days; the date range cannot be changed. Use this to answer 'where do accounts stall' style questions. Optionally narrow results to the accounts of a country, an industry, or a segment with `country`, `industry`, or `segmentId`. A lifecycle has at most 20 stages, so the default page returns them all. The lifecycle must belong to the channel; otherwise the call returns 404."
            operationId: getWorkspaceGroupChannelAccountLifecycleStageMetricsPage
            parameters:
                -   in: path
                    description:
                        "ID of the Liferay site that owns the LDP workspace."
                    name: groupId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    description:
                        "ID of the channel whose account lifecycle stage metrics should be listed."
                    name: channelId
                    required: true
                    schema:
                        type: string
                -   in: path
                    description:
                        "ID of the account lifecycle whose stage metrics should be listed. Use `getWorkspaceGroupChannelAccountLifecyclesPage` to find it."
                    name: accountLifecycleId
                    required: true
                    schema:
                        type: string
                -   in: query
                    description:
                        "Only include accounts headquartered in this country."
                    name: country
                    schema:
                        type: string
                -   in: query
                    description:
                        "Only include accounts in this industry."
                    name: industry
                    schema:
                        type: string
                -   in: query
                    description:
                        "Page number (starts at 1)."
                    name: page
                    schema:
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Page size, from 1 to 100. Larger values are rejected."
                    name: pageSize
                    schema:
                        maximum: 100
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Only include accounts that are members of this segment."
                    name: segmentId
                    schema:
                        format: int64
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AccountLifecycleStageMetric"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AccountLifecycleStageMetric"
                                type: array
            tags: ["AccountLifecycleStageMetric"]
    "/workspace/{groupId}/channels/{channelId}/accounts":
        get:
            description:
                "List or search accounts synced to an LDP workspace. Optionally narrow results to a single channel (also known as property). Optionally narrow results to a single lifecycle stage with `lifecycleStage`, passing the name of a stage; the stage is looked up in the account lifecycle given by `accountLifecycleId`, or in the channel's default account lifecycle when it is omitted. To list the account lifecycles of a channel, use `getWorkspaceGroupChannelAccountLifecyclesPage`. Use this to browse or search accounts by name. To fetch a single account by ID, use `getWorkspaceGroupAccount`. For date range filtering pass `rangeKey` as one of LAST_24_HOURS, YESTERDAY, LAST_7_DAYS, LAST_28_DAYS, LAST_30_DAYS, LAST_90_DAYS, LAST_180_DAYS, or pass both `rangeStart` and `rangeEnd` as `yyyy-MM-dd` dates for a custom window of at most 180 days; a custom window takes precedence over `rangeKey`. Without either, results are not limited to a date range. Wide date ranges can take a while. If the response says the query is still running, wait the stated number of seconds and repeat the identical call."
            operationId: getWorkspaceGroupChannelAccountsPage
            parameters:
                -   in: path
                    description:
                        "ID of the Liferay site that owns the LDP workspace."
                    name: groupId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    description:
                        "ID of the channel whose accounts should be listed."
                    name: channelId
                    required: true
                    schema:
                        type: string
                -   in: query
                    description:
                        "ID of the account lifecycle that `lifecycleStage` is looked up in and that sorting by `lifecycleStage` uses. It does not narrow the results. When omitted, `lifecycleStage` is looked up in the channel's default account lifecycle and sorting by `lifecycleStage` has no effect."
                    name: accountLifecycleId
                    schema:
                        type: string
                -   in: query
                    description:
                        "Lifecycle stage name. When set, narrow the results to the accounts currently in that stage of the account lifecycle given by `accountLifecycleId`, or of the channel's default account lifecycle when it is omitted. The name is matched ignoring case and surrounding spaces and resolved to the stage ID that backs the filter, so pass the name, not the ID."
                    example: At Risk
                    name: lifecycleStage
                    schema:
                        type: string
                -   in: query
                    description:
                        "Page number (starts at 1)."
                    name: page
                    schema:
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Page size, from 1 to 100. Larger values are rejected."
                    name: pageSize
                    schema:
                        maximum: 100
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Custom range end as a `yyyy-MM-dd` date (e.g. 2026-01-31). Set together with `rangeStart`; together they take precedence over `rangeKey`."
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    description:
                        "Date range preset. Use one of the listed enum values. When both `rangeStart` and `rangeEnd` are set, they take precedence over `rangeKey`."
                    example: LAST_30_DAYS
                    name: rangeKey
                    schema:
                        enum: [LAST_180_DAYS, LAST_24_HOURS, LAST_28_DAYS, LAST_30_DAYS, LAST_7_DAYS, LAST_90_DAYS, YESTERDAY]
                        type: string
                -   in: query
                    description:
                        "Custom range start as a `yyyy-MM-dd` date (e.g. 2026-01-01). Set together with `rangeEnd`; together they take precedence over `rangeKey`."
                    name: rangeStart
                    schema:
                        type: string
                -   in: query
                    description:
                        "Free text keyword search across account name and related fields. Empty or null returns all accounts."
                    name: search
                    schema:
                        type: string
                -   in: query
                    description:
                        "Sort expression `column:asc|desc`. Defaults to `accountName:asc` when omitted. Sortable columns: accountName, accountType, activitiesCount, annualRevenue, country, createDate, firstActivityDate, industry, lastActivityDate, lifecycleStage, modifiedDate, numberOfEmployees, state, yearStarted; sorting by lifecycleStage requires `accountLifecycleId`. Only one column is accepted."
                    example: accountName:asc
                    name: sort
                    schema:
