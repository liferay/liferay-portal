components:
    schemas:
        Account:
            description:
                "An account synced to Analytics Cloud. Accounts aggregate individuals (or contacts) employed by or associated with a single organization."
            properties:
                accountName:
                    description:
                        "Name of the account."
                    readOnly: true
                    type: string
                accountType:
                    description:
                        "Account classification supplied by the data source (e.g. 'Customer', 'Partner')."
                    readOnly: true
                    type: string
                activitiesCount:
                    description:
                        "Total number of tracked activities attributed to individuals associated with this account, over the account's whole history. Not a windowed count."
                    format: int64
                    readOnly: true
                    type: integer
                annualRevenue:
                    description:
                        "Annual revenue of the account."
                    format: double
                    readOnly: true
                    type: number
                country:
                    description:
                        "Country name where the account is headquartered."
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        "Last time the account record was modified within Analytics Cloud."
                    format: date-time
                    readOnly: true
                    type: string
                firstActivityDate:
                    description:
                        "Date of the earliest tracked activity from any individual associated with this account."
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    description:
                        "Account ID. Use this with `getWorkspaceGroupAccount` to fetch the account directly."
                    readOnly: true
                    type: string
                industry:
                    description:
                        "Industry classification of the account (e.g. 'Software', 'Manufacturing')."
                    readOnly: true
                    type: string
                lastActivityDate:
                    description:
                        "Date of most recent activity from any individual associated with this account."
                    format: date-time
                    readOnly: true
                    type: string
                lifecycleStage:
                    description:
                        "Sales/marketing lifecycle stage of the account (e.g. 'Prospect', 'Customer')."
                    readOnly: true
                    type: string
                numberOfEmployees:
                    description:
                        "Number of employees reported for the account."
                    readOnly: true
                    type: integer
                website:
                    description:
                        "Website of the account."
                    readOnly: true
                    type: string
            type: object
        AccountLifecycleStage:
            description:
                "A stage of an account lifecycle. Each lifecycle has one stage per stage type, ordered by display order."
            properties:
                description:
                    description:
                        "Description of the stage."
                    readOnly: true
                    type: string
                displayOrder:
                    description:
                        "Position of the stage in the lifecycle, starting at 1."
                    readOnly: true
                    type: integer
                id:
                    description:
                        "Stage ID."
                    readOnly: true
                    type: string
                maxDuration:
                    description:
                        "Maximum number of days an account is expected to stay in the stage before it is considered stalled. Null when no limit is set."
                    readOnly: true
                    type: integer
                stageType:
                    description:
                        "Stage type: AWARE, ENGAGED, PIPELINE, ONBOARDING, ESTABLISHED, or AT_RISK. Use it (or the description) as `fromLifecycleStage` or `toLifecycleStage` to filter stage transitions."
                    readOnly: true
                    type: string
            type: object
        AccountLifecycleStageTransition:
            description:
                "An account moving from one account lifecycle stage to another. An account that moved several times in the requested date range appears once per move."
            properties:
                accountId:
                    description:
                        "Account ID. Use this with `getWorkspaceGroupAccount` to fetch the account."
                    readOnly: true
                    type: string
                accountName:
                    description:
                        "Name of the account."
                    readOnly: true
                    type: string
                fromAccountLifecycleStage:
                    $ref: "#/components/schemas/AccountLifecycleStage"
                    description:
                        "Stage the account left."
                    readOnly: true
                toAccountLifecycleStage:
                    $ref: "#/components/schemas/AccountLifecycleStage"
                    description:
                        "Stage the account entered."
                    readOnly: true
                transitionDate:
                    description:
                        "When the account entered the new stage."
                    format: date-time
                    readOnly: true
                    type: string
            type: object
        AssetSummaryMetric:
            description:
                "An aggregated set of analytics metrics for a single tracked asset (page, blog, document, form, journal, object entry, etc.) over the selected date range. Trend percentages compare metrics on the selected date range to the previous date range. Use `getWorkspaceGroupChannelAssetSummariesPage` to list these sets of metrics."
            properties:
                assetId:
                    description:
                        "ID of the tracked asset."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Display title of the asset (e.g. the page title or blog post title)."
                    readOnly: true
                    type: string
                assetType:
                    description:
                        "Asset category as reported by the analytics engine (e.g. Blog, Document, Form, Journal, Page)."
                    readOnly: true
                    type: string
                downloads:
                    description:
                        "Download count over the selected date range. Null when the asset type doesn't track downloads."
                    format: double
                    readOnly: true
                    type: number
                downloadsTrendPercentage:
                    description:
                        "Percentage change in downloads compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
                impressions:
                    description:
                        "Impression count (asset rendered into a viewport but not necessarily interacted with)."
                    format: double
                    readOnly: true
                    type: number
                impressionsTrendPercentage:
                    description:
                        "Percentage change in impressions compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
                reads:
                    description:
                        "Read count (full-content engagement, distinct from impressions)."
                    format: double
                    readOnly: true
                    type: number
                readsTrendPercentage:
                    description:
                        "Percentage change in reads compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
                views:
                    description:
                        "View count (asset opened/loaded by an individual)."
                    format: double
                    readOnly: true
                    type: number
                viewsTrendPercentage:
                    description:
                        "Percentage change in views compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
            type: object
        Channel:
            description:
                "A logical grouping of data coming from configured data sources (e.g. a website, a CRM connection) under which asset metrics, events, individuals, and segments are scoped. Also known as property."
            properties:
                id:
                    description:
                        "Channel ID. Use this with `getWorkspaceGroupChannel` to fetch the channel directly."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Display name of the channel."
                    readOnly: true
                    type: string
            type: object
        Event:
            description:
                "A single tracked analytics event captured — page views, custom events, form submissions, etc. Each event carries free-form `attributes` (a name value map of contextual properties) plus any matching page metadata. Use `getWorkspaceGroupChannelEventsPage` to retrieve a list of analytics events."
            properties:
                applicationId:
                    description:
                        "ID of the application that emitted the event."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Title of the asset associated with the event."
                    readOnly: true
                    type: string
                attributes:
                    additionalProperties:
                        type: string
                    description:
                        "Free-form event properties as a key-value map. Available keys depend on the event `name` (e.g. a `pageViewed` event carries different attributes than `formSubmitted`)."
                    readOnly: true
                    type: object
                canonicalUrl:
                    description:
                        "Canonical URL of the page where the event was emitted."
                    readOnly: true
                    type: string
                createDate:
                    description:
                        "Timestamp of when the event was recorded."
                    format: date-time
                    readOnly: true
                    type: string
                individualId:
                    description:
                        "ID of the individual that emitted the event. Null for anonymous individuals. Use with `getWorkspaceGroupIndividual` to fetch the individual."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Name of the event type (e.g. 'pageViewed', 'formSubmitted', etc.). The set of available names varies per channel and per integration."
                    readOnly: true
                    type: string
                pageDescription:
                    description:
                        "Meta description of the page that emitted the event."
                    readOnly: true
                    type: string
                pageKeywords:
                    description:
                        "Meta keywords of the page that emitted the event. Comma-separated when there are multiple."
                    readOnly: true
                    type: string
                pageTitle:
                    description:
                        "Title of the page that event occurred on."
                    readOnly: true
                    type: string
                referrer:
                    description:
                        "Referring URL the visitor arrived from."
                    readOnly: true
                    type: string
                url:
                    description:
                        "Full URL of the page where the event was emitted."
                    readOnly: true
                    type: string
            type: object
        EventMetric:
            description:
                "Event and session totals for a single account or individual over the selected date range, each with the previous period's total, a trend, and a time series bucketed by the requested interval. Use `getWorkspaceGroupChannelAccountEventMetric` or `getWorkspaceGroupChannelIndividualEventMetric` to retrieve it."
            properties:
                totalEvents:
                    $ref: "#/components/schemas/Metric"
                totalSessions:
                    $ref: "#/components/schemas/Metric"
            type: object
        HistogramBucket:
            description:
                "One bucket of a metric's time series."
            properties:
                key:
                    description:
                        "Start of the bucket, as an ISO-8601 date-time."
                    readOnly: true
                    type: string
                value:
                    description:
                        "Metric value inside the bucket."
                    format: double
                    readOnly: true
                    type: number
            type: object
        Individual:
            description:
                "A single individual synced to Analytics Cloud. Individuals are aggregated from data sources configured to sync to Analytics Cloud, and may be either 'known' (identified by email) or 'anonymous' (browser-tracked only)."
            properties:
                accountName:
                    description:
                        "Display name of the account this Individual is primarily associated with."
                    readOnly: true
                    type: string
                activitiesCount:
                    description:
                        "Total number of tracked activities attributed to this individual."
                    format: int64
                    readOnly: true
                    type: integer
                activityStatus:
                    description:
                        "Engagement classification computed by Analytics Cloud from the individual's recent activity. The set of values is defined by the analytics engine."
                    readOnly: true
                    type: string
                averageSessionDuration:
                    description:
                        "Average duration of the individual's sessions, in milliseconds."
                    format: int64
                    readOnly: true
                    type: integer
                dateCreated:
                    description:
                        "First time this Individual was observed by Analytics Cloud."
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        "Last time this individual's profile was modified."
                    format: date-time
                    readOnly: true
                    type: string
                demographics:
                    additionalProperties:
                        items:
                            $ref: "#/components/schemas/IndividualDemographicField"
                        type: array
                    description:
                        "Per-category demographic attributes attached to this Individual. The map key is the demographic category (e.g. 'profile', 'address', 'employment'), and each value is a list of attribute records. Use `IndividualDemographicField.fieldType` to interpret each `value`."
                    readOnly: true
                    type: object
                emailAddress:
                    description:
                        "Email address of a known individual, taken from the 'email' demographic attribute. Null for anonymous individuals or when no data source supplies one."
                    readOnly: true
                    type: string
                firstActivityDate:
                    description:
                        "Date of the earliest tracked activity for this individual."
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    description:
                        "Individual ID. Use this with `getWorkspaceGroupIndividual` to fetch a single individual."
                    readOnly: true
                    type: string
                knownSinceDate:
                    description:
                        "Date the individual stopped being anonymous and became known."
                    format: date-time
                    readOnly: true
                    type: string
                lastActivityDate:
                    description:
                        "Date of the most recent tracked activity for this individual."
                    format: date-time
                    readOnly: true
                    type: string
                lastSessionCountry:
                    description:
                        "Country detected for the individual's most recent session."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Display name of a known individual, built from the 'givenName' and 'familyName' demographic attributes. Null when neither is available."
                    readOnly: true
                    type: string
                profileType:
                    description:
                        "Profile classification. KNOWN individuals are identified by email/account; ANONYMOUS individuals are browser-tracked only."
                    enum: [ANONYMOUS, KNOWN]
                    readOnly: true
                    type: string
                sessionsCount:
                    description:
                        "Total number of sessions attributed to this individual over their whole history. Not a windowed count."
                    format: int64
                    readOnly: true
                    type: integer
            type: object
        IndividualDemographicField:
            description:
                "A single demographic attribute attached to an individual (e.g. job title, age, country). Sourced from connected data sources. Multiple attributes can share a category in `Individual.demographics`."
            properties:
                fieldType:
                    description:
                        "Logical data type of the value. Use this to interpret the `value` field."
                    enum: [BOOLEAN, DATE, NUMBER, STRING]
                    readOnly: true
                    type: string
                label:
                    description:
                        "Human-readable label for the attribute."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Canonical attribute name. Can be used in filter expressions and OData queries."
                    readOnly: true
                    type: string
                value:
                    description:
                        "Attribute value, always serialized as a string. Use `fieldType` to interpret/parse it as the underlying logical type."
                    readOnly: true
                    type: string
            type: object
        IndividualSegment:
            description:
                "A saved audience definition that selects individuals matching a filter expression."
            properties:
                activeIndividualCount:
                    description:
                        "Number of individuals currently in the segment who have been active."
                    format: int64
                    readOnly: true
                    type: integer
                anonymousIndividualCount:
                    description:
                        "Number of anonymous individuals in this segment."
                    format: int64
                    readOnly: true
                    type: integer
                channelId:
                    description:
                        "ID of the channel this segment is scoped to."
                    readOnly: true
                    type: string
                dateCreated:
                    description:
                        "When the segment was created."
                    format: date-time
                    readOnly: true
                    type: string
                dateModified:
                    description:
                        "Last time the segment definition was modified."
                    format: date-time
                    readOnly: true
                    type: string
                filter:
                    description:
                        "OData-style filter expression that defines segment membership."
                    readOnly: true
                    type: string
                id:
                    description:
                        "Segment ID. Use this with `getWorkspaceGroupIndividualSegment` to fetch a single segment."
                    readOnly: true
                    type: string
                includeAnonymousUsers:
                    description:
                        "True if anonymous individuals are eligible for membership in this segment."
                    readOnly: true
                    type: boolean
                individualCount:
                    description:
                        "Total individuals in the segment."
                    format: int64
                    readOnly: true
                    type: integer
                knownIndividualCount:
                    description:
                        "Number of known individuals in this segment."
                    format: int64
                    readOnly: true
                    type: integer
                lastActivityDate:
                    description:
                        "Most recent activity by any individual currently in the segment."
                    format: date-time
                    readOnly: true
                    type: string
                name:
                    description:
                        "Display name of the segment."
                    readOnly: true
                    type: string
                segmentType:
                    description:
                        "Segment evaluation cadence."
                    enum: [BATCH, REAL_TIME]
                    readOnly: true
                    type: string
                state:
                    description:
                        "Lifecycle state of the segment."
                    enum: [DISABLED, IN_PROGRESS, READY]
                    readOnly: true
                    type: string
                status:
                    description:
                        "Operational status of the segment."
                    enum: [ACTIVE, INACTIVE]
                    readOnly: true
                    type: string
            type: object
        IndividualSegmentMembership:
            description:
                "A single individual's membership in an individual segment. Captures when the Individual entered the segment and (if applicable) when they exited."
            properties:
                dateCreated:
                    description:
                        "When the individual entered the segment."
                    format: date-time
                    readOnly: true
                    type: string
                dateRemoved:
                    description:
                        "When the individual exited the segment. Null if membership is still active."
                    format: date-time
                    readOnly: true
                    type: string
                individualId:
                    description:
                        "ID of the individual whose membership this record describes. Use with `getWorkspaceGroupIndividual` to fetch the individual."
                    readOnly: true
                    type: string
                individualSegmentId:
                    description:
                        "ID of the segment this membership belongs to."
                    readOnly: true
                    type: string
                status:
                    description:
                        "Membership status. ACTIVE means currently a member; INACTIVE means formerly a member."
                    enum: [ACTIVE, INACTIVE]
                    readOnly: true
                    type: string
            type: object
        IndividualSegmentMembershipChange:
            description:
                "A single change to an individual segment's membership: one individual entering or leaving the segment on a given date, with the individual's name and email resolved. Use `getWorkspaceGroupIndividualSegmentMembershipChangesPage` to list changes for a segment over a date range."
            properties:
                dateChanged:
                    description:
                        "When the change happened."
                    format: date-time
                    readOnly: true
                    type: string
                dateFirst:
                    description:
                        "When the individual first entered the segment."
                    format: date-time
                    readOnly: true
                    type: string
                id:
                    description:
                        "ID of the change record."
                    readOnly: true
                    type: string
                individualEmail:
                    description:
                        "Email address of the individual whose membership changed."
                    readOnly: true
                    type: string
                individualId:
                    description:
                        "ID of the individual whose membership changed. Use with `getWorkspaceGroupIndividual` to fetch the individual."
                    readOnly: true
                    type: string
                individualName:
                    description:
                        "Display name of the individual whose membership changed."
                    readOnly: true
                    type: string
                individualSegmentId:
                    description:
                        "ID of the segment this change belongs to."
                    readOnly: true
                    type: string
                operation:
                    description:
                        "Kind of change. ADDED when the individual entered the segment; the analytics engine defines the value used when an individual leaves."
                    readOnly: true
                    type: string
            type: object
        IndividualSegmentMembershipChangeMetric:
            description:
                "How an individual segment's membership changed over the selected date range, bucketed by day. `individuals` and `knownIndividuals` are the segment's size: `value` is the size at the end of the range and `previousValue` the size at the end of the preceding range of the same length. `addedIndividuals` and `removedIndividuals` are how much the segment grew and shrank, summed over the range. Those two are derived from the change in size between consecutive days, so on any one day only one of them can be non-zero: a day on which 10 individuals joined and 10 left reports zero for both, and a day on which 12 joined and 10 left reports 2 added and 0 removed. Read them as net movement, not as counts of individuals entering and leaving. For the current member list use `getWorkspaceGroupIndividualSegmentMembershipsPage`."
            properties:
                addedIndividuals:
                    $ref: "#/components/schemas/Metric"
                individuals:
                    $ref: "#/components/schemas/Metric"
                knownIndividuals:
                    $ref: "#/components/schemas/Metric"
                removedIndividuals:
                    $ref: "#/components/schemas/Metric"
            type: object
        Metric:
            description:
                "A single aggregated metric over the selected date range, compared to the previous range of the same length, with a time series bucketed by the requested interval."
            properties:
                histogramBuckets:
                    description:
                        "Time series of the metric across the selected date range, one bucket per interval."
                    items:
                        $ref: "#/components/schemas/HistogramBucket"
                    readOnly: true
                    type: array
                previousValue:
                    description:
                        "Total over the previous date range of the same length."
                    format: double
                    readOnly: true
                    type: number
                trendClassification:
                    description:
                        "Direction of the change from the previous range (e.g. POSITIVE, NEGATIVE, NEUTRAL). The set of values is defined by the analytics engine."
                    readOnly: true
                    type: string
                trendPercentage:
                    description:
                        "Percentage change from the previous date range."
                    format: double
                    readOnly: true
                    type: number
                value:
                    description:
                        "Total over the selected date range."
                    format: double
                    readOnly: true
                    type: number
            type: object
        PageMetric:
            description:
                "Analytics metrics for a single tracked page over the selected date range. Use `getWorkspaceGroupChannelPagesPage` to list these metrics for a site."
            properties:
                assetId:
                    description:
                        "ID of the tracked page (the page's canonical URL)."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Display title of the page."
                    readOnly: true
                    type: string
                avgTimeOnPage:
                    description:
                        "Average time on page in seconds across all sessions in the date range."
                    format: double
                    readOnly: true
                    type: number
                bounceRate:
                    description:
                        "Fraction of sessions that landed on this page and exited without further interaction. Expressed as a value between 0 to 1."
                    format: double
                    readOnly: true
                    type: number
                dataSourceId:
                    description:
                        "ID of the data source providing this page's analytics events."
                    readOnly: true
                    type: string
                directAccess:
                    description:
                        "Total count of sessions where this page was the entry point with no referrer over the selected time range."
                    format: double
                    readOnly: true
                    type: number
                entrances:
                    description:
                        "Total count of sessions that started on this page over the selected time range."
                    format: double
                    readOnly: true
                    type: number
                exitRate:
                    description:
                        "Fraction of sessions on which this page was the last page viewed before exit. Expressed as a value between 0 to 1."
                    format: double
                    readOnly: true
                    type: number
                indirectAccess:
                    description:
                        "Visit count where this page was reached via a referrer (search engine, link, etc.)."
                    format: double
                    readOnly: true
                    type: number
                urls:
                    description:
                        "List of distinct URLs that resolve to this page."
                    items:
                        type: string
                    readOnly: true
                    type: array
                views:
                    description:
                        "Total page view count over the selected date range."
                    format: double
                    readOnly: true
                    type: number
                viewsTrendPercentage:
                    description:
                        "Percentage change in views compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
                visitors:
                    description:
                        "Distinct visitor count over the selected date range."
                    format: double
                    readOnly: true
                    type: number
                visitorsTrendPercentage:
                    description:
                        "Percentage change in distinct visitors compared to the previous date range."
                    format: double
                    readOnly: true
                    type: number
            type: object
        SearchTerm:
            description:
                "Search term metrics. Use `getWorkspaceGroupChannelSearchTermsPage` to list these metrics for a workspace."
            properties:
                count:
                    description:
                        "Number of times the term has been searched."
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        "Value of the term that was searched."
                    readOnly: true
                    type: string
            type: object
        UserSession:
            description:
                "A single browsing session by one individual, with the events recorded during it. Use `getWorkspaceGroupChannelAccountUserSessionsPage` or `getWorkspaceGroupChannelIndividualUserSessionsPage` to list the sessions of an account's individuals or of one individual."
            properties:
                becameKnown:
                    description:
                        "True if the individual became known during this session."
                    readOnly: true
                    type: boolean
                browserName:
                    description:
                        "Browser used during the session."
                    readOnly: true
                    type: string
                completeDate:
                    description:
                        "When the session ended."
                    format: date-time
                    readOnly: true
                    type: string
                createDate:
                    description:
                        "When the session started."
                    format: date-time
                    readOnly: true
                    type: string
                deviceType:
                    description:
                        "Device type used during the session (e.g. 'Desktop', 'Smartphone')."
                    readOnly: true
                    type: string
                events:
                    description:
                        "Events recorded during the session, oldest first."
                    items:
                        $ref: "#/components/schemas/Event"
                    readOnly: true
                    type: array
            type: object
        Workspace:
            description:
                "An Analytics Cloud workspace synced from a Liferay site. Each workspace owns its own channels, individuals, accounts, segments, and asset analytics. Workspaces are scoped to the Liferay group identified by `groupId`."
            properties:
                groupId:
                    description:
                        "ID of the Liferay site that owns the Analytics Cloud workspace. Use this with other endpoints to scope requests to this workspace."
                    format: int64
                    readOnly: true
                    type: integer
                name:
                    description:
                        "Display name of the workspace."
                    readOnly: true
                    type: string
            type: object
info:
    description:
        "Read-only headless REST API for Liferay Analytics Cloud. Exposes accounts, asset-summary metrics, events, individuals, individual segments, page metrics, properties, and search terms for use as MCP tools and external integrations. All endpoints are scoped to a provisioned Analytics Cloud workspace. A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.osb.faro.rest.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Liferay Analytics Cloud Headless REST API
    version: v1.0
    x-class-name: FaroRest
openapi: 3.0.1
paths:
    "/workspace/{groupId}/account-lifecycles/{accountLifecycleId}/stage-transitions":
        get:
            description:
                "List the accounts that moved from one account lifecycle stage to another within a date range, one entry per move and most recent first. Each entry names the account, the stage it left, the stage it entered, and when the move happened. Filter by origin stage (`fromLifecycleStage`), destination stage (`toLifecycleStage`), account country or industry, or segment membership. Lifecycle stage values are matched case-insensitively against the stage type (e.g. PIPELINE or 'at risk') or the stage description. For date range filtering pass `rangeKey` as one of LAST_24_HOURS, YESTERDAY, LAST_7_DAYS, LAST_28_DAYS, LAST_30_DAYS, LAST_90_DAYS, LAST_180_DAYS, LAST_YEAR; it defaults to LAST_90_DAYS, roughly the last quarter. Alternatively, pass `rangeStart` and `rangeEnd` as dates for a custom window."
            operationId: getWorkspaceGroupAccountLifecycleStageTransitionsPage
            parameters:
                -   in: path
                    description:
                        "ID of the Liferay site that owns the Analytics Cloud workspace."
                    name: groupId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    description:
                        "ID of the account lifecycle whose stage transitions should be listed."
                    name: accountLifecycleId
                    required: true
                    schema:
                        type: string
                -   in: query
                    description:
                        "Only include accounts headquartered in this country."
                    name: country
                    schema:
                        type: string
                -   in: query
                    description:
                        "Only include moves out of this stage. Give the stage type (e.g. PIPELINE) or its description; matching is case-insensitive."
                    example: PIPELINE
                    name: fromLifecycleStage
                    schema:
                        type: string
