        get:
            description:
                "Fetch how often the visitors of a channel (also known as property) came back in a date range, as counts of daily, weekly, biweekly, monthly and occasional visitors. The buckets are relative to the length of the range, so compare ranges of the same length. Each threshold is at least one session, so short ranges leave the less frequent buckets empty: under 14 days there are no biweekly visitors, under 28 days no monthly ones and under 60 days no occasional ones, and a single day such as LAST_24_HOURS or YESTERDAY counts every visitor as daily. Use LAST_90_DAYS or LAST_180_DAYS for a full split. It cannot be narrowed to a segment or an account. For date range filtering pass `rangeKey` as one of LAST_24_HOURS, YESTERDAY, LAST_7_DAYS, LAST_28_DAYS, LAST_30_DAYS, LAST_90_DAYS, LAST_180_DAYS, or pass both `rangeStart` and `rangeEnd` as `yyyy-MM-dd` dates for a custom window of at most 180 days; a custom window takes precedence over `rangeKey`. Without either, the last 30 days are used. Use this for 'how loyal are our visitors' style queries. Wide date ranges can take a while. If the response says the query is still running, wait the stated number of seconds and repeat the identical call."
            operationId: getWorkspaceGroupChannelVisitFrequencyMetric
            parameters:
                -   in: path
                    description:
                        "ID of the Liferay site that owns the LDP workspace."
                    name: groupId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    description:
                        "ID of the channel whose visitors should be counted."
                    name: channelId
                    required: true
                    schema:
                        type: string
                -   in: query
                    description:
                        "Custom range end as a `yyyy-MM-dd` date (e.g. 2026-01-31). Set together with `rangeStart`; together they take precedence over `rangeKey`."
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    description:
                        "Date range preset. Use one of the listed enum values. Defaults to LAST_30_DAYS. When both `rangeStart` and `rangeEnd` are set, they take precedence over `rangeKey`."
                    example: LAST_30_DAYS
                    name: rangeKey
                    schema:
                        enum: [LAST_180_DAYS, LAST_24_HOURS, LAST_28_DAYS, LAST_30_DAYS, LAST_7_DAYS, LAST_90_DAYS, YESTERDAY]
                        type: string
                -   in: query
                    description:
                        "Custom range start as a `yyyy-MM-dd` date (e.g. 2026-01-01). Set together with `rangeEnd`; together they take precedence over `rangeKey`."
                    name: rangeStart
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/VisitFrequencyMetric"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/VisitFrequencyMetric"
            tags: ["VisitFrequencyMetric"]
    "/workspace/{groupId}/channels/{channelId}/visitor-metrics":
        get:
            description:
                "Fetch the visitor totals of a channel (also known as property) for a date range: unique visitors, known visitors (identified by email), and the average and total session duration. Optionally narrow results to the individuals in a segment with `segmentId`. For date range filtering pass `rangeKey` as one of LAST_24_HOURS, YESTERDAY, LAST_7_DAYS, LAST_28_DAYS, LAST_30_DAYS, LAST_90_DAYS, LAST_180_DAYS; this tool does not support custom `rangeStart`/`rangeEnd` windows and returns 400 when they are set. Without `rangeKey`, the last 30 days are used. Use this for 'how many visitors did the site have' style queries. Wide date ranges can take a while. If the response says the query is still running, wait the stated number of seconds and repeat the identical call."
            operationId: getWorkspaceGroupChannelVisitorMetric
            parameters:
                -   in: path
                    description:
                        "ID of the Liferay site that owns the LDP workspace."
                    name: groupId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    description:
                        "ID of the channel whose visitors should be counted."
                    name: channelId
                    required: true
                    schema:
                        type: string
                -   in: query
                    description:
                        "Date range preset. Use one of the listed enum values. Defaults to LAST_30_DAYS."
                    example: LAST_30_DAYS
                    name: rangeKey
                    schema:
                        enum: [LAST_180_DAYS, LAST_24_HOURS, LAST_28_DAYS, LAST_30_DAYS, LAST_7_DAYS, LAST_90_DAYS, YESTERDAY]
                        type: string
                -   in: query
                    description:
