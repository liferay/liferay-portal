                            schema:
                                $ref: "#/components/schemas/VisitorMetric"
            tags: ["VisitorMetric"]
    "/workspace/{groupId}/event-attribute-definitions":
        get:
            description:
                "List the event attribute definitions of an LDP workspace, with their data types and sample values. Optionally narrow results to the attributes of a single event with `eventDefinitionId`; an unknown ID returns an empty page. Use this to learn which attributes events carry and how to read their values. To list the events and their IDs, use `getWorkspaceGroupEventDefinitionsPage`."
            operationId: getWorkspaceGroupEventAttributeDefinitionsPage
            parameters:
                -   in: path
                    description:
                        "ID of the Liferay site that owns the LDP workspace."
                    name: groupId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    description:
                        "Only include attributes of this scope. Defaults to ALL."
                    example: ALL
                    name: attributeType
                    schema:
                        enum: [ALL, GLOBAL, LOCAL]
                        type: string
                -   in: query
                    description:
                        "ID of an event definition. When set, narrow the results to the attributes of that event."
                    name: eventDefinitionId
                    schema:
                        type: string
                -   in: query
                    description:
                        "Page number (starts at 1)."
                    name: page
                    schema:
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Page size, from 1 to 100. Larger values are rejected."
                    name: pageSize
                    schema:
                        maximum: 100
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Free text search across attribute name, display name, and description, ignoring case. Empty or null returns all attributes."
                    name: search
                    schema:
                        type: string
                -   in: query
                    description:
                        "Sort expression `column:asc|desc`. Defaults to `name:asc` when omitted. Sortable column: name. Only one column is accepted."
                    example: name:asc
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/EventAttributeDefinition"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/EventAttributeDefinition"
                                type: array
            tags: ["EventAttributeDefinition"]
    "/workspace/{groupId}/event-definitions":
        get:
            description:
                "List the event definitions of an LDP workspace: the DEFAULT events that LDP predefines and every CUSTOM event the workspace has seen, across all channels, with their display names. Use this to find out which events exist before querying events. To list the attributes of an event, use `getWorkspaceGroupEventAttributeDefinitionsPage` with its ID as `eventDefinitionId`."
