                -   in: path
                    description:
                        "ID of the individual segment whose membership should be measured."
                    name: individualSegmentId
                    required: true
                    schema:
                        type: string
                -   in: query
                    description:
                        "Date range preset. LAST_30_DAYS when omitted. Custom windows are not supported on this operation: the range always ends today."
