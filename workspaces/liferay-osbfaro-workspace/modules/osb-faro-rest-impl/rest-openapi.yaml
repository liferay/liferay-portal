                    description:
                        "If true, lists only blocked custom events, which are not collected; if false, leaves them out. Both are returned when omitted."
                    name: blocked
                    schema:
                        type: boolean
                -   in: query
                    description:
                        "Only include events of this type. Defaults to ALL."
                    example: ALL
                    name: eventType
                    schema:
                        enum: [ALL, CUSTOM, DEFAULT]
                        type: string
                -   in: query
                    description:
                        "If true, lists only hidden definitions; if false, only visible ones. Both are returned when omitted."
                    name: hidden
                    schema:
                        type: boolean
                -   in: query
                    description:
                        "Page number (starts at 1)."
                    name: page
                    schema:
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Page size, from 1 to 100. Larger values are rejected."
                    name: pageSize
                    schema:
                        maximum: 100
                        minimum: 1
                        type: integer
                -   in: query
                    description:
                        "Free text search across event name, display name, and description, ignoring case (name only when `blocked` is true). Empty or null returns all event definitions."
                    name: search
                    schema:
                        type: string
                -   in: query
                    description:
                        "Sort expression `column:asc|desc`. Defaults to `name:asc` when omitted. Sortable columns: displayName, name. Only one column is accepted."
                    example: name:asc
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/EventDefinition"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/EventDefinition"
                                type: array
            tags: ["EventDefinition"]
