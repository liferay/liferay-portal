assemble:
    -   from: batch
        into: batch
liferay-one-batch:
    name: Liferay One Batch
    oAuthApplicationHeadlessServer: liferay-one-batch-oahs
    type: batch
liferay-one-batch-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: Liferay One Batch OAuth Application Headless Server
    scopes:
        -   c_entitlementdefinition.everything
        -   c_entitlementdefinitionsku.everything
        -   c_environment.everything
        -   c_project.everything
        -   c_projectmembership.everything
        -   c_property.everything
        -   c_usagedefinition.everything
        -   c_usageevent.everything
        -   Liferay.Headless.Admin.List.Type.everything
        -   Liferay.Headless.Admin.Taxonomy.everything
        -   Liferay.Headless.Admin.User.everything
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Headless.Commerce.Admin.Catalog.everything
        -   Liferay.Headless.Commerce.Admin.Order.everything
        -   Liferay.Headless.Commerce.Admin.Pricing.everything
        -   Liferay.Object.Admin.REST.everything
        -   Liferay.Search.Experiences.REST.everything
    type: oAuthApplicationHeadlessServer