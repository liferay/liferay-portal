accessControl:
    allowedCIDRs:
        -   10.0.0.0/16
        -   203.0.113.0/24
    enabled: true
argocd:
    gateway:
        enabled: true
        hostname: argocd.liferay.render
clusterSecretStores:
    liferay-render-secret-store:
        spec:
            provider:
                azurekv:
                    vaultUrl: https://liferay-render.vault.azure.net
deploymentContext:
    deploymentName: liferay-render
gitops:
    repository:
        url: https://github.com/example/liferay-gitops.git
infrastructure:
    repoURL: oci://example-registry/liferay-helm-chart/liferay-azure-infrastructure
    targetRevision: 1.0.0
infrastructureProvider:
    repoURL: oci://example-registry/liferay-helm-chart/liferay-azure-infrastructure-provider
    targetRevision: 1.0.0
liferay:
    repoURL: oci://example-registry/liferay-helm-chart/liferay-azure
    targetRevision: 1.0.0
networkPolicy:
    apiServerSources:
        -   ipBlock:
                cidr: 10.0.0.0/16