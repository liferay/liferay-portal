release:
    name: my-release
    namespace: my-namespace
suite: LiferayInfrastructure
templates:
    -   templates/liferayinfrastructure.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.database.rootPasswordSecretName
                    value: my-release-db-root-password
        it: Derives the database root password secret name from the release
        set:
            enabled: true
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-release
            -   equal:
                    path: metadata.namespace
                    value: my-namespace
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: LiferayInfrastructure
        it: Names the LiferayInfrastructure after the release
        set:
            enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the LiferayInfrastructure when the chart is disabled
        set:
            enabled: false
    -   asserts:
            -   equal:
                    path: spec.commonTags.environment_id
                    value: env-123
            -   equal:
                    path: spec.commonTags.project_id
                    value: proj-456
        it: Propagates the environment and project identifiers into the common tags
        set:
            environmentId: env-123
            projectId: proj-456
    -   asserts:
            -   equal:
                    path: spec.backup.enabled
                    value: true
        it: Reflects an enabled backup configuration
        set:
            backup.enabled: true
    -   asserts:
            -   equal:
                    path: spec.backup.vaultTags.spend_area
                    value: storage
            -   equal:
                    path: spec.storage.tags.resource_type
                    value: backup
        it: Propagates the storage tags and backup vault tags into the spec
        set:
            backup.vaultTags.spend_area: storage
            storage.tags.resource_type: backup
    -   asserts:
            -   isEmpty:
                    path: spec.backup.vaultTags
            -   isEmpty:
                    path: spec.storage.tags
        it: Defaults the storage tags and backup vault tags to empty maps