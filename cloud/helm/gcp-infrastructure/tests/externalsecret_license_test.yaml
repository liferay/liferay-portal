suite: License ExternalSecret
templates:
    -   templates/externalsecret-license.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: liferay-licenses-my-license
            -   equal:
                    path: spec.data[0].remoteRef.key
                    value: liferay-licenses-my-license
            -   equal:
                    path: spec.data[0].remoteRef.property
                    value: license.xml
            -   equal:
                    path: spec.data[0].secretKey
                    value: rawLicense
            -   equal:
                    path: spec.secretStoreRef.name
                    value: my-store
            -   equal:
                    path: spec.target.name
                    value: liferay-license
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: ExternalSecret
        it: Creates a license ExternalSecret keyed under the licenses path
        set:
            enabled: true
            license.externalSecretName: my-license
            license.targetSecretName: liferay-license
            secretStoreName: my-store
    -   asserts:
            -   equal:
                    path: spec.target.name
                    value: liferay-license
        it: Defaults the target secret name to the secret the Liferay chart mounts
        set:
            enabled: true
            license.externalSecretName: my-license
            secretStoreName: my-store
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the license ExternalSecret when the infrastructure is disabled
        set:
            enabled: false
            license.externalSecretName: my-license
            secretStoreName: my-store
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the license ExternalSecret when the target secret name is missing
        set:
            enabled: true
            license.externalSecretName: my-license
            license.targetSecretName: ""
            secretStoreName: my-store
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: liferay-licenses-my-license
            -   equal:
                    path: spec.data[0].remoteRef.key
                    value: liferay-licenses-my-license
        it: Passes through an external secret name that already carries the prefix
        set:
            enabled: true
            license.externalSecretName: liferay-licenses-my-license
            secretStoreName: my-store
    -   asserts:
            -   equal:
                    path: spec.target.template.data["license.xml"]
                    value: "{{ .rawLicense | toString }}"
            -   equal:
                    path: spec.target.template.type
                    value: Opaque
        it: Rewrites the raw license into the key the Liferay chart reads
        set:
            enabled: true
            license.externalSecretName: my-license
            secretStoreName: my-store