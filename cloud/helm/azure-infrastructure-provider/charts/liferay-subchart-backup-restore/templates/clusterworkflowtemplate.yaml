{{- $azureCli := printf "%s:%s" .Values.images.azureCli.repository .Values.images.azureCli.tag -}}
{{- $helmKubectl := printf "%s:%s" .Values.images.helmKubectl.repository .Values.images.helmKubectl.tag -}}
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
    labels:
        component: backup-restore-platform
    name: backup-restore-cluster-workflow-template
spec:
    arguments:
        parameters:
            -   name: recovery-point-id
    entrypoint: main
    onExit: reset-restore-phase
    podGC:
        {{- .Values.argo.workflowSpec.podGC | toYaml | nindent 8 }}
    podMetadata:
        labels:
            azure.workload.identity/use: "true"
    serviceAccountName: backup-restore-service-account
    templates:
        -   inputs:
                parameters:
                    -   name: liferay-infrastructure-name
                    -   name: restore-phase
                    -   default: "null"
                        name: restore-point-in-time
                    -   name: target-active-data-plane
            name: apply-infrastructure
            outputs:
                parameters:
                    -   name: generation
                        valueFrom:
                            jsonPath: "{.metadata.generation}"
            resource:
                action: patch
                flags:
                    -   --field-manager=liferay-backup-restore
                manifest: |-
                    apiVersion: liferay.com/v1alpha1
                    kind: LiferayInfrastructure
                    metadata:
                        name: {{ "{{" }}inputs.parameters.liferay-infrastructure-name}}
                        namespace: {{ "{{" }}workflow.namespace}}
                    spec:
                        database:
                            restorePointInTime: {{ "{{" }}inputs.parameters.restore-point-in-time}}
                        restorePhase: {{ "{{" }}inputs.parameters.restore-phase}}
                        targetActiveDataPlane: {{ "{{" }}inputs.parameters.target-active-data-plane}}
                mergeStrategy: merge
        -   inputs:
                parameters:
                    -   name: liferay-infrastructure-name
                    -   name: restore-phase
                    -   default: "null"
                        name: restore-point-in-time
                    -   name: target-active-data-plane
            name: apply-wait-infrastructure
            steps:
                -   -   arguments:
                            parameters:
                                -   name: liferay-infrastructure-name
                                    value: "{{ "{{" }}inputs.parameters.liferay-infrastructure-name}}"
                                -   name: restore-phase
                                    value: "{{ "{{" }}inputs.parameters.restore-phase}}"
                                -   name: restore-point-in-time
                                    value: "{{ "{{" }}inputs.parameters.restore-point-in-time}}"
                                -   name: target-active-data-plane
                                    value: "{{ "{{" }}inputs.parameters.target-active-data-plane}}"
                        name: apply-infrastructure
                        template: apply-infrastructure
                -   -   arguments:
                            parameters:
                                -   name: expected-generation
                                    value: "{{ "{{" }}steps.apply-infrastructure.outputs.parameters.generation}}"
                        name: wait-for-infrastructure
                        template: wait-for-infrastructure
        -   inputs:
                parameters:
                    -   name: liferay-infrastructure-name
                    -   name: target-active-data-plane
            name: clean-up-infrastructure
            steps:
                -   -   arguments:
                            parameters:
                                -   name: liferay-infrastructure-name
                                    value: "{{ "{{" }}inputs.parameters.liferay-infrastructure-name}}"
                                -   name: restore-phase
                                    value: none
                                -   name: target-active-data-plane
                                    value: "{{ "{{" }}inputs.parameters.target-active-data-plane}}"
                        name: apply-wait-infrastructure
                        template: apply-wait-infrastructure
        -   activeDeadlineSeconds: {{ .Values.azureBackupService.restoreWaitTimeoutSeconds }}
            inputs:
                parameters:
                    -   name: storage-account-name
            name: delete-target-container
            retryStrategy:
                backoff:
                    duration: 30s
                    factor: 2
                    maxDuration: 20m
                limit: 5
                retryPolicy: OnFailure
            script:
                command: [sh]
                env:
                    -   name: AZURE_CONFIG_DIR
                        value: /tmp/azure
                    -   name: AZURE_EXTENSION_DIR
                        value: /tmp/azure-extensions
                image: "{{ $azureCli }}"
                resources:
                    {{- .Values.resources.default | toYaml | nindent 20 }}
                source: |-
                    {{- tpl (.Files.Get "scripts/delete-target-container.sh") . | nindent 20 }}
        -   name: get-current-infrastructure-state
            outputs:
                parameters:
                    -   name: backup-vault-name
                        valueFrom:
                            path: /tmp/backup-vault-name.txt
                    -   name: data-active
                        valueFrom:
                            path: /tmp/data-plane-active.txt
                    -   name: data-inactive
                        valueFrom:
                            path: /tmp/data-plane-inactive.txt
                    -   name: database-server-name-active
                        valueFrom:
                            path: /tmp/database-server-name-active.txt
                    -   name: liferay-infrastructure-name
                        valueFrom:
                            path: /tmp/liferay-infrastructure-name.txt
                    -   name: liferay-workload-name
                        valueFrom:
                            path: /tmp/liferay-workload-name.txt
                    -   name: resource-group-name
                        valueFrom:
                            path: /tmp/resource-group-name.txt
                    -   name: storage-account-id-active
                        valueFrom:
                            path: /tmp/storage-account-id-active.txt
            script:
                command: [sh]
                image: "{{ $helmKubectl }}"
                resources:
                    {{- .Values.resources.default | toYaml | nindent 20 }}
                source: |-
                    {{- tpl (.Files.Get "scripts/get-current-infrastructure-state.sh") . | nindent 20 }}
        -   activeDeadlineSeconds: {{ .Values.liferayInfrastructure.waitTimeoutSeconds }}
            inputs:
                parameters:
                    -   name: data-inactive
            name: get-inactive-storage-account
            outputs:
                parameters:
                    -   name: storage-account-id
                        valueFrom:
                            path: /tmp/storage-account-id-inactive.txt
                    -   name: storage-account-location
                        valueFrom:
                            path: /tmp/storage-account-location.txt
                    -   name: storage-account-name
                        valueFrom:
                            path: /tmp/storage-account-name-inactive.txt
            script:
                command: [sh]
                image: "{{ $helmKubectl }}"
                resources:
                    {{- .Values.resources.default | toYaml | nindent 20 }}
                source: |-
                    {{- tpl (.Files.Get "scripts/get-inactive-storage-account.sh") . | nindent 20 }}
        -   activeDeadlineSeconds: {{ .Values.azureBackupService.restoreWaitTimeoutSeconds }}
            inputs:
                parameters:
                    -   name: backup-vault-name
                    -   name: database-server-name
                    -   name: resource-group-name
                    -   name: storage-account-id
            name: get-recovery-point-time
            outputs:
                parameters:
                    -   name: backup-instance-name
                        valueFrom:
                            path: /tmp/backup-instance-name.txt
                    -   name: recovery-point-time
                        valueFrom:
                            path: /tmp/recovery-point-time.txt
            script:
                command: [sh]
                env:
                    -   name: AZURE_CONFIG_DIR
                        value: /tmp/azure
                    -   name: AZURE_EXTENSION_DIR
                        value: /tmp/azure-extensions
                image: "{{ $azureCli }}"
                resources:
                    {{- .Values.resources.default | toYaml | nindent 20 }}
                source: |-
                    {{- tpl (.Files.Get "scripts/get-recovery-point-time.sh") . | nindent 20 }}
        -   container:
                args:
                    -   rollout
                    -   restart
                    -   statefulset
                    -   "{{ "{{" }}inputs.parameters.liferay-workload-name}}"
                command: [kubectl]
                image: "{{ $helmKubectl }}"
                resources:
                    {{- .Values.resources.default | toYaml | nindent 20 }}
            inputs:
                parameters:
                    -   name: liferay-workload-name
            name: kubectl-rollout-restart
        -   container:
                args:
                    -   rollout
                    -   status
                    -   statefulset
                    -   "{{ "{{" }}inputs.parameters.liferay-workload-name}}"
                    -   --timeout={{ .Values.liferayWorkload.rolloutTimeout }}
                command: [kubectl]
                image: "{{ $helmKubectl }}"
                resources:
                    {{- .Values.resources.default | toYaml | nindent 20 }}
            inputs:
                parameters:
                    -   name: liferay-workload-name
            name: kubectl-rollout-status
        -   dag:
                tasks:
                    -   arguments:
                            parameters:
                                -   name: liferay-infrastructure-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.liferay-infrastructure-name}}"
                                -   name: target-active-data-plane
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.data-inactive}}"
                        depends: restart-liferay
                        name: clean-up-infrastructure
                        template: clean-up-infrastructure
                    -   name: get-current-infrastructure-state
                        template: get-current-infrastructure-state
                    -   arguments:
                            parameters:
                                -   name: backup-vault-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.backup-vault-name}}"
                                -   name: database-server-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.database-server-name-active}}"
                                -   name: resource-group-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.resource-group-name}}"
                                -   name: storage-account-id
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.storage-account-id-active}}"
                        depends: get-current-infrastructure-state
                        name: get-recovery-point-time
                        template: get-recovery-point-time
                    -   arguments:
                            parameters:
                                -   name: liferay-infrastructure-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.liferay-infrastructure-name}}"
                                -   name: restore-phase
                                    value: promoting
                                -   name: target-active-data-plane
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.data-inactive}}"
                        depends: restore-document-library && wait-for-database
                        name: promote-inactive-data-plane
                        template: apply-wait-infrastructure
                    -   arguments:
                            parameters:
                                -   name: liferay-infrastructure-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.liferay-infrastructure-name}}"
                                -   name: restore-phase
                                    value: provisioning
                                -   name: restore-point-in-time
                                    value: "{{ "{{" }}tasks.get-recovery-point-time.outputs.parameters.recovery-point-time}}"
                                -   name: target-active-data-plane
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.data-inactive}}"
                        depends: get-recovery-point-time
                        name: provision-inactive-data-plane
                        template: apply-infrastructure
                    -   arguments:
                            parameters:
                                -   name: liferay-workload-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.liferay-workload-name}}"
                        depends: promote-inactive-data-plane
                        name: restart-liferay
                        template: restart-liferay
                    -   arguments:
                            parameters:
                                -   name: backup-instance-name
                                    value: "{{ "{{" }}tasks.get-recovery-point-time.outputs.parameters.backup-instance-name}}"
                                -   name: backup-vault-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.backup-vault-name}}"
                                -   name: data-inactive
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.data-inactive}}"
                                -   name: resource-group-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.resource-group-name}}"
                        depends: provision-inactive-data-plane
                        name: restore-document-library
                        template: restore-document-library
                    -   arguments:
                            parameters:
                                -   name: liferay-infrastructure-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.liferay-infrastructure-name}}"
                                -   name: target-active-data-plane
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.data-active}}"
                        depends: "(!provision-inactive-data-plane.Omitted && !provision-inactive-data-plane.Skipped || !restore-document-library.Omitted && !restore-document-library.Skipped || !wait-for-database.Omitted && !wait-for-database.Skipped) && !promote-inactive-data-plane.Succeeded"
                        name: roll-back-infrastructure
                        template: clean-up-infrastructure
                    -   arguments:
                            parameters:
                                -   name: liferay-infrastructure-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.liferay-infrastructure-name}}"
                                -   name: liferay-workload-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.liferay-workload-name}}"
                                -   name: target-active-data-plane
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.data-active}}"
                        depends: "promote-inactive-data-plane.Succeeded && !restart-liferay.Succeeded"
                        name: roll-back-restart
                        template: roll-back-restart
                    -   arguments:
                            parameters:
                                -   name: backup-vault-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.backup-vault-name}}"
                                -   name: data-inactive
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.data-inactive}}"
                                -   name: resource-group-name
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.resource-group-name}}"
                                -   name: storage-account-id-demoted
                                    value: "{{ "{{" }}tasks.get-current-infrastructure-state.outputs.parameters.storage-account-id-active}}"
                        depends: promote-inactive-data-plane
                        name: set-data-plane-protection
                        template: set-data-plane-protection
                    -   arguments:
                            parameters:
                                -   name: expected-generation
                                    value: "{{ "{{" }}tasks.provision-inactive-data-plane.outputs.parameters.generation}}"
                        depends: provision-inactive-data-plane
                        name: wait-for-database
                        template: wait-for-infrastructure
            name: main
        -   name: reset-restore-phase
            script:
                command: [sh]
                image: "{{ $helmKubectl }}"
                resources:
                    {{- .Values.resources.default | toYaml | nindent 20 }}
                source: |-
                    {{- tpl (.Files.Get "scripts/reset-restore-phase.sh") . | nindent 20 }}
        -   inputs:
                parameters:
                    -   name: liferay-workload-name
            name: restart-liferay
            steps:
                -   -   arguments:
                            parameters:
                                -   name: liferay-workload-name
                                    value: "{{ "{{" }}inputs.parameters.liferay-workload-name}}"
                        name: kubectl-rollout-restart
                        template: kubectl-rollout-restart
                -   -   arguments:
                            parameters:
                                -   name: liferay-workload-name
                                    value: "{{ "{{" }}inputs.parameters.liferay-workload-name}}"
                        name: kubectl-rollout-status
                        template: kubectl-rollout-status
        -   inputs:
                parameters:
                    -   name: backup-instance-name
                    -   name: backup-vault-name
                    -   name: data-inactive
                    -   name: resource-group-name
            name: restore-document-library
            steps:
                -   -   arguments:
                            parameters:
                                -   name: data-inactive
                                    value: "{{ "{{" }}inputs.parameters.data-inactive}}"
                        name: get-inactive-storage-account
                        template: get-inactive-storage-account
                -   -   arguments:
                            parameters:
                                -   name: storage-account-name
                                    value: "{{ "{{" }}steps.get-inactive-storage-account.outputs.parameters.storage-account-name}}"
                        name: delete-target-container
                        template: delete-target-container
                -   -   arguments:
                            parameters:
                                -   name: backup-instance-name
                                    value: "{{ "{{" }}inputs.parameters.backup-instance-name}}"
                                -   name: backup-vault-name
                                    value: "{{ "{{" }}inputs.parameters.backup-vault-name}}"
                                -   name: resource-group-name
                                    value: "{{ "{{" }}inputs.parameters.resource-group-name}}"
                                -   name: storage-account-id
                                    value: "{{ "{{" }}steps.get-inactive-storage-account.outputs.parameters.storage-account-id}}"
                                -   name: storage-account-location
                                    value: "{{ "{{" }}steps.get-inactive-storage-account.outputs.parameters.storage-account-location}}"
                        name: restore-document-library-blob
                        template: restore-document-library-blob
        -   activeDeadlineSeconds: {{ .Values.azureBackupService.restoreWaitTimeoutSeconds }}
            inputs:
                parameters:
                    -   name: backup-instance-name
                    -   name: backup-vault-name
                    -   name: resource-group-name
                    -   name: storage-account-id
                    -   name: storage-account-location
            name: restore-document-library-blob
            script:
                command: [sh]
                env:
                    -   name: AZURE_CONFIG_DIR
                        value: /tmp/azure
                    -   name: AZURE_EXTENSION_DIR
                        value: /tmp/azure-extensions
                image: "{{ $azureCli }}"
                resources:
                    {{- .Values.resources.default | toYaml | nindent 20 }}
                source: |-
                    {{- tpl (.Files.Get "scripts/restore-document-library-blob.sh") . | nindent 20 }}
        -   inputs:
                parameters:
                    -   name: liferay-infrastructure-name
                    -   name: liferay-workload-name
                    -   name: target-active-data-plane
            name: roll-back-restart
            steps:
                -   -   arguments:
                            parameters:
                                -   name: liferay-infrastructure-name
                                    value: "{{ "{{" }}inputs.parameters.liferay-infrastructure-name}}"
                                -   name: restore-phase
                                    value: promoting
                                -   name: target-active-data-plane
                                    value: "{{ "{{" }}inputs.parameters.target-active-data-plane}}"
                        name: apply-wait-infrastructure
                        template: apply-wait-infrastructure
                -   -   arguments:
                            parameters:
                                -   name: liferay-workload-name
                                    value: "{{ "{{" }}inputs.parameters.liferay-workload-name}}"
                        name: restart-liferay
                        template: restart-liferay
                -   -   arguments:
                            parameters:
                                -   name: liferay-infrastructure-name
                                    value: "{{ "{{" }}inputs.parameters.liferay-infrastructure-name}}"
                                -   name: target-active-data-plane
                                    value: "{{ "{{" }}inputs.parameters.target-active-data-plane}}"
                        name: clean-up-infrastructure
                        template: clean-up-infrastructure
        -   inputs:
                parameters:
                    -   name: backup-vault-name
                    -   name: data-inactive
                    -   name: resource-group-name
                    -   name: storage-account-id-demoted
            name: set-data-plane-protection
            steps:
                -   -   arguments:
                            parameters:
                                -   name: data-inactive
                                    value: "{{ "{{" }}inputs.parameters.data-inactive}}"
                        name: get-inactive-storage-account
                        template: get-inactive-storage-account
                -   -   arguments:
                            parameters:
                                -   name: backup-vault-name
                                    value: "{{ "{{" }}inputs.parameters.backup-vault-name}}"
                                -   name: resource-group-name
                                    value: "{{ "{{" }}inputs.parameters.resource-group-name}}"
                                -   name: storage-account-id-demoted
                                    value: "{{ "{{" }}inputs.parameters.storage-account-id-demoted}}"
                                -   name: storage-account-id-promoted
                                    value: "{{ "{{" }}steps.get-inactive-storage-account.outputs.parameters.storage-account-id}}"
                        name: set-data-plane-protection-backup-instances
                        template: set-data-plane-protection-backup-instances
        -   activeDeadlineSeconds: {{ .Values.azureBackupService.protectionWaitTimeoutSeconds }}
            inputs:
                parameters:
                    -   name: backup-vault-name
                    -   name: resource-group-name
                    -   name: storage-account-id-demoted
                    -   name: storage-account-id-promoted
            name: set-data-plane-protection-backup-instances
            script:
                command: [sh]
                env:
                    -   name: AZURE_CONFIG_DIR
                        value: /tmp/azure
                    -   name: AZURE_EXTENSION_DIR
                        value: /tmp/azure-extensions
                image: "{{ $azureCli }}"
                resources:
                    {{- .Values.resources.default | toYaml | nindent 20 }}
                source: |-
                    {{- tpl (.Files.Get "scripts/set-data-plane-protection-backup-instances.sh") . | nindent 20 }}
        -   activeDeadlineSeconds: {{ .Values.liferayInfrastructure.waitTimeoutSeconds }}
            inputs:
                parameters:
                    -   name: expected-generation
            name: wait-for-infrastructure
            script:
                command: [sh]
                image: "{{ $helmKubectl }}"
                resources:
                    {{- .Values.resources.default | toYaml | nindent 20 }}
                source: |-
                    {{- tpl (.Files.Get "scripts/wait-for-infrastructure.sh") . | nindent 20 }}
    ttlStrategy:
        {{- .Values.argo.workflowSpec.ttlStrategy | toYaml | nindent 8 }}