release:
    name: my-release
    namespace: crossplane-system
suite: Backup Restore ClusterWorkflowTemplate
templates:
    -   charts/liferay-subchart-backup-restore/templates/clusterworkflowtemplate.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.templates[0].resource.action
                    value: patch
            -   contains:
                    content: --field-manager=liferay-backup-restore
                    path: spec.templates[0].resource.flags
            -   matchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: "apiVersion: liferay.com/v1alpha1"
            -   notMatchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: azure.liferay.com
        it: Binds every composite patch to the field manager ArgoCD tolerates
    -   asserts:
            -   equal:
                    path: spec.podMetadata.labels["azure.workload.identity/use"]
                    value: "true"
        it: Labels every workflow pod so the workload identity webhook injects a token
    -   asserts:
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: az extension add \\\s+--name dataprotection \\\s+--version 1\.11\.3
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: az login \\\s+--federated-token "\$\(cat "\$\{AZURE_FEDERATED_TOKEN_FILE\}"\)"
            -   contains:
                    content:
                        name: AZURE_CONFIG_DIR
                        value: /tmp/azure
                    path: spec.templates[3].script.env
            -   contains:
                    content:
                        name: AZURE_EXTENSION_DIR
                        value: /tmp/azure-extensions
                    path: spec.templates[3].script.env
            -   equal:
                    path: spec.templates[3].script.image
                    value: mcr.microsoft.com/azure-cli:2.89.1
        it: Pins the dataprotection extension and logs in before any az command
    -   asserts:
            -   equal:
                    path: spec.templates[13].name
                    value: restore-document-library-blob
            -   matchRegex:
                    path: spec.templates[13].script.source
                    pattern: --target-resource-id
            -   notMatchRegex:
                    path: spec.templates[13].script.source
                    pattern: --backup-instance-id
            -   matchRegex:
                    path: spec.templates[13].script.source
                    pattern: az dataprotection job show
            -   matchRegex:
                    path: spec.templates[13].script.source
                    pattern: --query properties.status
        it: Restores to the alternate location and gates on the job status
    -   asserts:
            -   equal:
                    path: spec.templates[6].name
                    value: get-recovery-point-time
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: --query properties.recoveryPointTime
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: --query backup.earliestRestoreDate
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: "\\[\\?properties.dataSourceInfo.resourceID=="
        it: Reads the restore point from the recovery point and guards it against the window
    -   asserts:
            -   equal:
                    path: spec.arguments.parameters[0].name
                    value: recovery-point-id
            -   equal:
                    path: spec.entrypoint
                    value: main
            -   equal:
                    path: spec.onExit
                    value: reset-restore-phase
            -   equal:
                    path: spec.serviceAccountName
                    value: backup-restore-service-account
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: \{\{workflow.parameters.recovery-point-id\}\}
        it: Reads the recovery point identifier LCD-53113 declares but does not forward
    -   asserts:
            -   equal:
                    path: spec.templates[10].name
                    value: reset-restore-phase
            -   matchRegex:
                    path: spec.templates[10].script.source
                    pattern: --field-manager=liferay-backup-restore
            -   matchRegex:
                    path: spec.templates[10].script.source
                    pattern: "\"restorePhase\":\"none\""
        it: Resets the restore phase under the same field manager on exit
    -   asserts:
            -   equal:
                    path: spec.templates[3].activeDeadlineSeconds
                    value: 7200
            -   equal:
                    path: spec.templates[6].activeDeadlineSeconds
                    value: 7200
            -   equal:
                    path: spec.templates[13].activeDeadlineSeconds
                    value: 7200
            -   equal:
                    path: spec.templates[15].activeDeadlineSeconds
                    value: 3600
        it: Sets every step timeout well above the measured restore duration
    -   asserts:
            -   equal:
                    path: spec.templates[9].name
                    value: main
            -   equal:
                    path: spec.templates[9].dag.tasks[4].name
                    value: provision-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[4].template
                    value: apply-infrastructure
            -   equal:
                    path: spec.templates[9].dag.tasks[6].name
                    value: restore-document-library
            -   equal:
                    path: spec.templates[9].dag.tasks[6].depends
                    value: provision-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[9].name
                    value: wait-for-database
            -   equal:
                    path: spec.templates[9].dag.tasks[9].depends
                    value: provision-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[3].name
                    value: promote-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[3].depends
                    value: restore-document-library && wait-for-database
        it: Runs the database and document library restores as independent legs
    -   asserts:
            -   equal:
                    path: spec.templates[5].name
                    value: get-inactive-storage-account
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: conditions\[\?\(@.type=='Ready'\)\]
            -   equal:
                    path: spec.templates[3].retryStrategy.retryPolicy
                    value: OnFailure
            -   equal:
                    path: spec.templates[3].retryStrategy.limit
                    value: 5
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: ":lower:"
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: "exists}\" = \"false\""
            -   equal:
                    path: spec.templates[3].retryStrategy.backoff.maxDuration
                    value: 20m
        it: Waits only for the storage account and retries past role assignment propagation