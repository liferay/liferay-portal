release:
    name: my-release
    namespace: crossplane-system
set:
    database:
        engine: postgresql
    liferay-subchart-backup-restore:
        database:
            engine: postgresql
suite: Backup Restore ClusterWorkflowTemplate
templates:
    -   charts/liferay-subchart-backup-restore/templates/clusterworkflowtemplate.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.templates[0].resource.action
                    value: patch
            -   contains:
                    content: --field-manager=liferay-backup-restore
                    path: spec.templates[0].resource.flags
            -   matchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: "apiVersion: liferay.com/v1alpha1"
            -   notMatchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: azure.liferay.com
        it: Binds every composite patch to the field manager ArgoCD tolerates
    -   asserts:
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: for candidate_backup_instance_name in \$\( \\\s+az dataprotection backup-instance list \\\s+--output tsv \\\s+--query "\[\].name"
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: was not found in the backup vault
            -   notMatchRegex:
                    path: spec.templates[5].script.source
                    pattern: which is the restore target
            -   notMatchRegex:
                    path: spec.templates[5].script.source
                    pattern: storage-account-id
        it: Finds the recovery point in whichever backup instance holds it, even one whose account is gone
    -   asserts:
            -   contains:
                    content:
                        name: restore-generation
                        valueFrom:
                            path: /tmp/restore-generation.txt
                    path: spec.templates[3].outputs.parameters
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: (?s)restore_generation=[$][(] .*?echo .[{][{]workflow[.]uid[}][}]..*?[|] jq --raw-input --raw-output .[.][[]0:6[]].[)]
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: is already retained on the [$][{]data_plane_inactive[}] data plane
            -   contains:
                    content:
                        default: "null"
                        name: restore-generation
                    path: spec.templates[0].inputs.parameters
            -   matchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: "restoreGeneration: [{][{]inputs[.]parameters[.]restore-generation[}][}]"
            -   contains:
                    content:
                        name: restore-generation
                        value: "{{tasks.get-current-infrastructure-state.outputs.parameters.restore-generation}}"
                    path: spec.templates[9].dag.tasks[5].arguments.parameters
        it: Gives every restore its own data plane generation
    -   asserts:
            -   equal:
                    path: spec.podMetadata.annotations["karpenter.sh/do-not-disrupt"]
                    value: "true"
        it: Keeps node consolidation from evicting a restore that is still running
    -   asserts:
            -   equal:
                    path: spec.templates[6].name
                    value: get-retained-data-plane
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: "[(][[]7, [(][[]35, [(][.]spec[.]backup[.]retentionDays // 30[)][]] [|] min[)][]] [|] max[)] as [$]retention_days"
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: now [+] [(][$]retention_days [*] 86400[)][)] [|] floor [|] todate
            -   notMatchRegex:
                    path: spec.templates[6].script.source
                    pattern: retainedDatabaseServerDays
            -   notMatchRegex:
                    path: spec.templates[3].script.source
                    pattern: retention_days
            -   contains:
                    content:
                        name: retained-data-plane
                        valueFrom:
                            path: /tmp/retained-data-plane.txt
                    path: spec.templates[6].outputs.parameters
            -   equal:
                    path: spec.templates[9].dag.tasks[3].depends
                    value: restore-document-library && wait-for-database
            -   equal:
                    path: spec.templates[9].dag.tasks[4].depends
                    value: get-retained-data-plane
        it: Keeps the demoted data plane for the whole backup retention counted from its promotion
    -   asserts:
            -   equal:
                    path: spec.podMetadata.labels["azure.workload.identity/use"]
                    value: "true"
        it: Labels every workflow pod so the workload identity webhook injects a token
    -   asserts:
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: "[(][(][$]retained_data_planes[[][.]metadata[.]labels[.]retainedDataPlane[]] // .1970-01-01T00:00:00Z.[)] [|] fromdateiso8601[)] > [(]now [+] 3600[)]"
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: "server: [.]metadata[.]annotations[[].crossplane[.]io/external-name.[]]"
            -   notMatchRegex:
                    path: spec.templates[3].script.source
                    pattern: retainedDatabaseServer=true
        it: Leaves a retained data plane out of the restore sources once its release is within the hour
    -   asserts:
            -   contains:
                    content:
                        default: "{}"
                        name: retained-data-planes
                    path: spec.templates[0].inputs.parameters
            -   matchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: "retainedDataPlanes: [{][{]inputs[.]parameters[.]retained-data-planes[}][}]"
            -   notMatchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: retainedBackupInstances|retainedDatabaseServers
            -   contains:
                    content:
                        name: data-plane-key
                        value: "{{tasks.get-current-infrastructure-state.outputs.parameters.data-plane-key-active}}"
                    path: spec.templates[9].dag.tasks[3].arguments.parameters
            -   contains:
                    content:
                        name: retained-data-planes
                        value: "{{tasks.get-retained-data-plane.outputs.parameters.retained-data-plane}}"
                    path: spec.templates[9].dag.tasks[4].arguments.parameters
            -   contains:
                    content:
                        name: retained-data-planes
                        value: "{{tasks.get-current-infrastructure-state.outputs.parameters.retained-data-plane-release}}"
                    path: spec.templates[9].dag.tasks[8].arguments.parameters
            -   contains:
                    content:
                        name: retained-data-planes
                        value: "{{tasks.get-current-infrastructure-state.outputs.parameters.retained-data-plane-release}}"
                    path: spec.templates[9].dag.tasks[9].arguments.parameters
            -   notContains:
                    any: true
                    content:
                        name: retained-data-planes
                    path: spec.templates[9].dag.tasks[0].arguments.parameters
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: "[{][(][$]data_plane_key[)]: null[}]"
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: jsonpath="[{][.]items[[]0[]][.]metadata[.]labels[.]dataPlaneKey[}]"
        it: Marks the demoted data plane retained in the promoting patch and releases it on every roll back
    -   asserts:
            -   contains:
                    content:
                        name: database-candidates
                        valueFrom:
                            path: /tmp/database-candidates.txt
                    path: spec.templates[3].outputs.parameters
            -   contains:
                    content:
                        name: database-candidates
                    path: spec.templates[5].inputs.parameters
            -   contains:
                    content:
                        name: restore-source-data-plane
                        valueFrom:
                            path: /tmp/restore-source-data-plane.txt
                    path: spec.templates[5].outputs.parameters
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: for database_candidate in [$][(]echo '[{][{]inputs[.]parameters[.]database-candidates[}][}]' [|] jq --compact-output
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: elif [[][[] "[$][{]earliest_restore_date:0:19[}]" > "[$][{]recovery_point_time:0:19[}]" []][]]
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: (?s)elif [[][[] "[$][{]earliest_restore_date[}]" > "[$][{]restore_source_earliest_restore_date[}]" []][]].*?restore_source_data_plane=.*?jq --raw-output ".key"
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: (?s)function main [{].*?_find_recovery_point.*?_pick_restore_source "[$][(]cat /tmp/recovery-point-time[.]txt[)]".*?function _find_recovery_point [{].*?function _pick_restore_source [{]
            -   notMatchRegex:
                    path: spec.templates[5].script.source
                    pattern: sort [|]
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: No database server holds the recovery point time
            -   notMatchRegex:
                    path: spec.templates[5].script.source
                    pattern: server-id|server_id
            -   contains:
                    content:
                        default: ""
                        name: restore-source-data-plane
                    path: spec.templates[0].inputs.parameters
            -   matchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: "database:\\s+restore: [{][{]=inputs[.]parameters\\['restore-point-in-time'\\] == '' [?] 'null' : toJson[(][{]'pointInTime': [{]'sourceDataPlane': inputs[.]parameters\\['restore-source-data-plane'\\], 'time': inputs[.]parameters\\['restore-point-in-time'\\][}] [}][)][}][}]"
            -   contains:
                    content:
                        name: restore-source-data-plane
                        value: "{{tasks.get-recovery-point-time.outputs.parameters.restore-source-data-plane}}"
                    path: spec.templates[9].dag.tasks[5].arguments.parameters
        it: Picks the restore source as the latest data plane that can reach the recovery point
    -   asserts:
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: az extension add \\\s+--name dataprotection \\\s+--version 1\.11\.3
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: az login \\\s+--federated-token "\$\(cat "\$\{AZURE_FEDERATED_TOKEN_FILE\}"\)"
            -   contains:
                    content:
                        name: AZURE_CONFIG_DIR
                        value: /tmp/azure
                    path: spec.templates[5].script.env
            -   contains:
                    content:
                        name: AZURE_EXTENSION_DIR
                        value: /tmp/azure-extensions
                    path: spec.templates[5].script.env
            -   equal:
                    path: spec.templates[5].script.image
                    value: mcr.microsoft.com/azure-cli:2.89.1
        it: Pins the dataprotection extension and logs in before any az command
    -   asserts:
            -   equal:
                    path: spec.arguments.parameters[0].name
                    value: recovery-point-id
            -   equal:
                    path: spec.entrypoint
                    value: main
            -   equal:
                    path: spec.onExit
                    value: reset-restore-phase
            -   equal:
                    path: spec.serviceAccountName
                    value: backup-restore-service-account
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: \{\{workflow.parameters.recovery-point-id\}\}
        it: Reads the recovery point identifier LCD-53113 declares but does not forward
    -   asserts:
            -   equal:
                    path: spec.templates[5].name
                    value: get-recovery-point-time
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: --query properties.recoveryPointTime
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: --query backup[.]earliestRestoreDate
        it: Reads the restore point from the recovery point and guards it against the window
    -   asserts:
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: --selector "dataPlane=\$\{data_plane_inactive\}"
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: still holds a database server that is being released
        it: Refuses a restore while the inactive plane still holds a managed resource
    -   asserts:
            -   equal:
                    path: spec.templates[10].name
                    value: release-retained-data-planes
            -   equal:
                    path: spec.templates[10].script.image
                    value: dtzar/helm-kubectl:4.1.1
            -   matchRegex:
                    path: spec.templates[10].script.source
                    pattern: restore_phase}" != "none"
            -   matchRegex:
                    path: spec.templates[10].script.source
                    pattern: "[(][.]spec[.]retainedDataPlanes // [{][}][)] [|] with_entries[(]select[(][.]value [|] fromdateiso8601 < now[)][)] [|] with_entries[(][.]value = null[)]"
            -   matchRegex:
                    path: spec.templates[10].script.source
                    pattern: --field-manager=liferay-backup-restore
            -   matchRegex:
                    path: spec.templates[10].script.source
                    pattern: retainedDataPlanes.*expired_data_planes}}}
        it: Releases retained data planes only after their deadline under the restore field manager
    -   asserts:
            -   equal:
                    path: spec.templates[11].name
                    value: reset-restore-phase
            -   matchRegex:
                    path: spec.templates[11].script.source
                    pattern: --field-manager=liferay-backup-restore
            -   matchRegex:
                    path: spec.templates[11].script.source
                    pattern: "\"restorePhase\":\"none\""
        it: Resets the restore phase under the same field manager on exit
    -   asserts:
            -   equal:
                    path: spec.templates[14].name
                    value: restore-document-library-blob
            -   matchRegex:
                    path: spec.templates[14].script.source
                    pattern: --target-resource-id
            -   notMatchRegex:
                    path: spec.templates[14].script.source
                    pattern: --backup-instance-id
            -   matchRegex:
                    path: spec.templates[14].script.source
                    pattern: az dataprotection job show
            -   matchRegex:
                    path: spec.templates[14].script.source
                    pattern: --query properties.status
        it: Restores to the alternate location and gates on the job status
    -   asserts:
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: any[(]contains[(]"ScopeLocked"[)][)]
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: cannot be deleted while Azure Backup locks it[.] Suspend backups on the backup instance that protects it with az dataprotection backup-instance suspend-backup, then retry the restore[.]
            -   equal:
                    path: spec.templates[18].retryStrategy
                    value:
                        backoff:
                            duration: 30s
                            factor: 2
                            maxDuration: 20m
                        limit: 5
                        retryPolicy: OnFailure
        it: Retries suspending backups and names the fix for a demoted account Azure Backup still locks
    -   asserts:
            -   equal:
                    path: spec.templates[9].name
                    value: main
            -   equal:
                    path: spec.templates[9].dag.tasks[5].name
                    value: provision-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[5].template
                    value: apply-infrastructure
            -   equal:
                    path: spec.templates[9].dag.tasks[7].name
                    value: restore-document-library
            -   equal:
                    path: spec.templates[9].dag.tasks[7].depends
                    value: provision-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[12].name
                    value: wait-for-database
            -   equal:
                    path: spec.templates[9].dag.tasks[12].depends
                    value: provision-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[3].name
                    value: get-retained-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[3].depends
                    value: restore-document-library && wait-for-database
        it: Runs the database and document library restores as independent legs
    -   asserts:
            -   equal:
                    path: spec.templates[5].activeDeadlineSeconds
                    value: 7200
            -   equal:
                    path: spec.templates[14].activeDeadlineSeconds
                    value: 7200
            -   equal:
                    path: spec.templates[18].activeDeadlineSeconds
                    value: 600
            -   equal:
                    path: spec.templates[19].activeDeadlineSeconds
                    value: 3600
        it: Sets every step timeout well above the measured restore duration
    -   asserts:
            -   equal:
                    path: spec.templates[9].dag.tasks[10].name
                    value: set-data-plane-protection
            -   equal:
                    path: spec.templates[9].dag.tasks[10].depends
                    value: promote-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[11].name
                    value: suspend-demoted-backups
            -   equal:
                    path: spec.templates[9].dag.tasks[11].depends
                    value: restart-liferay
            -   equal:
                    path: spec.templates[9].dag.tasks[0].depends
                    value: suspend-demoted-backups
            -   equal:
                    path: spec.templates[17].activeDeadlineSeconds
                    value: 600
            -   matchRegex:
                    path: spec.templates[17].script.source
                    pattern: _wait_for_protection_state "[$]{promoted_instance_name}" ProtectionConfigured
            -   notMatchRegex:
                    path: spec.templates[17].script.source
                    pattern: suspend-backup
            -   notMatchRegex:
                    path: spec.templates[17].script.source
                    pattern: resume-protection
            -   matchRegex:
                    path: spec.templates[17].script.source
                    pattern: (?s)function main \{.*?function _wait_for_protection_state \{
            -   equal:
                    path: spec.templates[18].name
                    value: suspend-demoted-backups
            -   matchRegex:
                    path: spec.templates[18].script.source
                    pattern: (?s)backup-instance suspend-backup.*?--no-wait
            -   matchRegex:
                    path: spec.templates[18].script.source
                    pattern: "state}\" == \"BackupsSuspended\""
            -   matchRegex:
                    path: spec.templates[18].script.source
                    pattern: No backup instance protected the demoted data plane, so no backups were suspended
            -   notMatchRegex:
                    path: spec.templates[18].script.source
                    pattern: backup-instance delete
        it: Suspends backups on the demoted plane only once Liferay has restarted and waits for the promoted one
    -   asserts:
            -   equal:
                    path: spec.templates[4].name
                    value: get-inactive-storage-account
            -   matchRegex:
                    path: spec.templates[4].script.source
                    pattern: conditions\[\?\(@.type=='Ready'\)\]
            -   equal:
                    path: spec.templates[13].steps[1][0].name
                    value: restore-document-library-blob
            -   lengthEqual:
                    count: 2
                    path: spec.templates[13].steps
            -   matchRegex:
                    path: spec.templates[14].script.source
                    pattern: (?s)while ! az dataprotection backup-instance restore trigger.*?--no-wait
            -   matchRegex:
                    path: spec.templates[14].script.source
                    pattern: was not accepted yet while the vault role assignment propagates
            -   notMatchRegex:
                    path: spec.templates[14].script.source
                    pattern: validate-for-restore
        it: Waits only for the storage account and for the vault role on it before restoring into the fresh account