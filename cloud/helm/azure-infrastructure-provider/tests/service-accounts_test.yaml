release:
    name: my-release
    namespace: crossplane-system
set:
    deploymentContext:
        crossplaneDataClientId: 11111111-1111-1111-1111-111111111111
        crossplaneIamClientId: 22222222-2222-2222-2222-222222222222
suite: Service Accounts
templates:
    -   templates/service-accounts.yaml
tests:
    -   asserts:
            -   documentIndex: 0
                equal:
                    path: metadata.namespace
                    value: custom-system
            -   documentIndex: 1
                equal:
                    path: metadata.namespace
                    value: custom-system
        it: Follows the Crossplane namespace override
        set:
            crossplaneNamespace: custom-system
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   documentIndex: 0
                equal:
                    path: metadata.annotations["azure.workload.identity/client-id"]
                    value: 11111111-1111-1111-1111-111111111111
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: crossplane-data
            -   documentIndex: 0
                equal:
                    path: metadata.namespace
                    value: crossplane-system
            -   documentIndex: 1
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   documentIndex: 1
                equal:
                    path: metadata.annotations["azure.workload.identity/client-id"]
                    value: 22222222-2222-2222-2222-222222222222
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: crossplane-iam
            -   documentIndex: 1
                equal:
                    path: metadata.namespace
                    value: crossplane-system
        it: Renders the Crossplane data and IAM service accounts bound to their workload identities before the providers start