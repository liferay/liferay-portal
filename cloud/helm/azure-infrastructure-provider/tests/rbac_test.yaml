release:
    name: my-release
    namespace: crossplane-system
suite: RBAC
templates:
    -   templates/rbac.yaml
tests:
    -   asserts:
            -   documentIndex: 1
                equal:
                    path: subjects[0].namespace
                    value: custom-system
        it: Follows the Crossplane namespace override
        set:
            crossplaneNamespace: custom-system
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                isKind:
                    of: ClusterRole
            -   documentIndex: 0
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   documentIndex: 0
                equal:
                    path: metadata.labels["rbac.crossplane.io/aggregate-to-crossplane"]
                    value: "true"
            -   documentIndex: 0
                equal:
                    path: rules
                    value:
                        -   apiGroups: [""]
                            resources: ["secrets", "serviceaccounts"]
                            verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
                        -   apiGroups: ["elasticsearch.k8s.elastic.co"]
                            resources: ["elasticsearches"]
                            verbs: ["get", "list", "watch"]
            -   documentIndex: 1
                isKind:
                    of: ClusterRoleBinding
            -   documentIndex: 1
                equal:
                    path: roleRef.name
                    value: crossplane-provider-kubernetes
            -   documentIndex: 1
                equal:
                    path: subjects[0].name
                    value: provider-kubernetes
            -   documentIndex: 1
                equal:
                    path: subjects[0].namespace
                    value: crossplane-system
        it: Renders the aggregated role and its binding by default
