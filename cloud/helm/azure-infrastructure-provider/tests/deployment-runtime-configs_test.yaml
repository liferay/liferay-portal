release:
    name: my-release
    namespace: crossplane-system
set:
    deploymentContext:
        crossplaneDataClientId: 11111111-1111-1111-1111-111111111111
        crossplaneIamClientId: 22222222-2222-2222-2222-222222222222
suite: Deployment Runtime Configs
templates:
    -   templates/deployment-runtime-configs.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 8
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: azure-authorization-config
            -   documentIndex: 0
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["azure.workload.identity/client-id"]
                    value: 22222222-2222-2222-2222-222222222222
            -   documentIndex: 0
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-iam
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: azure-dataprotection-config
            -   documentIndex: 1
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["azure.workload.identity/client-id"]
                    value: 11111111-1111-1111-1111-111111111111
            -   documentIndex: 1
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-data
            -   documentIndex: 2
                equal:
                    path: metadata.name
                    value: azure-dbforpostgresql-config
            -   documentIndex: 2
                equal:
                    path: spec.deploymentTemplate.spec.template.metadata.labels["azure.workload.identity/use"]
                    value: "true"
            -   documentIndex: 2
                equal:
                    path: spec.serviceAccountTemplate.metadata.annotations["azure.workload.identity/client-id"]
                    value: 11111111-1111-1111-1111-111111111111
            -   documentIndex: 2
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: crossplane-data
        it: Renders one deployment runtime config per provider bound to its workload identity