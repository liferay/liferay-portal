release:
    name: my-release
    namespace: crossplane-system
suite: Deployment Runtime Configs
templates:
    -   templates/deployment-runtime-configs.yaml
tests:
    -   asserts:
            -   notExists:
                    path: spec.serviceAccountTemplate
        it: Leaves every provider service account to the chart so that providers sharing one never fight over its ownership
    -   asserts:
            -   hasDocuments:
                    count: 9
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: azure-alertsmanagement-config
            -   documentIndex: 0
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.serviceAccountName
                    value: crossplane-data
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: azure-authorization-config
            -   documentIndex: 1
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.serviceAccountName
                    value: crossplane-iam
            -   documentIndex: 2
                equal:
                    path: metadata.name
                    value: azure-dataprotection-config
            -   documentIndex: 2
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.serviceAccountName
                    value: crossplane-data
            -   documentIndex: 3
                equal:
                    path: metadata.name
                    value: azure-dbforpostgresql-config
            -   documentIndex: 3
                equal:
                    path: spec.deploymentTemplate.spec.template.metadata.labels["azure.workload.identity/use"]
                    value: "true"
            -   documentIndex: 3
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.serviceAccountName
                    value: crossplane-data
        it: Renders one deployment runtime config per provider running as its identity service account