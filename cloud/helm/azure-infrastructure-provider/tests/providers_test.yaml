release:
    name: my-release
    namespace: crossplane-system
suite: Providers
templates:
    -   templates/providers.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the providers when they are disabled
        set:
            providers:
                enabled: false
    -   asserts:
            -   hasDocuments:
                    count: 9
            -   documentIndex: 0
                equal:
                    path: spec.package
                    value: xpkg.upbound.io/upbound/provider-azure-alertsmanagement:v2.7.0
            -   documentIndex: 0
                equal:
                    path: spec.runtimeConfigRef.name
                    value: azure-alertsmanagement-config
            -   documentIndex: 1
                equal:
                    path: spec.package
                    value: xpkg.upbound.io/upbound/provider-azure-authorization:v2.7.0
            -   documentIndex: 1
                equal:
                    path: spec.runtimeConfigRef.name
                    value: azure-authorization-config
            -   documentIndex: 2
                equal:
                    path: spec.package
                    value: xpkg.upbound.io/upbound/provider-azure-dataprotection:v2.7.0
            -   documentIndex: 2
                equal:
                    path: spec.runtimeConfigRef.name
                    value: azure-dataprotection-config
            -   documentIndex: 8
                equal:
                    path: metadata.name
                    value: provider-family-azure
        it: Renders the Azure provider family by default