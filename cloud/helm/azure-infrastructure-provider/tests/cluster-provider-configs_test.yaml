release:
    name: my-release
    namespace: crossplane-system
set:
    deploymentContext:
        crossplaneDataClientId: 11111111-1111-1111-1111-111111111111
        crossplaneIamClientId: 22222222-2222-2222-2222-222222222222
        subscriptionId: 00000000-0000-0000-0000-000000000000
        tenantId: 33333333-3333-3333-3333-333333333333
suite: Cluster Provider Configs
templates:
    -   templates/cluster-provider-configs.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: default
            -   documentIndex: 0
                equal:
                    path: spec.clientID
                    value: 11111111-1111-1111-1111-111111111111
            -   documentIndex: 0
                equal:
                    path: spec.credentials.source
                    value: OIDCTokenFile
            -   documentIndex: 0
                equal:
                    path: spec.subscriptionID
                    value: 00000000-0000-0000-0000-000000000000
            -   documentIndex: 0
                equal:
                    path: spec.tenantID
                    value: 33333333-3333-3333-3333-333333333333
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: iam
            -   documentIndex: 1
                equal:
                    path: spec.clientID
                    value: 22222222-2222-2222-2222-222222222222
            -   documentIndex: 1
                equal:
                    path: spec.credentials.source
                    value: OIDCTokenFile
        it: Renders exactly the two cluster provider configs bound to the crossplane-data and crossplane-iam identities