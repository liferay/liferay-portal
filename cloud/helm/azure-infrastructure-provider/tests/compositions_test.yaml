release:
    name: my-release
    namespace: crossplane-system
suite: Compositions
templates:
    -   templates/compositions.yaml
tests:
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "kind: Job"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "image: postgres:18-alpine"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "image: mcr.microsoft.com/azure-cli"
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: postgresql.sql.m.crossplane.io
        it: Bootstraps the database through a job rather than the SQL provider
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: CREATE ROLE {{ \$databaseOwnerRole }} NOLOGIN
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: GRANT CONNECT, TEMPORARY ON DATABASE
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: SET ROLE {{ \$databaseOwnerRole }}
        it: Grants the application a least privileged database role
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "GRANT USAGE, CREATE ON SCHEMA public TO \\{\\{ \\$databaseOwnerRole \\}\\};"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "--dbname \"\\{\\{ \\$databaseName \\}\\}\""
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: --dbname postgres
        it: Grants the shared owner role create rights on the public schema
    -   asserts:
            -   equal:
                    path: spec.compositeTypeRef.apiVersion
                    value: liferay.com/v1alpha1
            -   equal:
                    path: spec.pipeline[0].functionRef.name
                    value: function-environment-configs
            -   equal:
                    path: spec.pipeline[1].functionRef.name
                    value: function-go-templating
            -   equal:
                    path: spec.pipeline[2].functionRef.name
                    value: function-auto-ready
            -   hasDocuments:
                    count: 2
            -   isKind:
                    of: Composition
            -   documentIndex: 0
                equal:
                    path: metadata.labels["liferay.com/interface"]
                    value: liferay-infrastructure
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: liferay-infrastructure
            -   documentIndex: 0
                equal:
                    path: spec.compositeTypeRef.kind
                    value: LiferayInfrastructure
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "kind: FlexibleServer"
            -   documentIndex: 1
                equal:
                    path: metadata.labels["liferay.com/interface"]
                    value: liferay-overlay
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: liferay-overlay
            -   documentIndex: 1
                equal:
                    path: spec.compositeTypeRef.kind
                    value: LiferayOverlay
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "kind: Account"
        it: Implements the shared Liferay APIs through the packaged function pipeline
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "autoGeneratePassword: true"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "name: database-admin-password"
        it: Lets the provider generate and own the database administrator password
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "kind: FlexibleServerActiveDirectoryAdministrator"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "principalType: ServicePrincipal"
        it: Makes the bootstrap identity a Microsoft Entra administrator
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: \{\{- if \$backup.enabled \}\}
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "kind: BackupVault"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "datastoreType: VaultStore"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "type: SystemAssigned"
        it: Provisions the backup vault only once backups are enabled
    -   asserts:
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "roleDefinitionName: Reader"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "roleDefinitionName: Storage Account Backup Contributor"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: \{\{- if \$backupVaultPrincipalId \}\}
        it: Grants the vault identity only the role the document library demands
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: R/%sT%s:00\+00:00/%s
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\"Monday\" \"2024-01-01\""
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: \$isWeekly \| ternary "P1W" "P1D"
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "schedule: cron"
        it: Renders the schedule as an ISO 8601 repeating interval rather than a cron expression
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "kind: BackupPolicyBlobStorage"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "kind: BackupInstanceBlobStorage"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "vaultDefaultRetentionDuration:"
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: operationalDefaultRetentionDuration
        it: Protects the document library with a vaulted policy so restore can cross accounts
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "storageAccountContainerNames:\\s+-\\s+document-library"
        it: Scopes the document library protection to its own container
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "softDelete: \\{\\{ \\$forceDestroy \\| ternary \"Off\" \"On\" \\| quote \\}\\}"
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "softDelete: \"On\""
        it: Lets forceDestroy disable vault soft delete so the vault can be destroyed
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: \$backupScheduleHash := printf "%s\|%s\|%s" \$backupRepeatingTimeInterval
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: sha256sum \| trunc 6
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "composition-resource-name: liferay-backup-policy-storage-\\{\\{ \\$backupScheduleHash \\}\\}"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: printf "%s-storage-policy-%s" \$backupVaultName \$backupScheduleHash
        it: Names each policy after its schedule so a schedule change rolls the policy
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: \$backupVaultIdentity.principalId
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: index \$backupVaultIdentity
        it: Reads the vault principal from the identity object rather than indexing it
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: \{\{- if \$areBackupRolesAssigned \}\}
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: \$areBackupRolesAssigned = and \$areBackupRolesAssigned \$isBackupRoleAssigned
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "resolve: Always"
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: \$backupRoleAssignmentNames
        it: Holds the backup instances back until every vault role assignment is ready
    -   asserts:
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "kind: BackupPolicyPostgreSQLFlexibleServer"
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "kind: BackupInstancePostgreSQLFlexibleServer"
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: Long Term Retention Backup Role
        it: Leaves the database to its own automatic backups rather than the vault
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$backupRetentionDays := max 7 \\(min 35 \\(int \\(\\$backup.retentionDays \\| default 30\\)\\)\\)"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "backupRetentionDays: \\{\\{ \\$backupRetentionDays \\}\\}"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$backupRetentionDuration := printf \"P%dD\" \\$backupRetentionDays"
        it: Retains the document library and the database for the same clamped period
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "kind: ConfigMap"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "name: database-server-details"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: DATABASE_ENDPOINT
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: DATABASE_PORT
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: DATABASE_USERNAME
        it: Publishes only the database endpoint it discovered from Azure
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: LIFERAY_OVERLAY_BACKEND_OPTIONS.*account=
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: LIFERAY_OVERLAY_BUCKET_NAME
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: LIFERAY_OVERLAY_CONTAINER_NAME
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: RCLONE_AZUREBLOB_ACCOUNT
        it: Publishes the overlay bucket and its backend options
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "sharedAccessKeyEnabled: true"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "name: liferay-storage-\\{\\{ \\$dataPlane \\}\\}-credentials"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: attribute.primary_connection_string
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\| toString \\| b64dec"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: LIFERAY_DOCLIB_CONNECTION_STRING
        it: Publishes the storage account connection string for the document library store
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$isDatabaseReady := and \\(ne \\$activeDatabaseFqdn \"\"\\) \\$isDatabaseBootstrapped"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "managedServiceDetailsReady: \\{\\{ and \\$isDatabaseReady \\$isDoclibReady \\}\\}"
        it: Reports the managed service details ready only once every service is ready
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "activeDirectoryAuthEnabled: true"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: resource-type oss-rdbms
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: PGPASSWORD=\$\(cat /entra/token\)
        it: Uses Microsoft Entra for the bootstrap connection rather than a password
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: \{\{- if \$isDoclibReady \}\}
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$isDoclibReady := and \\(ne \\$doclibConnectionString \"\"\\) \\$isDoclibContainerReady"
        it: Withholds the document library details until the container and its credential exist