release:
    name: my-release
    namespace: my-namespace
set:
    clusterSecretStoreName: my-secret-store
suite: Certificate ExternalSecret
templates:
    -   templates/externalsecret-certificate.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 1
            -   equal:
                    path: metadata.name
                    value: liferay-certificates-shared-certificate
        it: Deduplicates a certificate shared by two endpoints
        set:
            endpoints:
                first:
                    hostname: first.example.com
                    port: 443
                    protocol: HTTPS
                    tls:
                        externalSecretKeys:
                            -   liferay-certificates-shared-certificate
                second:
                    hostname: second.example.com
                    port: 443
                    protocol: HTTPS
                    tls:
                        externalSecretKeys:
                            -   liferay-certificates-shared-certificate
    -   asserts:
            -   failedTemplate:
                    errorPattern: Secret name must not end with a hyphen and six characters
        it: Fails when a certificate secret key ends like an ARN suffix
        set:
            endpoints:
                web:
                    tls:
                        externalSecretKeys:
                            -   liferay-certificates-prod-abc123
    -   asserts:
            -   failedTemplate:
                    errorPattern: "Name is not DNS-1123 compliant: liferay-certificates-ProdCert"
        it: Fails when a certificate secret key is not DNS-1123 compliant
        set:
            endpoints:
                mydomain:
                    hostname: mydomain.example.com
                    port: 443
                    protocol: HTTPS
                    tls:
                        externalSecretKeys:
                            -   liferay-certificates-ProdCert
    -   asserts:
            -   failedTemplate:
                    errorPattern: "Secret key must start with liferay-certificates-: my-certificate"
        it: Fails when a certificate secret key omits the prefix
        set:
            endpoints:
                mydomain:
                    hostname: mydomain.example.com
                    port: 443
                    protocol: HTTPS
                    tls:
                        externalSecretKeys:
                            -   my-certificate
    -   asserts:
            -   failedTemplate:
                    errorPattern: The value "clusterSecretStoreName" is required to synchronize certificates
        it: Fails when the secret store name is missing
        set:
            clusterSecretStoreName: ""
            endpoints:
                mydomain:
                    hostname: mydomain.example.com
                    port: 443
                    protocol: HTTPS
                    tls:
                        externalSecretKeys:
                            -   liferay-certificates-my-certificate
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: liferay-certificates-my-certificate
            -   equal:
                    path: spec.dataFrom[0].extract.key
                    value: liferay-certificates-my-certificate
            -   equal:
                    path: spec.secretStoreRef.name
                    value: my-secret-store
        it: Names the secret after the certificate key
        set:
            endpoints:
                mydomain:
                    hostname: mydomain.example.com
                    port: 443
                    protocol: HTTPS
                    tls:
                        externalSecretKeys:
                            -   liferay-certificates-my-certificate
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the ExternalSecret when no endpoint defines TLS
        set:
            endpoints:
                http:
                    port: 80
                    protocol: HTTP
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: liferay-certificates-first-certificate
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: liferay-certificates-second-certificate
        it: Separates the documents when the endpoints carry distinct certificates
        set:
            endpoints:
                first:
                    hostname: first.example.com
                    port: 443
                    protocol: HTTPS
                    tls:
                        externalSecretKeys:
                            -   liferay-certificates-first-certificate
                second:
                    hostname: second.example.com
                    port: 8443
                    protocol: HTTPS
                    tls:
                        externalSecretKeys:
                            -   liferay-certificates-second-certificate
    -   asserts:
            -   equal:
                    path: spec.target.template.type
                    value: kubernetes.io/tls
            -   notExists:
                    path: spec.target.name
        it: Synchronizes the certificate as a TLS secret
        set:
            endpoints:
                mydomain:
                    hostname: mydomain.example.com
                    port: 443
                    protocol: HTTPS
                    tls:
                        externalSecretKeys:
                            -   liferay-certificates-my-certificate