release:
    name: my-release
    namespace: my-namespace
suite: Search Credentials
templates:
    -   templates/search-credentials.yaml
tests:
    -   asserts:
            -   documentSelector:
                    path: kind
                    value: ExternalSecret
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-24"
            -   documentSelector:
                    path: kind
                    value: Role
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-25"
            -   documentSelector:
                    path: kind
                    value: RoleBinding
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-25"
            -   documentSelector:
                    path: kind
                    value: SecretStore
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-25"
            -   documentSelector:
                    path: kind
                    value: ServiceAccount
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-25"
        it: Assigns the credential resources their sync waves
    -   asserts:
            -   equal:
                    path: metadata.namespace
                    value: my-namespace-elasticsearch
            -   equal:
                    path: roleRef.name
                    value: my-release-search-secret-reader
            -   equal:
                    path: subjects[0].name
                    value: my-release-search-secret-reader
            -   equal:
                    path: subjects[0].namespace
                    value: my-namespace
        documentSelector:
            path: kind
            value: RoleBinding
        it: Binds the secret reader service account to the namespaced role
    -   asserts:
            -   failedTemplate:
                    errorPattern: "Unsupported search engine: typo"
        it: Fails when the search engine is unsupported
        set:
            search.engine: typo
    -   asserts:
            -   equal:
                    path: metadata.namespace
                    value: my-namespace-elasticsearch
            -   equal:
                    path: rules[0].resourceNames
                    value:
                        -   my-release-es-es-elastic-user
            -   equal:
                    path: rules[0].verbs
                    value:
                        -   get
        documentSelector:
            path: kind
            value: Role
        it: Grants read access only to the Elasticsearch user secret
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits every resource when the chart is disabled
        set:
            enabled: false
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits every resource when the engine is OpenSearch
        set:
            search.engine: opensearch
    -   asserts:
            -   equal:
                    path: spec.provider.kubernetes.auth.serviceAccount.name
                    value: my-release-search-secret-reader
            -   equal:
                    path: spec.provider.kubernetes.remoteNamespace
                    value: my-namespace-elasticsearch
            -   equal:
                    path: spec.provider.kubernetes.server.caProvider.key
                    value: ca.crt
            -   equal:
                    path: spec.provider.kubernetes.server.caProvider.name
                    value: kube-root-ca.crt
            -   equal:
                    path: spec.provider.kubernetes.server.caProvider.type
                    value: ConfigMap
            -   notExists:
                    path: spec.provider.kubernetes.server.caProvider.namespace
            -   notExists:
                    path: spec.provider.kubernetes.server.url
        documentSelector:
            path: kind
            value: SecretStore
        it: Reads the Elasticsearch user secret from the Elasticsearch namespace
    -   asserts:
            -   hasDocuments:
                    count: 5
        it: Renders the full credential resource set by default
    -   asserts:
            -   equal:
                    path: spec.data[0].remoteRef.key
                    value: my-release-es-es-elastic-user
            -   equal:
                    path: spec.data[0].remoteRef.property
                    value: elastic
            -   equal:
                    path: spec.target.template.data.SEARCH_PASSWORD
                    value: "{{ .password }}"
            -   equal:
                    path: spec.target.template.data.SEARCH_URL
                    value: http://my-release-es-es-http.my-namespace-elasticsearch.svc:9200
            -   equal:
                    path: spec.target.template.data.SEARCH_USERNAME
                    value: elastic
        documentSelector:
            path: kind
            value: ExternalSecret
        it: Templates the search connection details for Liferay