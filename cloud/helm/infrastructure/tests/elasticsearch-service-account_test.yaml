release:
    name: my-release
    namespace: my-namespace
suite: Elasticsearch Service Account
templates:
    -   templates/elasticsearch-service-account.yaml
tests:
    -   asserts:
            -   equal:
                    path: automountServiceAccountToken
                    value: false
            -   equal:
                    path: metadata.name
                    value: elasticsearch
            -   equal:
                    path: metadata.namespace
                    value: my-namespace-elasticsearch
            -   isKind:
                    of: ServiceAccount
        it: Creates the Elasticsearch service account in the dedicated namespace
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the Elasticsearch service account when the engine is OpenSearch
        set:
            search.engine: opensearch
            search.supportedEngines:
                -   elasticsearch
                -   opensearch