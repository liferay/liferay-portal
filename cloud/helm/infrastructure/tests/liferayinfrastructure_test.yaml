release:
    name: my-release
    namespace: my-namespace
suite: LiferayInfrastructure
templates:
    -   templates/liferayinfrastructure.yaml
tests:
    -   asserts:
            -   isEmpty:
                    path: spec.backup
            -   notExists:
                    path: spec.forceDestroy
            -   notExists:
                    path: spec.orphanOnDelete
        it: Leaves unset settings to the composite resource defaults
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-release
            -   equal:
                    path: metadata.namespace
                    value: my-namespace
            -   hasDocuments:
                    count: 1
        it: Names the LiferayInfrastructure after the release
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the LiferayInfrastructure when the chart is disabled
        set:
            enabled: false
    -   asserts:
            -   equal:
                    path: spec.search.engine
                    value: elasticsearch
            -   notExists:
                    path: spec.search.opensearch
        it: Omits the OpenSearch settings when the engine is Elasticsearch
        set:
            search.opensearch.instanceType: t3.small.search
    -   asserts:
            -   notExists:
                    path: spec.commonTags
        it: Omits the common tags when none are set
    -   asserts:
            -   equal:
                    path: spec.forceDestroy
                    value: false
            -   equal:
                    path: spec.orphanOnDelete
                    value: false
        it: Passes forceDestroy and orphanOnDelete through whenever they are set
        set:
            forceDestroy: false
            orphanOnDelete: false
    -   asserts:
            -   equal:
                    path: spec.search.engine
                    value: opensearch
            -   equal:
                    path: spec.search.opensearch
                    value:
                        instanceCount: 3
                        instanceType: m6g.large.search
                        version: "2.19"
                        volumeSizeGB: 50
        it: Passes the OpenSearch settings through to the composite resource
        set:
            search:
                engine: opensearch
                opensearch:
                    instanceCount: 3
                    instanceType: m6g.large.search
                    version: "2.19"
                    volumeSizeGB: 50
    -   asserts:
            -   equal:
                    path: spec.backup.dayOfWeek
                    value: Saturday
            -   equal:
                    path: spec.backup.enabled
                    value: true
            -   equal:
                    path: spec.backup.frequency
                    value: Weekly
            -   equal:
                    path: spec.backup.retentionDays
                    value: 7
            -   equal:
                    path: spec.backup.timeOfDay
                    value: 23:30
            -   equal:
                    path: spec.backup.timeZone
                    value: America/New_York
            -   equal:
                    path: spec.backup.vaultTags.spend_area
                    value: storage
        it: Passes the backup settings through to the composite resource
        set:
            backup:
                dayOfWeek: Saturday
                enabled: true
                frequency: Weekly
                retentionDays: 7
                timeOfDay: 23:30
                timeZone: America/New_York
                vaultTags:
                    spend_area: storage
    -   asserts:
            -   equal:
                    path: spec.commonTags.owner
                    value: platform
        it: Passes the common tags through to the composite resource
        set:
            commonTags:
                owner: platform
    -   asserts:
            -   equal:
                    path: spec.database.instanceType
                    value: GP_Standard_B2s
            -   equal:
                    path: spec.database.storageGB
                    value: 64
            -   equal:
                    path: spec.database.version
                    value: "17"
        it: Passes the database settings through to the composite resource
        set:
            database:
                instanceType: GP_Standard_B2s
                storageGB: 64
                version: "17"
    -   asserts:
            -   isAPIVersion:
                    of: liferay.com/v1alpha1
            -   isKind:
                    of: LiferayInfrastructure
        it: Targets the cloud agnostic API group
    -   asserts:
            -   notExists:
                    path: spec.database.restore
            -   notExists:
                    path: spec.database.rootPasswordSecretName
            -   notExists:
                    path: spec.restoreGeneration
            -   notExists:
                    path: spec.restorePhase
            -   notExists:
                    path: spec.retainedDataPlanes
            -   notExists:
                    path: spec.targetActiveDataPlane
        it: Withholds the fields the provider and restore controller own
    -   asserts:
            -   notExists:
                    path: spec.backup.restore
        it: Withholds the restore sanitization scripts from the composite resource
        set:
            backup.enabled: true
            backup.restore.sanitizationScripts.x-010-fix-urls: UPDATE Foo SET url = 'https://a.example.com';