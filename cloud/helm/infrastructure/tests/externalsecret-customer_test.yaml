release:
    name: my-release
    namespace: my-namespace
set:
    clusterSecretStoreName: my-secret-store
    secretNames:
        -   abc1234-my-api-key
suite: Customer ExternalSecret
templates:
    -   templates/externalsecret-customer.yaml
tests:
    -   asserts:
            -   failedTemplate:
                    errorPattern: "Name is not DNS-1123 compliant: My_Secret"
        it: Fails when a secret name is not DNS-1123 compliant
        set:
            secretNames:
                -   My_Secret
    -   asserts:
            -   failedTemplate:
                    errorPattern: The value "clusterSecretStoreName" is required to synchronize customer secrets
        it: Fails when the secret store name is missing
        set:
            clusterSecretStoreName: ""
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the ExternalSecrets when no secret is listed
        set:
            secretNames: []
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: abc1234-my-api-key
            -   equal:
                    path: spec.data[0].remoteRef.key
                    value: abc1234-my-api-key
            -   equal:
                    path: spec.data[0].remoteRef.metadataPolicy
                    value: Fetch
            -   equal:
                    path: spec.data[1].remoteRef.key
                    value: abc1234-my-api-key
            -   equal:
                    path: spec.secretStoreRef.name
                    value: my-secret-store
        it: Reads the secret and its metadata from the cluster secret store
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: def5678-my-token
        it: Renders one ExternalSecret per listed secret
        set:
            secretNames:
                -   abc1234-my-api-key
                -   def5678-my-token