release:
    name: my-release
    namespace: liferay-able-nonproduction
set:
    environmentId: nonproduction
    projectId: able
suite: Client Extension Namespace
templates:
    -   templates/client-extension-namespace.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.labels["liferay.com/observable"]
                    value: "true"
            -   equal:
                    path: metadata.labels["pod-security.kubernetes.io/enforce"]
                    value: restricted
            -   equal:
                    path: metadata.name
                    value: liferay-able-nonproduction-cx
        it: Creates the separate client extension namespace when it is enabled
        set:
            clientExtensions:
                separateNamespace:
                    enabled: true
                    name: liferay-able-nonproduction-cx
    -   asserts:
            -   failedTemplate:
                    errorMessage: "The namespace \"liferay-able-prod-cx\" must not end with \"-cx\", since another environment's client extension namespace can have that name"
        it: Fails for a namespace that ends with the client extension namespace suffix
        release:
            namespace: liferay-able-prod-cx
        set:
            clientExtensions:
                separateNamespace:
                    name: liferay-able-prod-cx-cx
            environmentId: prod-cx
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the namespace by default