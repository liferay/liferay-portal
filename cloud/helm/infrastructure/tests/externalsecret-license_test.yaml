release:
    name: my-release
    namespace: my-namespace
set:
    clusterSecretStoreName: my-secret-store
    license:
        externalSecretKey: liferay-licenses-my-license
suite: License ExternalSecret
templates:
    -   templates/externalsecret-license.yaml
tests:
    -   asserts:
            -   failedTemplate:
                    errorPattern: "Secret key must start with liferay-licenses-: my-license"
        it: Fails when the license secret key omits the prefix
        set:
            license.externalSecretKey: my-license
    -   asserts:
            -   failedTemplate:
                    errorPattern: The value "clusterSecretStoreName" is required to synchronize the license
        it: Fails when the secret store name is missing
        set:
            clusterSecretStoreName: ""
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: liferay-license
            -   notExists:
                    path: spec.target
        it: Names the ExternalSecret after the secret the Liferay chart mounts
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the ExternalSecret when no license is configured
        set:
            license.externalSecretKey: ""
    -   asserts:
            -   equal:
                    path: spec.data[0].remoteRef.property
                    value: enterprise.xml
        it: Reads the license from the configured remote property
        set:
            license.externalSecretProperty: enterprise.xml
    -   asserts:
            -   equal:
                    path: spec.data[0].remoteRef.key
                    value: liferay-licenses-my-license
            -   equal:
                    path: spec.data[0].remoteRef.property
                    value: license.xml
            -   equal:
                    path: spec.data[0].secretKey
                    value: license.xml
            -   equal:
                    path: spec.secretStoreRef.name
                    value: my-secret-store
        it: Writes the license under the key the Liferay chart reads