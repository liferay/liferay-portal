release:
    name: my-release
    namespace: my-namespace
suite: Database Password
templates:
    -   templates/database-password.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.dataFrom[0].sourceRef.generatorRef.kind
                    value: Password
            -   equal:
                    path: spec.dataFrom[0].sourceRef.generatorRef.name
                    value: database-app-password-generator
            -   notExists:
                    path: spec.secretStoreRef
        documentSelector:
            path: kind
            value: ExternalSecret
        it: Draws the password from the generator rather than a secret store
    -   asserts:
            -   equal:
                    path: spec.target.template.data.DATABASE_PASSWORD
                    value: "{{ .password }}"
            -   equal:
                    path: spec.target.name
                    value: database-app-password
        documentSelector:
            path: kind
            value: ExternalSecret
        it: Keys the password to the database contract
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the password when the application authenticates by workload identity
        set:
            database.authentication: workloadIdentity
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the password when the chart is disabled
        set:
            enabled: false
    -   asserts:
            -   hasDocuments:
                    count: 2
        it: Renders the generator and the external secret by default
    -   asserts:
            -   equal:
                    path: metadata.annotations["helm.sh/resource-policy"]
                    value: keep
            -   equal:
                    path: spec.refreshInterval
                    value: 0s
        documentSelector:
            path: kind
            value: ExternalSecret
        it: Writes the password once and never rotates it