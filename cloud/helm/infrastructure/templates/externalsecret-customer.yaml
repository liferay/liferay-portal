{{- if .Values.enabled }}
{{- range $secretName := .Values.secretNames }}
{{- include "liferay.validateDNS1123Name" $secretName }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    labels:
        app: liferay
        component: customer-secret
    name: {{ $secretName | quote }}
    namespace: {{ $.Release.Namespace }}
spec:
    data:
        -   remoteRef:
                key: {{ $secretName | quote }}
                metadataPolicy: Fetch
            secretKey: metadata
        -   remoteRef:
                key: {{ $secretName | quote }}
            secretKey: data
    refreshInterval: 1h0m0s
    secretStoreRef:
        kind: ClusterSecretStore
        name: {{ required "The value \"clusterSecretStoreName\" is required to synchronize customer secrets" $.Values.clusterSecretStoreName | quote }}
    target:
        creationPolicy: Owner
        deletionPolicy: Retain
        template:
            metadata:
                annotations:
                    eso.validated-namespace: |-
                        {{`
                        {{- $metadata := .metadata | toString | fromJson -}}
                        {{- $labels := $metadata -}}
                        {{- if hasKey $metadata "labels" -}}
                        {{- $labels = $metadata.labels -}}
                        {{- end -}}
                        {{- $destinationNamespace := index ($labels | default dict) "esm-app-destination-namespace" | default "" -}}
                        {{- $expectedNamespace := `}}{{ $.Release.Namespace | quote }}{{` -}}

                        {{- if eq $destinationNamespace $expectedNamespace -}}
                        {{- $expectedNamespace -}}
                        {{- else -}}
                        {{- fail (printf "Secret namespace label %q does not match the ExternalSecret namespace %q" $destinationNamespace $expectedNamespace) -}}
                        {{- end -}}
                        `}}
            templateFrom:
                -   literal: |
                        {{`
                        {{- $data := .data | toString -}}

                        {{- if and (hasPrefix "{" $data) (hasSuffix "}" $data) -}}
                        {{- range $k, $v := ($data | fromJson) }}
                        {{ $k }}: {{ $v | toString | quote }}
                        {{- end }}
                        {{- else }}
                        secret: {{ $data | quote }}
                        {{- end -}}
                        `}}
                    target: Data
{{- end }}
{{- end }}