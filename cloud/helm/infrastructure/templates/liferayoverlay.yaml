{{- if and .Values.enabled .Values.overlayBucket.enabled -}}
{{- $overlayBucket := .Values.overlayBucket -}}
apiVersion: liferay.com/v1alpha1
kind: LiferayOverlay
metadata:
    annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
        argocd.argoproj.io/sync-wave: "-20"
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
spec:
    {{- with $overlayBucket.commonTags }}
    commonTags:
        {{- . | toYaml | nindent 8 }}
    {{- end }}
    forceDestroy: {{ $overlayBucket.forceDestroy }}
    orphanOnDelete: {{ $overlayBucket.orphanOnDelete }}
    projectId: {{ .Values.projectId | quote }}
    region: {{ .Values.region | quote }}
{{- end -}}