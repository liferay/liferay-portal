{{- include "search.validateEngine" . -}}
{{- if and .Values.enabled (eq .Values.search.engine "elasticsearch") }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        argocd.argoproj.io/sync-wave: "-25"
    name: search-connection-details
    namespace: {{ .Release.Namespace }}
spec:
    data:
        -   remoteRef:
                key: {{ include "elasticsearch.elasticUserSecretName" . }}
                property: elastic
            secretKey: password
    refreshInterval: 1h0m0s
    secretStoreRef:
        kind: SecretStore
        name: {{ .Release.Name }}-search
    target:
        creationPolicy: Owner
        deletionPolicy: Retain
        name: search-connection-details
        template:
            data:
                SEARCH_PASSWORD: "{{ `{{ .password }}` }}"
                SEARCH_URL: {{ printf "http://%s-es-http.%s.svc:9200" (include "elasticsearch.name" .) (include "elasticsearch.namespace" .) }}
                SEARCH_USERNAME: elastic
            engineVersion: v2
            type: Opaque
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
    annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        argocd.argoproj.io/sync-wave: "-26"
    name: {{ .Release.Name }}-search
    namespace: {{ .Release.Namespace }}
spec:
    provider:
        kubernetes:
            auth:
                serviceAccount:
                    name: {{ include "search.secretReaderServiceAccountName" . }}
            remoteNamespace: {{ include "elasticsearch.namespace" . }}
            server:
                caProvider:
                    key: ca.crt
                    name: kube-root-ca.crt
                    type: ConfigMap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-27"
    name: {{ include "search.secretReaderServiceAccountName" . }}
    namespace: {{ include "elasticsearch.namespace" . }}
rules:
    -   apiGroups: [""]
        resourceNames:
            -   {{ include "elasticsearch.elasticUserSecretName" . }}
        resources: ["secrets"]
        verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-27"
    name: {{ include "search.secretReaderServiceAccountName" . }}
    namespace: {{ include "elasticsearch.namespace" . }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "search.secretReaderServiceAccountName" . }}
subjects:
    -   kind: ServiceAccount
        name: {{ include "search.secretReaderServiceAccountName" . }}
        namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-27"
    name: {{ include "search.secretReaderServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end -}}