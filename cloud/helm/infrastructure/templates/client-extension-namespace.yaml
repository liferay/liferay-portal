{{- if .Values.enabled }}
{{- $separateNamespace := .Values.clientExtensions.separateNamespace }}
{{- if and (hasPrefix .Release.Namespace $separateNamespace.name) (ne .Release.Namespace $separateNamespace.name) }}
{{- $suffix := trimPrefix .Release.Namespace $separateNamespace.name }}
{{- if hasSuffix $suffix .Release.Namespace }}
{{- fail (printf "The namespace %q must not end with %q, since another environment's client extension namespace can have that name" .Release.Namespace $suffix) }}
{{- end }}
{{- end }}
{{- if $separateNamespace.enabled }}
apiVersion: v1
kind: Namespace
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-25"
    labels:
        component: client-extensions
        environmentId: {{ .Values.environmentId | quote }}
        liferay.com/observable: "true"
        name: {{ include "clientExtensions.namespace" . }}
        pod-security.kubernetes.io/enforce: restricted
        projectId: {{ .Values.projectId | quote }}
    name: {{ include "clientExtensions.namespace" . }}
{{- end }}
{{- end -}}