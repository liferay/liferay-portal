release:
    name: my-release
    namespace: my-namespace
suite: Values Schema
templates:
    -   templates/deployment.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.template.spec.containers[0].env[?(@.name=="PROVISIONING_GRACE_PERIOD")].value
                    value: "0"
            -   isKind:
                    of: Deployment
        it: Accepts every duration form the operator parses
        set:
            downloadPollInterval: 500µs
            expirationGracePeriod: 1.5h
            heartbeatInterval: 1h30m
            provisioningGracePeriod: 0
    -   asserts:
            -   isKind:
                    of: Deployment
        it: Accepts the values a parent chart injects into a conditional subchart
        set:
            enabled: true
            global:
                imageRegistry: registry.example.com
    -   asserts:
            -   failedTemplate:
                    errorPattern: tag
        it: Rejects a fractional image tag that YAML would truncate
        set:
            image.tag: 1.10
    -   asserts:
            -   failedTemplate:
                    errorPattern: heartbeatInterval
        it: Rejects a malformed duration
        set:
            heartbeatInterval: 10 minutes
    -   asserts:
            -   failedTemplate:
                    errorPattern: clientExtensions
        it: Rejects a non-boolean ClientExtension controller switch
        set:
            clientExtensions.enabled: "yes"
    -   asserts:
            -   failedTemplate:
                    errorPattern: maxDelayy
        it: Rejects an unknown key inside a values object
        set:
            retry.maxDelayy: 1m
    -   asserts:
            -   failedTemplate:
                    errorPattern: heartbeatIntervall
        it: Rejects an unknown root key
        set:
            heartbeatIntervall: 10m
    -   asserts:
            -   failedTemplate:
                    errorPattern: replicaCount
        it: Rejects more than one replica
        set:
            replicaCount: 2
    -   asserts:
            -   failedTemplate:
                    errorPattern: claimName
        it: Rejects the marketplace without a claim name
        set:
            marketplace.enabled: true