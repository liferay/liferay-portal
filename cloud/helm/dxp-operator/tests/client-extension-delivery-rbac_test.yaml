release:
    name: my-release
    namespace: my-namespace
suite: Client Extension Delivery RBAC
templates:
    -   templates/client-extension-delivery-rbac.yaml
tests:
    -   asserts:
            -   isKind:
                    of: ClusterRole
            -   equal:
                    path: metadata.name
                    value: client-extension-delivery-cluster-role
            -   equal:
                    path: rules
                    value:
                        -   apiGroups:
                                -   ""
                            resources:
                                -   configmaps
                            verbs:
                                -   create
                                -   delete
                                -   patch
                                -   update
        it: Defines the ConfigMap writes DXP grants in its own namespace
        set:
            clientExtensions.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the delivery cluster role by default