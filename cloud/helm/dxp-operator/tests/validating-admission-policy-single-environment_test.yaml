release:
    name: my-release
    namespace: my-namespace
suite: Single environment ValidatingAdmissionPolicy
templates:
    -   templates/validating-admission-policy-single-environment.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-release-liferay-dxp-operator-single-environment
            -   equal:
                    path: spec.policyName
                    value: my-release-liferay-dxp-operator-single-environment
        documentSelector:
            path: kind
            value: ValidatingAdmissionPolicyBinding
        it: Binds the policy named after the release