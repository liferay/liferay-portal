release:
    name: my-release
    namespace: my-namespace
suite: Webhook
templates:
    -   templates/deployment.yaml
    -   templates/webhook.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-release-liferay-dxp-operator-webhook
            -   equal:
                    path: spec.ports[0].port
                    value: 443
            -   equal:
                    path: spec.ports[0].targetPort
                    value: webhook
        documentSelector:
            path: kind
            value: Service
        it: Exposes the webhook service on 443 targeting the webhook port
        template: templates/webhook.yaml
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-release-liferay-dxp-operator-webhook
            -   equal:
                    path: type
                    value: kubernetes.io/tls
            -   isNotEmpty:
                    path: data["ca.crt"]
            -   isNotEmpty:
                    path: data["tls.crt"]
            -   isNotEmpty:
                    path: data["tls.key"]
        documentSelector:
            path: kind
            value: Secret
        it: Generates a self-signed TLS serving certificate secret
        template: templates/webhook.yaml
    -   asserts:
            -   contains:
                    content:
                        mountPath: /tmp/k8s-webhook-server/serving-certs
                        name: webhook-certs
                        readOnly: true
                    path: spec.template.spec.containers[0].volumeMounts
            -   contains:
                    content:
                        name: webhook-certs
                        secret:
                            secretName: my-release-liferay-dxp-operator-webhook
                    path: spec.template.spec.volumes
        it: Mounts the serving certificate into the manager container
        template: templates/deployment.yaml
    -   asserts:
            -   hasDocuments:
                    count: 2
        it: Renders only the serving certificate secret and service
        template: templates/webhook.yaml