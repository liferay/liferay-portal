release:
    name: my-release
    namespace: my-namespace
suite: Webhook
templates:
    -   templates/deployment.yaml
    -   templates/webhook.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-release-liferay-dxp-operator-webhook
            -   equal:
                    path: spec.ports[0].port
                    value: 443
            -   equal:
                    path: spec.ports[0].targetPort
                    value: webhook
        documentSelector:
            path: kind
            value: Service
        it: Exposes the webhook service on 443 targeting the webhook port
        template: templates/webhook.yaml
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-release-liferay-dxp-operator-webhook
            -   equal:
                    path: type
                    value: kubernetes.io/tls
            -   isNotEmpty:
                    path: data["ca.crt"]
            -   isNotEmpty:
                    path: data["tls.crt"]
            -   isNotEmpty:
                    path: data["tls.key"]
        documentSelector:
            path: kind
            value: Secret
        it: Generates a self-signed TLS serving certificate secret
        template: templates/webhook.yaml
    -   asserts:
            -   contains:
                    content:
                        mountPath: /tmp/k8s-webhook-server/serving-certs
                        name: webhook-certs
                        readOnly: true
                    path: spec.template.spec.containers[0].volumeMounts
            -   contains:
                    content:
                        name: webhook-certs
                        secret:
                            secretName: my-release-liferay-dxp-operator-webhook
                    path: spec.template.spec.volumes
        it: Mounts the serving certificate into the manager container
        template: templates/deployment.yaml
    -   asserts:
            -   hasDocuments:
                    count: 3
        it: Renders the certificate secret, service, and webhook configuration
        template: templates/webhook.yaml
    -   asserts:
            -   contains:
                    content: CREATE
                    path: webhooks[0].rules[0].operations
            -   contains:
                    content: UPDATE
                    path: webhooks[0].rules[0].operations
            -   contains:
                    content: statefulsets
                    path: webhooks[0].rules[0].resources
            -   contains:
                    content: statefulsets/scale
                    path: webhooks[0].rules[0].resources
            -   equal:
                    path: webhooks[0].clientConfig.service.path
                    value: /validate-apps-v1-statefulset
            -   equal:
                    path: webhooks[0].failurePolicy
                    value: Fail
            -   equal:
                    path: webhooks[0].namespaceSelector.matchLabels["licensing.liferay.com/environment"]
                    value: "true"
            -   isNotEmpty:
                    path: webhooks[0].clientConfig.caBundle
        documentSelector:
            path: kind
            value: ValidatingWebhookConfiguration
        it: Denies over-limit scaling fail-closed on labeled namespaces
        template: templates/webhook.yaml