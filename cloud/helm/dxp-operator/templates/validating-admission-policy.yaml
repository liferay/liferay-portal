apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    labels:
        {{- include "dxp-operator.labels" . | nindent 8 }}
    name: {{ include "dxp-operator.fullname" . }}-workload-scale
spec:
    failurePolicy: Fail
    matchConditions:
        -   expression: >-
                request.userInfo.username != '{{ printf "system:serviceaccount:%s:%s" (include "dxp-operator.namespace" .) (include "dxp-operator.serviceAccountName" .) }}'
            name: exclude-operator-serviceaccount
    matchConstraints:
        namespaceSelector:
            matchLabels:
                licensing.liferay.com/environment: "true"
        resourceRules:
            -   apiGroups:
                    -   apps
                apiVersions:
                    -   v1
                operations:
                    -   CREATE
                    -   UPDATE
                resources:
                    -   deployments
                    -   deployments/scale
                    -   statefulsets
                    -   statefulsets/scale
    paramKind:
        apiVersion: licensing.liferay.com/v1alpha1
        kind: LiferayEnvironment
    validations:
        -   expression: >-
                !variables.hasCeiling ||
                variables.licensedWorkloadKind != variables.workloadKind ||
                variables.licensedWorkloadName != variables.workloadName ||
                variables.requestedReplicas <= variables.replicaCeiling
            messageExpression: >-
                'replicas ' + string(variables.requestedReplicas) +
                ' exceeds the replica ceiling ' + string(variables.replicaCeiling) +
                ' for ' + variables.workloadKind + ' "' + variables.workloadName + '"'
            reason: Forbidden
    variables:
        -   expression: >-
                has(params.status) && (has(params.status.replicaCeiling) ||
                (has(params.status.license) && has(params.status.license.maxClusterNodes)))
            name: hasCeiling
        -   expression: "has(request.subResource) && request.subResource == 'scale'"
            name: isScale
        -   expression: >-
                has(params.spec.workloadRef) && has(params.spec.workloadRef.kind) ?
                params.spec.workloadRef.kind : 'StatefulSet'
            name: licensedWorkloadKind
        -   expression: "has(params.spec.workloadRef) ? params.spec.workloadRef.name : ''"
            name: licensedWorkloadName
        -   expression: >-
                !variables.hasCeiling ? 0 :
                (has(params.status.replicaCeiling) ? params.status.replicaCeiling :
                params.status.license.maxClusterNodes)
            name: replicaCeiling
        -   expression: >-
                has(object.spec.replicas) ? object.spec.replicas :
                (variables.isScale ? 0 : 1)
            name: requestedReplicas
        -   expression: "request.resource.resource == 'deployments' ? 'Deployment' : 'StatefulSet'"
            name: workloadKind
        -   expression: "variables.isScale ? request.name : object.metadata.name"
            name: workloadName
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    labels:
        {{- include "dxp-operator.labels" . | nindent 8 }}
    name: {{ include "dxp-operator.fullname" . }}-workload-scale
spec:
    paramRef:
        parameterNotFoundAction: Allow
        selector: {}
    policyName: {{ include "dxp-operator.fullname" . }}-workload-scale
    validationActions:
        -   Deny