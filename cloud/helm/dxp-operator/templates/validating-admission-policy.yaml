apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    labels:
        {{- include "dxp-operator.labels" . | nindent 8 }}
    name: {{ include "dxp-operator.fullname" . }}-statefulset-scale
spec:
    failurePolicy: Fail
    matchConditions:
        -   expression: >-
                request.userInfo.username != '{{ printf "system:serviceaccount:%s:%s" (include "dxp-operator.namespace" .) (include "dxp-operator.serviceAccountName" .) }}'
            name: exclude-operator-serviceaccount
    matchConstraints:
        namespaceSelector:
            matchLabels:
                licensing.liferay.com/environment: "true"
        resourceRules:
            -   apiGroups:
                    -   apps
                apiVersions:
                    -   v1
                operations:
                    -   CREATE
                    -   UPDATE
                resources:
                    -   statefulsets
                    -   statefulsets/scale
    paramKind:
        apiVersion: licensing.liferay.com/v1alpha1
        kind: LiferayEnvironment
    validations:
        -   expression: >-
                !variables.hasCeiling ||
                variables.licensedWorkloadName != variables.workloadName ||
                variables.requestedReplicas <= variables.maxClusterNodes
            messageExpression: >-
                'replicas ' + string(variables.requestedReplicas) +
                ' exceeds licensed maxClusterNodes ' + string(variables.maxClusterNodes) +
                ' for StatefulSet "' + variables.workloadName + '"'
            reason: Forbidden
    variables:
        -   expression: >-
                has(params.status) && has(params.status.license) &&
                has(params.status.license.maxClusterNodes)
            name: hasCeiling
        -   expression: "has(request.subResource) && request.subResource == 'scale'"
            name: isScale
        -   expression: "has(params.spec.workloadRef) ? params.spec.workloadRef.name : ''"
            name: licensedWorkloadName
        -   expression: "variables.hasCeiling ? params.status.license.maxClusterNodes : 0"
            name: maxClusterNodes
        -   expression: >-
                has(object.spec.replicas) ? object.spec.replicas :
                (variables.isScale ? 0 : 1)
            name: requestedReplicas
        -   expression: "variables.isScale ? request.name : object.metadata.name"
            name: workloadName
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    labels:
        {{- include "dxp-operator.labels" . | nindent 8 }}
    name: {{ include "dxp-operator.fullname" . }}-statefulset-scale
spec:
    paramRef:
        parameterNotFoundAction: Allow
        selector: {}
    policyName: {{ include "dxp-operator.fullname" . }}-statefulset-scale
    validationActions:
        -   Deny