suite: Alloy service account
templates:
    -   templates/alloy/serviceaccount.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.annotations["azure.workload.identity/client-id"]
                    value: 00000000-0000-0000-0000-000000000000
        it: Annotates the service account with the Azure identity client ID
        set:
            alloy.enabled: true
            alloy.iam.azureClientId: 00000000-0000-0000-0000-000000000000
            cloudProvider: azure
    -   asserts:
            -   isNull:
                    path: metadata.annotations
        it: Omits the Azure annotation when no identity client ID is set
        set:
            alloy.enabled: true
            cloudProvider: azure
    -   asserts:
            -   isNull:
                    path: metadata.annotations
        it: Omits the Azure annotation when the cloud provider is not Azure
        set:
            alloy.enabled: true
            alloy.iam.azureClientId: 00000000-0000-0000-0000-000000000000
            cloudProvider: gcp