suite: Alloy configuration
templates:
    -   templates/alloy/config.yaml
tests:
    -   asserts:
            -   failedTemplate:
                    errorPattern: alloy should be disabled when using Azure as a cloud provider
        it: Rejects alloy on Azure when no remote write URL is set
        set:
            alloy.enabled: true
            cloudProvider: azure
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the alloy configuration when alloy is disabled on Azure
        set:
            cloudProvider: azure
    -   asserts:
            -   failedTemplate:
                    errorPattern: alloy.remoteWrite.url is required when cloud provider is not AWS, Azure, or GCP
        it: Rejects an unrecognized cloud provider without a remote write URL
        set:
            alloy.enabled: true
            cloudProvider: alibaba
    -   asserts:
            -   matchRegex:
                    path: data["config.alloy"]
                    pattern: url = "https://example.com/write"
        it: Renders the alloy configuration when Azure sets a remote write URL
        set:
            alloy.enabled: true
            alloy.remoteWrite.url: https://example.com/write
            cloudProvider: azure