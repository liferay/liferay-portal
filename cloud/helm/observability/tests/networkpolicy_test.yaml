release:
    name: obs
    namespace: observability
set:
    cloudProvider: gcp
suite: Observability NetworkPolicies
templates:
    -   templates/networkpolicy.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.namespace
                    value: observability
            -   equal:
                    path: spec.podSelector.matchLabels
                    value:
                        app.kubernetes.io/component: frontend
                        app.kubernetes.io/instance: obs
                        app.kubernetes.io/name: observability
            -   equal:
                    path: spec.ingress[0].from[0].podSelector.matchLabels
                    value:
                        app.kubernetes.io/instance: obs
                        app.kubernetes.io/name: grafana
            -   lengthEqual:
                    count: 1
                    path: spec.ingress[0].from
            -   equal:
                    path: spec.ingress[0].ports[0]
                    value:
                        port: web
                        protocol: TCP
        documentSelector:
            path: metadata.name
            value: obs-observability-frontend-ingress
        it: Allows only Grafana to reach the GMP frontend, which serves its only datasource
    -   asserts:
            -   equal:
                    path: metadata.namespace
                    value: observability
            -   equal:
                    path: spec.podSelector
                    value: {}
            -   notExists:
                    path: spec.ingress
        documentSelector:
            path: metadata.name
            value: default-deny-ingress
        it: Denies every other ingress by default, namespace-wide
    -   asserts:
            -   failedTemplate:
                    errorPattern: grafana.networkPolicy.enabled.*must be true when Grafana is exposed
        it: Fails when Grafana is exposed by a service type and its own policy is off
        set:
            grafana.service.type: LoadBalancer
    -   asserts:
            -   failedTemplate:
                    errorPattern: grafana.networkPolicy.enabled.*must be true when Grafana is exposed
        it: Fails when Grafana is exposed by an enabled route and its own policy is off
        set:
            grafana.route.main.enabled: true
    -   asserts:
            -   failedTemplate:
                    errorPattern: grafana.networkPolicy.enabled.*must be true when Grafana is exposed
        it: Fails when Grafana is exposed by an ingress and its own policy is off
        set:
            grafana.ingress.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits both policies on a cloud other than GCP, where alloy scrapes from inside the namespace
        set:
            cloudProvider: aws
    -   asserts:
            -   hasDocuments:
                    count: 2
        it: Renders exactly the frontend allow and the namespace-wide default-deny, unconditionally on GCP
    -   asserts:
            -   hasDocuments:
                    count: 2
        it: Renders when Grafana is exposed and its own policy is on
        set:
            grafana.ingress.enabled: true
            grafana.networkPolicy.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Skips the exposure check on a cloud other than GCP, where no deny is rendered
        set:
            cloudProvider: aws
            grafana.ingress.enabled: true