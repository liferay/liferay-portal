suite: Alloy remote write secret
templates:
    -   templates/alloy/secret.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the remote write secret on Azure
        set:
            alloy.enabled: true
            alloy.remoteWrite.bearerToken: token
            cloudProvider: azure
    -   asserts:
            -   equal:
                    path: stringData["bearer-token"]
                    value: token
        it: Renders the remote write secret for an unrecognized cloud provider
        set:
            alloy.enabled: true
            alloy.remoteWrite.bearerToken: token
            cloudProvider: alibaba