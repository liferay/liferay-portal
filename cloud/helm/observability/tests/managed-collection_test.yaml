release:
    name: my-release
    namespace: my-namespace
suite: Azure managed collection
templates:
    -   templates/azure/managed-collection.yaml
tests:
    -   asserts:
            -   contains:
                    content:
                        replacement: liferay
                        targetLabel: job
                    path: spec.podMetricsEndpoints[0].relabelings
            -   equal:
                    path: spec.namespaceSelector.any
                    value: true
            -   equal:
                    path: spec.podMetricsEndpoints[0].interval
                    value: 1m
            -   equal:
                    path: spec.podMetricsEndpoints[0].path
                    value: /metrics
            -   equal:
                    path: spec.podMetricsEndpoints[0].port
                    value: metrics
            -   equal:
                    path: spec.selector.matchLabels.component
                    value: liferay
        it: Configures the liferay PodMonitor endpoint and selector
        set:
            cloudProvider: azure
    -   asserts:
            -   equal:
                    path: spec.labelLimit
                    value: 63
            -   equal:
                    path: spec.labelNameLengthLimit
                    value: 511
            -   equal:
                    path: spec.labelValueLengthLimit
                    value: 1023
        it: Emits the label limits the workspace enforces
        set:
            cloudProvider: azure
    -   asserts:
            -   equal:
                    path: apiVersion
                    value: azmonitoring.coreos.com/v1
            -   equal:
                    path: metadata.name
                    value: my-release-observability-liferay
            -   equal:
                    path: metadata.namespace
                    value: my-namespace
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: PodMonitor
        it: Renders a single PodMonitor for the liferay scrape target
        set:
            cloudProvider: azure
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the PodMonitor when the liferay scrape is disabled
        set:
            alloy.scrape.liferay.enabled: false
            cloudProvider: azure
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the PodMonitor when the cloud provider is aws
        set:
            cloudProvider: aws
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the PodMonitor when the cloud provider is gcp
        set:
            cloudProvider: gcp
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the PodMonitor when the cloud provider is unset