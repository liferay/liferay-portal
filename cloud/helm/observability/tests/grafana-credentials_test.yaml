suite: Grafana credentials
templates:
    -   templates/grafana/smtp-credentials.yaml
    -   templates/grafana/sso-credentials.yaml
tests:
    -   asserts:
            -   failedTemplate:
                    errorMessage: "\"smtp.credentialsSecretKey\" must be set when \"smtp.enabled\" is \"true\""
                template: templates/grafana/smtp-credentials.yaml
        it: Fails when SMTP is enabled without a credentials secret key
        set:
            clusterSecretStore.name: example-secret-store
            smtp.enabled: true
    -   asserts:
            -   failedTemplate:
                    errorMessage: "\"clusterSecretStore.name\" must be set when \"sso.enabled\" is \"true\""
                template: templates/grafana/sso-credentials.yaml
        it: Fails when SSO is enabled without a cluster secret store
        set:
            sso.credentialsSecretKey: grafana-oidc
            sso.enabled: true
    -   asserts:
            -   equal:
                    path: spec.target.template.data
                    value:
                        GF_AUTH_OKTA_CLIENT_ID: "{{ .client_id }}"
                        GF_AUTH_OKTA_CLIENT_SECRET: "{{ .client_secret }}"
                        GF_AUTH_OKTA_ENABLED: "true"
                template: templates/grafana/sso-credentials.yaml
        it: Names the SSO environment variables after the provider
        set:
            clusterSecretStore.name: example-secret-store
            sso.credentialsSecretKey: grafana-oidc
            sso.enabled: true
            sso.provider: okta
    -   asserts:
            -   equal:
                    path: spec.secretStoreRef.name
                    value: example-secret-store
                template: templates/grafana/smtp-credentials.yaml
            -   equal:
                    path: spec.dataFrom[0].extract.key
                    value: grafana-smtp
                template: templates/grafana/smtp-credentials.yaml
        it: Reads the SMTP credentials from the cluster secret store
        set:
            clusterSecretStore.name: example-secret-store
            smtp.credentialsSecretKey: grafana-smtp
            smtp.enabled: true
    -   asserts:
            -   equal:
                    path: spec.secretStoreRef.name
                    value: customer-secret-store
                template: templates/grafana/sso-credentials.yaml
            -   exists:
                    path: spec.target.template.data.GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                template: templates/grafana/sso-credentials.yaml
        it: Reads the SSO credentials from sso.secretStoreName over the cluster secret store
        set:
            clusterSecretStore.name: example-secret-store
            sso.credentialsSecretKey: grafana-oidc
            sso.enabled: true
            sso.secretStoreName: customer-secret-store
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Renders no credentials secrets when SMTP and SSO are disabled