suite: Grafana service account
templates:
    -   charts/grafana/templates/serviceaccount.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.annotations["azure.workload.identity/client-id"]
                    value: 00000000-0000-0000-0000-000000000000
        it: Annotates the service account with the Azure identity client ID
        set:
            grafana:
                serviceAccount:
                    annotations:
                        azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000