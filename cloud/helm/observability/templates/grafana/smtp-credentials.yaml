{{- if .Values.smtp.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    labels:
        {{- include "observability.labels" . | nindent 8 }}
    name: grafana-smtp-credentials
    namespace: {{ include "observability.namespace" . | quote }}
spec:
    dataFrom:
        -   extract:
                key: {{ required "\"smtp.credentialsSecretKey\" must be set when \"smtp.enabled\" is \"true\"" .Values.smtp.credentialsSecretKey | quote }}
    refreshInterval: 1h0m0s
    secretStoreRef:
        kind: ClusterSecretStore
        name: {{ include "observability.clusterSecretStoreName" (dict "context" . "override" .Values.smtp.secretStoreName "reason" "\"smtp.enabled\" is \"true\"") | quote }}
    target:
        name: grafana-smtp-credentials
        template:
            data:
                GF_SMTP_ENABLED: "true"
                GF_SMTP_PASSWORD: "{{ `{{ .password }}` }}"
                GF_SMTP_USER: "{{ `{{ .user }}` }}"
            engineVersion: v2
{{- end -}}