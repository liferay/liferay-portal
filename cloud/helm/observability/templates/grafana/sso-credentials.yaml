{{- if .Values.sso.enabled -}}
{{- $prefix := printf "GF_AUTH_%s" (upper .Values.sso.provider) -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    labels:
        {{- include "observability.labels" . | nindent 8 }}
    name: grafana-sso-credentials
    namespace: {{ include "observability.namespace" . | quote }}
spec:
    dataFrom:
        -   extract:
                key: {{ required "\"sso.credentialsSecretKey\" must be set when \"sso.enabled\" is \"true\"" .Values.sso.credentialsSecretKey | quote }}
    refreshInterval: 1h0m0s
    secretStoreRef:
        kind: ClusterSecretStore
        name: {{ include "observability.clusterSecretStoreName" (dict "context" . "override" .Values.sso.secretStoreName "reason" "\"sso.enabled\" is \"true\"") | quote }}
    target:
        name: grafana-sso-credentials
        template:
            data:
                {{ $prefix }}_CLIENT_ID: "{{ `{{ .client_id }}` }}"
                {{ $prefix }}_CLIENT_SECRET: "{{ `{{ .client_secret }}` }}"
                {{ $prefix }}_ENABLED: "true"
            engineVersion: v2
{{- end -}}