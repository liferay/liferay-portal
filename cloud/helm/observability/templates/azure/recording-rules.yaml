{{- $cloudProvider := include "observability.cloudProvider" . -}}
{{- if and (eq $cloudProvider "azure") .Values.alerting.recordingRules -}}
{{- $location := required "azure.location must be set when cloudProvider=azure" .Values.azure.location -}}
{{- $matchedRules := list -}}
{{- $prometheusWorkspaceId := required "azure.prometheusWorkspaceId must be set when cloudProvider=azure" .Values.azure.prometheusWorkspaceId -}}
{{- $resourceGroupName := required "azure.resourceGroupName must be set when cloudProvider=azure" .Values.azure.resourceGroupName -}}
{{- range $rule := .Values.alerting.recordingRules -}}
{{- if or (not $rule.cloudProvider) (eq $rule.cloudProvider $cloudProvider) -}}
{{- $matchedRules = append $matchedRules $rule -}}
{{- end -}}
{{- end -}}
{{- if $matchedRules -}}
apiVersion: alertsmanagement.azure.m.upbound.io/v1beta1
kind: MonitorAlertPrometheusRuleGroup
metadata:
    annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    labels:
        {{- include "observability.labels" . | nindent 8 }}
    name: {{ printf "%s-recording-rules" (include "observability.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
    namespace: {{ include "observability.namespace" . | quote }}
spec:
    forProvider:
        interval: {{ printf "PT%s" (.Values.alerting.interval | upper) | quote }}
        location: {{ $location | quote }}
        resourceGroupName: {{ $resourceGroupName | quote }}
        rule:
            {{- range $matchedRules }}
            -   expression: |
                    {{- .expr | nindent 20 }}
                record: {{ .record | quote }}
            {{- end }}
        ruleGroupEnabled: true
        scopes:
            -   {{ $prometheusWorkspaceId | quote }}
    providerConfigRef:
        kind: ClusterProviderConfig
        name: default
{{- end -}}
{{- end -}}