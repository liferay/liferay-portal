{{- if eq (include "observability.cloudProvider" .) "azure" -}}
{{- $azure := .Values.azure -}}
{{- $scrape := .Values.alloy.scrape -}}
{{- $interval := .Values.alloy.scrapeInterval -}}
{{- if $scrape.liferay.enabled }}
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
    labels:
        {{- include "observability.labels" . | nindent 8 }}
    name: {{ printf "%s-liferay" (include "observability.fullname" .) | trunc 63 | trimSuffix "-" }}
    namespace: {{ include "observability.namespace" . | quote }}
spec:
    labelLimit: {{ $azure.labelLimit }}
    labelNameLengthLimit: {{ $azure.labelNameLengthLimit }}
    labelValueLengthLimit: {{ $azure.labelValueLengthLimit }}
    namespaceSelector:
        any: true
    podMetricsEndpoints:
        -   interval: {{ $interval | quote }}
            path: {{ $scrape.liferay.path | quote }}
            port: {{ $azure.scrape.liferay.portName | quote }}
            relabelings:
                -   replacement: liferay
                    targetLabel: job
    selector:
        matchLabels:
            {{- toYaml $scrape.liferay.matchLabels | nindent 12 }}
{{- end }}
{{- end -}}