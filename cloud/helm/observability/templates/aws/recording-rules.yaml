{{- $cloudProvider := include "observability.cloudProvider" . -}}
{{- if and (eq $cloudProvider "aws") .Values.alerting.recordingRules .Values.aws.ampWorkspaceID -}}
{{- $matchedRules := list -}}
{{- range $rule := .Values.alerting.recordingRules -}}
{{- if or (not $rule.cloudProvider) (eq $rule.cloudProvider $cloudProvider) -}}
{{- $matchedRules = append $matchedRules $rule -}}
{{- end -}}
{{- end -}}
{{- if $matchedRules -}}
apiVersion: prometheusservice.services.k8s.aws/v1alpha1
kind: RuleGroupsNamespace
metadata:
    labels:
        {{- include "observability.labels" . | nindent 8 }}
    name: {{ printf "%s-recording-rules" (include "observability.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
spec:
    configuration: |
        groups:
            -   interval: {{ .Values.alerting.interval | quote }}
                name: liferay-recording-rules
                rules:
                    {{- range $matchedRules }}
                    -   expr: |
                            {{- .expr | nindent 28 }}
                        record: {{ .record | quote }}
                    {{- end }}
    name: liferay-recording-rules
    workspaceID: {{ .Values.aws.ampWorkspaceID | quote }}
{{- end -}}
{{- end -}}