{{- $cloudProvider := include "observability.cloudProvider" . -}}
{{- if and (eq $cloudProvider "gcp") .Values.alerting.recordingRules -}}
{{- $matchedRules := dict "ClusterRules" (list) "GlobalRules" (list) -}}
{{- range $rule := .Values.alerting.recordingRules -}}
{{- if or (not $rule.cloudProvider) (eq $rule.cloudProvider $cloudProvider) -}}
{{- $kind := ternary "GlobalRules" "ClusterRules" (eq ($rule.scope | default "") "global") -}}
{{- $_ := set $matchedRules $kind (append (get $matchedRules $kind) $rule) -}}
{{- end -}}
{{- end -}}
{{- range $kind, $rules := $matchedRules }}
{{- if $rules }}
---
apiVersion: monitoring.googleapis.com/v1
kind: {{ $kind }}
metadata:
    labels:
        {{- include "observability.labels" $ | nindent 8 }}
    name: {{ printf "%s-recording-rules" (include "observability.fullname" $) | trunc 63 | trimSuffix "-" | quote }}
spec:
    groups:
        -   interval: {{ $.Values.alerting.interval | quote }}
            name: liferay-recording-rules
            rules:
                {{- range $rules }}
                -   expr: |
                        {{- .expr | nindent 24 }}
                    record: {{ .record | quote }}
                {{- end }}
{{- end }}
{{- end }}
{{- end -}}