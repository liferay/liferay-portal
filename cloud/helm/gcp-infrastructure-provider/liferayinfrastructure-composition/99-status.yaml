{{- $isDatabaseBootstrapped := false }}
{{- range $condition := dig (printf "liferay-db-grant-job-%s" $activeDataPlane) "resource" "status" "conditions" list $observedResources }}
    {{- if and (eq $condition.type "Ready") (eq $condition.status "True") }}
        {{- $isDatabaseBootstrapped = true }}
    {{- end }}
{{- end }}
{{- if $isDatabaseBootstrapped }}
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
    annotations:
        crossplane.io/external-name: {{ $baseName }}-managed-service-details-secret
        gotemplating.fn.crossplane.io/composition-resource-name: managed-service-details-secret
    name: {{ $baseName }}-managed-service-details-secret
spec:
    forProvider:
        manifest:
            apiVersion: v1
            data:
                DATABASE_ENDPOINT: {{ "localhost" | b64enc | quote }}
                DATABASE_INSTANCE_NAME: {{ dig (printf "database-primary-%s" $activeDataPlane) "resource" "status" "atProvider" "connectionName" "" $observedResources | b64enc | quote }}
                DATABASE_PORT: {{ $databasePort | b64enc | quote }}
                DATABASE_USERNAME: {{ $databaseIamUser | toString | b64enc | quote }}
                LIFERAY_GCS_BUCKET_NAME: {{ printf "%s-dl-%s" $baseName $activeDataPlane | b64enc | quote }}
            kind: Secret
            metadata:
                name: managed-service-details
                namespace: {{ $namespace }}
            type: Opaque
    managementPolicies: {{ $managementPolicies }}
{{- end }}
---
apiVersion: liferay.com/v1alpha1
kind: LiferayInfrastructure
status:
    managedServiceDetailsReady: {{ $isDatabaseBootstrapped }}