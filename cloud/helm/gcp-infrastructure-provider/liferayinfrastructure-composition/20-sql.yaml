{{- $database := $xr.spec.database }}
{{- $databaseInstanceNameFormat := printf "%s-db-instance-%%s" $xr.metadata.name }}
{{- $availabilityType := $database.availabilityType | default "ZONAL" }}
{{- $edition := $database.edition | default "ENTERPRISE" }}
{{- $instanceType := $database.instanceType | default "db-custom-1-3840" }}

{{- if and (eq $edition "ENTERPRISE_PLUS") (not (hasPrefix "db-perf-optimized-" $instanceType)) }}
{{- fail (printf "database.edition=ENTERPRISE_PLUS requires a db-perf-optimized-* instance type (got %q)" $instanceType) }}
{{- end }}

{{- range $i, $dataPlane := $dataPlanes }}
{{- $databaseInstanceName := printf $databaseInstanceNameFormat $dataPlane }}
{{- if $i }}
---
{{- end }}
apiVersion: sql.gcp.m.upbound.io/v1beta1
kind: DatabaseInstance
metadata:
    annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: database-primary-{{ $dataPlane }}
    labels:
        {{- $labels | toYaml | nindent 8 }}
        dataPlane: {{ $dataPlane }}
    name: {{ $databaseInstanceName }}
spec:
    forProvider:
        databaseVersion: {{ $database.databaseVersion | default "POSTGRES_18" }}
        deletionProtection: {{ and ($database.deletionProtection | default ($xr.spec.deletionProtection | default false)) (eq $dataPlane $activeDataPlane) }}
        {{- if $cmkEnabled }}
        encryptionKmsKeyName: {{ $cmkKeyName }}
        {{- end }}
        region: {{ $region }}
        rootPasswordSecretRef:
            key: password
            name: {{ $database.rootPasswordSecretName }}
        settings:
            availabilityType: {{ $availabilityType }}
            backupConfiguration:
                backupRetentionSettings:
                    retainedBackups: 7
                enabled: true
                pointInTimeRecoveryEnabled: true
                transactionLogRetentionDays: 7
            databaseFlags:
                -   name: cloudsql.iam_authentication
                    value: "on"
            diskSize: {{ $database.storageGB | default 10 }}
            diskType: PD_SSD
            edition: {{ $edition }}
            insightsConfig:
                queryInsightsEnabled: {{ $database.queryInsightsEnabled | default true }}
            ipConfiguration:
                ipv4Enabled: false
                privateNetwork: projects/{{ $env.projectId }}/global/networks/{{ $env.vpcName }}
                sslMode: TRUSTED_CLIENT_CERTIFICATE_REQUIRED
            retainBackupsOnDelete: true
            tier: {{ $instanceType }}
            userLabels:
                {{- $backupTargetLabels | toYaml | nindent 16 }}
                active: {{ printf "%t" (eq $dataPlane $activeDataPlane) | quote }}
    managementPolicies: {{ $xr.spec.backup.enabled | ternary ((list "*") | toJson) $managementPolicies }}
---
apiVersion: sql.gcp.m.upbound.io/v1beta1
kind: Database
metadata:
    annotations:
        crossplane.io/external-name: {{ $databaseName }}
        gotemplating.fn.crossplane.io/composition-resource-name: liferay-db-{{ $dataPlane }}
    labels:
        {{- $labels | toYaml | nindent 8 }}
        dataPlane: {{ $dataPlane }}
    name: {{ $xr.metadata.name }}-db-{{ $dataPlane }}
spec:
    forProvider:
        charset: UTF8
        collation: en_US.UTF8
        instanceSelector:
            matchLabels:
                dataPlane: {{ $dataPlane }}
    managementPolicies: ["Create", "Observe", "Update"]
{{- if not (and (eq $dataPlane $targetActiveDataPlane) (eq $restorePhase "provisioning")) }}
---
apiVersion: sql.gcp.m.upbound.io/v1beta1
kind: User
metadata:
    annotations:
        crossplane.io/external-name: {{ $databaseIamUser }}
        gotemplating.fn.crossplane.io/composition-resource-name: liferay-iam-user-{{ $dataPlane }}
    labels:
        {{- $labels | toYaml | nindent 8 }}
        dataPlane: {{ $dataPlane }}
    name: {{ $xr.metadata.name }}-db-user-{{ $dataPlane }}
spec:
    forProvider:
        instanceSelector:
            matchLabels:
                dataPlane: {{ $dataPlane }}
        type: CLOUD_IAM_SERVICE_ACCOUNT
    managementPolicies: ["Create", "Observe", "Update"]
{{- end }}
{{- end }}
{{- range $dataPlane := list "blue" "green" }}
{{- $databaseInstanceName := printf $databaseInstanceNameFormat $dataPlane }}
{{- if or (has $dataPlane $dataPlanes) (hasKey $observedResources (printf "liferay-db-%s" $dataPlane)) }}
---
apiVersion: protection.crossplane.io/v1beta1
kind: Usage
metadata:
    annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: usage-instance-by-database-{{ $dataPlane }}
    name: {{ $xr.metadata.name }}-instance-by-database-{{ $dataPlane }}
    namespace: {{ $namespace }}
spec:
    by:
        apiVersion: sql.gcp.m.upbound.io/v1beta1
        kind: Database
        resourceRef:
            name: {{ $xr.metadata.name }}-db-{{ $dataPlane }}
    of:
        apiVersion: sql.gcp.m.upbound.io/v1beta1
        kind: DatabaseInstance
        resourceRef:
            name: {{ $databaseInstanceName }}
{{- end }}
{{- if and (or (has $dataPlane $dataPlanes) (hasKey $observedResources (printf "liferay-iam-user-%s" $dataPlane))) (not (and (eq $restorePhase "provisioning") (eq $dataPlane $targetActiveDataPlane))) }}
---
apiVersion: protection.crossplane.io/v1beta1
kind: Usage
metadata:
    annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: usage-instance-by-user-{{ $dataPlane }}
    name: {{ $xr.metadata.name }}-instance-by-user-{{ $dataPlane }}
    namespace: {{ $namespace }}
spec:
    by:
        apiVersion: sql.gcp.m.upbound.io/v1beta1
        kind: User
        resourceRef:
            name: {{ $xr.metadata.name }}-db-user-{{ $dataPlane }}
    of:
        apiVersion: sql.gcp.m.upbound.io/v1beta1
        kind: DatabaseInstance
        resourceRef:
            name: {{ $databaseInstanceName }}
{{- end }}
{{- end }}