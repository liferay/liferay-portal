{{- range $i, $dataPlane := $dataPlanes }}
{{- if $i }}
---
{{- end }}
apiVersion: storage.gcp.m.upbound.io/v1beta1
kind: Bucket
metadata:
    annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: liferay-gcs-bucket-{{ $dataPlane }}
    labels:
        dataPlane: {{ $dataPlane }}
    name: {{ $baseName }}-dl-{{ $dataPlane }}
spec:
    forProvider:
        {{- if $cmkEnabled }}
        encryption:
            defaultKmsKeyName: {{ $cmkKeyName }}
        {{- end }}
        forceDestroy: {{ or $forceDestroy (ne $dataPlane $activeDataPlane) }}
        labels:
            {{- merge (dict "active" (eq $dataPlane $activeDataPlane | toString)) $backupTargetLabels $xr.spec.storage.tags | toYaml | nindent 12 }}
        location: {{ $region }}
        storageClass: STANDARD
        uniformBucketLevelAccess: true
        versioning:
            enabled: true
    managementPolicies: {{ $managementPolicies }}
---
apiVersion: storage.gcp.m.upbound.io/v1beta1
kind: BucketIAMMember
metadata:
    annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: liferay-gcs-iam-{{ $dataPlane }}
    labels:
        dataPlane: {{ $dataPlane }}
spec:
    forProvider:
        bucketSelector:
            matchLabels:
                dataPlane: {{ $dataPlane }}
        member: serviceAccount:{{ $gsaEmail }}
        role: roles/storage.admin
    managementPolicies: {{ $managementPolicies }}
{{- end }}