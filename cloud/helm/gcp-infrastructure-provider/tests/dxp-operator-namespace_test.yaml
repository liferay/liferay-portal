release:
    name: my-release
    namespace: my-namespace
suite: DXPOperatorNamespace
templates:
    -   templates/dxp-operator-namespace.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-120"
            -   equal:
                    path: metadata.labels["pod-security.kubernetes.io/enforce"]
                    value: restricted
            -   equal:
                    path: metadata.labels.name
                    value: dxp-operator-system
            -   equal:
                    path: metadata.name
                    value: dxp-operator-system
            -   isKind:
                    of: Namespace
        it: Creates the operator namespace ahead of the operator workload
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the namespace when the namespace override is empty
        set:
            liferay-dxp-operator:
                namespaceOverride: ""
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the namespace when the namespace override matches the release namespace
        set:
            liferay-dxp-operator:
                namespaceOverride: my-namespace
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the namespace when the operator is disabled
        set:
            liferay-dxp-operator:
                enabled: false
    -   asserts:
            -   equal:
                    path: metadata.labels.name
                    value: liferay-operator-system
            -   equal:
                    path: metadata.name
                    value: liferay-operator-system
        it: Renders the namespace declared by the namespace override
        set:
            liferay-dxp-operator:
                namespaceOverride: liferay-operator-system