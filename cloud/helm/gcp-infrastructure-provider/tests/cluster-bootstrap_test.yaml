release:
    name: my-release
    namespace: crossplane-system
suite: Cluster Bootstrap DaemonSet
templates:
    -   templates/cluster-bootstrap.yaml
tests:
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.template.spec.initContainers[0].command[2]
                    pattern: vm.max_map_count=262144
        it: Applies an overridden bootstrap script
        set:
            clusterBootstrap.script: |
                sysctl -w vm.max_map_count=262144
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                isKind:
                    of: DaemonSet
            -   documentIndex: 0
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-120"
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: cluster-bootstrap
            -   documentIndex: 0
                equal:
                    path: metadata.namespace
                    value: cluster-bootstrap-system
            -   documentIndex: 1
                isKind:
                    of: Namespace
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: cluster-bootstrap-system
        it: Creates the bootstrap DaemonSet and its namespace by default
    -   asserts:
            -   documentIndex: 0
                equal:
                    path: spec.template.spec.containers[0].image
                    value: registry.k8s.io/pause:3.9
            -   documentIndex: 0
                equal:
                    path: spec.template.spec.nodeSelector["kubernetes.io/os"]
                    value: linux
        it: Holds the pod open on every Linux node so later nodes are bootstrapped too
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the bootstrap when disabled
        set:
            clusterBootstrap.enabled: false
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.template.spec.initContainers[0].command[2]
                    pattern: vm.max_map_count=1048576
        it: Raises the virtual memory areas Elasticsearch requires
    -   asserts:
            -   documentIndex: 0
                equal:
                    path: spec.template.spec.initContainers[0].image
                    value: alpine:3
            -   documentIndex: 0
                equal:
                    path: spec.template.spec.initContainers[0].securityContext.privileged
                    value: true
            -   documentIndex: 0
                equal:
                    path: spec.template.spec.initContainers[0].securityContext.runAsUser
                    value: 0
        it: Runs the sysctl privileged, since the node kernel parameter is not namespaced