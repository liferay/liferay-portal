release:
    name: my-release
    namespace: crossplane-system
suite: Compositions
templates:
    -   templates/compositions.yaml
tests:
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "-   \"\\{\\{ dig \"status\" \"atProvider\" \"connectionName\" \"\" \\$[A-Za-z]+ \\}\\}\""
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$[A-Za-z]+ := dig \\(printf \"database-primary-%s\" \\$activeDataPlane\\) \"resource\" \"status\" \"atProvider\" \"connectionName\" \"\" \\$[A-Za-z]+"
        it: Connects to the database instance by the connection name Cloud SQL reports
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "edition: \\{\\{ hasPrefix \"db-perf-optimized-\" \\$[A-Za-z]+ \\| ternary \"ENTERPRISE_PLUS\" \"ENTERPRISE\" \\}\\}"
        it: Derives the Cloud SQL edition from the instance type
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "age: \\{\\{ add \\$backup\\.retentionDays 2 \\}\\}"
        it: Expires the document library backups two days after the retention period
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: liferay-infrastructure
            -   documentIndex: 0
                equal:
                    path: spec.compositeTypeRef.kind
                    value: LiferayInfrastructure
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "composition-resource-name: database-primary-\\{\\{ \\$dataPlane \\}\\}\\s"
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: liferay-overlay
            -   documentIndex: 1
                equal:
                    path: spec.compositeTypeRef.kind
                    value: LiferayOverlay
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "composition-resource-name: liferay-overlay-bucket\\s"
        it: Implements the shared Liferay APIs through the packaged function pipeline
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "merge \\(dict \"is-backup-vault\" \"true\"\\) \\$[A-Za-z]+ \\$backup\\.vaultTags"
        it: Labels the backup vault as the vault over the vault tags
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "userLabels:\\s+\\{\\{- merge \\(dict \"active\" \\(eq \\$dataPlane \\$[A-Za-z]+ \\| toString\\)\\) \\$[A-Za-z]+ \\| toYaml"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "labels:\\s+\\{\\{- merge \\(dict \"active\" \\(eq \\$dataPlane \\$[A-Za-z]+ \\| toString\\)\\) \\$[A-Za-z]+ \\$xr\\.spec\\.storage\\.tags \\| toYaml"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$[A-Za-z]+ := merge \\(dict \"should-back-up\" \"true\"\\) \\$[A-Za-z]+ -\\}\\}"
        it: Labels the database and each bucket with their backup selection over the custom tags
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "managementPolicies: \\{\\{ \\$xr\\.spec\\.backup\\.enabled \\| ternary \\(\\(list \"\\*\"\\) \\| toJson\\) \\$managementPolicies \\}\\}"
        it: Lets Crossplane delete the database instance once backups are enabled even when orphaning on delete
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$[A-Za-z]+ := merge \\(dict \"app\" \"liferay\" \"deployment-name\" \\$env\\.deploymentName \"environment-id\" \\$environmentId \"project-id\" \\$projectId\\) \\$xr\\.spec\\.commonTags"
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "merge \\(dict \"app\" \"liferay\" \"deployment-name\" \\$env\\.deploymentName \"project-id\" \\$xr\\.spec\\.projectId\\) \\$xr\\.spec\\.commonTags"
        it: Lets the derived labels win over the common tags
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "databaseVersion: \\{\\{ printf \"POSTGRES_%s\" \\(\\$database\\.version \\| default \"18\"\\) \\}\\}"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "availabilityType: \\{\\{ \\$database\\.highAvailability \\| ternary \"REGIONAL\" \"ZONAL\" \\}\\}"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$[A-Za-z]+ := \\$database\\.instanceType \\| default \"db-custom-1-3840\""
        it: Maps the shared database fields onto the Cloud SQL instance
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "printf \"%s-overlay-%s\" \\$env\\.deploymentName \\(printf \"%\\.18s-%s\" \\$projectId \\(printf \"%s-%s-%s\" \\$env\\.projectId \\$env\\.deploymentName \\$projectId \\| sha256sum \\| trunc 6\\)\\)"
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "printf \"%s-overlay-%s\" \\$env\\.deploymentName \\(printf \"%\\.18s-%s\" \\$xr\\.spec\\.projectId \\(printf \"%s-%s-%s\" \\$env\\.projectId \\$env\\.deploymentName \\$xr\\.spec\\.projectId \\| sha256sum \\| trunc 6\\)\\)"
        it: Names the overlay bucket after the Liferay project in both compositions
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "deletionProtection: \\{\\{ and \\(not \\$forceDestroy\\) \\(eq \\$dataPlane \\$[A-Za-z]+\\) \\}\\}"
        it: Protects only the active database instance from deletion unless forceDestroy is set
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$[A-Za-z]+ := dig \"liferay-gsa\" \"resource\" \"status\" \"atProvider\" \"email\" \"\" \\$[A-Za-z]+"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$[A-Za-z]+ := dig \"liferay-gsa\" \"resource\" \"status\" \"atProvider\" \"member\" \"\" \\$[A-Za-z]+"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$[A-Za-z]+ := dig \"liferay-cryptokey\" \"resource\" \"status\" \"atProvider\" \"id\" \"\" \\$[A-Za-z]+"