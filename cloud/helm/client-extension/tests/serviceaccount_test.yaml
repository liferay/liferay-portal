release:
    name: my-release
    namespace: my-namespace
set:
    clientExtension:
        configs:
            com.liferay.client.extension.type.configuration.CETConfiguration~able:
                name: Able
        serviceId: able
    image:
        repository: liferay/jar-runner
        tag: 1.0.0
suite: ServiceAccount
templates:
    -   templates/deployment.yaml
    -   templates/serviceaccount.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 0
                template: templates/serviceaccount.yaml
            -   equal:
                    path: spec.template.spec.serviceAccountName
                    value: able
                template: templates/deployment.yaml
        it: Runs the pod with a specified service account without creating it
        set:
            serviceAccount:
                name: able
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-release-liferay-client-extension
                template: templates/serviceaccount.yaml
            -   equal:
                    path: spec.template.spec.serviceAccountName
                    value: my-release-liferay-client-extension
                template: templates/deployment.yaml
        it: Runs the pod with the created service account
        set:
            serviceAccount:
                create: true
    -   asserts:
            -   hasDocuments:
                    count: 0
                template: templates/serviceaccount.yaml
            -   notExists:
                    path: spec.template.spec.serviceAccountName
                template: templates/deployment.yaml
        it: Runs the pod with the namespace's default service account by default