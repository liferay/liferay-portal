release:
    name: my-release
    namespace: my-namespace
set:
    clientExtension:
        configs:
            com.liferay.client.extension.type.configuration.CETConfiguration~able:
                name: Able
        serviceId: able
    service:
        enabled: true
suite: Service
templates:
    -   templates/service.yaml
tests:
    -   asserts:
            -   failedTemplate:
                    errorMessage: workload.kind must be an enabled deployment when service.enabled is true
        it: Fails for a workload that is not a deployment
        set:
            workload:
                kind: CronJob