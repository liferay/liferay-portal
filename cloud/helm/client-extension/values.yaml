artifact:
    mounts: []
    pullPolicy: IfNotPresent
    reference: ""
clientExtension:
    configs: {}
    domain: ""
    dxpNamespace: ""
    serviceId: ""
    virtualInstanceId: liferay.com
fullnameOverride: ""
image:
    pullPolicy: IfNotPresent
    repository: ""
    tag: ""
imagePullSecrets: []
labels: {}
nameOverride: ""
network:
    enabled: false
    endpointRef: http
    gatewayName: ""
    hostnames: []
operatorServiceAccount:
    name: dxp-operator
    namespace: dxp-operator-system
podAnnotations: {}
podLabels: {}
service:
    enabled: false
    port: 80
    type: ClusterIP
serviceAccount:
    annotations: {}
    create: false
    name: ""
workload:
    affinity: {}
    backoffLimit: 6
    containerPort: 80
    enabled: true
    env: {}
    kind: Deployment
    livenessProbe: {}
    nodeSelector: {}
    podSecurityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
            type: RuntimeDefault
        sysctls:
            -   name: net.ipv4.ip_unprivileged_port_start
                value: "0"
    readinessProbe: {}
    replicas: 1
    resources: {}
    schedule: ""
    securityContext:
        allowPrivilegeEscalation: false
        capabilities:
            add:
                -   NET_BIND_SERVICE
            drop:
                -   ALL
    startupProbe: {}
    tolerations: []
    volumeMounts: []
    volumes: []