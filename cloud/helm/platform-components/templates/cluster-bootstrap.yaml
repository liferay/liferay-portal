{{- if .Values.clusterBootstrap.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-110"
    labels:
        {{- include "liferay-platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: cluster-bootstrap
    name: cluster-bootstrap
    namespace: cluster-bootstrap-system
spec:
    selector:
        matchLabels:
            app: cluster-bootstrap
    template:
        metadata:
            labels:
                app: cluster-bootstrap
        spec:
            containers:
                -   image: registry.k8s.io/pause:3.9
                    name: pause
                    resources:
                        {{- .Values.clusterBootstrap.resources | toYaml | nindent 24 }}
            initContainers:
                -   command:
                        -   sh
                        -   -c
                        -   |
                            sysctl -w vm.max_map_count=1048576
                    image: {{ .Values.clusterBootstrap.image }}
                    name: init-bootstraper
                    resources:
                        {{- .Values.clusterBootstrap.resources | toYaml | nindent 24 }}
                    securityContext:
                        privileged: true
                        runAsUser: 0
            nodeSelector:
                kubernetes.io/os: linux
---
apiVersion: v1
kind: Namespace
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-110"
    labels:
        {{- include "liferay-platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: cluster-bootstrap-system
    name: cluster-bootstrap-system
{{- end -}}