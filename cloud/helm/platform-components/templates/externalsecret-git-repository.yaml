{{- range $name, $config := dict "gitops" .Values.gitops.repository "infrastructure" .Values.gitops.infrastructureRepository }}
{{- if and $config.url $config.registerCredentials }}
{{- $credentialsSecretName := $config.credentialsSecretName }}
{{- $internalSecretName := $config.internalSecretName }}
{{- $method := $config.method }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        argocd.argoproj.io/sync-wave: "-90"
    labels:
        {{- include "liferay-platform.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $internalSecretName }}
    name: {{ $internalSecretName }}
    namespace: {{ $.Release.Namespace }}
spec:
    data:
{{- if eq $method "github_app" }}
    -   remoteRef:
            key: {{ $credentialsSecretName }}
            property: {{ $config.githubAppIdProperty }}
        secretKey: github_app_id
    -   remoteRef:
            key: {{ $credentialsSecretName }}
            property: {{ $config.githubAppInstallationIdProperty }}
        secretKey: github_app_installation_id
    -   remoteRef:
            key: {{ $credentialsSecretName }}
            property: {{ $config.githubAppPrivateKeyProperty }}
        secretKey: github_app_private_key
{{- else if eq $method "https" }}
    -   remoteRef:
            key: {{ $credentialsSecretName }}
            property: {{ $config.tokenProperty }}
        secretKey: password
    -   remoteRef:
            key: {{ $credentialsSecretName }}
            property: {{ $config.usernameProperty }}
        secretKey: username
{{- else if eq $method "ssh" }}
    -   remoteRef:
            decodingStrategy: Auto
            key: {{ $credentialsSecretName }}
            property: {{ $config.sshPrivateKeyProperty }}
        secretKey: ssh_private_key
{{- else }}
{{- fail (printf "Unsupported git repository auth method: %s" $method) }}
{{- end }}
    refreshInterval: 1h0m0s
    secretStoreRef:
        kind: ClusterSecretStore
        name: {{ include "liferay-platform.clusterSecretStoreName" $ }}
    target:
        creationPolicy: Owner
        name: {{ $internalSecretName }}
        template:
            data:
                {{- if eq $method "github_app" }}
                githubAppID: {{ `'{{ .github_app_id }}'` }}
                githubAppInstallationID: {{ `'{{ .github_app_installation_id }}'` }}
                githubAppPrivateKey: {{ `'{{ .github_app_private_key }}'` }}
                {{- end }}
                name: git-repo-{{ $name }}
                {{- if eq $method "https" }}
                password: {{ `'{{ .password }}'` }}
                {{- end }}
                {{- if eq $method "ssh" }}
                sshPrivateKey: {{ `'{{ .ssh_private_key }}'` }}
                {{- end }}
                type: git
                url: {{ $config.url }}
                {{- if eq $method "https" }}
                username: {{ `'{{ .username }}'` }}
                {{- end }}
            metadata:
                labels:
                    app.kubernetes.io/name: {{ $internalSecretName }}
                    argocd.argoproj.io/secret-type: repository
            type: Opaque
{{- end }}
{{- end }}