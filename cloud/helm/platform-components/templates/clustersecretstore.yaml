{{- if .Values.clusterSecretStore.enabled -}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
    annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        argocd.argoproj.io/sync-wave: "-90"
    labels:
        {{- include "liferay-platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "liferay-platform.clusterSecretStoreName" . }}
    name: {{ include "liferay-platform.clusterSecretStoreName" . }}
spec:
    provider:
        {{- toYaml .Values.clusterSecretStore.provider | nindent 8 }}
{{- end -}}