{{- if .Values.operatorApplications.crossplane.enabled -}}
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
        argocd.argoproj.io/sync-wave: "-90"
    labels:
        {{- include "liferay-platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: liferayoverlay-xrd
    name: liferayoverlays.liferay.com
spec:
    defaultCompositionRef:
        name: liferay-overlay
    group: liferay.com
    names:
        kind: LiferayOverlay
        plural: liferayoverlays
        shortNames:
            -   lfroverlay
            -   lro
        singular: liferayoverlay
    versions:
        -   name: v1alpha1
            referenceable: true
            schema:
                openAPIV3Schema:
                    properties:
                        spec:
                            properties:
                                commonTags:
                                    additionalProperties:
                                        type: string
                                    default: {}
                                    type: object
                                forceDestroy:
                                    default: false
                                    type: boolean
                                orphanOnDelete:
                                    default: false
                                    type: boolean
                                projectId:
                                    type: string
                                region:
                                    type: string
                            required:
                                -   projectId
                                -   region
                            type: object
                    type: object
            served: true
{{- end -}}