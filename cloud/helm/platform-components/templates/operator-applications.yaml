{{- range $key, $operator := include "liferay-platform.operators" . | fromYaml }}
{{- $config := index $.Values $key }}
{{- if $config.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-100"
    finalizers:
        -   resources-finalizer.argocd.argoproj.io
    labels:
        {{- include "liferay-platform.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $operator.name }}
    name: {{ $operator.name }}
    namespace: {{ $.Release.Namespace }}
spec:
    destination:
        namespace: {{ $config.namespace }}
        server: https://kubernetes.default.svc
    project: liferay-operator
    source:
        {{- include "liferay-platform.chartSource" (dict "chart" $operator.chart "repoURL" $config.repoURL "targetRevision" $config.targetRevision) | nindent 8 }}
        {{- with $config.values }}
        helm:
            valuesObject:
                {{- toYaml . | nindent 16 }}
        {{- end }}
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        {{- with $operator.namespaceLabels }}
        managedNamespaceMetadata:
            labels:
                {{- toYaml . | nindent 16 }}
        {{- end }}
        retry:
            backoff:
                duration: 30s
                factor: 2
                maxDuration: 10m
            limit: 10
        syncOptions:
            -   CreateNamespace=true
            -   ServerSideApply=true
{{- end }}
{{- end }}