{{- $repoURLs := list -}}
{{- range $operatorApplication := .Values.operatorApplications -}}
{{- $repoURLs = append $repoURLs $operatorApplication.repoURL -}}
{{- end -}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-110"
    labels:
        {{- include "liferay-platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: operator-appproject
    name: liferay-operator
    namespace: {{ .Release.Namespace }}
spec:
    clusterResourceWhitelist:
        -   group: "*"
            kind: "*"
    description:
        ArgoCD project for Liferay cloud native operators.
    destinations:
        {{- range $operatorApplication := .Values.operatorApplications }}
        -   namespace: {{ $operatorApplication.namespace }}
            server: https://kubernetes.default.svc
        {{- range $extraDestinationNamespace := $operatorApplication.extraDestinationNamespaces }}
        -   namespace: {{ $extraDestinationNamespace }}
            server: https://kubernetes.default.svc
        {{- end }}
        {{- end }}
    sourceRepos:
        {{- include "liferay-platform.sourceRepos" $repoURLs | nindent 8 }}