{{- $operators := include "liferay-platform.operators" . | fromYaml -}}
{{- $repoURLs := list -}}
{{- range $key, $operator := $operators -}}
{{- $config := index $.Values $key -}}
{{- $repoURLs = append $repoURLs $config.repoURL -}}
{{- with $config.crds -}}
{{- $repoURLs = append $repoURLs .repoURL -}}
{{- end -}}
{{- end -}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-110"
    labels:
        {{- include "liferay-platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: operator-appproject
    name: liferay-operator
    namespace: {{ .Release.Namespace }}
spec:
    clusterResourceWhitelist:
        -   group: "*"
            kind: "*"
    description:
        ArgoCD project for Liferay cloud native operators.
    destinations:
        {{- range $key, $operator := $operators }}
        -   namespace: {{ (index $.Values $key).namespace }}
            server: https://kubernetes.default.svc
        {{- range $extraDestinationNamespace := $operator.extraDestinationNamespaces }}
        -   namespace: {{ $extraDestinationNamespace }}
            server: https://kubernetes.default.svc
        {{- end }}
        {{- end }}
    sourceRepos:
        {{- include "liferay-platform.sourceRepos" $repoURLs | nindent 8 }}