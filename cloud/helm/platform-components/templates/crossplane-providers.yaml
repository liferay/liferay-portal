{{- if .Values.operatorApplications.crossplane.enabled -}}
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
    annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        argocd.argoproj.io/sync-wave: "-80"
    labels:
        {{- include "liferay-platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: kubernetes-provider-config
    name: default
spec:
    credentials:
        source: InjectedIdentity
{{- range $name, $provider := .Values.operatorApplications.crossplane.providers }}
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
    annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        argocd.argoproj.io/sync-wave: "-90"
    labels:
        {{- include "liferay-platform.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}-runtime-config
    name: {{ $name }}-runtime-config
spec:
    deploymentTemplate:
        spec:
            selector:
                matchLabels:
                    pkg.crossplane.io/provider: {{ $name }}
            template:
                metadata:
                    annotations:
                        {{- include "liferay-platform.crossplaneDeploymentRuntimeConfigAnnotations" $ | nindent 24 }}
                    labels:
                        pkg.crossplane.io/provider: {{ $name }}
                spec:
                    containers:
                        -   name: package-runtime
                            {{- with $provider.resources }}
                            resources:
                                {{- toYaml . | nindent 32 }}
                            {{- end }}
                            securityContext:
                                allowPrivilegeEscalation: false
                                capabilities:
                                    drop:
                                        -   ALL
                                privileged: false
                                readOnlyRootFilesystem: true
                    securityContext:
                        fsGroup: 2000
                        runAsGroup: 2000
                        runAsNonRoot: true
                        runAsUser: 2000
                        seccompProfile:
                            type: RuntimeDefault
                    {{- with $provider.serviceAccountName }}
                    serviceAccountName: {{ . }}
                    {{- end }}
    {{- with $provider.serviceAccountName }}
    serviceAccountTemplate:
        metadata:
            name: {{ . }}
    {{- end }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
    annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
        argocd.argoproj.io/sync-wave: "-90"
    labels:
        {{- include "liferay-platform.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    name: {{ $name }}
spec:
    package: {{ $provider.package }}
    runtimeConfigRef:
        name: {{ $name }}-runtime-config
    skipDependencyResolution: true
{{- end }}
{{- end -}}