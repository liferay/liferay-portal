{{- if .Values.operatorApplications.crossplane.enabled -}}
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
        argocd.argoproj.io/sync-wave: "-90"
    labels:
        {{- include "liferay-platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: liferayinfrastructure-xrd
    name: liferayinfrastructures.liferay.com
spec:
    defaultCompositionRef:
        name: liferay-infrastructure
    group: liferay.com
    names:
        kind: LiferayInfrastructure
        plural: liferayinfrastructures
        shortNames:
            -   lfrinfra
            -   lri
        singular: liferayinfrastructure
    versions:
        -   name: v1alpha1
            referenceable: true
            schema:
                openAPIV3Schema:
                    properties:
                        spec:
                            properties:
                                backup:
                                    default: {}
                                    properties:
                                        dayOfWeek:
                                            default: Sunday
                                            enum:
                                                -   Sunday
                                                -   Monday
                                                -   Tuesday
                                                -   Wednesday
                                                -   Thursday
                                                -   Friday
                                                -   Saturday
                                            type: string
                                        enabled:
                                            default: false
                                            type: boolean
                                        frequency:
                                            default: Daily
                                            enum:
                                                -   Daily
                                                -   Weekly
                                            type: string
                                        retentionDays:
                                            default: 30
                                            maximum: 3650
                                            minimum: 1
                                            type: integer
                                        timeOfDay:
                                            default: 05:00
                                            pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                                            type: string
                                        timeZone:
                                            default: UTC
                                            minLength: 1
                                            type: string
                                        vaultTags:
                                            additionalProperties:
                                                type: string
                                            default: {}
                                            type: object
                                    type: object
                                cmk:
                                    default:
                                        enabled: false
                                    properties:
                                        enabled:
                                            default: false
                                            type: boolean
                                    type: object
                                commonTags:
                                    additionalProperties:
                                        type: string
                                    default: {}
                                    type: object
                                database:
                                    default: {}
                                    properties:
                                        highAvailability:
                                            default: false
                                            type: boolean
                                        instanceType:
                                            minLength: 1
                                            type: string
                                        restore:
                                            nullable: true
                                            properties:
                                                pointInTime:
                                                    properties:
                                                        sourceDataPlane:
                                                            pattern: ^(blue|green)(-[0-9a-f]{6})?$
                                                            type: string
                                                        time:
                                                            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?Z$
                                                            type: string
                                                    required:
                                                        -   time
                                                    type: object
                                                snapshot:
                                                    properties:
                                                        id:
                                                            minLength: 1
                                                            type: string
                                                    required:
                                                        -   id
                                                    type: object
                                            type: object
                                            x-kubernetes-validations:
                                                -   message: restore must set exactly one of pointInTime or snapshot
                                                    rule: has(self.pointInTime) != has(self.snapshot)
                                        storageGB:
                                            default: 32
                                            type: integer
                                        version:
                                            type: string
                                    type: object
                                environmentId:
                                    minLength: 1
                                    type: string
                                forceDestroy:
                                    default: false
                                    type: boolean
                                orphanOnDelete:
                                    default: false
                                    type: boolean
                                overlayAccess:
                                    default: {}
                                    properties:
                                        enabled:
                                            default: false
                                            type: boolean
                                    type: object
                                projectId:
                                    minLength: 1
                                    type: string
                                restoreGeneration:
                                    nullable: true
                                    pattern: ^[0-9a-f]{6}$
                                    type: string
                                restorePhase:
                                    default: none
                                    enum:
                                        -   none
                                        -   promoting
                                        -   provisioning
                                    type: string
                                retainedDataPlanes:
                                    additionalProperties:
                                        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$
                                        type: string
                                    default: {}
                                    type: object
                                    x-kubernetes-validations:
                                        -   message: retainedDataPlanes keys must be blue or green, optionally followed by a hyphen and six hexadecimal digits
                                            rule: self.all(key, key.matches('^(blue|green)(-[0-9a-f]{6})?$'))
                                search:
                                    default: {}
                                    properties:
                                        engine:
                                            enum:
                                                -   elasticsearch
                                                -   opensearch
                                            type: string
                                        opensearch:
                                            default: {}
                                            properties:
                                                instanceCount:
                                                    default: 2
                                                    type: integer
                                                instanceType:
                                                    minLength: 1
                                                    type: string
                                                version:
                                                    default: "2.19"
                                                    pattern: ^[0-9]+\.[0-9]+$
                                                    type: string
                                                volumeSizeGB:
                                                    default: 20
                                                    type: integer
                                            type: object
                                    type: object
                                storage:
                                    default: {}
                                    properties:
                                        tags:
                                            additionalProperties:
                                                type: string
                                            default: {}
                                            type: object
                                    type: object
                                targetActiveDataPlane:
                                    default: blue
                                    enum:
                                        -   blue
                                        -   green
                                    type: string
                            required:
                                -   environmentId
                                -   projectId
                            type: object
                        status:
                            properties:
                                managedServiceDetailsReady:
                                    default: false
                                    type: boolean
                            type: object
                    type: object
            served: true
{{- end -}}