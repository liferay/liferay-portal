{{- if .Values.operatorApplications.crossplane.enabled -}}
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
        argocd.argoproj.io/sync-wave: "-90"
    labels:
        {{- include "liferay-platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: liferayinfrastructure-xrd
    name: liferayinfrastructures.liferay.com
spec:
    defaultCompositionRef:
        name: liferay-infrastructure
    group: liferay.com
    names:
        kind: LiferayInfrastructure
        plural: liferayinfrastructures
        shortNames:
            -   lfrinfra
            -   lri
        singular: liferayinfrastructure
    versions:
        -   name: v1alpha1
            referenceable: true
            schema:
                openAPIV3Schema:
                    properties:
                        spec:
                            properties:
                                backup:
                                    default: {}
                                    properties:
                                        dayOfWeek:
                                            enum:
                                                -   Sunday
                                                -   Monday
                                                -   Tuesday
                                                -   Wednesday
                                                -   Thursday
                                                -   Friday
                                                -   Saturday
                                            type: string
                                        enabled:
                                            default: false
                                            type: boolean
                                        frequency:
                                            default: Daily
                                            enum:
                                                -   Daily
                                                -   Weekly
                                            type: string
                                        retentionDays:
                                            default: 30
                                            maximum: 3650
                                            minimum: 1
                                            type: integer
                                        timeOfDay:
                                            default: 05:00
                                            pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                                            type: string
                                        timeZone:
                                            default: UTC
                                            minLength: 1
                                            type: string
                                        vaultTags:
                                            additionalProperties:
                                                type: string
                                            default: {}
                                            type: object
                                    type: object
                                    x-kubernetes-validations:
                                        -   message: dayOfWeek is required when frequency is Weekly
                                            rule: "!has(self.frequency) || self.frequency != 'Weekly' || has(self.dayOfWeek)"
                                cmk:
                                    default:
                                        enabled: false
                                    properties:
                                        enabled:
                                            default: false
                                            type: boolean
                                    type: object
                                commonTags:
                                    additionalProperties:
                                        type: string
                                    default: {}
                                    type: object
                                database:
                                    properties:
                                        authentication:
                                            default: password
                                            enum:
                                                -   password
                                                -   workloadIdentity
                                            type: string
                                        highAvailability:
                                            default: false
                                            type: boolean
                                        instanceType:
                                            minLength: 1
                                            type: string
                                        restorePointInTime:
                                            nullable: true
                                            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?Z$
                                            type: string
                                        storageGB:
                                            type: integer
                                        version:
                                            minLength: 1
                                            type: string
                                    required:
                                        -   instanceType
                                        -   storageGB
                                        -   version
                                    type: object
                                environmentId:
                                    minLength: 1
                                    type: string
                                forceDestroy:
                                    default: false
                                    type: boolean
                                orphanOnDelete:
                                    default: false
                                    type: boolean
                                overlayAccess:
                                    properties:
                                        enabled:
                                            default: false
                                            type: boolean
                                    type: object
                                projectId:
                                    minLength: 1
                                    type: string
                                region:
                                    minLength: 1
                                    type: string
                                restorePhase:
                                    enum:
                                        -   none
                                        -   promoting
                                        -   provisioning
                                    type: string
                                storage:
                                    properties:
                                        enableVersioning:
                                            default: true
                                            type: boolean
                                        tags:
                                            additionalProperties:
                                                type: string
                                            default: {}
                                            type: object
                                    type: object
                                targetActiveDataPlane:
                                    enum:
                                        -   blue
                                        -   green
                                    type: string
                            required:
                                -   database
                                -   environmentId
                                -   projectId
                                -   region
                                -   storage
                            type: object
                        status:
                            properties:
                                managedServiceDetailsReady:
                                    default: false
                                    type: boolean
                            type: object
                    type: object
            served: true
{{- end -}}