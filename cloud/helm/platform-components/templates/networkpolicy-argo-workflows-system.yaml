{{- $argoWorkflows := .Values.operatorApplications.argoWorkflows -}}
{{- if $argoWorkflows.enabled }}
{{- if .Values.observability.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    labels:
        {{- include "liferay-platform.labels" $ | nindent 8 }}
    name: argo-workflows-metrics-ingress
    namespace: {{ $argoWorkflows.namespace }}
spec:
    ingress:
        -   from:
                -   namespaceSelector:
                        matchLabels:
                            kubernetes.io/metadata.name: {{ .Values.observability.namespace }}
            ports:
                -   port: metrics
                    protocol: TCP
    podSelector:
        matchLabels:
            app.kubernetes.io/instance: {{ $argoWorkflows.name }}
            app.kubernetes.io/name: argo-workflows-workflow-controller
    policyTypes:
        -   Ingress
{{- end }}
{{- if .Values.argoWorkflows.gateway.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    labels:
        {{- include "liferay-platform.labels" $ | nindent 8 }}
    name: argo-workflows-gateway-proxy-ingress
    namespace: {{ $argoWorkflows.namespace }}
spec:
    ingress:
        -   ports:
                -   port: 10080
                    protocol: TCP
                -   port: 10443
                    protocol: TCP
                -   port: 10443
                    protocol: UDP
        {{- if .Values.observability.enabled }}
        -   from:
                -   namespaceSelector:
                        matchLabels:
                            kubernetes.io/metadata.name: {{ .Values.observability.namespace }}
                {{- with .Values.networkPolicy.metricsSources }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
            ports:
                -   port: metrics
                    protocol: TCP
        {{- end }}
    podSelector:
        matchLabels:
            app.kubernetes.io/managed-by: envoy-gateway
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-namespace: {{ $argoWorkflows.namespace }}
    policyTypes:
        -   Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    labels:
        {{- include "liferay-platform.labels" $ | nindent 8 }}
    name: argo-workflows-server-ingress
    namespace: {{ $argoWorkflows.namespace }}
spec:
    ingress:
        -   from:
                -   podSelector:
                        matchLabels:
                            app.kubernetes.io/managed-by: envoy-gateway
                            app.kubernetes.io/name: envoy
                            gateway.envoyproxy.io/owning-gateway-namespace: {{ $argoWorkflows.namespace }}
            ports:
                -   port: 2746
                    protocol: TCP
    podSelector:
        matchLabels:
            app.kubernetes.io/instance: {{ $argoWorkflows.name }}
            app.kubernetes.io/name: argo-workflows-server
    policyTypes:
        -   Ingress
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    labels:
        {{- include "liferay-platform.labels" $ | nindent 8 }}
    name: default-deny-ingress
    namespace: {{ $argoWorkflows.namespace }}
spec:
    podSelector: {}
    policyTypes:
        -   Ingress
{{- end -}}