release:
    name: my-release
    namespace: argocd-system
set:
    clusterSecretStore:
        name: liferay-test-secret-store
suite: ApplicationSets and AppProjects
templates:
    -   templates/application-infrastructure-provider.yaml
    -   templates/application-observability.yaml
    -   templates/applicationset-infrastructure.yaml
    -   templates/applicationset-liferay.yaml
    -   templates/applicationset-resources.yaml
    -   templates/appproject-application.yaml
    -   templates/appproject-infrastructure.yaml
    -   templates/appproject-operator.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-80"
                template: templates/application-infrastructure-provider.yaml
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-60"
                template: templates/applicationset-infrastructure.yaml
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-60"
                template: templates/applicationset-liferay.yaml
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-60"
                template: templates/applicationset-resources.yaml
        it: Assigns the infrastructure provider application an earlier sync wave than the ApplicationSets it feeds
    -   asserts:
            -   contains:
                    content: oci://us-central1-docker.pkg.dev/external-assets-nonprd/liferay-helm-chart
                    path: spec.sourceRepos
                template: templates/appproject-infrastructure.yaml
            -   contains:
                    content: oci://us-central1-docker.pkg.dev/external-assets-nonprd/liferay-helm-chart/**
                    path: spec.sourceRepos
                template: templates/appproject-infrastructure.yaml
            -   notContains:
                    content: oci://us-central1-docker.pkg.dev/external-assets-nonprd/liferay-helm-chart/lcd-12345/abc1234/liferay-azure-infrastructure-provider
                    path: spec.sourceRepos
                template: templates/appproject-infrastructure.yaml
        it: Collapses a commit pinned chart URL to its registry repository
        set:
            infrastructureProvider:
                repoURL: oci://us-central1-docker.pkg.dev/external-assets-nonprd/liferay-helm-chart/lcd-12345/abc1234/liferay-azure-infrastructure-provider
    -   asserts:
            -   equal:
                    path: spec.template.metadata.name
                    value: "{{path[1]}}-{{path[3]}}-infra"
                template: templates/applicationset-infrastructure.yaml
            -   equal:
                    path: spec.template.spec.destination.namespace
                    value: liferay-{{path[1]}}-{{path[3]}}
                template: templates/applicationset-infrastructure.yaml
            -   contains:
                    content:
                        name: environmentId
                        value: "{{path[3]}}"
                    path: spec.template.spec.sources[0].helm.parameters
                template: templates/applicationset-infrastructure.yaml
            -   equal:
                    path: spec.template.metadata.name
                    value: "{{path[1]}}-{{path[3]}}-app"
                template: templates/applicationset-liferay.yaml
            -   contains:
                    content:
                        name: liferay-default.network.gatewayName
                        value: "{{path[1]}}-{{path[3]}}-gateway"
                    path: spec.template.spec.sources[0].helm.parameters
                template: templates/applicationset-liferay.yaml
            -   equal:
                    path: spec.template.metadata.name
                    value: "{{path[1]}}-resources"
                template: templates/applicationset-resources.yaml
            -   equal:
                    path: spec.template.spec.destination.namespace
                    value: liferay-{{path[1]}}-resources
                template: templates/applicationset-resources.yaml
        it: Derives the application names and namespaces from the layout expressions
        set:
            gitops:
                layout:
                    environmentId: "{{path[3]}}"
                    projectId: "{{path[1]}}"
                repository:
                    url: https://github.com/example/liferay-gitops.git
            infrastructure:
                repoURL: oci://example-registry/liferay-azure-infrastructure
            liferay:
                repoURL: oci://example-registry/liferay-azure
    -   asserts:
            -   equal:
                    path: spec.template.spec.sources[0].helm.valueFiles
                    value:
                        -   $values/liferay/projects/{{path[2]}}/base/infrastructure.yaml
                        -   $values/{{path}}/infrastructure.yaml
                template: templates/applicationset-infrastructure.yaml
            -   equal:
                    path: spec.template.spec.sources[0].helm.valueFiles
                    value:
                        -   $values/liferay/projects/{{path[2]}}/base/liferay.yaml
                        -   $values/{{path}}/liferay.yaml
                template: templates/applicationset-liferay.yaml
            -   equal:
                    path: spec.template.spec.sources[0].helm.valueFiles
                    value:
                        -   $values/{{path}}/project.yaml
                template: templates/applicationset-resources.yaml
            -   equal:
                    path: spec.sources[0].helm.valueFiles
                    value:
                        -   $values/liferay/system/observability.yaml
                template: templates/application-observability.yaml
        it: Layers the values files from the base directory to the environment directory
        set:
            gitops:
                repository:
                    url: https://github.com/example/liferay-gitops.git
            infrastructure:
                repoURL: oci://example-registry/liferay-azure-infrastructure
            liferay:
                repoURL: oci://example-registry/liferay-azure
            observability:
                enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
                template: templates/application-infrastructure-provider.yaml
            -   hasDocuments:
                    count: 0
                template: templates/applicationset-infrastructure.yaml
            -   hasDocuments:
                    count: 0
                template: templates/applicationset-liferay.yaml
            -   hasDocuments:
                    count: 0
                template: templates/applicationset-resources.yaml
        it: Omits the Applications and ApplicationSets that can be disabled
        set:
            infrastructure.enabled: false
            infrastructureProvider.enabled: false
            liferay.enabled: false
    -   asserts:
            -   isEmpty:
                    path: spec.sourceRepos
                template: templates/appproject-application.yaml
            -   notContains:
                    content: /**
                    path: spec.sourceRepos
                template: templates/appproject-infrastructure.yaml
        it: Omits the unset repository URLs from the AppProject source repositories
    -   asserts:
            -   contains:
                    content:
                        name: deploymentContext.deploymentName
                        value: liferay-test
                    path: spec.sources[0].helm.parameters
                template: templates/application-infrastructure-provider.yaml
        it: Passes the deployment context to the infrastructure provider application
        set:
            deploymentContext:
                deploymentName: liferay-test
            infrastructureProvider:
                repoURL: oci://example-registry/liferay-azure-infrastructure-provider
    -   asserts:
            -   contains:
                    content:
                        namespace: elastic-system
                        server: https://kubernetes.default.svc
                    path: spec.destinations
                template: templates/appproject-operator.yaml
            -   contains:
                    content:
                        namespace: monitoring
                        server: https://kubernetes.default.svc
                    path: spec.destinations
                template: templates/appproject-operator.yaml
            -   notContains:
                    content:
                        namespace: kube-system
                        server: https://kubernetes.default.svc
                    path: spec.destinations
                template: templates/appproject-operator.yaml
            -   lengthEqual:
                    count: 9
                    path: spec.destinations
                template: templates/appproject-operator.yaml
        it: Permits the extra destination namespaces declared by an operator application
        set:
            operatorApplications.eckOperator.extraDestinationNamespaces:
                -   monitoring
            operatorApplications.keda.extraDestinationNamespaces: null
    -   asserts:
            -   contains:
                    content: https://charts.example.com
                    path: spec.sourceRepos
                template: templates/appproject-operator.yaml
            -   contains:
                    content: https://charts.example.com/**
                    path: spec.sourceRepos
                template: templates/appproject-operator.yaml
            -   notContains:
                    content: https://kedacore.github.io/charts
                    path: spec.sourceRepos
                template: templates/appproject-operator.yaml
        it: Reflects a repository URL override in the operator AppProject source repositories
        set:
            operatorApplications.keda.repoURL: https://charts.example.com
    -   asserts:
            -   hasDocuments:
                    count: 1
                template: templates/application-infrastructure-provider.yaml
            -   equal:
                    path: spec.destination.namespace
                    value: crossplane-system
                template: templates/application-infrastructure-provider.yaml
            -   equal:
                    path: spec.sources[0].helm.valueFiles
                    value:
                        -   $values/liferay/system/infrastructure-provider.yaml
                template: templates/application-infrastructure-provider.yaml
            -   equal:
                    path: spec.sources[1].ref
                    value: values
                template: templates/application-infrastructure-provider.yaml
            -   hasDocuments:
                    count: 1
                template: templates/applicationset-infrastructure.yaml
            -   equal:
                    path: spec.template.spec.project
                    value: liferay-infrastructure
                template: templates/applicationset-infrastructure.yaml
            -   contains:
                    content:
                        name: gateway.className
                        value: liferay-gateway-class
                    path: spec.template.spec.sources[0].helm.parameters
                template: templates/applicationset-infrastructure.yaml
            -   hasDocuments:
                    count: 1
                template: templates/applicationset-liferay.yaml
            -   equal:
                    path: spec.template.spec.project
                    value: liferay-application
                template: templates/applicationset-liferay.yaml
            -   contains:
                    content:
                        group: apps
                        kind: StatefulSet
                        managedFieldsManagers:
                            -   liferay-dxp-operator
                    path: spec.template.spec.ignoreDifferences
                template: templates/applicationset-liferay.yaml
            -   equal:
                    path: spec.template.spec.sources[1].ref
                    value: values
                template: templates/applicationset-liferay.yaml
            -   hasDocuments:
                    count: 1
                template: templates/applicationset-resources.yaml
            -   hasDocuments:
                    count: 1
                template: templates/appproject-application.yaml
            -   equal:
                    path: metadata.labels["app.kubernetes.io/name"]
                    value: liferay-appproject
                template: templates/appproject-application.yaml
            -   equal:
                    path: metadata.name
                    value: liferay-application
                template: templates/appproject-application.yaml
            -   equal:
                    path: metadata.namespace
                    value: argocd-system
                template: templates/appproject-application.yaml
            -   hasDocuments:
                    count: 1
                template: templates/appproject-infrastructure.yaml
            -   equal:
                    path: metadata.labels["app.kubernetes.io/name"]
                    value: infrastructure-appproject
                template: templates/appproject-infrastructure.yaml
            -   equal:
                    path: metadata.name
                    value: liferay-infrastructure
                template: templates/appproject-infrastructure.yaml
            -   equal:
                    path: metadata.namespace
                    value: argocd-system
                template: templates/appproject-infrastructure.yaml
            -   equal:
                    path: spec.destinations
                    value:
                        -   namespace: liferay-*
                            server: https://kubernetes.default.svc
                        -   namespace: crossplane-system
                            server: https://kubernetes.default.svc
                        -   namespace: envoy-gateway-system
                            server: https://kubernetes.default.svc
                        -   namespace: observability
                            server: https://kubernetes.default.svc
                template: templates/appproject-infrastructure.yaml
            -   contains:
                    content: oci://us-central1-docker.pkg.dev/external-assets-prd/liferay-helm-chart
                    path: spec.sourceRepos
                template: templates/appproject-infrastructure.yaml
            -   contains:
                    content: oci://us-central1-docker.pkg.dev/external-assets-prd/liferay-helm-chart/**
                    path: spec.sourceRepos
                template: templates/appproject-infrastructure.yaml
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-110"
                template: templates/appproject-operator.yaml
            -   equal:
                    path: metadata.labels["app.kubernetes.io/name"]
                    value: operator-appproject
                template: templates/appproject-operator.yaml
            -   equal:
                    path: metadata.name
                    value: liferay-operator
                template: templates/appproject-operator.yaml
            -   equal:
                    path: metadata.namespace
                    value: argocd-system
                template: templates/appproject-operator.yaml
            -   contains:
                    content:
                        namespace: ack-system
                        server: https://kubernetes.default.svc
                    path: spec.destinations
                template: templates/appproject-operator.yaml
            -   contains:
                    content:
                        namespace: keda-system
                        server: https://kubernetes.default.svc
                    path: spec.destinations
                template: templates/appproject-operator.yaml
            -   contains:
                    content:
                        namespace: kube-system
                        server: https://kubernetes.default.svc
                    path: spec.destinations
                template: templates/appproject-operator.yaml
            -   lengthEqual:
                    count: 9
                    path: spec.destinations
                template: templates/appproject-operator.yaml
            -   equal:
                    path: spec.sourceRepos
                    value:
                        -   oci://public.ecr.aws/aws-controllers-k8s/prometheusservice-chart
                        -   oci://public.ecr.aws/aws-controllers-k8s/prometheusservice-chart/**
                        -   https://argoproj.github.io/argo-helm
                        -   https://argoproj.github.io/argo-helm/**
                        -   https://charts.crossplane.io/stable
                        -   https://charts.crossplane.io/stable/**
                        -   oci://us-central1-docker.pkg.dev/external-assets-prd/liferay-helm-chart
                        -   oci://us-central1-docker.pkg.dev/external-assets-prd/liferay-helm-chart/**
                        -   https://helm.elastic.co
                        -   https://helm.elastic.co/**
                        -   oci://docker.io/envoyproxy/gateway-helm
                        -   oci://docker.io/envoyproxy/gateway-helm/**
                        -   https://charts.external-secrets.io
                        -   https://charts.external-secrets.io/**
                        -   https://kedacore.github.io/charts
                        -   https://kedacore.github.io/charts/**
                template: templates/appproject-operator.yaml
        it: Renders the ApplicationSets and AppProjects by default
    -   asserts:
            -   equal:
                    path: spec.generators[0].git.repoURL
                    value: https://github.com/example/liferay-gitops.git
                template: templates/applicationset-infrastructure.yaml
            -   contains:
                    content: https://github.com/example/liferay-gitops.git
                    path: spec.sourceRepos
                template: templates/appproject-application.yaml
            -   contains:
                    content: https://github.com/example/liferay-gitops.git
                    path: spec.sourceRepos
                template: templates/appproject-infrastructure.yaml
        it: Wires the ApplicationSets and AppProjects to the GitOps repository
        set:
            gitops:
                repository:
                    url: https://github.com/example/liferay-gitops.git
            infrastructure:
                repoURL: oci://example-registry/liferay-azure-infrastructure
            liferay:
                repoURL: oci://example-registry/liferay-azure