release:
    name: my-release
    namespace: argocd-system
suite: ArgoCD SSO ExternalSecret
templates:
    -   templates/externalsecret-argocd-sso.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the ExternalSecret by default
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: customer-idp-saml
            -   equal:
                    path: metadata.namespace
                    value: argocd-system
            -   equal:
                    path: spec.data[0].remoteRef.key
                    value: liferay-credentials-argocd-sso
            -   equal:
                    path: spec.data[0].remoteRef.property
                    value: caData
            -   equal:
                    path: spec.data[3].secretKey
                    value: ssoURL
            -   equal:
                    path: spec.secretStoreRef.name
                    value: liferay-test-secret-store
            -   equal:
                    path: spec.target.template.metadata.labels["app.kubernetes.io/part-of"]
                    value: argocd
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: ExternalSecret
        it: Pulls the SAML connector properties from the cluster secret store
        set:
            argocd:
                sso:
                    credentialsSecretKey: liferay-credentials-argocd-sso
                    enabled: true
            clusterSecretStores:
                liferay-test-secret-store: {}
            deploymentContext:
                deploymentName: liferay-test
    -   asserts:
            -   failedTemplate:
                    errorPattern: The value "clusterSecretStores" must define one store
        it: Rejects SSO when several stores mark more than one as the default
        set:
            argocd.sso.enabled: true
            clusterSecretStores:
                gcpsm-css:
                    default: true
                gcpsm-customer-css:
                    default: true
    -   asserts:
            -   failedTemplate:
                    errorPattern: The value "clusterSecretStores" must define one store
        it: Rejects SSO when several stores mark none as the default
        set:
            argocd.sso.enabled: true
            clusterSecretStores:
                gcpsm-css: {}
                gcpsm-customer-css: {}
    -   asserts:
            -   failedTemplate:
                    errorPattern: The value "clusterSecretStores" must define one store
        it: Rejects SSO without a cluster secret store
        set:
            argocd.sso.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 1
            -   isEmpty:
                    path: spec.data[0].remoteRef.key
        it: Renders an empty credentials key when none is configured
        set:
            argocd.sso.enabled: true
            clusterSecretStores:
                liferay-test-secret-store: {}
    -   asserts:
            -   equal:
                    path: spec.secretStoreRef.name
                    value: gcpsm-customer-css
        it: Uses the cluster secret store marked as the default
        set:
            argocd.sso.enabled: true
            clusterSecretStores:
                gcpsm-css: {}
                gcpsm-customer-css:
                    default: true
    -   asserts:
            -   equal:
                    path: spec.secretStoreRef.name
                    value: liferay-test-secret-store
        it: Uses the only cluster secret store without a default flag
        set:
            argocd.sso.enabled: true
            clusterSecretStores:
                liferay-test-secret-store: {}