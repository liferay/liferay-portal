release:
    name: my-release
    namespace: argocd-system
suite: ClusterSecretStore
templates:
    -   templates/clustersecretstore.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the ClusterSecretStore by default
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: gcpsm-css
            -   documentIndex: 0
                equal:
                    path: spec
                    value:
                        conditions:
                            -   namespaces:
                                    -   liferay-test
                        provider:
                            gcpsm:
                                projectID: liferaycloud-staging
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: gcpsm-customer-css
            -   documentIndex: 1
                equal:
                    path: spec
                    value:
                        provider:
                            gcpsm:
                                projectID: liferay-test-project
            -   documentIndex: 1
                notExists:
                    path: spec.default
        it: Renders a ClusterSecretStore per entry, named after its key, with the spec verbatim
        set:
            clusterSecretStores:
                gcpsm-css:
                    spec:
                        conditions:
                            -   namespaces:
                                    -   liferay-test
                        provider:
                            gcpsm:
                                projectID: liferaycloud-staging
                gcpsm-customer-css:
                    default: true
                    spec:
                        provider:
                            gcpsm:
                                projectID: liferay-test-project