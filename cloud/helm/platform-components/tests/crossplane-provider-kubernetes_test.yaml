release:
    name: my-release
    namespace: argocd-system
suite: Crossplane provider-kubernetes
templates:
    -   templates/crossplane-provider-kubernetes.yaml
tests:
    -   asserts:
            -   documentIndex: 1
                equal:
                    path: spec.deploymentTemplate.spec.template.metadata.annotations["sidecar.opentelemetry.io/inject"]
                    value: "false"
            -   documentIndex: 1
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.containers[0].resources.limits.memory
                    value: 2Gi
            -   documentIndex: 1
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.containers[0].securityContext.privileged
                    value: false
            -   documentIndex: 1
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
                    value: true
            -   documentIndex: 1
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.securityContext.fsGroup
                    value: 2000
            -   documentIndex: 1
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.securityContext.runAsUser
                    value: 2000
            -   documentIndex: 1
                equal:
                    path: spec.deploymentTemplate.spec.template.spec.serviceAccountName
                    value: provider-kubernetes
            -   documentIndex: 1
                equal:
                    path: spec.serviceAccountTemplate.metadata.name
                    value: provider-kubernetes
            -   documentIndex: 1
                notExists:
                    path: spec.deploymentTemplate.spec.template.metadata.labels["azure.workload.identity/use"]
        it: Hardens the provider-kubernetes runtime
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits provider-kubernetes when Crossplane is disabled
        set:
            operatorApplications.crossplane.enabled: false
    -   asserts:
            -   hasDocuments:
                    count: 3
            -   documentIndex: 0
                isAPIVersion:
                    of: kubernetes.m.crossplane.io/v1alpha1
            -   documentIndex: 0
                isKind:
                    of: ClusterProviderConfig
            -   documentIndex: 0
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-60"
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: default
            -   documentIndex: 0
                equal:
                    path: spec.credentials.source
                    value: InjectedIdentity
            -   documentIndex: 1
                isKind:
                    of: DeploymentRuntimeConfig
            -   documentIndex: 1
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-90"
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: kubernetes-config
            -   documentIndex: 2
                isKind:
                    of: Provider
            -   documentIndex: 2
                equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-90"
            -   documentIndex: 2
                equal:
                    path: spec.package
                    value: xpkg.upbound.io/upbound/provider-kubernetes:v1.2.0
            -   documentIndex: 2
                equal:
                    path: spec.runtimeConfigRef.name
                    value: kubernetes-config
            -   documentIndex: 2
                equal:
                    path: spec.skipDependencyResolution
                    value: true
        it: Renders the provider config, the runtime config, and the provider