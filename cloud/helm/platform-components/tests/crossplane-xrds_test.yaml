release:
    name: my-release
    namespace: argocd-system
suite: Crossplane XRDs
templates:
    -   templates/crossplane-xrd-liferayinfrastructure.yaml
    -   templates/crossplane-xrd-liferayoverlay.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.enabled.default
                    value: false
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.frequency.default
                    value: Daily
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.retentionDays.default
                    value: 30
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.retentionDays.maximum
                    value: 3650
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.retentionDays.minimum
                    value: 1
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeOfDay.default
                    value: 05:00
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeOfDay.pattern
                    value: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeZone.default
                    value: UTC
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeZone.minLength
                    value: 1
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.vaultTags.additionalProperties.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.dayOfWeek.enum
                    value:
                        -   Sunday
                        -   Monday
                        -   Tuesday
                        -   Wednesday
                        -   Thursday
                        -   Friday
                        -   Saturday
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.frequency.enum
                    value:
                        -   Daily
                        -   Weekly
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.default
                    value: {}
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.dayOfWeek.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.enabled.type
                    value: boolean
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.frequency.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.retentionDays.type
                    value: integer
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeOfDay.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeZone.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.vaultTags.type
                    value: object
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   notExists:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.dayOfWeek.default
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.x-kubernetes-validations[0].message
                    value: dayOfWeek is required when frequency is Weekly
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.x-kubernetes-validations[0].rule
                    value: "!has(self.frequency) || self.frequency != 'Weekly' || has(self.dayOfWeek)"
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
        it: Declares the provider neutral backup schedule contract
    -   asserts:
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.database.properties.restorePointInTime.nullable
                    value: true
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.database.properties.restorePointInTime.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   notContains:
                    content: restorePointInTime
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.database.required
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.database.properties.restorePointInTime.pattern
                    value: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?Z$
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   notExists:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.database.properties.restorePoint
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
        it: Declares the restore point as a timestamp the restore workflow writes
    -   asserts:
            -   isKind:
                    of: CompositeResourceDefinition
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-90"
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: metadata.name
                    value: liferayinfrastructures.liferay.com
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.defaultCompositionRef.name
                    value: liferay-infrastructure
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.group
                    value: liferay.com
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.names.kind
                    value: LiferayInfrastructure
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: metadata.name
                    value: liferayoverlays.liferay.com
                template: templates/crossplane-xrd-liferayoverlay.yaml
            -   equal:
                    path: spec.defaultCompositionRef.name
                    value: liferay-overlay
                template: templates/crossplane-xrd-liferayoverlay.yaml
            -   equal:
                    path: spec.names.kind
                    value: LiferayOverlay
                template: templates/crossplane-xrd-liferayoverlay.yaml
        it: Defines the cloud agnostic infrastructure APIs under the shared group
    -   asserts:
            -   hasDocuments:
                    count: 0
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   hasDocuments:
                    count: 0
                template: templates/crossplane-xrd-liferayoverlay.yaml
        it: Omits the XRDs when Crossplane is disabled
        set:
            operatorApplications.crossplane.enabled: false