release:
    name: my-release
    namespace: argocd-system
suite: Crossplane XRDs
templates:
    -   templates/crossplane-xrd-liferayinfrastructure.yaml
    -   templates/crossplane-xrd-liferayoverlay.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.enabled.default
                    value: false
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.frequency.default
                    value: Daily
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.retentionDays.default
                    value: 30
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.retentionDays.maximum
                    value: 3650
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.retentionDays.minimum
                    value: 1
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeOfDay.default
                    value: 05:00
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeOfDay.pattern
                    value: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeZone.default
                    value: UTC
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeZone.minLength
                    value: 1
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.vaultTags.additionalProperties.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.dayOfWeek.enum
                    value:
                        -   Sunday
                        -   Monday
                        -   Tuesday
                        -   Wednesday
                        -   Thursday
                        -   Friday
                        -   Saturday
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.frequency.enum
                    value:
                        -   Daily
                        -   Weekly
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.default
                    value: {}
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.dayOfWeek.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.enabled.type
                    value: boolean
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.frequency.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.retentionDays.type
                    value: integer
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeOfDay.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.timeZone.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.vaultTags.type
                    value: object
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.backup.properties.dayOfWeek.default
                    value: Sunday
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
        it: Declares the provider neutral backup schedule contract
    -   asserts:
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.default
                    value: {}
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.properties.enabled.default
                    value: false
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.properties.lifecyclePolicy.default
                    value: {}
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.properties.lifecyclePolicy.properties.indices.default
                    value: liferay-*
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.properties.lifecyclePolicy.properties.registration.default
                    value: job
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.properties.lifecyclePolicy.properties.registration.enum
                    value:
                        -   job
                        -   stackConfigPolicy
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.properties.lifecyclePolicy.properties.retention.properties.expireAfter.default
                    value: 7d
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.properties.lifecyclePolicy.properties.retention.properties.maxCount.default
                    value: 30
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.properties.lifecyclePolicy.properties.retention.properties.minCount.default
                    value: 5
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.properties.lifecyclePolicy.properties.retention.x-kubernetes-validations[0].rule
                    value: self.minCount <= self.maxCount
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.properties.lifecyclePolicy.properties.schedule.default
                    value: 0 30 1 * * ?
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.search.properties.snapshots.properties.tags.additionalProperties.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
        it: Declares the provider neutral search snapshot contract
    -   asserts:
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.restoreGeneration.nullable
                    value: true
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.restoreGeneration.pattern
                    value: ^[0-9a-f]{6}$
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.restoreGeneration.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   notContains:
                    content: restoreGeneration
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.required
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
        it: Declares the restore generation as a suffix the restore workflow writes
    -   asserts:
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.retainedDataPlanes.additionalProperties.pattern
                    value: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.retainedDataPlanes.additionalProperties.type
                    value: string
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.retainedDataPlanes.default
                    value: {}
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.retainedDataPlanes.type
                    value: object
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.retainedDataPlanes.x-kubernetes-validations[0].rule
                    value: self.all(key, key.matches('^(blue|green)(-[0-9a-f]{6})?$'))
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   notExists:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.retainedBackupInstances
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   notExists:
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.retainedDatabaseServers
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   notContains:
                    content: retainedDataPlanes
                    path: spec.versions[0].schema.openAPIV3Schema.properties.spec.properties.required
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
        it: Declares the retained data planes as deadlines keyed by data plane
    -   asserts:
            -   isKind:
                    of: CompositeResourceDefinition
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-90"
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: metadata.name
                    value: liferayinfrastructures.liferay.com
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.defaultCompositionRef.name
                    value: liferay-infrastructure
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.group
                    value: liferay.com
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: spec.names.kind
                    value: LiferayInfrastructure
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   equal:
                    path: metadata.name
                    value: liferayoverlays.liferay.com
                template: templates/crossplane-xrd-liferayoverlay.yaml
            -   equal:
                    path: spec.defaultCompositionRef.name
                    value: liferay-overlay
                template: templates/crossplane-xrd-liferayoverlay.yaml
            -   equal:
                    path: spec.names.kind
                    value: LiferayOverlay
                template: templates/crossplane-xrd-liferayoverlay.yaml
        it: Defines the cloud agnostic infrastructure APIs under the shared group
    -   asserts:
            -   hasDocuments:
                    count: 0
                template: templates/crossplane-xrd-liferayinfrastructure.yaml
            -   hasDocuments:
                    count: 0
                template: templates/crossplane-xrd-liferayoverlay.yaml
        it: Omits the XRDs when Crossplane is disabled
        set:
            crossplane.enabled: false