release:
    name: my-release
    namespace: argocd-system
suite: ArgoCD gateway
templates:
    -   templates/argocd-networking.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the gateway by default
    -   asserts:
            -   failedTemplate:
                    errorPattern: argocd.gateway.hostname is required
        it: Requires a hostname when the gateway is enabled
        set:
            argocd.gateway.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 4
            -   documentIndex: 0
                equal:
                    path: metadata.namespace
                    value: envoy-gateway-system
            -   documentIndex: 0
                equal:
                    path: spec.provider.kubernetes.envoyDeployment.replicas
                    value: 2
            -   documentIndex: 0
                isKind:
                    of: EnvoyProxy
            -   documentIndex: 1
                equal:
                    path: metadata.namespace
                    value: argocd-system
            -   documentIndex: 1
                equal:
                    path: spec.gatewayClassName
                    value: argocd-gateway-class
            -   documentIndex: 1
                lengthEqual:
                    count: 1
                    path: spec.listeners
            -   documentIndex: 1
                equal:
                    path: spec.listeners[0].hostname
                    value: argocd.liferay.test
            -   documentIndex: 2
                equal:
                    path: spec.controllerName
                    value: gateway.envoyproxy.io/gatewayclass-controller
            -   documentIndex: 2
                equal:
                    path: spec.parametersRef.name
                    value: argocd-gateway-proxy-config
            -   documentIndex: 2
                equal:
                    path: spec.parametersRef.namespace
                    value: envoy-gateway-system
            -   documentIndex: 2
                isKind:
                    of: GatewayClass
            -   documentIndex: 3
                equal:
                    path: spec.parentRefs[0].sectionName
                    value: http
            -   documentIndex: 3
                equal:
                    path: spec.rules[0].backendRefs[0].name
                    value: argocd-server
        it: Renders an HTTP-only gateway when TLS is not configured
        set:
            argocd:
                gateway:
                    enabled: true
                    hostname: argocd.liferay.test
    -   asserts:
            -   hasDocuments:
                    count: 6
            -   documentIndex: 0
                equal:
                    path: spec.dataFrom[0].extract.key
                    value: liferay-certificates-argocd
            -   documentIndex: 0
                equal:
                    path: spec.secretStoreRef.name
                    value: liferay-test-secret-store
            -   documentIndex: 0
                equal:
                    path: spec.target.template.type
                    value: kubernetes.io/tls
            -   documentIndex: 2
                equal:
                    path: spec.listeners[1].name
                    value: https
            -   documentIndex: 2
                equal:
                    path: spec.listeners[1].tls.certificateRefs[0].name
                    value: argocd-server-tls
            -   documentIndex: 2
                equal:
                    path: spec.listeners[1].tls.mode
                    value: Terminate
            -   documentIndex: 4
                equal:
                    path: spec.rules[0].filters[0].requestRedirect.statusCode
                    value: 301
            -   documentIndex: 5
                equal:
                    path: spec.parentRefs[0].sectionName
                    value: https
        it: Adds the TLS listener, redirect, and certificate secret when configured
        set:
            argocd:
                gateway:
                    enabled: true
                    hostname: argocd.liferay.test
                    tls:
                        externalSecretKey: liferay-certificates-argocd
            clusterIdentity:
                deploymentName: liferay-test
    -   asserts:
            -   documentIndex: 0
                equal:
                    path: spec.provider.kubernetes.envoyDeployment.pod.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::123456789012:role/liferay-test-envoy-proxy
            -   documentIndex: 0
                equal:
                    path: spec.provider.kubernetes.envoyService.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
                    value: nlb
        it: Renders the cloud-specific proxy annotations verbatim
        set:
            argocd:
                gateway:
                    enabled: true
                    envoyProxy:
                        podAnnotations:
                            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/liferay-test-envoy-proxy
                        serviceAnnotations:
                            service.beta.kubernetes.io/aws-load-balancer-type: nlb
                    hostname: argocd.liferay.test