release:
    name: my-release
    namespace: argocd-system
suite: Operator Applications
templates:
    -   templates/operator-applications.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 6
            -   notEqual:
                    path: metadata.name
                    value: ack-prometheusservice
        it: Omits the ACK Prometheus service controller when observability is disabled
        set:
            operatorApplications.ackPrometheusService.enabled: true
    -   asserts:
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   equal:
                    path: spec.source.helm.valuesObject.controller.resources.requests.cpu
                    value: 15m
            -   equal:
                    path: spec.source.helm.valuesObject.controller.workflowDefaults.spec.securityContext.runAsUser
                    value: 8737
            -   equal:
                    path: spec.source.helm.valuesObject.executor.image.tag
                    value: v4.0.4-nonroot
        documentSelector:
            path: metadata.name
            value: argo-workflows
        it: Renders Argo Workflows by default
    -   asserts:
            -   equal:
                    path: metadata.labels["app.kubernetes.io/name"]
                    value: crossplane
            -   notExists:
                    path: metadata.labels["app.kubernetes.io/part-of"]
            -   equal:
                    path: metadata.labels["liferay.com/project"]
                    value: liferay-cloud-native
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   equal:
                    path: spec.source.chart
                    value: crossplane
            -   equal:
                    path: spec.source.helm.valuesObject.resourcesCrossplane.limits.memory
                    value: 2Gi
            -   equal:
                    path: spec.source.helm.valuesObject.securityContextCrossplane.readOnlyRootFilesystem
                    value: true
            -   equal:
                    path: spec.source.repoURL
                    value: https://charts.crossplane.io/stable
            -   equal:
                    path: spec.source.targetRevision
                    value: 2.1.3
            -   equal:
                    path: spec.syncPolicy.managedNamespaceMetadata.labels["pod-security.kubernetes.io/enforce"]
                    value: restricted
        documentSelector:
            path: metadata.name
            value: crossplane
        it: Renders Crossplane by default
    -   asserts:
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   notExists:
                    path: spec.source.chart
            -   equal:
                    path: spec.source.helm.valuesObject.config.envoyGateway.extensionApis.enableBackend
                    value: false
            -   equal:
                    path: spec.source.helm.valuesObject.deployment.replicas
                    value: 2
            -   equal:
                    path: spec.source.path
                    value: .
            -   equal:
                    path: spec.source.repoURL
                    value: oci://docker.io/envoyproxy/gateway-helm
        documentSelector:
            path: metadata.name
            value: envoy-gateway
        it: Renders Envoy Gateway by default
    -   asserts:
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   equal:
                    path: spec.source.helm.valuesObject.installCRDs
                    value: true
            -   equal:
                    path: spec.source.helm.valuesObject.resources.limits.memory
                    value: 512Mi
            -   equal:
                    path: spec.source.helm.valuesObject.webhook.resources.limits.memory
                    value: 256Mi
        documentSelector:
            path: metadata.name
            value: external-secrets
        it: Renders External Secrets by default
    -   asserts:
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   equal:
                    path: spec.source.helm.valuesObject.resources.operator.limits.memory
                    value: 512Mi
        documentSelector:
            path: metadata.name
            value: keda
        it: Renders KEDA when enabled
        set:
            operatorApplications.keda.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 6
        it: Renders one application for every enabled operator
    -   asserts:
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   equal:
                    path: spec.destination.namespace
                    value: ack-system
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   notExists:
                    path: spec.source.chart
            -   equal:
                    path: spec.source.helm.valuesObject.aws.region
                    value: us-west-2
            -   equal:
                    path: spec.source.path
                    value: .
            -   equal:
                    path: spec.source.repoURL
                    value: oci://public.ecr.aws/aws-controllers-k8s/prometheusservice-chart
        documentSelector:
            path: metadata.name
            value: ack-prometheusservice
        it: Renders the ACK Prometheus service controller when observability and the operator are enabled
        set:
            observability.enabled: true
            operatorApplications:
                ackPrometheusService:
                    enabled: true
                    values:
                        aws:
                            region: us-west-2
    -   asserts:
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   equal:
                    path: spec.destination.namespace
                    value: dxp-operator-system
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   notExists:
                    path: spec.source.chart
            -   equal:
                    path: spec.source.helm.valuesObject.fullnameOverride
                    value: dxp-operator
            -   equal:
                    path: spec.source.path
                    value: .
            -   equal:
                    path: spec.source.repoURL
                    value: oci://us-central1-docker.pkg.dev/external-assets-prd/liferay-helm-chart/liferay-dxp-operator
            -   equal:
                    path: spec.source.targetRevision
                    value: 9.9.9
            -   equal:
                    path: spec.syncPolicy.managedNamespaceMetadata.labels["pod-security.kubernetes.io/enforce"]
                    value: restricted
        documentSelector:
            path: metadata.name
            value: dxp-operator
        it: Renders the DXP operator by default
        set:
            operatorApplications.dxpOperator.targetRevision: 9.9.9
    -   asserts:
            -   equal:
                    path: spec.destination.namespace
                    value: elastic-system
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   equal:
                    path: spec.source.helm.valuesObject.installCRDs
                    value: true
            -   equal:
                    path: spec.syncPolicy.managedNamespaceMetadata.labels["pod-security.kubernetes.io/enforce"]
                    value: restricted
        documentSelector:
            path: metadata.name
            value: eck-operator
        it: Renders the ECK operator by default