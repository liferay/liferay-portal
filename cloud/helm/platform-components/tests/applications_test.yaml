release:
    name: my-release
    namespace: argocd-system
suite: Operator Applications
templates:
    -   templates/operator-applications.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 6
        it: Ignores values for an operator the chart does not install
        set:
            unknownOperator:
                enabled: true
                namespace: unknown-system
                repoURL: https://charts.example.com
                targetRevision: 1.0.0
    -   asserts:
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   equal:
                    path: spec.source.helm.valuesObject.controller.resources.requests.cpu
                    value: 15m
            -   equal:
                    path: spec.source.helm.valuesObject.controller.workflowDefaults.spec.securityContext.runAsUser
                    value: 8737
            -   equal:
                    path: spec.source.helm.valuesObject.executor.image.nonroot
                    value: true
        documentSelector:
            path: metadata.name
            value: argo-workflows
        it: Renders Argo Workflows by default
    -   asserts:
            -   equal:
                    path: metadata.labels["app.kubernetes.io/name"]
                    value: crossplane
            -   notExists:
                    path: metadata.labels["app.kubernetes.io/part-of"]
            -   equal:
                    path: metadata.labels["liferay.com/project"]
                    value: liferay-cloud-native
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   equal:
                    path: spec.source.chart
                    value: crossplane
            -   equal:
                    path: spec.source.helm.valuesObject.resourcesCrossplane.limits.memory
                    value: 2Gi
            -   equal:
                    path: spec.source.helm.valuesObject.securityContextCrossplane.readOnlyRootFilesystem
                    value: true
            -   equal:
                    path: spec.source.repoURL
                    value: https://charts.crossplane.io/stable
            -   equal:
                    path: spec.source.targetRevision
                    value: 2.4.3
            -   equal:
                    path: spec.syncPolicy.managedNamespaceMetadata.labels["pod-security.kubernetes.io/enforce"]
                    value: restricted
        documentSelector:
            path: metadata.name
            value: crossplane
        it: Renders Crossplane by default
    -   asserts:
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   notExists:
                    path: spec.source.chart
            -   equal:
                    path: spec.source.helm.valuesObject.config.envoyGateway.extensionApis.enableBackend
                    value: false
            -   equal:
                    path: spec.source.helm.valuesObject.config.envoyGateway.logging.encoder
                    value: JSON
            -   equal:
                    path: spec.source.helm.valuesObject.config.envoyGateway.provider.kubernetes.deploy.type
                    value: GatewayNamespace
            -   equal:
                    path: spec.source.helm.valuesObject.crds.enabled
                    value: false
            -   equal:
                    path: spec.source.helm.valuesObject.deployment.replicas
                    value: 2
            -   equal:
                    path: spec.source.path
                    value: .
            -   equal:
                    path: spec.source.repoURL
                    value: oci://docker.io/envoyproxy/gateway-helm
        documentSelector:
            path: metadata.name
            value: envoy-gateway
        it: Renders Envoy Gateway by default
    -   asserts:
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   equal:
                    path: spec.source.helm.valuesObject.installCRDs
                    value: true
            -   equal:
                    path: spec.source.helm.valuesObject.resources.limits.memory
                    value: 512Mi
            -   equal:
                    path: spec.source.helm.valuesObject.webhook.resources.limits.memory
                    value: 256Mi
        documentSelector:
            path: metadata.name
            value: external-secrets
        it: Renders External Secrets by default
    -   asserts:
            -   equal:
                    path: spec.destination.namespace
                    value: keda
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   equal:
                    path: spec.source.chart
                    value: keda
            -   equal:
                    path: spec.source.helm.valuesObject.podIdentity.azureWorkload.clientId
                    value: 11111111-1111-1111-1111-111111111111
            -   equal:
                    path: spec.source.helm.valuesObject.podIdentity.azureWorkload.enabled
                    value: true
            -   equal:
                    path: spec.source.helm.valuesObject.podIdentity.azureWorkload.tenantId
                    value: 22222222-2222-2222-2222-222222222222
            -   equal:
                    path: spec.source.helm.valuesObject.resources.operator.limits.memory
                    value: 512Mi
            -   equal:
                    path: spec.source.repoURL
                    value: https://kedacore.github.io/charts
            -   equal:
                    path: spec.source.targetRevision
                    value: 2.21.0
        documentSelector:
            path: metadata.name
            value: keda
        it: Renders KEDA with the injected Azure workload identity when enabled
        set:
            keda.enabled: true
            keda.namespace: keda
            keda.values.podIdentity.azureWorkload.clientId: 11111111-1111-1111-1111-111111111111
            keda.values.podIdentity.azureWorkload.enabled: true
            keda.values.podIdentity.azureWorkload.tenantId: 22222222-2222-2222-2222-222222222222
    -   asserts:
            -   hasDocuments:
                    count: 6
        it: Renders one application for every enabled operator
    -   asserts:
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   equal:
                    path: spec.destination.namespace
                    value: ack-system
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   notExists:
                    path: spec.source.chart
            -   equal:
                    path: spec.source.helm.valuesObject.aws.region
                    value: us-west-2
            -   equal:
                    path: spec.source.path
                    value: .
            -   equal:
                    path: spec.source.repoURL
                    value: oci://public.ecr.aws/aws-controllers-k8s/prometheusservice-chart
        documentSelector:
            path: metadata.name
            value: ack-prometheusservice
        it: Renders the ACK Prometheus service controller when it is enabled
        set:
            ackPrometheusService:
                enabled: true
                values:
                    aws:
                        region: us-west-2
    -   asserts:
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   equal:
                    path: spec.destination.namespace
                    value: dxp-operator-system
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   notExists:
                    path: spec.source.chart
            -   equal:
                    path: spec.source.helm.valuesObject.fullnameOverride
                    value: dxp-operator
            -   equal:
                    path: spec.source.path
                    value: .
            -   equal:
                    path: spec.source.repoURL
                    value: oci://us-central1-docker.pkg.dev/external-assets-prd/liferay-helm-chart/liferay-dxp-operator
            -   equal:
                    path: spec.source.targetRevision
                    value: 9.9.9
            -   equal:
                    path: spec.syncPolicy.managedNamespaceMetadata.labels["pod-security.kubernetes.io/enforce"]
                    value: restricted
        documentSelector:
            path: metadata.name
            value: dxp-operator
        it: Renders the DXP operator by default
        set:
            dxpOperator.targetRevision: 9.9.9
    -   asserts:
            -   equal:
                    path: spec.destination.namespace
                    value: elastic-system
            -   equal:
                    path: spec.project
                    value: liferay-operator
            -   equal:
                    path: spec.source.helm.valuesObject.installCRDs
                    value: true
            -   equal:
                    path: spec.syncPolicy.managedNamespaceMetadata.labels["pod-security.kubernetes.io/enforce"]
                    value: restricted
        documentSelector:
            path: metadata.name
            value: eck-operator
        it: Renders the ECK operator by default