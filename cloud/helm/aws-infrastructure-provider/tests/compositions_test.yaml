release:
    name: my-release
    namespace: crossplane-system
suite: Compositions
templates:
    -   templates/compositions.yaml
tests:
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "composition-resource-name: database-bootstrap-job-\\{\\{ \\$activeDataPlane \\}\\}"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "key: DATABASE_PASSWORD\\s+name: database-app-password"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "key: username\\s+name: liferay-database-\\{\\{ \\$activeDataPlane \\}\\}-credentials"
        it: Bootstraps the application role on the active data plane with the generated password
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "splitList \":\" \\$backup\\.timeOfDay"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "printf \"cron\\(%s %s \\* \\* \\? \\*\\)\" \\(index \\$[A-Za-z]+ 1\\) \\(index \\$[A-Za-z]+ 0\\)"
        it: Builds a daily backup schedule from the time of day
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "if eq \\$backup\\.frequency \"Weekly\""
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "printf \"cron\\(%s %s \\? \\* %s \\*\\)\" \\(index \\$[A-Za-z]+ 1\\) \\(index \\$[A-Za-z]+ 0\\) \\(index \\$[A-Za-z]+ \\$backup\\.dayOfWeek\\)"
        it: Builds a weekly backup schedule on the chosen day of the week
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "dict \"Friday\" \"FRI\" \"Monday\" \"MON\" \"Saturday\" \"SAT\" \"Sunday\" \"SUN\" \"Thursday\" \"THU\" \"Tuesday\" \"TUE\" \"Wednesday\" \"WED\""
        it: Converts each day of the week to its AWS cron abbreviation
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- if and \\$opensearchEnabled \\$cmkEnabled \\}\\}\\s+---\\s+apiVersion: kms\\.aws\\.m\\.upbound\\.io/v1beta1\\s+kind: Alias"
        it: Creates the search key only when the search engine is OpenSearch and customer managed keys are enabled
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "deleteAfter: \\{\\{ \\$backup\\.retentionDays \\}\\}"
        it: Deletes each recovery point after the retention period
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- if and \\$backup\\.enabled \\$cmkEnabled \\}\\}\\s+apiVersion: kms\\.aws\\.m\\.upbound\\.io/v1beta1\\s+kind: Alias"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- if \\$cmkEnabled \\}\\}\\s+kmsKeyArnSelector:\\s+matchLabels:\\s+app: liferay\\s+component: backup-vault"
        it: Encrypts the backup vault with its own key only when customer managed keys are enabled
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: liferay-infrastructure
            -   documentIndex: 0
                equal:
                    path: spec.compositeTypeRef.kind
                    value: LiferayInfrastructure
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "composition-resource-name: backup-plan\\s"
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: liferay-overlay
            -   documentIndex: 1
                equal:
                    path: spec.compositeTypeRef.kind
                    value: LiferayOverlay
            -   documentIndex: 1
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "composition-resource-name: overlay-bucket\\s"
        it: Implements the shared Liferay APIs through the packaged function pipeline
    -   asserts:
            -   documentIndex: 0
                equal:
                    path: spec.pipeline[2].input.addTags[0].fromFieldPath
                    value: defaultTags
            -   documentIndex: 1
                equal:
                    path: spec.pipeline[2].input.addTags[0].fromFieldPath
                    value: defaultTags
        it: Lets the derived tags win over the common tags
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "engineVersion: \\{\\{ \\$database\\.version \\| quote \\}\\}"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "instanceClass: \\{\\{ \\$database\\.instanceType \\| default \"db\\.t3\\.medium\" \\}\\}"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "multiAz: \\{\\{ \\$database\\.highAvailability \\}\\}"
        it: Maps the shared database fields onto the RDS instance
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "scheduleExpressionTimezone: \\{\\{ \\$backup\\.timeZone \\| quote \\}\\}"
        it: Passes the backup time zone through to the AWS Backup plan rule
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "engineVersion: \\{\\{ printf \"OpenSearch_%s\" \\$opensearch\\.version \\| quote \\}\\}"
        it: Prefixes the OpenSearch version with the engine name AWS expects
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$opensearchEnabled := eq \\$xr\\.spec\\.search\\.engine \"opensearch\""
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- if \\$opensearchEnabled \\}\\}\\s+\\{\\{- \\$clusterSubnetIdsCount := len \\$clusterSubnetIds \\}\\}[\\s\\S]+?apiVersion: opensearch\\.aws\\.m\\.upbound\\.io/v1beta1\\s+kind: Domain"
        it: Provisions OpenSearch only when the search engine is OpenSearch
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- if \\$backup\\.enabled \\}\\}(\\s+\\{\\{-[^\\n]*)*\\s+apiVersion: backup\\.aws\\.m\\.upbound\\.io/v1beta1\\s+kind: Plan"
        it: Provisions the backup plan only once backups are enabled
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$activeDatabaseAddress := dig \\(printf \"database-%s\" \\$activeDataPlane\\) \"resource\" \"status\" \"atProvider\" \"address\""
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- if \\$isDatabaseReady \\}\\}\\s+---\\s+apiVersion: kubernetes\\.m\\.crossplane\\.io/v1alpha1\\s+kind: Object\\s+metadata:\\s+annotations:\\s+crossplane\\.io/external-name: \\{\\{ \\$baseName \\}\\}-database-server-details-configmap[\\s\\S]+?DATABASE_ENDPOINT: \\{\\{ \\$activeDatabaseAddress \\| quote \\}\\}\\s+kind: ConfigMap"
        it: Publishes the active data plane's database address only once the data plane is bootstrapped
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "if and \\(gt \\$clusterSubnetIdsCount 1\\) \\(mod \\(int \\$opensearch\\.instanceCount\\) \\$clusterSubnetIdsCount\\)"
        it: Rejects an OpenSearch node count the cluster zones cannot spread evenly
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "range \\$condition := dig \\(printf \"database-bootstrap-job-%s\" \\$activeDataPlane\\) \"resource\" \"status\" \"conditions\""
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$isDatabaseReady := and \\(ne \\$activeDatabaseAddress \"\"\\) \\$isDatabaseBootstrapped"
        it: Reports the database ready only once the active data plane is bootstrapped
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$restore := \\$database\\.restore \\| default dict"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\$restoreSnapshotId := dig \"snapshot\" \"id\" \"\" \\$restore"
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- if and \\(eq \\$restorePhase \"provisioning\"\\) \\(not \\$restoreSnapshotId\\) \\}\\}\\s+\\{\\{- fail \""
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- if and \\(eq \\$restorePhase \"provisioning\"\\) \\(eq \\$dataPlane \\$targetActiveDataPlane\\) \\}\\}\\s+snapshotIdentifier: \\{\\{ \\$restoreSnapshotId \\}\\}"
        it: Restores the target data plane from the database restore snapshot
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "key: aws:ResourceTag/Active\\s+value: \"true\"\\s+-\\s+key: aws:ResourceTag/Backup\\s+value: \"true\"\\s+-\\s+key: aws:ResourceTag/DeploymentName\\s+value: \\{\\{ \\$env\\.deploymentName \\}\\}\\s+-\\s+key: aws:ResourceTag/EnvironmentId\\s+value: \\{\\{ \\$environmentId \\}\\}\\s+-\\s+key: aws:ResourceTag/ProjectId\\s+value: \\{\\{ \\$projectId \\}\\}"
        it: Selects only the active resources of this environment for backup
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "tags:\\s+\\{\\{- with \\$storage\\.tags \\}\\}\\s+\\{\\{- \\. \\| toYaml \\| nindent 12 \\}\\}\\s+\\{\\{- end \\}\\}\\s+Active: [^\\n]+\\s+Backup: \"true\""
        it: Tags each bucket with its backup selection over the custom storage tags
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: "\\{\\{- with \\$backup\\.vaultTags \\}\\}\\s+tags:\\s+\\{\\{- \\. \\| toYaml"
        it: Tags the backup vault with the vault tags