release:
    name: my-release
    namespace: crossplane-system
suite: Backup Restore ClusterWorkflowTemplate
templates:
    -   charts/liferay-subchart-backup-restore/templates/clusterworkflowtemplate.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.templates[?(@.name=="sanitize-database")].volumes[0].configMap.name
                    value: backup-restore-sanitization
            -   equal:
                    path: spec.templates[?(@.name=="sanitize-database")].volumes[0].configMap.optional
                    value: true
            -   equal:
                    path: spec.templates[?(@.name=="sanitize-database")].script.volumeMounts[0].mountPath
                    value: /restore-sanitization
        it: Mounts the restore sanitization ConfigMap as optional
    -   asserts:
            -   equal:
                    path: metadata.labels.component
                    value: backup-restore-platform
            -   equal:
                    path: metadata.name
                    value: backup-restore-cluster-workflow-template
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: ClusterWorkflowTemplate
        it: Names the cluster workflow template
    -   asserts:
            -   contains:
                    content:
                        name: DATABASE_ENDPOINT
                        valueFrom:
                            secretKeyRef:
                                key: address
                                name: liferay-database-{{inputs.parameters.data-inactive}}-credentials
                    path: spec.templates[?(@.name=="sanitize-database")].script.env
            -   contains:
                    content:
                        name: DATABASE_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                key: password
                                name: liferay-database-{{inputs.parameters.data-inactive}}-credentials
                    path: spec.templates[?(@.name=="sanitize-database")].script.env
            -   contains:
                    content:
                        name: DATABASE_PORT
                        valueFrom:
                            secretKeyRef:
                                key: port
                                name: liferay-database-{{inputs.parameters.data-inactive}}-credentials
                    path: spec.templates[?(@.name=="sanitize-database")].script.env
            -   contains:
                    content:
                        name: DATABASE_USERNAME
                        valueFrom:
                            secretKeyRef:
                                key: username
                                name: liferay-database-{{inputs.parameters.data-inactive}}-credentials
                    path: spec.templates[?(@.name=="sanitize-database")].script.env
            -   lengthEqual:
                    count: 4
                    path: spec.templates[?(@.name=="sanitize-database")].script.env
            -   contains:
                    content:
                        name: data-inactive
                        value: "{{tasks.get-current-infrastructure-state.outputs.parameters.data-inactive}}"
                    path: spec.templates[?(@.name=="main")].dag.tasks[?(@.name=="sanitize-database")].arguments.parameters
        it: Reads the restored instance credentials from its connection secret
    -   asserts:
            -   contains:
                    any: true
                    content:
                        depends: promote-inactive-data-plane
                        name: restart-liferay
                    path: spec.templates[?(@.name=="main")].dag.tasks
        it: Restarts Liferay after promoting the inactive data plane
    -   asserts:
            -   equal:
                    path: spec.templates[?(@.name=="main")].dag.tasks[?(@.name=="roll-back-infrastructure")].depends
                    value: "(!restore-rds-instance.Omitted && !restore-rds-instance.Skipped || !restore-s3-bucket.Omitted && !restore-s3-bucket.Skipped) && !promote-inactive-data-plane.Succeeded"
        it: Rolls back the infrastructure when the sanitization fails
    -   asserts:
            -   equal:
                    path: spec.templates[?(@.name=="sanitize-database")].script.image
                    value: postgres:18-alpine
            -   matchRegex:
                    path: spec.templates[?(@.name=="sanitize-database")].script.source
                    pattern: --dbname lportal
            -   matchRegex:
                    path: spec.templates[?(@.name=="sanitize-database")].script.source
                    pattern: --host "\$\{DATABASE_ENDPOINT\}"
            -   matchRegex:
                    path: spec.templates[?(@.name=="sanitize-database")].script.source
                    pattern: --single-transaction
            -   matchRegex:
                    path: spec.templates[?(@.name=="sanitize-database")].script.source
                    pattern: ON_ERROR_STOP=1
            -   notMatchRegex:
                    path: spec.templates[?(@.name=="sanitize-database")].script.source
                    pattern: 127.0.0.1
        it: Runs psql against the Liferay database in one transaction
    -   asserts:
            -   equal:
                    path: spec.serviceAccountName
                    value: backup-restore-service-account
            -   notExists:
                    path: spec.templates[?(@.name=="sanitize-database")].executor
            -   notExists:
                    path: spec.templates[?(@.name=="sanitize-database")].initContainers
            -   notExists:
                    path: spec.templates[?(@.name=="sanitize-database")].serviceAccountName
        it: Runs the sanitization as the backup restore service account
    -   asserts:
            -   equal:
                    path: spec.templates[?(@.name=="main")].dag.tasks[?(@.name=="sanitize-database")].depends
                    value: restore-rds-instance
            -   equal:
                    path: spec.templates[?(@.name=="main")].dag.tasks[?(@.name=="sanitize-database")].template
                    value: sanitize-database
            -   equal:
                    path: spec.templates[?(@.name=="main")].dag.tasks[?(@.name=="promote-inactive-data-plane")].depends
                    value: restore-s3-bucket && sanitize-database
        it: Sanitizes the restored database before promoting it
    -   asserts:
            -   equal:
                    path: spec.templates[?(@.name=="sanitize-database")].activeDeadlineSeconds
                    value: 600
        it: Sizes the sanitization timeout from the values
        set:
            liferay-subchart-backup-restore.restoreSanitization.timeoutSeconds: 600