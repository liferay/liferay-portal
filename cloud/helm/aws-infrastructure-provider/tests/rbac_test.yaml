release:
    name: my-release
    namespace: crossplane-system
suite: RBAC
templates:
    -   templates/rbac.yaml
tests:
    -   asserts:
            -   contains:
                    content:
                        apiGroups: ["elasticsearch.k8s.elastic.co"]
                        resources: ["elasticsearches"]
                        verbs: ["get", "list", "patch", "watch"]
                    path: rules
                documentIndex: 0
        it: Grants required permissions on ElasticSearch resources