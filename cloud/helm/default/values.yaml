affinity: {}
annotations: {}
autoscaling:
    enabled: false
    hpa:
        annotations: {}
        maxReplicas: 100
        metrics:
            -   resource:
                    name: cpu
                    target:
                        averageUtilization: 80
                        type: Utilization
                type: Resource
        minReplicas: 1
    keda:
        customTriggers: {}
        maxReplicaCount: 100
        minReplicaCount: 1
        pollingInterval: 30
        prometheusServerAddress: ""
        triggerAuthentication:
            annotations: {}
            spec: {}
        triggers:
            cpu-usage-percent:
                metadata:
                    value: "80"
                metricType: Utilization
                type: cpu
            hikari-active-connections:
                metadata:
                    metricName: hikari_active_connections
                    query: max(hikaricp_ActiveConnections{namespace="{{ include "liferay.namespace" . }}"})
                    threshold: "50"
            jvm-memory-heap-used-percent:
                metadata:
                    metricName: jvm_memory_heap_used_percent
                    query: max(jvm_memory_used_bytes{area="heap",namespace="{{ include "liferay.namespace" . }}"} / jvm_memory_max_bytes{area="heap",namespace="{{ include "liferay.namespace" . }}"} * 100)
                    threshold: "80"
            jvm-threads-current:
                metadata:
                    metricName: jvm_threads_current
                    query: max(jvm_threads_current{namespace="{{ include "liferay.namespace" . }}"})
                    threshold: "500"
    type: hpa
configmap:
    annotations: {}
    data: {}
    overrideDefaults: false
customEnv: {}
customEnvFrom: {}
customInitContainers:
    x-license-sync:
        -   containerTemplate: |
                {{- if .licensing.enabled }}
                -   command:
                        -   bash
                        -   /liferay-init-scripts/deploy-sync.sh
                    env:
                        -   name: LIFERAY_SYNC_DEST
                            value: /opt/liferay/deploy/license.xml
                        -   name: LIFERAY_SYNC_INTERVAL
                            value: {{ .licensing.syncInterval | quote }}
                        -   name: LIFERAY_SYNC_MARKER
                            value: /opt/liferay/.liferay-license-sync.sha
                        -   name: LIFERAY_SYNC_SOURCE
                            value: /secret/license.xml
                    image: {{ printf "%s:%s" .image.repository (.image.tag | toString) }}
                    imagePullPolicy: {{ .image.pullPolicy }}
                    name: liferay-license-sync
                    restartPolicy: Always
                    securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                            drop:
                                -   ALL
                        seccompProfile:
                            type: RuntimeDefault
                    volumeMounts:
                        -   mountPath: /liferay-init-scripts/deploy-sync.sh
                            name: {{ .licensing.initScriptsVolumeName }}
                            subPath: deploy-sync.sh
                        -   mountPath: /secret
                            name: liferay-license
                        -   mountPath: /opt/liferay
                            name: liferay-persistent-volume
                            subPath: liferay
                {{- end }}
    x-liferay-overlay:
        -   containerTemplate: |
                {{- if and .overlay.enabled .overlay.copy }}
                -   command:
                        -   sh
                        -   -c
                        -   |
                            {{- range .overlay.copy }}
                            /liferay-init-scripts/overlay-sync.sh {{ $.overlay.type | quote }} {{ .from | quote }} {{ .into | quote }}
                            {{- end }}
                    envFrom:
                        -   secretRef:
                                name: overlay-bucket-details
                    image: {{ printf "%s:%s" .overlay.image.repository (.overlay.image.tag | toString) }}
                    name: liferay-overlay
                    {{- with .securityContext }}
                    securityContext:
                        {{- toYaml . | nindent 24 }}
                    {{- end }}
                    volumeMounts:
                        -   mountPath: /liferay-init-scripts/overlay-sync.sh
                            name: {{ .overlay.initScriptsVolumeName }}
                            subPath: overlay-sync.sh
                        -   mountPath: /temp
                            name: liferay-persistent-volume
                {{- end }}
    x-liferay-prepopulate-data:
        -   containerTemplate: |
                -   command:
                        -   bash
                        -   -c
                        -   |
                            rm --force --recursive /temp/liferay/liferay.pid 2>/dev/null

                            mkdir --parents \
                                /temp/liferay \
                                /temp/liferay/logs \
                                /temp/liferay/metrics \
                                /temp/liferay/reports \
                                /temp/liferay/routes \
                                /temp/liferay/work \
                                /temp/osgi/client-extensions \
                                /temp/osgi/configs \
                                /temp/osgi/modules \
                                /temp/osgi/state \
                                /temp/system/tmp \
                                /temp/tomcat/logs \
                                /temp/tomcat/temp \
                                /temp/tomcat/work

                            touch /temp/liferay/liferay.pid

                            if [ ! -d /temp/liferay/data ] || [ -z "$(ls --all /temp/liferay/data)" ]
                            then
                                mkdir --parents /temp/liferay/data

                                cp --force --recursive --verbose /opt/liferay/data/* /temp/liferay/data
                            fi

                            if [ ! -d /temp/liferay/glowroot ] || [ -z "$(ls --all /temp/liferay/glowroot)" ]
                            then
                                mkdir --parents /temp/liferay/glowroot

                                cp --force --recursive --verbose /opt/liferay/glowroot/* /temp/liferay/glowroot
                            fi

                            if [ ! -f /temp/tomcat/conf/server.xml ]
                            then
                                mkdir --parents /temp/tomcat/conf

                                cp /opt/liferay/tomcat/conf/logging.properties /temp/tomcat/conf/logging.properties

                                echo -e "\norg.apache.catalina.tribes.membership.cloud.level=SEVERE" >> /temp/tomcat/conf/logging.properties

                                cat /opt/liferay/tomcat/conf/server.xml | sed '/<!--.*-->/d' | sed '/<!--/,/-->/d' > /temp/tomcat/conf/server.xml

                                IFS='' read -r -d '' SERVER_XML_CLUSTER <<EOF
                                <Cluster className="org.apache.catalina.ha.tcp.SimpleTcpCluster">
                                    <Manager className="com.liferay.support.tomcat.session.LiferayDeltaManager" />
                                    <Channel className="org.apache.catalina.tribes.group.GroupChannel">
                                        <Membership
                                            className="org.apache.catalina.tribes.membership.cloud.CloudMembershipService"
                                            membershipProviderClassName="org.apache.catalina.tribes.membership.cloud.DNSMembershipProvider"
                                        />
                                        <Sender className="org.apache.catalina.tribes.transport.ReplicationTransmitter">
                                            <Transport
                                                className="org.apache.catalina.tribes.transport.nio.PooledParallelSender"
                                                timeout="300000"
                                            />
                                        </Sender>
                                    </Channel>
                                </Cluster>
                            EOF

                                sed --in-place '/<Engine/r'<(echo "${SERVER_XML_CLUSTER}") /temp/tomcat/conf/server.xml
                            fi

                            if [ -d /opt/liferay/deploy ] && [ -z "$(ls --all /temp/liferay/deploy/*license* 2>/dev/null)" ]
                            then
                                if [ ! -d /temp/liferay/data/license ] || [ -z "$(ls --all /temp/liferay/data/license/*.li 2>/dev/null)" ]
                                then
                                    mkdir --parents /temp/liferay/deploy

                                    cp --force --recursive --verbose /opt/liferay/deploy/. /temp/liferay/deploy
                                fi
                            fi
                    image: {{ printf "%s:%s" .image.repository (.image.tag | toString) }}
                    imagePullPolicy: {{ .image.pullPolicy }}
                    name: liferay-prepopulate-data
                    securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                            drop:
                                -   ALL
                        seccompProfile:
                            type: RuntimeDefault
                    volumeMounts:
                        -   mountPath: /temp
                            name: liferay-persistent-volume
    x-liferay-wait-on-services:
        -   containerTemplate: |
                -   command:
                        -   bash
                        -   -c
                        -   |
                            trap "echo 'Received signal to terminate.'; exit 0" SIGINT SIGTERM

                            {{- $liferayname := .liferayname }}
                            {{- range $k, $v := .dependencies }}
                                {{- if eq $v.source "statefulset" }}
                                    until timeout 2 bash -c '</dev/tcp/{{ $liferayname }}-{{ $k }}/{{ (index $v.statefulset.service.ports 0).port }}' 2>/dev/null
                                    do
                                        echo "Waiting for {{ $liferayname }}-{{ $k }}..."

                                        sleep 2
                                    done
                                {{- end }}
                            {{- end }}
                    image: {{ printf "%s:%s" .image.repository (.image.tag | toString) }}
                    imagePullPolicy: {{ .image.pullPolicy }}
                    name: liferay-wait-on-services
                    securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                            drop:
                                -   ALL
                        seccompProfile:
                            type: RuntimeDefault
    x-marketplace-sync:
        -   containerTemplate: |
                {{- if .marketplace.enabled }}
                -   command:
                        -   bash
                        -   /liferay-init-scripts/deploy-sync.sh
                    env:
                        -   name: LIFERAY_SYNC_DEST
                            value: /opt/liferay/deploy
                        -   name: LIFERAY_SYNC_INTERVAL
                            value: {{ .marketplace.syncInterval | quote }}
                        -   name: LIFERAY_SYNC_MARKER
                            value: /opt/liferay/.liferay-marketplace-sync
                        -   name: LIFERAY_SYNC_PATTERN
                            value: "*.lpkg"
                        -   name: LIFERAY_SYNC_SOURCE
                            value: /marketplace
                        -   name: POD_NAMESPACE
                            valueFrom:
                                fieldRef:
                                    fieldPath: metadata.namespace
                    image: {{ printf "%s:%s" .image.repository (.image.tag | toString) }}
                    imagePullPolicy: {{ .image.pullPolicy }}
                    name: liferay-marketplace-sync
                    restartPolicy: Always
                    securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                            drop:
                                -   ALL
                        seccompProfile:
                            type: RuntimeDefault
                    volumeMounts:
                        -   mountPath: /liferay-init-scripts/deploy-sync.sh
                            name: {{ .marketplace.initScriptsVolumeName }}
                            subPath: deploy-sync.sh
                        -   mountPath: /marketplace
                            name: liferay-marketplace
                            readOnly: true
                            subPathExpr: $(POD_NAMESPACE)
                        -   mountPath: /opt/liferay
                            name: liferay-persistent-volume
                            subPath: liferay
                {{- end }}
customLabels:
    origin: liferay-cloud
customPorts: {}
customPullSecrets: {}
customServicePorts: {}
customVolumeClaimTemplates: {}
customVolumeMounts: {}
customVolumes:
    x-liferay-init-scripts-default:
        -   configMap:
                defaultMode: 0755
                name: liferay-init-scripts-default
            name: liferay-init-scripts-default
dependencies: {}
env:
    -   name: DNS_MEMBERSHIP_SERVICE_NAME
        value: liferay-default-headless
    -   name: JMX_AGENT_PORT
        value: "12345"
    -   name: JMX_AGENT_YAML
        value: |
            rules:
            -   pattern: "com.zaxxer.hikari<type=Pool \\(([^)]+)\\)><>(\\w+)"
                name: hikaricp_$2
                labels:
                    pool: "$1"
            -   pattern: ".*"
    -   name: LIFERAY_CLUSTER_PERIOD_LINK_PERIOD_BIND_PERIOD_ADDR_OPENBRACKET__QUOTE_CLUSTER_MINUS_LINK_MINUS_CONTROL_QUOTE__CLOSEBRACKET_
        value: ${env.POD_IP}
    -   name: LIFERAY_CLUSTER_PERIOD_LINK_PERIOD_BIND_PERIOD_ADDR_OPENBRACKET__QUOTE_CLUSTER_MINUS_LINK_MINUS_UDP_QUOTE__CLOSEBRACKET_
        value: ${env.POD_IP}
    -   name: LIFERAY_PORTAL_PERIOD_INSTANCE_PERIOD_INET_PERIOD_SOCKET_PERIOD_ADDRESS
        value: ${env.POD_IP}:8080
    -   name: LIFERAY_PORTLET_PERIOD_SESSION_PERIOD_REPLICATE_PERIOD_ENABLED
        value: "true"
    -   name: LIFERAY_TOMCAT_SESSION_REPLICATION_ENABLED
        value: "true"
    -   name: LIFERAY_VIRTUAL_PERIOD_HOSTS_PERIOD_IGNORE_PERIOD_HOSTS
        value: 127.0.0.1,localhost,${env.POD_IP}
    -   name: POD_APP
        valueFrom:
            fieldRef:
                fieldPath: metadata.labels['app.kubernetes.io/name']
    -   name: POD_IP
        valueFrom:
            fieldRef:
                fieldPath: status.podIP
    -   name: POD_NAME
        valueFrom:
            fieldRef:
                fieldPath: metadata.name
    -   name: POD_NAMESPACE
        valueFrom:
            fieldRef:
                fieldPath: metadata.namespace
envFrom:
    -   secretRef:
            name: liferay-default
fullnameOverride: ""
global:
    liferayServiceAccount:
        annotations: {}
        automount: true
        create: true
        name: ""
        role:
            annotations: {}
            rules:
                -   apiGroups:
                        -   ""
                    resources:
                        -   configmaps
                    verbs:
                        -   get
                        -   list
                        -   watch
image:
    pullPolicy: IfNotPresent
    pullSecrets: []
    repository: liferay/dxp
    tag: 2026.q1.8-lts
initContainers: []
licensing:
