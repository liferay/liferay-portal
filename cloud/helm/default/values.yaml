    endpointRef: http
    extraParentRefs: []
    extraRules: []
    forceHttpsRedirect: false
    gatewayName: ""
    hostnames: []
    perHostnameRoutes: false
    securityPolicyAuthorizationSpec: {}
    timeouts: {}
networkPolicy:
