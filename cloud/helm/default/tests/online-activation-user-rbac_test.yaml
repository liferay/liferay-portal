release:
    name: liferay-default
    namespace: liferay-acme-prd
suite: Online Activation User RBAC
templates:
    -   templates/online-activation-user-rbac.yaml
tests:
    -   asserts:
            -   contains:
                    content:
                        apiGroups: [""]
                        resources: ["events", "pods", "pods/log"]
                        verbs: ["get", "list", "watch"]
                    path: rules
        documentSelector:
            path: kind
            value: Role
        it: Grants pod log access, without which the Argo Workflows UI cannot show step output
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   contains:
                    content:
                        apiGroups: ["argoproj.io"]
                        resources: ["workflows"]
                        verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
                    path: rules
        documentSelector:
            path: kind
            value: Role
        it: Grants workflow submission, which no other chart role provides
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: roleRef.kind
                    value: Role
            -   equal:
                    path: roleRef.name
                    value: online-activation-user-role
            -   equal:
                    path: subjects[0].name
                    value: online-activation-user-service-account
            -   equal:
                    path: subjects[0].namespace
                    value: liferay-acme-prd
        documentSelector:
            path: kind
            value: RoleBinding
        it: Keeps the login identity confined to this namespace through a namespaced role
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the login identity when licensing is disabled
        set:
            licensing.enabled: false
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the login identity when the online activation workflow is disabled
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: false
    -   asserts:
            -   hasDocuments:
                    count: 4
        it: Renders the role, the binding, the token, and the account it belongs to
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: type
                    value: kubernetes.io/service-account-token
            -   equal:
                    path: metadata.annotations["kubernetes.io/service-account.name"]
                    value: online-activation-user-service-account
        documentSelector:
            path: kind
            value: Secret
        it: Requests a token secret, which Kubernetes no longer creates on its own
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: custom-user-service-account
        documentSelector:
            path: kind
            value: ServiceAccount
        it: Tracks a custom service account name
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
            licensing.onlineActivationWorkflow.userAccess.serviceAccountName: custom-user-service-account