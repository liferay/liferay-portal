release:
    name: liferay-default
    namespace: liferay-acme-prd
suite: Online Activation RBAC
templates:
    -   templates/online-activation-rbac.yaml
tests:
    -   asserts:
            -   equal:
                    path: roleRef.kind
                    value: ClusterRole
            -   equal:
                    path: roleRef.name
                    value: online-activation-cluster-role
            -   equal:
                    path: subjects[0].name
                    value: online-activation-service-account
            -   equal:
                    path: subjects[0].namespace
                    value: liferay-acme-prd
        documentSelector:
            path: kind
            value: RoleBinding
        it: Confines the shared cluster role to this namespace through a namespaced binding
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: online-activation-service-account
            -   equal:
                    path: metadata.namespace
                    value: liferay-acme-prd
        documentSelector:
            path: kind
            value: ServiceAccount
        it: Creates the service account in the environment namespace, where the workflow pod runs
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the RBAC when licensing is disabled
        set:
            licensing.enabled: false
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the RBAC when the online activation workflow is disabled
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: false
    -   asserts:
            -   hasDocuments:
                    count: 2
        it: Renders only the identity the workflow needs in this namespace
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: roleRef.name
                    value: custom-cluster-role
        documentSelector:
            path: kind
            value: RoleBinding
        it: Tracks a custom cluster role name
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.clusterRoleName: custom-cluster-role
            licensing.onlineActivationWorkflow.enabled: true