suite: ConfigMap
templates:
    -   templates/configmap.yaml
tests:
    -   asserts:
            -   isKind:
                    of: ConfigMap
            -   matchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: "\"com.example.a\""
            -   matchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: "\"com.example.b\""
            -   matchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: "\"com.example.c\""
        it: Adds every entry of the bundle deny list through the loop
        set:
            portalBundleDenyList:
                -   com.example.a
                -   com.example.b
                -   com.example.c
    -   asserts:
            -   matchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: ComponentBlacklistConfiguration_blacklistComponentNames
            -   matchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: "\"com.example.d\""
        it: Adds every entry of the component deny list through the loop
        set:
            portalComponentDenyList:
                -   com.example.d
    -   asserts:
            -   notExists:
                    path: data["portal-cloud.properties"]
        it: Drops the default data when configmap defaults are overridden
        set:
            configmap.overrideDefaults: true
    -   asserts:
            -   matchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: cluster.link.enabled=true
        it: Enables the cluster link properties when autoscaling is enabled
        set:
            autoscaling.enabled: true
            replicaCount: 1
    -   asserts:
            -   matchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: cluster.link.enabled=true
        it: Enables the cluster link properties when more than one replica is requested
        set:
            autoscaling.enabled: false
            replicaCount: 2
    -   asserts:
            -   matchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: "\"com.example.a\""
            -   matchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: "\"com.example.b\""
            -   matchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: "\"com.example.d\""
        it: Merges the deny list entries contributed by dependencies
        set:
            dependencies:
                x-example:
                    portalBundleDenyList:
                        -   com.example.b
                    portalComponentDenyList:
                        -   com.example.d
            portalBundleDenyList:
                -   com.example.a
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-portal
        it: Names the ConfigMap after the chart name override
        set:
            nameOverride: my-portal
    -   asserts:
            -   notMatchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: BundleBlacklistConfiguration_blacklistBundleSymbolicNames
        it: Omits the bundle deny list override when the deny list is empty
        set:
            portalBundleDenyList: []
    -   asserts:
            -   notMatchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: cluster.link.enabled=true
        it: Omits the cluster link properties for a single replica
        set:
            autoscaling.enabled: false
            replicaCount: 1
    -   asserts:
            -   notMatchRegex:
                    path: data["portal-cloud.properties"]
                    pattern: ComponentBlacklistConfiguration_blacklistComponentNames
        it: Omits the component deny list override when the deny list is empty
        set:
            portalComponentDenyList: []