suite: License Sync Sidecar
templates:
    -   templates/configmap.yaml
    -   templates/liferay-init-scripts-cm.yaml
    -   templates/liferay-network-cm.yaml
    -   templates/workloads.yaml
tests:
    -   asserts:
            -   contains:
                    any: true
                    content:
                        name: liferay-license-sync
                    path: spec.template.spec.initContainers
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: StatefulSet
        it: Adds the license sync sidecar when the license is enabled
        set:
            license.enabled: true
    -   asserts:
            -   equal:
                    path: spec.template.spec.initContainers[?(@.name=="liferay-license-sync")].restartPolicy
                    value: Always
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: StatefulSet
        it: Runs the license sync sidecar as a native sidecar
        set:
            license.enabled: true
    -   asserts:
            -   contains:
                    any: true
                    content:
                        mountPath: /liferay-init-scripts/deploy-sync.sh
                        name: liferay-init-scripts-default
                        subPath: deploy-sync.sh
                    path: spec.template.spec.initContainers[?(@.name=="liferay-license-sync")].volumeMounts
            -   contains:
                    any: true
                    content:
                        mountPath: /opt/liferay
                        name: liferay-persistent-volume
                        subPath: liferay
                    path: spec.template.spec.initContainers[?(@.name=="liferay-license-sync")].volumeMounts
            -   contains:
                    any: true
                    content:
                        mountPath: /secret
                        name: liferay-license
                    path: spec.template.spec.initContainers[?(@.name=="liferay-license-sync")].volumeMounts
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: StatefulSet
        it: Mounts the license secret, sync script, and deploy folder
        set:
            license.enabled: true
    -   asserts:
            -   contains:
                    any: true
                    content:
                        name: liferay-license
                        secret:
                            items:
                                -   key: license.xml
                                    path: license.xml
                            optional: true
                            secretName: liferay-default-entitlements
                    path: spec.template.spec.volumes
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: StatefulSet
        it: Projects the operator entitlements license as an optional volume
        set:
            license.enabled: true
    -   asserts:
            -   contains:
                    any: true
                    content:
                        name: liferay-license
                        secret:
                            items:
                                -   key: license.xml
                                    path: license.xml
                            optional: true
                            secretName: custom-entitlements
                    path: spec.template.spec.volumes
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: StatefulSet
        it: Honors an overridden license secret name
        set:
            license.enabled: true
            license.secretName: custom-entitlements
    -   asserts:
            -   notContains:
                    any: true
                    content:
                        name: liferay-license
                    path: spec.template.spec.volumes
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: StatefulSet
        it: Omits the license volume when the license is disabled
    -   asserts:
            -   contains:
                    any: true
                    content:
                        name: LIFERAY_SYNC_INTERVAL
                        value: "120"
                    path: spec.template.spec.initContainers[?(@.name=="liferay-license-sync")].env
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: StatefulSet
        it: Passes the configured sync interval to the sidecar
        set:
            license.enabled: true
            licensing.syncInterval: 120
    -   asserts:
            -   notContains:
                    any: true
                    content:
                        name: liferay-license-sync
                    path: spec.template.spec.initContainers
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: StatefulSet
        it: Omits the license sync sidecar when the license is disabled
        set:
            license.enabled: false
    -   asserts:
            -   isNotEmpty:
                    path: data['deploy-sync.sh']
        documentSelector:
            path: metadata.name
            skipEmptyTemplates: true
            value: liferay-init-scripts-default
        it: Publishes the deploy sync script in the init scripts ConfigMap