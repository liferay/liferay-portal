suite: Session Persistence
templates:
    -   templates/configmap.yaml
    -   templates/liferay-init-scripts-cm.yaml
    -   templates/liferay-network-cm.yaml
    -   templates/workloads.yaml
tests:
    -   asserts:
            -   notExists:
                    path: spec.rules[0].sessionPersistence
        documentSelector:
            path: metadata.name
            skipEmptyTemplates: true
            value: liferay-default-httproute
        it: Omits session persistence unless it is configured
        set:
            network.enabled: true
            network.gatewayName: test-gateway
    -   asserts:
            -   equal:
                    path: spec.rules[0].sessionPersistence.sessionName
                    value: LIFERAY_SESSION
            -   equal:
                    path: spec.rules[0].sessionPersistence.type
                    value: Cookie
            -   equal:
                    path: spec.rules[0].sessionPersistence.cookieConfig.lifetimeType
                    value: Session
        documentSelector:
            path: metadata.name
            skipEmptyTemplates: true
            value: liferay-default-httproute
        it: Applies session persistence to the route that carries the backend
        set:
            network.enabled: true
            network.gatewayName: test-gateway
            network.sessionPersistence:
                cookieConfig:
                    lifetimeType: Session
                sessionName: LIFERAY_SESSION
                type: Cookie
    -   asserts:
            -   equal:
                    path: spec.rules[0].sessionPersistence.sessionName
                    value: LIFERAY_SESSION
        documentSelector:
            path: metadata.name
            skipEmptyTemplates: true
            value: liferay-default-httproute-a-example-com
        it: Applies session persistence to every per hostname route
        set:
            network.enabled: true
            network.gatewayName: test-gateway
            network.hostnames:
                -   a.example.com
                -   b.example.com
            network.perHostnameRoutes: true
            network.sessionPersistence:
                sessionName: LIFERAY_SESSION
                type: Cookie
    -   asserts:
            -   notExists:
                    path: spec.rules[0].sessionPersistence
        documentSelector:
            path: metadata.name
            skipEmptyTemplates: true
            value: liferay-default-https-redirect
        it: Leaves the HTTPS redirect route alone because it has no backend
        set:
            network.enabled: true
            network.endpointRef: https
            network.forceHttpsRedirect: true
            network.gatewayName: test-gateway
            network.sessionPersistence:
                sessionName: LIFERAY_SESSION
                type: Cookie
