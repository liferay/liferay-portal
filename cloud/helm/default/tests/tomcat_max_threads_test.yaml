suite: Tomcat Max Threads
templates:
    -   templates/configmap.yaml
    -   templates/liferay-init-scripts-cm.yaml
    -   templates/liferay-network-cm.yaml
    -   templates/workloads.yaml
tests:
    -   asserts:
            -   notMatchRegex:
                    path: spec.template.spec.initContainers[?(@.name=="liferay-prepopulate-data")].command[2]
                    pattern: >-
                        maxThreads
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: StatefulSet
        it: Leaves the image default alone when no value is given
    -   asserts:
            -   matchRegex:
                    path: spec.template.spec.initContainers[?(@.name=="liferay-prepopulate-data")].command[2]
                    pattern: >-
                        maxThreads="120"
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: StatefulSet
        it: Rewrites the connector thread count when a value is given
        set:
            tomcat.maxThreads: 120
    -   asserts:
            -   matchRegex:
                    path: spec.template.spec.initContainers[?(@.name=="liferay-prepopulate-data")].command[2]
                    pattern: >-
                        maxThreads="120"/' /temp/tomcat/conf/server.xml
        documentSelector:
            path: kind
            skipEmptyTemplates: true
            value: StatefulSet
        it: Rewrites the copy on the volume rather than the one in the image
        set:
            tomcat.maxThreads: 120