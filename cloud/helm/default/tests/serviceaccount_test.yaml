release:
    name: liferay-default
    namespace: liferay-acme-prd
suite: Service Account
templates:
    -   templates/serviceaccount.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                isKind:
                    of: Role
            -   documentIndex: 1
                equal:
                    path: subjects[0].name
                    value: liferay-default
        it: Binds the role to an account the chart does not create
        set:
            global.liferayServiceAccount.create: false
            global.liferayServiceAccount.name: liferay-default
    -   asserts:
            -   documentIndex: 0
                notContains:
                    content:
                        apiGroups:
                            -   ""
                        resources:
                            -   configmaps
                        verbs:
                            -   create
                            -   update
                    path: rules
        it: Grants no ConfigMap writes when client extension delivery is disabled
    -   asserts:
            -   contains:
                    content:
                        apiGroups:
                            -   ""
                        resources:
                            -   configmaps
                        verbs:
                            -   create
                            -   update
                    path: rules
                documentIndex: 0
        it: Lets DXP write its client extension ConfigMaps when client extension delivery is enabled
        set:
            clientExtensions.delivery.enabled: true