{{- if and .Values.licensing.enabled .Values.licensing.onlineActivationWorkflow.enabled -}}
{{- $onlineActivationWorkflow := .Values.licensing.onlineActivationWorkflow -}}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
    labels:
        {{- include "liferay.labels" . | nindent 8 }}
    name: {{ $onlineActivationWorkflow.workflowTemplateName }}
    namespace: {{ include "liferay.namespace" . }}
spec:
    arguments:
        parameters:
            -   description:
                    The activation code issued for this environment.
                name: activation-code
            -   description:
                    The LiferayEnvironment to activate in this namespace.
                name: liferay-environment-name
                value: {{ include "liferay.name" . }}
    entrypoint: main
    podGC:
        strategy: OnWorkflowSuccess
    serviceAccountName: {{ $onlineActivationWorkflow.serviceAccountName }}
    templates:
        -   name: main
            steps:
                -   -   name: activate
                        templateRef:
                            clusterScope: true
                            name: {{ $onlineActivationWorkflow.clusterWorkflowTemplateName }}
                            template: main
    ttlStrategy:
        secondsAfterCompletion: {{ $onlineActivationWorkflow.ttlSecondsAfterCompletion }}
{{- end -}}
