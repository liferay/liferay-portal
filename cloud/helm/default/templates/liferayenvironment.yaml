{{- if .Values.licensing.enabled }}
apiVersion: licensing.liferay.com/v1alpha1
kind: LiferayEnvironment
metadata:
    annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    labels:
        app: {{ include "liferay.name" . }}
        {{- include "liferay.labels" . | nindent 8 }}
    name: {{ include "liferay.name" . }}
    namespace: {{ include "liferay.namespace" . }}
spec:
    activationCodeSecretRef:
        key: {{ .Values.licensing.activationCodeSecretKey }}
        name: {{ include "liferay.activationCodeSecretName" . }}
    {{- if .Values.autoscaling.enabled }}
    autoscaling:
        {{- if eq .Values.autoscaling.type "keda" }}
        maxReplicas: {{ .Values.autoscaling.keda.maxReplicaCount }}
        minReplicas: {{ .Values.autoscaling.keda.minReplicaCount }}
        {{- else }}
        maxReplicas: {{ .Values.autoscaling.hpa.maxReplicas }}
        minReplicas: {{ .Values.autoscaling.hpa.minReplicas }}
        {{- end }}
    {{- else }}
    desiredReplicas: {{ .Values.replicaCount }}
    {{- end }}
    {{- with .Values.licensing.dxpVersion }}
    dxpVersion: {{ . | quote }}
    {{- end }}
    {{- if .Values.licensing.offline }}
    offline: true
    {{- end }}
    {{- with .Values.licensing.offlineActivationBundle }}
    offlineActivationBundle: {{ . | quote }}
    {{- end }}
    workloadRef:
        name: {{ include "liferay.name" . }}
{{- end }}