{{- $allowedNamespaces := append .Values.clientExtensions.policy.allowedNamespaces (printf "%s-cx" (include "liferay.namespace" .)) -}}
apiVersion: v1
data:
    allowedNamespaces: {{ $allowedNamespaces | uniq | sortAlpha | join "," | quote }}
kind: ConfigMap
metadata:
    labels:
        {{- include "liferay.labels" . | nindent 8 }}
        lxc.liferay.com/metadataType: client-extension-policy
    name: client-extension-policy
    namespace: {{ include "liferay.namespace" . }}