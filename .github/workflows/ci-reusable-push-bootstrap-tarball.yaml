defaults:
    run:
        shell: bash
jobs:
    push:
        outputs:
            object_name: ${{steps.vars.outputs.object_name}}
            sha256: ${{steps.package.outputs.sha256}}
            version: ${{steps.vars.outputs.version}}
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 1
                    filter: tree:0
                    show-progress: false
                    sparse-checkout: |
                        cloud/scripts
                        cloud/terraform/${{inputs.provider}}
                        cloud/terraform/modules
            -   id: auth
                name: Authenticate to Google Cloud
                uses: google-github-actions/auth@v3
                with:
                    project_id: ${{inputs.is_production && vars.GCP_PROJECT_ID_EXTERNAL_PRODUCTION || vars.GCP_PROJECT_ID_EXTERNAL_NONPRODUCTION}}
                    workload_identity_provider: ${{inputs.is_production && vars.GCP_WORKLOAD_IDENTITY_PROVIDER_EXTERNAL_PRODUCTION || vars.GCP_WORKLOAD_IDENTITY_PROVIDER_EXTERNAL_NONPRODUCTION}}
            -   name: Set up Google Cloud CLI
                uses: google-github-actions/setup-gcloud@v2
                with:
                    project_id: ${{inputs.is_production && vars.GCP_PROJECT_ID_EXTERNAL_PRODUCTION || vars.GCP_PROJECT_ID_EXTERNAL_NONPRODUCTION}}
            -   if: ${{inputs.provider == 'azure' && !inputs.is_production}}
                name: Install ORAS
                uses: oras-project/setup-oras@v1
            -   env:
                    BOOTSTRAP_STORAGE_PATH_NONPRODUCTION: ${{vars.BOOTSTRAP_STORAGE_PATH_NONPRODUCTION}}
                    BOOTSTRAP_STORAGE_PATH_PRODUCTION: ${{vars.BOOTSTRAP_STORAGE_PATH_PRODUCTION}}
                id: vars
                name: Set up variables
                run: |
                    set -o errexit
                    set -o nounset
                    set -o pipefail

                    function main {
                        local provider="${{inputs.provider}}"

                        local version

                        version=$(jq --arg key "liferay-${provider}-bootstrap" --raw-output '.[$key]' ./cloud/scripts/versions.json)

                        local object_basename="liferay-${provider}-bootstrap-${version}.tar.gz"

                        echo "OBJECT_BASENAME=${object_basename}" >> ${GITHUB_ENV}

                        local object_directory="${BOOTSTRAP_STORAGE_PATH_PRODUCTION}"

                        if [[ "${{inputs.is_production}}" != "true" ]]
                        then
                            object_directory="${BOOTSTRAP_STORAGE_PATH_NONPRODUCTION}/$(echo "${GITHUB_REF_NAME}" | tr '/' '-')/${GITHUB_SHA::7}"
                        fi

                        local object_name="${object_directory}/${object_basename}"

                        echo "OBJECT_NAME=${object_name}" >> ${GITHUB_ENV}
                        echo "object_name=${object_name}" >> ${GITHUB_OUTPUT}
                        echo "version=${version}" >> ${GITHUB_OUTPUT}
                    }

                    main "${@}"
            -   env:
                    CONTAINER_IMAGE_REGISTRY_NONPRODUCTION: ${{vars.CONTAINER_IMAGE_REGISTRY_NONPRODUCTION}}
                    HELM_CHART_REGISTRY_NONPRODUCTION: ${{vars.HELM_CHART_REGISTRY_NONPRODUCTION}}
                id: package
                name: Package and push bootstrap tarball
                run: |
                    set -o errexit
                    set -o nounset
                    set -o pipefail

                    function main {
                        local provider="${{inputs.provider}}"

                        local files

                        if [[ "${provider}" == "aws" ]]
                        then
                            files=(
                                cloud/scripts/setup_aws.sh
                                cloud/terraform/aws/eks/*
                                cloud/terraform/aws/gitops/platform/*
                                cloud/terraform/aws/gitops/resources/*
                            )
                        elif [[ "${provider}" == "azure" ]]
                        then
                            files=(
                                cloud/scripts/_azure_common.sh
                                cloud/scripts/config.json.defaults
                                cloud/scripts/setup_azure.sh
                                cloud/scripts/teardown_azure.sh
                                cloud/terraform/azure/aks/*
                                cloud/terraform/azure/platform/*
                                cloud/terraform/modules/argocd/*
                            )
                        elif [[ "${provider}" == "gcp" ]]
                        then
                            files=(
                                cloud/scripts/setup_gcp.sh
                                cloud/terraform/gcp/gitops/platform/*
                                cloud/terraform/gcp/gitops/resources/*
                                cloud/terraform/gcp/gke/*
                            )
                        fi

                        if [[ "${provider}" == "azure" ]] && [[ "${{inputs.is_production}}" != "true" ]]
                        then
                            _point_artifacts_at_this_build ./cloud/scripts/config.json.defaults
                        fi

                        tar \
                            --create \
                            --file "/tmp/${OBJECT_BASENAME}" \
                            --gzip \
                            --verbose \
                            "${files[@]}"

                        (cd /tmp && sha256sum "${OBJECT_BASENAME}" > "${OBJECT_BASENAME}.sha256")

                        local sha256

                        sha256=$(cut --delimiter=' ' --fields=1 < "/tmp/${OBJECT_BASENAME}.sha256")

                        echo "sha256=${sha256}" >> ${GITHUB_OUTPUT}

                        gcloud \
                            storage \
                            cp \
                            "/tmp/${OBJECT_BASENAME}" \
                            "${OBJECT_NAME}"

                        gcloud \
                            storage \
                            cp \
                            "/tmp/${OBJECT_BASENAME}.sha256" \
                            "${OBJECT_NAME}.sha256"
                    }

                    function _get_build_registry {
                        local type="${1}"

                        local registry="${HELM_CHART_REGISTRY_NONPRODUCTION}"

                        if [[ "${type}" == "images" ]]
                        then
                            registry="${CONTAINER_IMAGE_REGISTRY_NONPRODUCTION}"
                        fi

                        echo "${registry}/$(echo "${GITHUB_REF_NAME}" | tr 'A-Z/' 'a-z-')/${GITHUB_SHA::7}"
                    }

                    function _has_artifact {
                        local name="${1}"
                        local registry="${2}"
                        local version="${3}"

                        oras \
                            manifest \
                            fetch \
                            --password "${{steps.auth.outputs.auth_token}}" \
                            --username oauth2accesstoken \
                            "${registry}/${name}:${version}" \
                            > /dev/null 2>&1
                    }

                    function _point_artifacts_at_this_build {
                        local config_json_defaults_file="${1}"

                        local name
                        local type
                        local version

                        while read -r name type version
                        do
                            local registry

                            registry=$(_get_build_registry "${type}")

                            if ! _has_artifact "${name}" "${registry}" "${version}"
                            then
                                continue
                            fi

                            echo "\`${type}.${name}\` points to \`${registry}\`. This build pushed it there." >> "${GITHUB_STEP_SUMMARY}"

                            local updated_config_json_defaults

                            updated_config_json_defaults=$( \
                                jq \
                                    --arg name "${name}" \
                                    --arg registry "${registry}" \
                                    --arg type "${type}" \
                                    --tab \
                                    '.artifacts[$type][$name].registry = $registry' \
                                    "${config_json_defaults_file}")

                            printf '%s' "${updated_config_json_defaults}" > "${config_json_defaults_file}"
                        done < <( \
                            jq \
                                --raw-output \
                                '.artifacts
                                | {charts, images}
                                | to_entries[]
                                | .key as $type
                                | .value
                                | to_entries[]
                                | "\(.key) \($type) \(.value.version)"' \
                                "${config_json_defaults_file}")
                    }

                    main "${@}"
on:
    workflow_call:
        inputs:
            is_production:
                default: false
                required: false
                type: boolean
            provider:
                required: true
                type: string
        outputs:
            object_name:
                value: ${{jobs.push.outputs.object_name}}
            sha256:
                value: ${{jobs.push.outputs.sha256}}
            version:
                value: ${{jobs.push.outputs.version}}
permissions:
    contents: read
    id-token: write