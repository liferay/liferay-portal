name: Merge upstream master
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sync Fork
        run: gh repo sync $OWNER/$REPO -b $BRANCH_NAME
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: peterrichards-lr
          REPO: liferay-portal
          BRANCH_NAME: master
