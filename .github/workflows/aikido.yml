name: Aikido Security

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable scanner --debug output"
        type: boolean
        default: false

permissions:
  contents: read

env:
  AIKIDO_SCANNER_VERSION: "1.0.139"
  AIKIDO_SCANNER_SHA256: "41b4368ee0ffbb195015a39119a7cc9db2ff0aefa8388bc01e48b747c6d4d2d1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aikido-scan:
    name: Aikido scan
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Aikido scanner
        id: cache-scanner
        uses: actions/cache@v4
        with:
          path: ~/aikido-scanner
          key: aikido-scanner-${{ env.AIKIDO_SCANNER_VERSION }}-${{ env.AIKIDO_SCANNER_SHA256 }}-linux-x86_64

      - name: Download Aikido scanner
        if: steps.cache-scanner.outputs.cache-hit != 'true'
        run: |
          curl -fsL "https://aikido-local-scanner.s3.eu-west-1.amazonaws.com/v${{ env.AIKIDO_SCANNER_VERSION }}/linux_X86_64/aikido-local-scanner.zip" \
            -o /tmp/aikido-scanner.zip
          echo "${{ env.AIKIDO_SCANNER_SHA256 }}  /tmp/aikido-scanner.zip" | sha256sum -c -
          unzip /tmp/aikido-scanner.zip -d ~/aikido-scanner/
          chmod +x ~/aikido-scanner/aikido-local-scanner
      - name: Detect new vulnerabilities
        # Soft-fail: scanner uploads results fine, but its post-scan gating
        # status-poll currently returns "Endpoint no longer accesible"
        # (Aikido server-side). Keep CI green while results still land in the
        # Aikido console; remove once Aikido restores the poll endpoint.
        continue-on-error: true
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_SECRET_KEY }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ~/aikido-scanner/aikido-local-scanner scan \
            --repositoryname "$REPO" \
            --branchname "$REF_NAME" \
            --fail-on critical \
            --scan-types dependencies \
            --exclude portal-test \
            --exclude modules/test \
            ${{ inputs.debug && '--debug' || '' }} \
            -- "$GITHUB_WORKSPACE"
